<title>加水浮力模型：F浮变化的四个阶段 - 物理虚拟实验</title>
<style>
:root{
  --bg-darker:#020617; --bg-dark:#0f172a; --surface:#1e293b;
  --primary:#3b82f6; --secondary:#06b6d4; --accent:#8b5cf6;
  --text-main:#f8fafc; --text-muted:#94a3b8;
  --glass-bg:rgba(255,255,255,.05); --glass-border:rgba(255,255,255,.1);
  --card-shadow:0 8px 32px 0 rgba(0,0,0,.37);
  --s1:#38bdf8; --s2:#34d399; --s3:#fbbf24; --s4:#a78bfa;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg-darker); color:var(--text-main); min-height:100vh; overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","Noto Sans SC",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(circle at 16% 10%, rgba(59,130,246,.13), transparent 42%),
    radial-gradient(circle at 86% 60%, rgba(6,182,212,.11), transparent 44%),
    radial-gradient(circle at 50% 100%, rgba(139,92,246,.09), transparent 46%);
}
.header{
  background:rgba(15,23,42,.82); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--glass-border);
  padding:.85rem 2rem; display:flex; justify-content:space-between; align-items:center;
  position:sticky; top:0; z-index:100;
}
.logo{
  font-size:1.12rem; font-weight:800; letter-spacing:.2px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.nav a{color:var(--text-muted); margin-left:1.4rem; text-decoration:none; font-size:.87rem; font-weight:500; transition:color .25s}
.nav a:hover{color:var(--primary)}
.wrap{max-width:1260px; margin:0 auto; padding:1.4rem}
.main-card{
  background:linear-gradient(160deg,rgba(15,23,42,.94),rgba(2,6,23,.97));
  border:1px solid #1e3a52; border-radius:22px; box-shadow:var(--card-shadow); overflow:hidden;
}
.exp-head{padding:1.3rem 1.6rem .95rem; border-bottom:1px solid var(--glass-border)}
.exp-head h1{font-size:1.4rem; font-weight:800; letter-spacing:.2px; line-height:1.35}
.exp-head h1 em{font-style:normal; color:#38bdf8}
.exp-head h1 sub{font-size:.6em; vertical-align:-.24em}
.exp-head p{color:var(--text-muted); font-size:.85rem; margin-top:.35rem}

.stage{display:grid; grid-template-columns:minmax(0,1.32fr) minmax(0,.6fr) minmax(0,1fr); gap:15px; padding:1.05rem 1.15rem .35rem; align-items:start}
.panel{
  background:rgba(11,24,40,.7); border:1px solid rgba(56,189,248,.13);
  border-radius:16px; padding:10px 12px 12px; min-width:0;
}
.panel-tag{
  font-size:.7rem; font-weight:700; letter-spacing:.14em; color:#7dd3fc;

}
.panel-tag::before{content:""; width:3px; height:12px; border-radius:2px; background:linear-gradient(#22d3ee,#3b82f6)}
.cv-wrap{width:100%; min-width:0}
canvas{display:block; width:100%; border-radius:10px}

/* 阶段说明卡 */
.stage-card{
  border-radius:12px; padding:.6rem .75rem .65rem; margin-bottom:9px;
  background:rgba(52,211,153,.08); border:1px solid rgba(52,211,153,.22);
  transition:background .35s, border-color .35s;
}
.sc-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.sc-bar{width:4px; height:15px; border-radius:2px; background:var(--s2); flex:0 0 auto; transition:background .35s}
.sc-title{font-size:.92rem; font-weight:800; color:#e2e8f0}
.sc-expr{font-size:.86rem; font-weight:800; color:#34d399; font-variant-numeric:tabular-nums; transition:color .35s}
.sc-desc{font-size:.76rem; color:#93a4bb; margin-top:.3rem; line-height:1.5}

/* 读数 */
.readout{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:9px; padding:.85rem 1.15rem .15rem}
.ro{background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:12px; padding:.5rem .7rem; min-width:0}
.ro b{display:block; font-size:.68rem; color:var(--text-muted); font-weight:600; letter-spacing:.03em; white-space:nowrap}
.ro span{font-size:1.02rem; font-weight:800; font-variant-numeric:tabular-nums; color:#e2e8f0; white-space:nowrap}
.ro span i{font-style:normal; font-size:.66em; font-weight:600; color:#7f8ea3; margin-left:2px}
.ro.k span{color:#38bdf8}

/* 控制区 */
.controls{display:flex; flex-wrap:wrap; align-items:center; gap:13px; padding:.95rem 1.15rem 1.15rem; border-top:1px solid var(--glass-border); margin-top:.85rem}
.btn{

  border:1px solid #31455d; background:#17283c; color:#dbeafe; transition:border-color .18s, background .18s, transform .12s;

}
.btn:hover{border-color:#38bdf8; background:#1e3b55}
.btn:active{transform:scale(.975)}
.btn.primary{background:linear-gradient(120deg,#2563eb,#0891b2); border-color:#38bdf8; color:#fff}
.btn.primary.on{background:linear-gradient(120deg,#0d9488,#0e7490)}
.btn .ico{width:0; height:0; border-style:solid; display:inline-block}
.btn .ico.play{border-width:6px 0 6px 10px; border-color:transparent transparent transparent #fff; margin-left:1px}
.btn .ico.pause{border:0; width:10px; height:12px; background:linear-gradient(90deg,#fff 0 3px,transparent 3px 7px,#fff 7px 10px)}

.slider-wrap{flex:1 1 260px; min-width:210px; display:flex; align-items:center; gap:11px}
.slider-wrap .lab{font-size:.78rem; color:#93a4bb; font-weight:600; white-space:nowrap}
input[type=range]{
  -webkit-appearance:none; appearance:none; flex:1; min-width:80px; height:7px; border-radius:99px; outline:none; cursor:pointer;
  background:linear-gradient(90deg,#0ea5e9 0%,#22d3ee var(--p,0%),#1e293b var(--p,0%),#1e293b 100%);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.5);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:19px; height:19px; border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#f0f9ff,#bae6fd 55%,#38bdf8);
  border:2px solid #0284c7; box-shadow:0 0 0 4px rgba(14,165,233,.16),0 2px 6px rgba(0,0,0,.5); cursor:grab;
}
input[type=range]::-moz-range-thumb{
  width:17px;height:17px;border-radius:50%;background:#bae6fd;border:2px solid #0284c7;
  box-shadow:0 0 0 4px rgba(14,165,233,.16);cursor:grab;
}
.chips{display:flex; gap:7px; flex-wrap:wrap}
.chip{
  font-size:.75rem; font-weight:700; padding:.3rem .62rem; border-radius:99px; cursor:pointer;
  border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text-muted); transition:.2s; white-space:nowrap;
}
.chip:hover{color:#e2e8f0; border-color:rgba(148,163,184,.45)}
.chip.on{color:#04121f; border-color:transparent}
.hint{font-size:.74rem; color:#5b6b80; width:100%; text-align:center; margin-top:-2px}
kbd{
  font:inherit; font-size:.72rem; padding:.08rem .34rem; border-radius:5px;
  border:1px solid #33465c; background:#16243a; color:#a8b8cc;
}

@media (max-width:1080px){
  .stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

  .readout{grid-template-columns:repeat(3,minmax(0,1fr))}

@media (max-width:680px){

  .exp-head h1{font-size:1.08rem}
  .exp-head p{font-size:.78rem}

  .ro span{font-size:.94rem}
  .controls{padding:.8rem .8rem 1rem; gap:10px}
  .slider-wrap{flex:1 1 100%}
  .header{padding:.7rem 1rem}
  .nav a{margin-left:1rem; font-size:.8rem}
}
</style>

<body>
<header class="header">
  <div class="logo">物理虚拟实验平台</div>
  <nav class="nav">
    <a href="experiments.html">实验目录</a>
    <a href="index.html">首页</a>
  </nav>
</header>

<div class="wrap">
  <div class="main-card">
    <div class="exp-head">
      <h1>加水浮力模型：<em>F<sub>浮</sub></em> 变化的四个阶段</h1>
      <p>向容器中缓慢加水，观察浮力随水面高度 <b>h</b> 变化的四个阶段（物体为边长 10 cm 的正方体，密度 0.6×10³ kg/m³，重力 G = 6.0 N，细绳长 6 cm）</p>
    </div>

    <div class="stage">
      <section class="panel panel-tank">
        <div class="panel-tag">实时实验场景</div>
        <div class="cv-wrap"><canvas id="sceneCanvas"></canvas></div>
      </section>

      <section class="panel panel-force">
        <div class="panel-tag">重心受力图</div>
        <div class="cv-wrap"><canvas id="forceCanvas"></canvas></div>
      </section>

      <section class="panel panel-graph">
        <div class="stage-card" id="stageCard">
          <div class="sc-top">
            <span class="sc-bar" id="scBar"></span>
            <span class="sc-title" id="scTitle">阶段 ①：沉底蓄水</span>
            <span class="sc-expr" id="scExpr">F浮 &lt; G</span>
          </div>
          <p class="sc-desc" id="scDesc"></p>
        </div>
        <div class="cv-wrap"><canvas id="graphCanvas"></canvas></div>
      </section>
    </div>

    <div class="readout">
      <div class="ro k"><b>水面高度 h</b><span id="roH">0.0<i>cm</i></span></div>
      <div class="ro"><b>浸入深度</b><span id="roImm">0.0<i>cm</i></span></div>
      <div class="ro k"><b>浮力 F浮</b><span id="roF">0.00<i>N</i></span></div>
      <div class="ro"><b>重力 G</b><span id="roG">6.00<i>N</i></span></div>
      <div class="ro"><b>状态</b><span id="roState" style="font-size:.86rem">沉底静止</span></div>
    </div>

    <div class="controls">
      <button class="btn primary" id="btnAuto"><span class="ico play" id="icoAuto"></span><span id="txtAuto">自动演示</span></button>
      <button class="btn" id="btnReset">重置</button>
      <div class="slider-wrap">
        <span class="lab">拖动控制进水</span>
        <input type="range" id="hSlider" min="0" max="20" step="0.1" value="0" aria-label="控制进水">
        <span class="lab" id="sliderVal" style="min-width:56px;text-align:right;color:#7dd3fc">0.0 cm</span>
      </div>
      <div class="chips" id="chips"></div>
      <div class="hint">按下 <kbd>空格键</kbd> 可快速暂停或恢复动画演示</div>
    </div>
  </div>
</div>

<script src="protect.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   物理模型（与图像上的整数值严格自洽）
   正方体边长 a = 10 cm，V = 1.0e-3 m³，ρ物 = 600 kg/m³，g = 10 N/kg
   → G = 6.0 N，ρ水 g A = 1.0 N/cm（浸入 1 cm 增浮力 1 N）
   漂浮时浸入深度 d = G / (ρ水 g A) = 6.0 cm
   细绳长 L = 6 cm，物体高 H = 10 cm
   四个阶段（h 为水面高度，单位 cm）：
     ① h < 6      物体沉底，F浮 = h            （0 → 6.0 N，线性）
     ② 6 ≤ h ≤ 12  漂浮，绳松弛，F浮 = G = 6.0 N （平台）
     ③ 12 < h < 16 绳被拉直，浸入加深，F浮 = h-6 （6.0 → 10.0 N，线性）
     ④ h ≥ 16     完全浸没，F浮 = 10.0 N        （平台）
   ============================================================ */
var PH = { G:6.0, k:1.0, d:6.0, L:6.0, H:10.0, hMax:20.0, tankW:22.0, tankH:24.0 };
var STAGES = [
  { no:"①", name:"沉底蓄水", color:"#38bdf8", expr:"F浮 < G", state:"沉底静止",
    desc:"水面还不足以让浮力等于重力，物体静止在容器底部，浮力随水面升高而线性增大。" },
  { no:"②", name:"漂浮随升", color:"#34d399", expr:"F浮 = G = 6.0 N", state:"漂浮随升",
    desc:"浮力等于重力，绳子松弛，物体漂浮并随水面一起上升。" },
  { no:"③", name:"绳子拉直", color:"#fbbf24", expr:"F浮 > G", state:"绳被拉直",
    desc:"物体已升到绳长上限，绳被拉直并拉住物体，继续加水使浸入加深，浮力继续增大。" },
  { no:"④", name:"完全浸没", color:"#a78bfa", expr:"F浮 = 10.0 N（不变）", state:"完全浸没",
    desc:"物体完全浸没，浸入体积不再变化，浮力保持最大值 10.0 N 不变。" }
];
var BOUND = [6.0, 12.0, 16.0];   // 阶段分界（cm）

function stageOf(h){
  if (h < BOUND[0]) return 0;
  if (h <= BOUND[1]) return 1;
  if (h < BOUND[2]) return 2;
  return 3;
}
// 任意水面高度下的完整状态
function solve(h){
  var z, imm, F, N = 0, T = 0;
  if (h < PH.d){                       // ① 沉底
    z = 0; imm = Math.max(0, h); F = PH.k * imm; N = PH.G - F;
  } else if (h <= PH.L + PH.d){        // ② 漂浮，绳松弛
    z = h - PH.d; imm = PH.d; F = PH.G;
  } else {                             // ③④ 绳拉直
    z = PH.L; imm = Math.min(h - PH.L, PH.H); F = PH.k * imm; T = F - PH.G;
  }
  var slack = Math.max(0, PH.L - z);   // 绳的松弛量（cm）
  return { h:h, z:z, imm:imm, F:F, N:N, T:T, slack:slack, stage:stageOf(h) };
}

/* ============================================================ */
var DPR = Math.min(window.devicePixelRatio || 1, 2);
var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };

var ST = {
  h: 11.7,         // 水面高度 cm（初始与参考图同状态：阶段②漂浮随升）
  shown: 11.7,     // 平滑显示值
  t: 0,            // 动画时间 s
  auto: false,
  paused: false,
  pour: 0,         // 进水强度 0..1（用于水柱/涟漪）
  ripples: [],
  bubbles: [],
  lastPour: 0
};

var cvsScene = document.getElementById("sceneCanvas");
var cvsForce = document.getElementById("forceCanvas");
var cvsGraph = document.getElementById("graphCanvas");
var LAY = { scene:null, force:null, graph:null };

function fitCanvas(cv, w, h){
  cv.width = Math.max(1, Math.round(w * DPR));
  cv.height = Math.max(1, Math.round(h * DPR));
  cv.style.width = w + "px";
  cv.style.height = h + "px";
  var ctx = cv.getContext("2d");
  ctx.setTransform(DPR,0,0,DPR,0,0);
  return { ctx:ctx, w:w, h:h, dpr:DPR };
}

function relayout(){
  var wrapW = cvsScene.parentElement.clientWidth;
  if (wrapW < 120) wrapW = 120;
  // 场景：左右留白随宽度收缩但有下限，保证文字不随缩放变小
  var ml = clamp(wrapW * 0.185, 48, 96);
  var mr = clamp(wrapW * 0.175, 46, 92);
  var ppc = (wrapW - ml - mr) / PH.tankW;
  if (ppc < 4) ppc = 4;
  var mt = clamp(ppc * 6.6, 58, 96);       // 顶部给水龙头留空间
  var mb = clamp(ppc * 6.4, 58, 92);
  var sw = wrapW, sh = PH.tankH * ppc + mt + mb;
  LAY.scene = fitCanvas(cvsScene, sw, sh);
  LAY.scene.ppc = ppc; LAY.scene.ml = ml; LAY.scene.mr = mr;
  LAY.scene.mt = mt; LAY.scene.mb = mb;
  LAY.scene.il = ml; LAY.scene.ir = ml + PH.tankW * ppc;
  LAY.scene.it = mt; LAY.scene.ib = mt + PH.tankH * ppc;

  var fw = cvsForce.parentElement.clientWidth;
  LAY.force = fitCanvas(cvsForce, Math.max(120, fw), sh);

  var gw = cvsGraph.parentElement.clientWidth;
  var cardH = document.getElementById("stageCard").offsetHeight || 76;
  var gh = Math.max(220, sh - cardH - 9);
  LAY.graph = fitCanvas(cvsGraph, Math.max(160, gw), gh);
}
window.addEventListener("resize", function(){ relayout(); });
if (window.ResizeObserver) {
  try { new ResizeObserver(function(){ relayout(); }).observe(cvsScene.parentElement); } catch(e){}
}

/* ================= 场景绘制 ================= */
function roundRect(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function arrowHead(ctx,x,y,dx,dy,size,color){
  var len = Math.hypot(dx,dy) || 1;
  var ux = dx/len, uy = dy/len, px = -uy, py = ux;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x - ux*size + px*size*0.46, y - uy*size + py*size*0.46);
  ctx.lineTo(x - ux*size - px*size*0.46, y - uy*size - py*size*0.46);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}

function drawScene(){
  var L = LAY.scene; if(!L) return;
  var ctx = L.ctx, ppc = L.ppc, il = L.il, ir = L.ir, it = L.it, ib = L.ib;
  var W = L.w, H = L.h;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  var S = solve(ST.shown);
  var sy = ib - ST.shown * ppc;              // 水面 y
  var cx = (il + ir) / 2;                     // 物体中心 x
  var side = PH.H * ppc;                      // 正方体边长 px
  var bx0 = cx - side/2;                      // 前面左下角 x
  var byb = ib - S.z * ppc;                   // 物体底面 y
  var d3x = Math.max(8, side*0.085), d3y = Math.max(7, side*0.072);
  var wall = Math.max(4, ppc*0.42);

  /* ---- 背景：暗色摄影棚 ---- */
  var bg = ctx.createRadialGradient(cx, it + (ib-it)*0.45, 10, cx, it + (ib-it)*0.45, W*0.85);
  bg.addColorStop(0,"#12253a"); bg.addColorStop(0.55,"#0a1524"); bg.addColorStop(1,"#050b14");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  /* ---- 台面 ---- */
  var benchY = ib + wall + 3;
  var bgrad = ctx.createLinearGradient(0,benchY,0,benchY+ (H-benchY));
  bgrad.addColorStop(0,"#1b2f45"); bgrad.addColorStop(0.35,"#132234"); bgrad.addColorStop(1,"#0a1420");
  ctx.fillStyle = bgrad; ctx.fillRect(0,benchY,W,H-benchY);
  ctx.strokeStyle = "rgba(125,211,252,.22)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,benchY+0.5); ctx.lineTo(W,benchY+0.5); ctx.stroke();
  // 台面高光
  var sheen = ctx.createLinearGradient(0,benchY,0,benchY+16);
  sheen.addColorStop(0,"rgba(125,211,252,.09)"); sheen.addColorStop(1,"rgba(125,211,252,0)");
  ctx.fillStyle = sheen; ctx.fillRect(0,benchY,W,16);

  /* ---- 玻璃缸：内腔底色 ---- */
  var innerW = ir - il, innerH = ib - it;
  var cavity = ctx.createLinearGradient(il,it,ir,ib);
  cavity.addColorStop(0,"rgba(160,205,230,.055)");
  cavity.addColorStop(0.5,"rgba(120,175,210,.03)");
  cavity.addColorStop(1,"rgba(160,205,230,.05)");
  ctx.fillStyle = cavity; ctx.fillRect(il,it,innerW,innerH);

  /* ---- 水 ---- */
  if (ST.shown > 0.004){
    ctx.save();
    ctx.beginPath(); ctx.rect(il, sy, innerW, ib - sy); ctx.clip();
    var wg = ctx.createLinearGradient(0, sy, 0, ib);
    wg.addColorStop(0,   "rgba(186,238,252,.94)");
    wg.addColorStop(0.07,"rgba(126,208,236,.95)");
    wg.addColorStop(0.34,"rgba(62,163,208,.96)");
    wg.addColorStop(0.70,"rgba(30,118,168,.97)");
    wg.addColorStop(1,   "rgba(12,68,108,.98)");
    ctx.fillStyle = wg; ctx.fillRect(il, sy, innerW, ib - sy);

    // 水体内部的斜向光带（体积感）
    ctx.globalCompositeOperation = "lighter";
    var beam = ctx.createLinearGradient(il, sy, il+innerW*0.75, ib);
    beam.addColorStop(0,"rgba(150,235,255,.10)");
    beam.addColorStop(0.5,"rgba(150,235,255,.03)");
    beam.addColorStop(1,"rgba(150,235,255,0)");
    ctx.fillStyle = beam; ctx.fillRect(il, sy, innerW, ib - sy);

    // 缸底焦散光斑
    var rows = Math.max(4, Math.round((ib-sy)/26));
    for (var i=0;i<rows;i++){
      var yy = ib - 5 - i*((ib-sy)/rows)*0.92;
      ctx.beginPath();
      for (var x=il; x<=ir; x+=5){
        var wob = Math.sin(x*0.055 + ST.t*1.5 + i*0.85)*2.6 + Math.sin(x*0.135 - ST.t*2.2 + i*0.6)*1.2;
        if (x===il) ctx.moveTo(x, yy+wob); else ctx.lineTo(x, yy+wob);
      }
      ctx.strokeStyle = "rgba(160,240,255," + (0.085 - i*0.008) + ")";
      ctx.lineWidth = 2.1; ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.restore();
  }

  /* ---- 物体阴影（投在缸底） ---- */
  if (ST.shown > 0.004){
    var shA = 0.34 * clamp(1 - S.z/12, 0.15, 1);
    var shg = ctx.createRadialGradient(cx, ib-2, 2, cx, ib-2, side*0.72);
    shg.addColorStop(0,"rgba(0,0,0,"+shA+")"); shg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.save();
    ctx.beginPath(); ctx.rect(il, it, innerW, innerH); ctx.clip();
    ctx.fillStyle = shg;
    ctx.beginPath(); ctx.ellipse(cx, ib-2, side*0.66, 7.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  /* ---- 正方体：水上部分 ---- */
  function cubeFaces(ctx,x,yb,s,dx,dy){
    // 前面
    var g1 = ctx.createLinearGradient(x, yb-s, x+s, yb);
    g1.addColorStop(0,"#eaa05c"); g1.addColorStop(.42,"#d98239"); g1.addColorStop(1,"#ac5820");
    ctx.fillStyle = g1; ctx.beginPath(); ctx.rect(x, yb-s, s, s); ctx.fill();
    // 木纹
    ctx.save(); ctx.beginPath(); ctx.rect(x, yb-s, s, s); ctx.clip();
    for (var i=1;i<10;i++){
      var yy = yb - s + s*i/10;
      ctx.beginPath();
      for (var k=0;k<=7;k++){
        var xx = x + s*k/7, y2 = yy + Math.sin(k*1.6+i*1.1)*s*0.012;
        if (k===0) ctx.moveTo(xx,y2); else ctx.lineTo(xx,y2);
      }
      ctx.strokeStyle = "rgba(116,56,14,.15)"; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.restore();
    // 顶面
    var g2 = ctx.createLinearGradient(x, yb-s-dy, x+s+dx, yb-s);
    g2.addColorStop(0,"#fbc98f"); g2.addColorStop(1,"#e6a560");
    ctx.beginPath();
    ctx.moveTo(x,yb-s); ctx.lineTo(x+s,yb-s); ctx.lineTo(x+s+dx,yb-s-dy); ctx.lineTo(x+dx,yb-s-dy);
    ctx.closePath(); ctx.fillStyle = g2; ctx.fill();
    // 右面
    var g3 = ctx.createLinearGradient(x+s, yb-s, x+s+dx, yb);
    g3.addColorStop(0,"#a3521d"); g3.addColorStop(1,"#7a3a11");
    ctx.beginPath();
    ctx.moveTo(x+s,yb); ctx.lineTo(x+s+dx,yb-dy); ctx.lineTo(x+s+dx,yb-s-dy); ctx.lineTo(x+s,yb-s);
    ctx.closePath(); ctx.fillStyle = g3; ctx.fill();
    // 棱线高光
    ctx.strokeStyle = "rgba(255,238,212,.5)"; ctx.lineWidth = Math.max(1, s*0.008);
    ctx.beginPath();
    ctx.moveTo(x,yb); ctx.lineTo(x,yb-s); ctx.lineTo(x+dx,yb-s-dy); ctx.lineTo(x+s+dx,yb-s-dy);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,238,212,.24)";
    ctx.beginPath(); ctx.moveTo(x+s,yb-s); ctx.lineTo(x+s,yb); ctx.stroke();
  }

  if (ST.shown > 0.004 && sy < byb){
    // 水上部分
    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,W,sy); ctx.clip();
    cubeFaces(ctx, bx0, byb, side, d3x, d3y);
    ctx.restore();
    // 水下部分：横向折射偏移 + 水体染色
    var refr = clamp(side*0.028, 1.5, 6);
    ctx.save();
    ctx.beginPath(); ctx.rect(il, sy, innerW, ib-sy); ctx.clip();
    ctx.translate(refr, 0);
    cubeFaces(ctx, bx0, byb, side, d3x, d3y);
    // 只在物体上叠一层水色
    ctx.beginPath();
    ctx.moveTo(bx0,byb); ctx.lineTo(bx0+side,byb); ctx.lineTo(bx0+side,byb-side);
    ctx.lineTo(bx0+side+d3x,byb-side-d3y); ctx.lineTo(bx0+d3x,byb-side-d3y); ctx.lineTo(bx0,byb-side);
    ctx.closePath();
    ctx.clip();
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle = "rgba(12,86,128,.34)";
    ctx.fillRect(il, sy, innerW, ib-sy);
    ctx.restore();
  } else {
    cubeFaces(ctx, bx0, byb, side, d3x, d3y);
  }

  /* ---- 细绳 ---- */
  var ax = cx, ay = byb + (ST.shown>0.004 && sy<byb ? 0 : 0);
  var anchorX = cx, anchorY = ib - 3;
  var freeLen = S.slack;
  var dropCm = S.z;                 // 物体底面离缸底的高度（cm）
  ctx.save();
  ctx.lineCap = "round";
  var path = new Path2D();
  if (freeLen < 0.2){
    path.moveTo(ax, ay); path.lineTo(anchorX, anchorY);
  } else if (dropCm < 1.2 && freeLen > 1.5){
    // 物体躺在缸底：余绳从方块底边探出，在右下角外侧盘成一小圈（贴地）
    var coilR = Math.max(8, ppc*0.85);
    var ly = ib - coilR*0.60;
    var lx = bx0 + side + d3x + coilR*0.95;
    var sx = bx0 + side*0.84;
    path.moveTo(sx, ay);
    path.bezierCurveTo(sx + coilR*0.9, ly + 1.6, lx - coilR*1.7, ly + 0.9, lx - coilR*0.78, ly - coilR*0.05);
    path.ellipse(lx, ly - coilR*0.05, coilR, coilR*0.60, -0.12, 0, Math.PI*2.15, false);
  } else {
    // 悬空余绳：自然下垂成一圈松弛的弧
    var sag = Math.min(freeLen, 4.2) * ppc;
    path.moveTo(ax, ay);
    path.bezierCurveTo(ax + sag*0.34, ay + (anchorY-ay)*0.32,
                       anchorX + sag*0.20, ay + (anchorY-ay)*0.74,
                       anchorX, anchorY);
  }
  ctx.strokeStyle = "rgba(3,10,18,.6)"; ctx.lineWidth = Math.max(2.6, ppc*0.20); ctx.stroke(path);
  ctx.strokeStyle = "rgba(214,226,240,.88)"; ctx.lineWidth = Math.max(1.1, ppc*0.085); ctx.stroke(path);
  // 缸底吊环
  ctx.beginPath(); ctx.arc(anchorX, anchorY, Math.max(2.6, ppc*0.22), 0, Math.PI*2);
  ctx.fillStyle = "#0b1622"; ctx.fill();
  ctx.strokeStyle = "rgba(170,195,220,.7)"; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.restore();

  /* ---- 水面：高光线、涟漪、弯月面 ---- */
  if (ST.shown > 0.004){
    var amp = 0.9 + ST.pour * 2.4;
    ctx.save();
    ctx.beginPath(); ctx.rect(il-1, sy-8, innerW+2, 16); ctx.clip();
    ctx.beginPath();
    for (var x2=il; x2<=ir; x2+=3){
      var edge = Math.min(x2-il, ir-x2);
      var lift = edge < 11 ? (1 - edge/11) * 2.6 : 0;   // 贴壁弯月面
      var yy2 = sy + Math.sin(x2*0.105 + ST.t*2.6)*amp + Math.sin(x2*0.032 - ST.t*1.35)*amp*0.7 - lift;
      if (x2===il) ctx.moveTo(x2,yy2); else ctx.lineTo(x2,yy2);
    }
    ctx.strokeStyle = "rgba(232,250,255,.92)"; ctx.lineWidth = Math.max(1.4, ppc*0.10);
    ctx.shadowColor = "rgba(160,235,255,.75)"; ctx.shadowBlur = 7; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();

    // 涟漪
    for (var r=0;r<ST.ripples.length;r++){
      var rp = ST.ripples[r];
      ctx.beginPath();
      ctx.ellipse(rp.x, sy, rp.r, rp.r*0.22, 0, 0, Math.PI*2);
      ctx.strokeStyle = "rgba(220,248,255," + (0.5*(1-rp.r/rp.rmax)).toFixed(3) + ")";
      ctx.lineWidth = 1.4; ctx.stroke();
    }
    // 气泡
    for (var b=0;b<ST.bubbles.length;b++){
      var bu = ST.bubbles[b];
      ctx.beginPath(); ctx.arc(bu.x, bu.y, bu.r, 0, Math.PI*2);
      ctx.fillStyle = "rgba(210,245,255,.20)"; ctx.fill();
      ctx.strokeStyle = "rgba(230,250,255,.45)"; ctx.lineWidth = 0.9; ctx.stroke();
      ctx.beginPath(); ctx.arc(bu.x - bu.r*0.32, bu.y - bu.r*0.34, bu.r*0.3, 0, Math.PI*2);
      ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fill();
    }
  }

  /* ---- 玻璃缸：前壁高光与反射 ---- */
  ctx.save();
  // 左侧壁
  var lw = ctx.createLinearGradient(il-wall,0,il+3,0);
  lw.addColorStop(0,"rgba(190,225,245,.30)"); lw.addColorStop(0.5,"rgba(190,225,245,.10)"); lw.addColorStop(1,"rgba(190,225,245,.02)");
  ctx.fillStyle = lw; ctx.fillRect(il-wall, it-wall, wall, innerH+wall*2);
  // 右侧壁
  var rw = ctx.createLinearGradient(ir-3,0,ir+wall,0);
  rw.addColorStop(0,"rgba(190,225,245,.03)"); rw.addColorStop(1,"rgba(190,225,245,.22)");
  ctx.fillStyle = rw; ctx.fillRect(ir-1, it-wall, wall+1, innerH+wall*2);
  // 缸口
  var tg = ctx.createLinearGradient(0,it-wall,0,it);
  tg.addColorStop(0,"rgba(210,238,255,.30)"); tg.addColorStop(1,"rgba(210,238,255,.06)");
  ctx.fillStyle = tg; ctx.fillRect(il-wall, it-wall, innerW+wall*2, wall);
  // 缸底玻璃
  var bg2 = ctx.createLinearGradient(0,ib,0,ib+wall);
  bg2.addColorStop(0,"rgba(210,238,255,.22)"); bg2.addColorStop(1,"rgba(210,238,255,.06)");
  ctx.fillStyle = bg2; ctx.fillRect(il-wall, ib, innerW+wall*2, wall);
  // 斜向窗光反射（裁剪在缸内，避免溢出到缸外）
  ctx.save();
  ctx.beginPath(); ctx.rect(il, it, innerW, innerH); ctx.clip();
  ctx.beginPath();
  ctx.moveTo(il+innerW*0.10, it); ctx.lineTo(il+innerW*0.30, it);
  ctx.lineTo(il+innerW*0.06, ib); ctx.lineTo(il-innerW*0.02, ib);
  ctx.closePath();
  var sg = ctx.createLinearGradient(il,it,il+innerW*0.3,ib);
  sg.addColorStop(0,"rgba(255,255,255,.13)"); sg.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle = sg; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(il+innerW*0.36, it); ctx.lineTo(il+innerW*0.42, it);
  ctx.lineTo(il+innerW*0.19, ib); ctx.lineTo(il+innerW*0.13, ib);
  ctx.closePath();
  ctx.fillStyle = "rgba(255,255,255,.07)"; ctx.fill();
  ctx.restore();
  // 玻璃轮廓
  ctx.strokeStyle = "rgba(186,222,244,.42)"; ctx.lineWidth = 1.4;
  roundRect(ctx, il-wall, it-wall, innerW+wall*2, innerH+wall*2, Math.max(3,wall*0.8)); ctx.stroke();
  ctx.strokeStyle = "rgba(150,200,230,.20)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(il,it); ctx.lineTo(il,ib); ctx.lineTo(ir,ib); ctx.lineTo(ir,it); ctx.stroke();
  ctx.restore();

  /* ---- 实验室水龙头 + 进水水柱 ---- */
  var nozX = ir - innerW*0.24;
  var armH = clamp(ppc*0.72, 8, 12);
  var armY = Math.max(10, it - ppc*4.3);
  var nozBot = it - Math.max(10, ppc*1.5);
  var nozW = clamp(ppc*1.55, 15, 23);
  ctx.save();
  var pg = ctx.createLinearGradient(0, armY, 0, armY+armH);
  pg.addColorStop(0,"#e2edf6"); pg.addColorStop(0.32,"#a3bacb"); pg.addColorStop(0.68,"#5d7488"); pg.addColorStop(1,"#3a4e60");
  ctx.fillStyle = pg;
  // 横臂：从画布右侧伸入
  roundRect(ctx, nozX - 4, armY, W - nozX + 8, armH, armH/2); ctx.fill();
  // 弯头
  var eg = ctx.createRadialGradient(nozX-2, armY+armH*0.2, 1, nozX, armY+armH*0.5, armH*1.6);
  eg.addColorStop(0,"#f0f7fc"); eg.addColorStop(0.5,"#96adc0"); eg.addColorStop(1,"#36495b");
  ctx.fillStyle = eg;
  roundRect(ctx, nozX - armH*0.9, armY - 2, armH*1.8, armH + 5, armH*0.5); ctx.fill();
  // 出水口
  var ng = ctx.createLinearGradient(nozX - nozW/2, 0, nozX + nozW/2, 0);
  ng.addColorStop(0,"#4b6073"); ng.addColorStop(0.32,"#dde9f3"); ng.addColorStop(0.62,"#8ea6b9"); ng.addColorStop(1,"#394c5e");
  ctx.fillStyle = ng;
  ctx.beginPath();
  ctx.moveTo(nozX - nozW/2, armY + armH - 2);
  ctx.lineTo(nozX + nozW/2, armY + armH - 2);
  ctx.lineTo(nozX + nozW*0.34, nozBot);
  ctx.lineTo(nozX - nozW*0.34, nozBot);
  ctx.closePath(); ctx.fill();
  // 阀门旋钮
  var knobX = nozX + Math.min(48, Math.max(20, W - nozX - 26));
  ctx.beginPath(); ctx.arc(knobX, armY + armH/2, armH*0.8, 0, Math.PI*2);
  ctx.fillStyle = "#2c465a"; ctx.fill();
  ctx.strokeStyle = "rgba(198,224,240,.6)"; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(knobX, armY + armH/2 - armH*0.8); ctx.lineTo(knobX, armY + armH/2 + armH*0.8);
  ctx.strokeStyle = "rgba(198,224,240,.35)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();

  if (ST.pour > 0.02 && ST.shown < PH.hMax - 0.05){
    var streamTop = nozBot;
    var streamBot = sy;
    if (streamBot > streamTop + 4){
      ctx.save();
      ctx.beginPath(); ctx.rect(nozX-9, streamTop, 18, streamBot-streamTop); ctx.clip();
      var stg = ctx.createLinearGradient(nozX-4,0,nozX+4,0);
      stg.addColorStop(0,"rgba(190,240,255,.55)"); stg.addColorStop(0.45,"rgba(235,252,255,.92)"); stg.addColorStop(1,"rgba(190,240,255,.55)");
      ctx.fillStyle = stg;
      var wdt = 5 + ST.pour*2.6;
      ctx.beginPath();
      for (var yy3=streamTop; yy3<=streamBot; yy3+=3){
        var xoff = Math.sin((yy3-streamTop)*0.13 + ST.t*9)*0.9*ST.pour;
        var ww = wdt * (0.75 + 0.25*(yy3-streamTop)/Math.max(1,streamBot-streamTop));
        if (yy3===streamTop){ ctx.moveTo(nozX+ww/2+xoff, yy3); ctx.lineTo(nozX-ww/2+xoff, yy3); }
        else { ctx.lineTo(nozX+ww/2+xoff, yy3); }
      }
      for (var yy4=streamBot; yy4>=streamTop; yy4-=3){
        var xoff2 = Math.sin((yy4-streamTop)*0.13 + ST.t*9)*0.9*ST.pour;
        var ww2 = wdt * (0.75 + 0.25*(yy4-streamTop)/Math.max(1,streamBot-streamTop));
        ctx.lineTo(nozX-ww2/2+xoff2, yy4);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  /* ---- 刻度尺 ---- */
  var rx = il - wall - Math.max(20, ppc*2.2);
  var tickLen = Math.max(6, ppc*0.55);
  ctx.save();
  ctx.fillStyle = "rgba(125,211,252,.06)";
  roundRect(ctx, rx-8, it-14, Math.max(30, ppc*3.1), innerH+18, 8); ctx.fill();
  ctx.font = "600 " + clamp(ppc*0.78, 9.5, 12.5).toFixed(1) + "px -apple-system,'Microsoft YaHei',sans-serif";
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (var cm=0; cm<=PH.tankH; cm++){
    var y = ib - cm*ppc;
    if (y < it-2 || y > ib+2) continue;
    var major = (cm % 4 === 0);
    ctx.strokeStyle = major ? "rgba(148,196,225,.85)" : "rgba(120,160,190,.42)";
    ctx.lineWidth = major ? 1.3 : 1;
    ctx.beginPath(); ctx.moveTo(rx, y); ctx.lineTo(rx + (major ? tickLen*1.5 : tickLen), y); ctx.stroke();
    if (major){
      ctx.fillStyle = "rgba(176,214,240,.92)";
      ctx.fillText(String(cm), rx - 3, y);
    }
  }
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(125,211,252,.9)";
  ctx.font = "700 " + clamp(ppc*0.82, 10, 13).toFixed(1) + "px -apple-system,'Microsoft YaHei',sans-serif";
  ctx.fillText("h/cm", rx-6, it-24);
  ctx.restore();

  /* ---- 水面高度标注 ---- */
  if (ST.shown > 0.02){
    var lineY = sy;
    ctx.save();
    ctx.setLineDash([5,4]);
    ctx.strokeStyle = "rgba(125,211,252,.75)"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(ir, lineY); ctx.lineTo(W-4, lineY); ctx.stroke();
    ctx.setLineDash([]);
    var txt = "h = " + ST.shown.toFixed(1) + " cm";
    ctx.font = "800 " + clamp(ppc*0.86, 10.5, 13).toFixed(1) + "px -apple-system,'Microsoft YaHei',sans-serif";
    var tw = ctx.measureText(txt).width;
    var pw = tw + 16, ph = Math.max(20, ppc*1.5);
    var px0 = W - pw - 2, py0 = clamp(lineY - ph/2, 2, H - ph - 2);
    var pg2 = ctx.createLinearGradient(px0, py0, px0+pw, py0+ph);
    pg2.addColorStop(0,"rgba(14,116,144,.96)"); pg2.addColorStop(1,"rgba(8,145,178,.96)");
    ctx.fillStyle = pg2;
    roundRect(ctx, px0, py0, pw, ph, ph/2); ctx.fill();
    ctx.strokeStyle = "rgba(125,211,252,.55)"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "#eafaff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(txt, px0 + pw/2, py0 + ph/2 + 0.5);
    ctx.restore();
  }

  /* ---- 左下角状态提示 ---- */
  ctx.save();
  ctx.font = "700 " + clamp(ppc*0.82, 10.5, 13).toFixed(1) + "px -apple-system,'Microsoft YaHei',sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  var stg2 = STAGES[S.stage];
  ctx.fillStyle = stg2.color;
  ctx.fillText("阶段 " + stg2.no + " · " + stg2.name, 12, H - 12);
  ctx.restore();
}

/* ================= 受力图绘制 ================= */
function drawForce(){
  var L = LAY.force; if(!L) return;
  var ctx = L.ctx, W = L.w, H = L.h;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  var S = solve(ST.shown);

  var cx = W/2, cy = H*0.44;
  var sc = Math.min(H*0.30, W*0.62) / PH.G;    // px per N（以 G 为基准）

  // 背景参考线
  ctx.save();
  ctx.strokeStyle = "rgba(125,211,252,.09)"; ctx.lineWidth = 1; ctx.setLineDash([4,5]);
  ctx.beginPath(); ctx.moveTo(cx, 16); ctx.lineTo(cx, H-16); ctx.stroke();
  ctx.restore();

  // 物体小方块
  var bs = clamp(W*0.30, 40, 64);
  var bxx = cx - bs/2, byy = cy - bs/2, ddx = bs*0.13, ddy = bs*0.11;
  var g1 = ctx.createLinearGradient(bxx, byy, bxx+bs, byy+bs);
  g1.addColorStop(0,"#eaa05c"); g1.addColorStop(1,"#b25c22");
  ctx.fillStyle = g1; ctx.beginPath(); ctx.rect(bxx,byy,bs,bs); ctx.fill();
  ctx.beginPath(); ctx.moveTo(bxx,byy); ctx.lineTo(bxx+bs,byy); ctx.lineTo(bxx+bs+ddx,byy-ddy); ctx.lineTo(bxx+ddx,byy-ddy); ctx.closePath();
  ctx.fillStyle = "#f0b273"; ctx.fill();
  ctx.beginPath(); ctx.moveTo(bxx+bs,byy); ctx.lineTo(bxx+bs+ddx,byy-ddy); ctx.lineTo(bxx+bs+ddx,byy+bs-ddy); ctx.lineTo(bxx+bs,byy+bs); ctx.closePath();
  ctx.fillStyle = "#9a4d1a"; ctx.fill();
  ctx.strokeStyle = "rgba(255,236,208,.5)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.rect(bxx,byy,bs,bs); ctx.stroke();

  // 重心
  ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, Math.PI*2);
  ctx.fillStyle = "#f8fafc"; ctx.fill();
  ctx.strokeStyle = "#0b1622"; ctx.lineWidth = 1.6; ctx.stroke();

  var fs = clamp(W*0.028, 9.5, 13.5);
  ctx.font = "800 " + fs.toFixed(1) + "px -apple-system,'Microsoft YaHei',sans-serif";

  function vec(x0,y0,x1,y1,color,dashed,width){
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = width;
    if (dashed) ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    ctx.restore();
    arrowHead(ctx, x1, y1, x1-x0, y1-y0, Math.max(8, fs*0.95), color);
  }
  function label(x,y,text,color,align){
    ctx.save();
    ctx.textAlign = align || "left"; ctx.textBaseline = "middle";
    ctx.lineWidth = 3.2; ctx.strokeStyle = "rgba(4,10,20,.85)";
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color; ctx.fillText(text, x, y);
    ctx.restore();
  }

  // F浮（向上）
  var fUp = S.F * sc;
  if (fUp > 1){
    vec(cx, cy, cx, cy - fUp, "#22d3ee", false, 2.6);
    label(cx + 8, cy - fUp - 2, "F浮 = " + S.F.toFixed(1) + " N", "#67e8f9", "left");
  }
  // G（向下）
  var gDown = PH.G * sc;
  vec(cx, cy, cx, cy + gDown, "#fb923c", false, 2.6);
  label(cx + 8, cy + gDown + 2, "G = " + PH.G.toFixed(1) + " N", "#fdba74", "left");
  // N（支持力，向上，左侧虚线）
  if (S.N > 0.02){
    vec(cx - W*0.22, cy, cx - W*0.22, cy - S.N*sc, "#94a3b8", true, 1.8);
    label(cx - W*0.22, cy - S.N*sc - 12, "N = " + S.N.toFixed(1) + " N", "#cbd5e1", "center");
  }
  // T（绳拉力，向下，右侧虚线）
  if (S.T > 0.02){
    vec(cx + W*0.22, cy, cx + W*0.22, cy + S.T*sc, "#c084fc", true, 1.8);
    label(cx + W*0.22, cy + S.T*sc + 13, "T = " + S.T.toFixed(1) + " N", "#d8b4fe", "center");
  }

  // 底部结论
  var stg = STAGES[S.stage];
  var txt;
  if (S.stage === 0) txt = "F浮 < G → 沉底（N = " + S.N.toFixed(1) + " N）";
  else if (S.stage === 1) txt = "F浮 = G → 漂浮（绳松弛）";
  else if (S.stage === 2) txt = "F浮 > G → 绳拉直（T = " + S.T.toFixed(1) + " N）";
  else txt = "完全浸没（T = " + S.T.toFixed(1) + " N）";
  ctx.save();
  ctx.font = "700 " + clamp(W*0.033, 10.5, 13).toFixed(1) + "px -apple-system,'Microsoft YaHei',sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  var tw = ctx.measureText(txt).width;
  var pw = Math.min(W-10, tw + 18), ph = 26;
  ctx.fillStyle = "rgba(8,20,34,.9)";
  roundRect(ctx, cx-pw/2, H-42, pw, ph, 8); ctx.fill();
  ctx.strokeStyle = stg.color + "66"; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = stg.color;
  ctx.fillText(txt, cx, H-42+ph/2+0.5);
  ctx.restore();
}

/* ================= F浮-h 图像绘制 ================= */
function drawGraph(){
  var L = LAY.graph; if(!L) return;
  var ctx = L.ctx, W = L.w, H = L.h;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  var pad = { l: clamp(W*0.13, 34, 48), r: 14, t: 16, b: clamp(H*0.13, 30, 40) };
  var x0 = pad.l, x1 = W - pad.r, y0 = H - pad.b, y1 = pad.t;
  var HMAX = PH.hMax, FMAX = 12;
  var gx = function(h){ return x0 + (x1-x0) * h / HMAX; };
  var gy = function(F){ return y0 - (y0-y1) * F / FMAX; };

  var fs = clamp(W*0.031, 9.5, 12.5);
  var FONT = "600 " + fs.toFixed(1) + "px -apple-system,'Microsoft YaHei',sans-serif";
  var FONTB = "800 " + fs.toFixed(1) + "px -apple-system,'Microsoft YaHei',sans-serif";

  // 背景
  ctx.fillStyle = "rgba(6,16,28,.55)";
  roundRect(ctx, x0-4, y1-6, (x1-x0)+8, (y0-y1)+12, 8); ctx.fill();

  // 四阶段色带
  var bands = [[0,6,"rgba(56,189,248,.13)"],[6,12,"rgba(52,211,153,.14)"],
               [12,16,"rgba(251,191,36,.13)"],[16,20,"rgba(167,139,250,.13)"]];
  for (var i=0;i<bands.length;i++){
    var b = bands[i];
    ctx.fillStyle = b[2];
    ctx.fillRect(gx(b[0]), y1, gx(b[1])-gx(b[0]), y0-y1);
  }
  // 阶段分界虚线
  ctx.save();
  ctx.setLineDash([4,4]); ctx.strokeStyle = "rgba(148,163,184,.28)"; ctx.lineWidth = 1;
  for (var k=0;k<BOUND.length;k++){
    ctx.beginPath(); ctx.moveTo(gx(BOUND[k]), y1); ctx.lineTo(gx(BOUND[k]), y0); ctx.stroke();
  }
  ctx.restore();

  // 网格
  ctx.save();
  ctx.strokeStyle = "rgba(148,163,184,.16)"; ctx.lineWidth = 1; ctx.setLineDash([3,4]);
  for (var f=2; f<=FMAX; f+=2){
    ctx.beginPath(); ctx.moveTo(x0, gy(f)); ctx.lineTo(x1, gy(f)); ctx.stroke();
  }
  for (var hh=4; hh<=HMAX; hh+=4){
    ctx.beginPath(); ctx.moveTo(gx(hh), y1); ctx.lineTo(gx(hh), y0); ctx.stroke();
  }
  ctx.restore();

  // 坐标轴
  ctx.strokeStyle = "rgba(203,213,225,.85)"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(x0, y1-2); ctx.lineTo(x0, y0); ctx.lineTo(x1+2, y0); ctx.stroke();
  arrowHead(ctx, x0, y1-4, 0, -1, 9, "rgba(203,213,225,.9)");
  arrowHead(ctx, x1+4, y0, 1, 0, 9, "rgba(203,213,225,.9)");

  // 刻度与数字
  ctx.fillStyle = "#94a3b8"; ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.font = FONT;
  for (var h2=0; h2<=HMAX; h2+=4){
    ctx.beginPath(); ctx.moveTo(gx(h2), y0); ctx.lineTo(gx(h2), y0+5);
    ctx.strokeStyle = "rgba(203,213,225,.6)"; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillText(String(h2), gx(h2), y0+8);
  }
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (var f2=0; f2<=FMAX; f2+=2){
    if (f2===0) continue;
    var isKey = (f2===6 || f2===10);
    ctx.beginPath(); ctx.moveTo(x0, gy(f2)); ctx.lineTo(x0-5, gy(f2));
    ctx.strokeStyle = isKey ? "rgba(203,213,225,.8)" : "rgba(203,213,225,.45)";
    ctx.lineWidth = 1.2; ctx.stroke();
    ctx.font = isKey ? FONTB : FONT;
    ctx.fillStyle = isKey ? "#e2e8f0" : "#7f8ea3";
    ctx.fillText(String(f2), x0-8, gy(f2));
  }
  // 轴名（放在绘图区内的空角，避免与刻度数字重叠）
  ctx.font = FONTB; ctx.fillStyle = "rgba(148,163,184,.85)";
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText("F浮 / N", x0 + 9, y1 + 5);
  ctx.textAlign = "right"; ctx.textBaseline = "bottom";
  ctx.fillText("h / cm", x1 - 6, y0 - 7);

  // 曲线（分段着色：已走过 = 亮色，未到达 = 灰）
  var hCur = ST.shown;
  var pts = [];
  for (var h3=0; h3<=HMAX+1e-9; h3+=0.2){
    pts.push([gx(h3), gy(solve(h3).F), h3]);
  }
  function strokeSegs(upto, color, width, dash){
    ctx.save();
    if (dash) ctx.setLineDash(dash);
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    var started = false;
    for (var q=0;q<pts.length;q++){
      var p = pts[q];
      var inSeg = (upto === null) ? true : (p[2] <= upto + 1e-9);
      if (!inSeg){ started = false; continue; }
      if (!started){ ctx.moveTo(p[0], p[1]); started = true; }
      else ctx.lineTo(p[0], p[1]);
    }
    ctx.stroke();
    ctx.restore();
  }
  // 未到达部分
  ctx.save();
  ctx.strokeStyle = "rgba(148,163,184,.42)"; ctx.lineWidth = 2.2; ctx.lineJoin="round";
  ctx.beginPath();
  var begun = false;
  for (var q2=0;q2<pts.length;q2++){
    var p2 = pts[q2];
    if (p2[2] < hCur - 1e-9){ begun = false; continue; }
    if (!begun){ ctx.moveTo(p2[0], p2[1]); begun = true; }
    else ctx.lineTo(p2[0], p2[1]);
  }
  ctx.stroke();
  ctx.restore();
  // 已到达部分（按阶段用不同颜色）
  var segColors = ["#38bdf8","#34d399","#fbbf24","#a78bfa"];
  for (var s=0;s<4;s++){
    var lo = s===0?0:BOUND[s-1], hi = (s===3?HMAX:BOUND[s]);
    if (hCur <= lo) continue;
    ctx.save();
    ctx.strokeStyle = segColors[s]; ctx.lineWidth = 3.2; ctx.lineJoin="round"; ctx.lineCap="round";
    ctx.beginPath();
    var st2 = false;
    for (var q3=0;q3<pts.length;q3++){
      var p3 = pts[q3];
      if (p3[2] < lo - 1e-9 || p3[2] > Math.min(hi, hCur) + 1e-9){ st2 = false; continue; }
      if (!st2){ ctx.moveTo(p3[0], p3[1]); st2 = true; }
      else ctx.lineTo(p3[0], p3[1]);
    }
    // 保证段首连上
    ctx.stroke();
    ctx.restore();
  }
  // 补上拐点连线（阶段切换处）
  ctx.save();
  ctx.strokeStyle = "rgba(148,163,184,0)"; ctx.restore();

  // 当前点
  var Fcur = solve(hCur).F;
  var pxc = gx(hCur), pyc = gy(Fcur);
  ctx.save();
  ctx.setLineDash([4,4]); ctx.strokeStyle = "rgba(148,163,184,.55)"; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(x0, pyc); ctx.lineTo(pxc, pyc); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pxc, y0); ctx.lineTo(pxc, pyc); ctx.stroke();
  ctx.restore();

  ctx.beginPath(); ctx.arc(pxc, pyc, 8.5, 0, Math.PI*2);
  ctx.fillStyle = "rgba(52,211,153,.22)"; ctx.fill();
  ctx.beginPath(); ctx.arc(pxc, pyc, 5, 0, Math.PI*2);
  ctx.fillStyle = "#34d399"; ctx.fill();
  ctx.strokeStyle = "#ecfdf5"; ctx.lineWidth = 1.6; ctx.stroke();

  // 数值标签
  ctx.save();
  ctx.font = FONTB; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
  var valTxt = Fcur.toFixed(1);
  var vx = pxc + 9, vy = pyc - 9;
  var vw = ctx.measureText(valTxt).width;
  if (vx + vw > x1) { ctx.textAlign = "right"; vx = pxc - 9; }
  ctx.lineWidth = 3.4; ctx.strokeStyle = "rgba(4,10,20,.9)";
  ctx.strokeText(valTxt, vx, vy);
  ctx.fillStyle = "#f87171"; ctx.fillText(valTxt, vx, vy);
  ctx.restore();

  // 阶段编号
  ctx.save();
  ctx.font = FONTB; ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (var b2=0;b2<4;b2++){
    var lo2 = b2===0?0:BOUND[b2-1], hi2 = b2===3?HMAX:BOUND[b2];
    var mx = (gx(lo2)+gx(hi2))/2;
    var active = (ST.shown >= lo2 && (ST.shown < hi2 || (b2===3 && ST.shown>=16)));
    ctx.fillStyle = active ? segColors[b2] : "rgba(148,163,184,.5)";
    ctx.fillText(STAGES[b2].no, mx, y1 + 2);
  }
  ctx.restore();
}

/* ================= UI 同步 ================= */
var elH = document.getElementById("roH"), elImm = document.getElementById("roImm"),
    elF = document.getElementById("roF"), elState = document.getElementById("roState");
var elSlider = document.getElementById("hSlider"), elSliderVal = document.getElementById("sliderVal");
var scBar = document.getElementById("scBar"), scTitle = document.getElementById("scTitle"),
    scExpr = document.getElementById("scExpr"), scDesc = document.getElementById("scDesc"),
    stageCard = document.getElementById("stageCard");
var btnAuto = document.getElementById("btnAuto"), icoAuto = document.getElementById("icoAuto"),
    txtAuto = document.getElementById("txtAuto");

var chipsBox = document.getElementById("chips");
var CHIP_H = [3, 9, 14, 18];
for (var ci=0; ci<4; ci++){
  (function(idx){
    var d = document.createElement("div");
    d.className = "chip";
    d.textContent = STAGES[idx].no + " " + STAGES[idx].name;
    d.addEventListener("click", function(){
      setAuto(false);
      ST.h = CHIP_H[idx];
      ST.shown = CHIP_H[idx];
    });
    chipsBox.appendChild(d);
  })(ci);
}

function syncUI(){
  var S = solve(ST.shown);
  elH.innerHTML = ST.shown.toFixed(1) + "<i>cm</i>";
  elImm.innerHTML = S.imm.toFixed(1) + "<i>cm</i>";
  elF.innerHTML = S.F.toFixed(2) + "<i>N</i>";
  elState.textContent = STAGES[S.stage].state;

  var stg = STAGES[S.stage];
  scBar.style.background = stg.color;
  scTitle.textContent = "阶段 " + stg.no + "：" + stg.name;
  scExpr.textContent = stg.expr;
  scExpr.style.color = stg.color;
  scDesc.textContent = stg.desc;
  stageCard.style.background = stg.color + "14";
  stageCard.style.borderColor = stg.color + "44";

  elSlider.value = ST.shown.toFixed(1);
  var pct = (ST.shown / PH.hMax * 100).toFixed(2) + "%";
  elSlider.style.setProperty("--p", pct);
  elSliderVal.textContent = ST.shown.toFixed(1) + " cm";

  var chips = chipsBox.children;
  for (var i=0;i<chips.length;i++){
    var on = (i === S.stage);
    chips[i].classList.toggle("on", on);
    chips[i].style.background = on ? STAGES[i].color : "";
  }
}

/* ================= 交互 ================= */
function setAuto(on){
  ST.auto = on;
  btnAuto.classList.toggle("on", on);
  icoAuto.className = "ico " + (on ? "pause" : "play");
  txtAuto.textContent = on ? "暂停演示" : "自动演示";
}
btnAuto.addEventListener("click", function(){
  if (ST.paused){                       // 暂停中 → 继续
    ST.paused = false; setAuto(true); return;
  }
  if (!ST.auto){                        // 开始演示：从空缸重新加水，完整走完四个阶段
    ST.h = 0; ST.shown = 0; autoPhase = "rise"; autoHold = 0;
    setAuto(true);
  } else {
    setAuto(false);
  }
});
document.getElementById("btnReset").addEventListener("click", function(){
  setAuto(false); ST.h = 0; ST.shown = 0; ST.paused = false;
  ST.ripples.length = 0; ST.bubbles.length = 0;
});
elSlider.addEventListener("input", function(){
  setAuto(false);
  ST.h = parseFloat(elSlider.value) || 0;
});
window.addEventListener("keydown", function(e){
  if (e.code === "Space" || e.key === " "){
    e.preventDefault();
    ST.paused = !ST.paused;
    if (ST.auto){
      btnAuto.classList.toggle("on", !ST.paused);
      icoAuto.className = "ico " + (ST.paused ? "play" : "pause");
      txtAuto.textContent = ST.paused ? "继续演示" : "暂停演示";
    }
  }
});

/* ================= 主循环 ================= */
var last = 0, autoHold = 0, autoPhase = "rise";
function update(dt){
  var prev = ST.h;
  if (ST.auto && !ST.paused){
    if (autoPhase === "rise"){
      ST.h += dt * 1.45;
      if (ST.h >= PH.hMax){ ST.h = PH.hMax; autoPhase = "hold"; autoHold = 0; }
    } else {
      autoHold += dt;
      if (autoHold > 1.3){ ST.h = 0; autoPhase = "rise"; }
    }
  }
  // 平滑（时间常数 0.12 s；暂停时立即对齐，画面真正“冻结”）
  if (ST.paused){
    ST.shown = ST.h;
  } else {
    var k = 1 - Math.exp(-dt / 0.09);
    ST.shown += (ST.h - ST.shown) * k;
    if (Math.abs(ST.h - ST.shown) < 0.02) ST.shown = ST.h;
  }

  var dh = Math.abs(ST.shown - prev);
  var target = clamp(dh / (dt * 6 + 1e-6), 0, 1);
  ST.pour += (target - ST.pour) * (1 - Math.pow(0.02, dt));
  if (ST.pour < 0.01) ST.pour = 0;

  ST.t += dt;

  // 涟漪
  if (ST.pour > 0.25 && ST.shown > 0.2 && Math.random() < ST.pour * 0.35){
    ST.ripples.push({ x: LAY.scene ? (LAY.scene.ir - (LAY.scene.ir-LAY.scene.il)*0.24) : 200,
                      r: 2, rmax: 26 + Math.random()*16 });
  }
  for (var i=ST.ripples.length-1;i>=0;i--){
    ST.ripples[i].r += dt * 34;
    if (ST.ripples[i].r > ST.ripples[i].rmax) ST.ripples.splice(i,1);
  }
  // 气泡
  if (ST.shown > 1 && ST.bubbles.length < 14 && Math.random() < dt*1.6){
    var Ls = LAY.scene;
    if (Ls){
      ST.bubbles.push({
        x: Ls.il + Math.random()*(Ls.ir-Ls.il),
        y: Ls.ib - 4,
        r: 1.2 + Math.random()*1.8,
        vy: 14 + Math.random()*22,
        wob: Math.random()*Math.PI*2
      });
    }
  }
  for (var b=ST.bubbles.length-1;b>=0;b--){
    var bu = ST.bubbles[b];
    bu.y -= bu.vy*dt; bu.wob += dt*3;
    bu.x += Math.sin(bu.wob)*0.35;
    var syNow = LAY.scene ? (LAY.scene.ib - ST.shown*LAY.scene.ppc) : 0;
    if (bu.y < syNow + 2 || bu.y < 0) ST.bubbles.splice(b,1);
  }
}

function frame(now){
  if (!last) last = now;
  var dt = Math.min((now - last)/1000, 0.05);
  last = now;
  update(dt);
  drawScene(); drawForce(); drawGraph(); syncUI();
  requestAnimationFrame(frame);
}

/* 启动 */
relayout();
setTimeout(function(){ relayout(); }, 60);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
syncUI();
requestAnimationFrame(frame);

// 供自动化测试使用
window.__buoy = {
  solve: solve,
  stageOf: stageOf,
  getH: function(){ return ST.shown; },
  getTarget: function(){ return ST.h; },
  setH: function(v){ setAuto(false); ST.h = v; ST.shown = v; },
  setAuto: setAuto,
  isPaused: function(){ return ST.paused; },
  setPaused: function(v){ ST.paused = !!v; },
  PH: PH,
  STAGES: STAGES
};
})();
</script>
