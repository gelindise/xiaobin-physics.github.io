name: 同步网站到香港服务器

# push 网站文件后自动同步；也可以到 Actions 页面手动点 Run workflow
on:
  push:
    branches: [main]
    paths-ignore:
      - "api/**"
      - ".github/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync sshpass

      # rsync 只传有变化的文件，首次 1.7GB 约 10-30 分钟，之后几秒完成
      - name: 同步到香港服务器
        env:
          SSHPASS: ${{ secrets.HK_PASSWORD }}
          HK_HOST: ${{ secrets.HK_HOST }}
        run: |
          rsync -avz --delete \
            -e "sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'api/' \
            --exclude 'node_modules/' \
            --exclude 'shots/' \
            --exclude '.vercel/' \
            --exclude '.env*' \
            --exclude '*.bak' \
            --exclude '.DS_Store' \
            --exclude 'vercel.json' \
            --exclude 'CNAME' \
            ./ root@$HK_HOST:/var/www/xiaobin/
