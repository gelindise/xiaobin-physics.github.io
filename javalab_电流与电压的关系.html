<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>探究电流与电压的关系 - 虚拟实验</title>
  <script src="protect.js"></script>
  <script src="auth-check.js"></script>
  <style>
    :root {
      --bg: #f1f5f9; --card-bg: #ffffff; --card-border: #e2e8f0;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.06);
      --text-primary: #1e293b; --text-secondary: #64748b; --text-body: #475569;
      --btn-border: #cbd5e1; --primary: #3b82f6; --primary-hover: #2563eb;
      --danger: #ef4444; --success: #16a34a;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);color:var(--text-body);min-height:100vh;
      display:flex;justify-content:center;align-items:flex-start;padding:16px;
    }
    .main-container{width:100%;max-width:980px;display:flex;flex-direction:column;gap:10px}
    .card{
      background:var(--card-bg);border:1px solid var(--card-border);
      border-radius:14px;box-shadow:var(--card-shadow);padding:14px 18px;
    }
    .header-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
    h1{font-size:1.3rem;color:var(--text-primary);font-weight:700}
    .subtitle{font-size:0.82rem;color:var(--text-secondary);margin-top:2px}
    .btn-row{display:flex;gap:7px;flex-wrap:wrap}
    button{
      font-family:inherit;font-size:0.85rem;padding:7px 14px;
      border-radius:7px;border:1px solid var(--btn-border);
      background:var(--card-bg);color:var(--text-body);cursor:pointer;
      transition:all 0.15s;white-space:nowrap
    }
    button:hover{background:#f1f5f9}
    button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
    button.primary:hover{background:var(--primary-hover)}
    button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
    .canvas-wrap{
      position:relative;width:100%;aspect-ratio:4/3;max-height:620px;
      border-radius:10px;overflow:hidden;background:#fff;
      border:1px solid var(--card-border);
    }
    canvas{display:block;width:100%;height:100%}
    .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
    .info-card{
      background:var(--card-bg);border:1px solid var(--card-border);
      border-radius:9px;padding:10px 12px;box-shadow:var(--card-shadow)
    }
    .info-card .label{font-size:0.72rem;color:var(--text-secondary);margin-bottom:2px}
    .info-card .value{font-size:1.05rem;font-weight:700;color:var(--text-primary)}
    .bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:700px){.bottom-grid{grid-template-columns:1fr}}
    table{width:100%;border-collapse:collapse;font-size:0.82rem}
    th{background:#f8fafc;color:var(--text-secondary);font-weight:600;padding:6px 8px;border-bottom:2px solid #e2e8f0;text-align:center}
    td{padding:6px 8px;border-bottom:1px solid #f1f5f9;text-align:center;color:var(--text-body)}
    .graph-box{position:relative;width:100%;aspect-ratio:1;max-height:260px;border:1px solid #e2e8f0;border-radius:8px;background:#fff}
    .graph-box canvas{display:block;width:100%;height:100%}
    .empty-hint{color:#cbd5e1;font-size:0.82rem;text-align:center;padding:30px 0}
    .val-on{color:#16a34a!important}.val-off{color:#94a3b8!important}
  </style>
</head>
<body>
<div class="main-container">
  <div class="card">
    <div class="header-row">
      <div>
        <h1>探究电流与电压的关系</h1>
        <p class="subtitle">九年级物理 · 欧姆定律实验 · 实物电路仿真</p>
      </div>
      <div class="btn-row">
        <button class="primary" onclick="recordData()">记录数据</button>
        <button class="danger" onclick="clearData()">清空数据</button>
        <button onclick="toggleFullscreen()">⛶ 全屏</button>
      </div>
    </div>
  </div>

  <div class="card" style="padding:6px;">
    <div class="canvas-wrap">
      <canvas id="simCanvas"></canvas>
    </div>
  </div>

  <div class="info-grid">
    <div class="info-card"><div class="label">电路状态</div><div class="value val-on" id="circuitStatus">● 通路</div></div>
    <div class="info-card"><div class="label">电流表读数</div><div class="value val-on" id="valCurrent">0.30 A</div></div>
    <div class="info-card"><div class="label">电压表读数（R两端）</div><div class="value val-on" id="valVoltage">3.00 V</div></div>
    <div class="info-card"><div class="label">变阻器接入电阻</div><div class="value val-on" id="valRheo">0 Ω</div></div>
  </div>

  <div class="bottom-grid">
    <div class="card">
      <h3 style="font-size:0.9rem;color:var(--text-primary);margin-bottom:6px;">实验数据记录表</h3>
      <div style="max-height:200px;overflow-y:auto;">
        <table>
          <thead><tr><th>序号</th><th>电压U/V</th><th>电流I/A</th><th>R_rheo/Ω</th></tr></thead>
          <tbody id="dataTable"><tr><td colspan="4" class="empty-hint">点击"记录数据"开始采集</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h3 style="font-size:0.9rem;color:var(--text-primary);margin-bottom:6px;">I-U 关系图</h3>
      <div class="graph-box"><canvas id="graphCanvas"></canvas></div>
    </div>
  </div>
</div>

<script>
(function(){
  // ============ Access Protection ============
  (function(){
    var r=document.referrer,h=window.location.hostname;
    var a=['xiaobinlaoshi.cn','localhost','127.0.0.1','gelindise.github.io','xiaobin-physics.github.io'];
    var ok=!r||h==='localhost'||h==='127.0.0.1';
    if(!ok)for(var i=0;i<a.length;i++){if(r.indexOf(a[i])!==-1||h.indexOf(a[i])!==-1){ok=true;break}}
    if(!ok&&!localStorage.getItem('physics_lab_token')){
      document.body.innerHTML='<div style="text-align:center;padding:80px;color:#64748b;font-size:1.1rem;">请从平台首页进入实验</div>';return;
    }
  })();

  // ============ Canvas ============
  var canvas=document.getElementById('simCanvas'),ctx=canvas.getContext('2d');
  var W=0,H=0;
  function rs(){
    var r=canvas.parentElement.getBoundingClientRect(),d=window.devicePixelRatio||1;
    W=r.width;H=r.height;canvas.width=W*d;canvas.height=H*d;
    ctx.setTransform(1,0,0,1,0,0);ctx.scale(d,d);
  }
  rs();window.addEventListener('resize',rs);

  var gcv=document.getElementById('graphCanvas'),gctx=gcv.getContext('2d');
  var gW=0,gH=0;
  function grs(){
    var r=gcv.parentElement.getBoundingClientRect(),d=window.devicePixelRatio||1;
    gW=r.width;gH=r.height;gcv.width=gW*d;gcv.height=gH*d;
    gctx.setTransform(1,0,0,1,0,0);gctx.scale(d,d);
  }
  grs();window.addEventListener('resize',grs);

  // ============ Physics ============
  var Vbat=3.0,Rfix=10,Rmax=50,Rrheo=0,sfrac=0,closed=true;
  function calc(){if(!closed)return{I:0,VR:0};var t=Rfix+Rrheo;return{I:Vbat/t,VR:Vbat*Rfix/t}}

  // ============ roundRect polyfill ============
  if(!ctx.roundRect){ctx.roundRect=function(x,y,w,h,rr){
    if(typeof rr==='number')rr={tl:rr,tr:rr,br:rr,bl:rr};
    ctx.beginPath();ctx.moveTo(x+rr.tl,y);ctx.lineTo(x+w-rr.tr,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+rr.tr);ctx.lineTo(x+w,y+h-rr.br);
    ctx.quadraticCurveTo(x+w,y+h,x+w-rr.br,y+h);ctx.lineTo(x+rr.bl,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-rr.bl);ctx.lineTo(x,y+rr.tl);
    ctx.quadraticCurveTo(x,y,x+rr.tl,y);ctx.closePath();
  }}

  // ============ Component Positions ============
  function P(){return{
    // Ammeter - top left
    amX:W*0.19,amY:H*0.21,amR:W*0.07,
    // Voltmeter - top right
    vmX:W*0.73,vmY:H*0.22,vmR:W*0.07,
    // Fixed Resistor - center
    rx:W*0.42,ry:H*0.32,rw:W*0.13,rh:H*0.055,
    // Sliding Rheostat - right
    rhX:W*0.80,rhY:H*0.37,rhW:W*0.065,rhH:H*0.38,
    // Battery - bottom left
    batX:W*0.15,batY:H*0.68,batW:W*0.18,batH:H*0.10,
    // Knife switch - bottom center
    swX:W*0.38,swY:H*0.65,swW:W*0.10,swH:H*0.10
  }}

  // ============ Drawing Utilities ============
  function shadow(blur,color,fn){ctx.save();ctx.shadowBlur=blur;ctx.shadowColor=color;fn();ctx.restore()}
  function dot(x,y,r,c){ctx.fillStyle=c||'#475569';ctx.beginPath();ctx.arc(x,y,r||3,0,Math.PI*2);ctx.fill()}

  function drawWirePathPts(pts,color){
    ctx.save();ctx.strokeStyle=color||'#1a1a1a';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.shadowColor='rgba(0,0,0,0.1)';ctx.shadowBlur=2;
    ctx.beginPath();
    for(var i=0;i<pts.length;i++){
      var p=pts[i];if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);
    }
    ctx.stroke();ctx.restore();
  }

  // ============ Lab Bench Background ============
  function drawBench(){
    // Table surface
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#f8fafc');g.addColorStop(0.65,'#f1f5f9');g.addColorStop(0.66,'#e2e8f0');g.addColorStop(1,'#cbd5e1');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // Subtle grid
    ctx.strokeStyle='rgba(148,163,184,0.1)';ctx.lineWidth=0.5;
    for(var x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
    for(var y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    // Table edge line
    ctx.strokeStyle='#94a3b8';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,H*0.66);ctx.lineTo(W,H*0.66);ctx.stroke();
  }

  // ============ Battery Holder ============
  function drawBattery(bx,by,bw,bh){
    var g=ctx;
    // Shadow
    g.fillStyle='rgba(0,0,0,0.08)';g.beginPath();g.roundRect(bx-bw*0.05,by-bh*0.1,bw*1.1,bh*1.25,8);g.fill();
    // Plastic case - dark blue
    var cg=g.createLinearGradient(bx,by,bx,by+bh);
    cg.addColorStop(0,'#3b5998');cg.addColorStop(0.3,'#2d4373');cg.addColorStop(0.7,'#1e3a5f');cg.addColorStop(1,'#15304f');
    g.fillStyle=cg;g.strokeStyle='#1a2d44';g.lineWidth=2;
    g.beginPath();g.roundRect(bx-bw*0.05,by-bh*0.05,bw*1.1,bh*1.15,6);g.fill();g.stroke();

    // Two battery slots (oval cutouts)
    var cellW=bw*0.38,cellH=bh*1.0,cellGap=bw*0.12;
    for(var i=0;i<2;i++){
      var cx=bx+bw*0.14+i*(cellW+cellGap),cy=by+bh*0.45;
      // Battery body (silver)
      var bg=g.createLinearGradient(cx-cellW/2,0,cx+cellW/2,0);
      bg.addColorStop(0,'#c0c0c0');bg.addColorStop(0.3,'#e8e8e8');bg.addColorStop(0.5,'#f5f5f5');bg.addColorStop(0.7,'#e0e0e0');bg.addColorStop(1,'#a0a0a0');
      g.fillStyle=bg;g.strokeStyle='#888';g.lineWidth=1;
      g.beginPath();g.roundRect(cx-cellW/2,cy-cellH/2,cellW,cellH,cellW/2);g.fill();g.stroke();

      // Positive terminal cap (copper/bronze)
      var capX=cx+cellW/2,capY=cy;
      g.fillStyle='#d4a574';g.strokeStyle='#b8860b';g.lineWidth=1;
      g.beginPath();g.arc(capX,capY,cellW*0.22,0,Math.PI*2);g.fill();g.stroke();
      // Nipple
      g.fillStyle='#e8c99b';g.beginPath();g.arc(capX,capY,cellW*0.1,0,Math.PI*2);g.fill();

      // Negative terminal
      var negX=cx-cellW/2;
      g.fillStyle='#888';g.strokeStyle='#666';g.lineWidth=1;
      g.beginPath();g.arc(negX,cy,cellW*0.18,0,Math.PI*2);g.fill();g.stroke();

      // "+" label
      g.fillStyle='#dc2626';g.font='bold 9px sans-serif';g.textAlign='center';
      g.fillText('+',capX,cy-cellH*0.45);

      // 1.5V label
      g.fillStyle='#1e293b';g.font='bold 10px sans-serif';
      g.fillText('1.5V',cx,cy+cellH*0.55);
    }

    // "+" terminal post (red) - right side
    var posTX=bx+bw*1.05,posTY=by+bh*0.3;
    g.fillStyle='#dc2626';g.strokeStyle='#991b1b';g.lineWidth=1.5;
    g.beginPath();g.arc(posTX,posTY,7,0,Math.PI*2);g.fill();g.stroke();
    g.fillStyle='#fff';g.font='bold 8px sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.fillText('+',posTX,posTY);

    // "-" terminal post (black) - left side
    var negTX=bx-bw*0.05,negTY=by+bh*0.65;
    g.fillStyle='#1e293b';g.strokeStyle='#0f172a';g.lineWidth=1.5;
    g.beginPath();g.arc(negTX,negTY,7,0,Math.PI*2);g.fill();g.stroke();
    g.fillStyle='#fff';g.fillText('-',negTX,negTY);

    // Label
    g.fillStyle='#fff';g.font='bold 10px sans-serif';g.textAlign='center';
    g.fillText('电源 3V',bx+bw*0.45,by+bh*1.1+12);

    return{posX:posTX,posY:posTY,negX:negTX,negY:negTY}
  }

  // ============ Knife Switch ============
  function drawSwitch(sx,sy,sw,sh){
    var g=ctx;
    // Shadow
    g.fillStyle='rgba(0,0,0,0.06)';g.beginPath();g.roundRect(sx-2,sy+4,sw+4,sh-2,5);g.fill();

    // Base (light blue plastic)
    var bg=g.createLinearGradient(sx,sy,sx,sy+sh);
    bg.addColorStop(0,'#e0e7ff');bg.addColorStop(0.5,'#c7d2fe');bg.addColorStop(1,'#a5b4fc');
    g.fillStyle=bg;g.strokeStyle='#6366f1';g.lineWidth=2;
    g.beginPath();g.roundRect(sx,sy,sw,sh,5);g.fill();g.stroke();

    // Left contact post (pivot side)
    var lx=sx+sw*0.18,ly=sy+sh*0.25;
    g.fillStyle='#d4d4d8';g.strokeStyle='#71717a';g.lineWidth=1.5;
    g.beginPath();g.roundRect(lx-4,ly-2,8,sh*0.5,3);g.fill();g.stroke();
    g.fillStyle='#a1a1aa';g.beginPath();g.arc(lx,ly,5,0,Math.PI*2);g.fill();
    g.fillStyle='#52525b';g.beginPath();g.arc(lx,ly,2,0,Math.PI*2);g.fill();

    // Right contact post with slot (jaw)
    var rx2=sx+sw*0.82,ry2=sy+sh*0.48;
    g.fillStyle='#d4d4d8';g.strokeStyle='#71717a';g.lineWidth=1.5;
    g.beginPath();g.roundRect(rx2-4,ry2-2,8,sh*0.5,3);g.fill();g.stroke();
    // Contact slot (two prongs)
    g.fillStyle='#a1a1aa';
    g.fillRect(rx2-3,ry2-8,2.5,sh*0.35);g.fillRect(rx2+1,ry2-8,2.5,sh*0.35);
    g.fillStyle='#52525b';g.beginPath();g.arc(rx2,ry2,2,0,Math.PI*2);g.fill();

    // Knife blade
    var pivotX=lx,pivotY=ly;
    var bladeLen=sw*0.75;
    var contactX=rx2,contactY=ry2;
    if(closed){
      var angle=Math.atan2(contactY-pivotY,contactX-pivotX);
      var tipX=pivotX+bladeLen*Math.cos(angle);
      var tipY=pivotY+bladeLen*Math.sin(angle);
      // Blade body (metallic, wider)
      g.save();g.shadowColor='rgba(0,0,0,0.25)';g.shadowBlur=4;
      g.strokeStyle='#c0c0c0';g.lineWidth=7;g.lineCap='butt';
      g.beginPath();g.moveTo(pivotX,pivotY);g.lineTo(tipX,tipY);g.stroke();
      g.strokeStyle='#9ca3af';g.lineWidth=7;
      g.beginPath();g.moveTo(pivotX,pivotY+1);g.lineTo(tipX,tipY+1);g.stroke();
      g.strokeStyle='rgba(255,255,255,0.7)';g.lineWidth=2.5;
      g.beginPath();g.moveTo(pivotX,pivotY-1);g.lineTo(tipX,tipY-1);g.stroke();
      g.restore();
      // Contact indicator (green dot)
      g.fillStyle='#22c55e';g.save();g.shadowColor='rgba(34,197,94,0.6)';g.shadowBlur=6;
      g.beginPath();g.arc(contactX,contactY,3.5,0,Math.PI*2);g.fill();g.restore();
      // Handle (black plastic grip)
      g.fillStyle='#334155';g.strokeStyle='#1e293b';g.lineWidth=1;
      g.beginPath();g.roundRect(pivotX-6,pivotY-11,12,10,3);g.fill();g.stroke();
    }else{
      var upAngle=-Math.PI*0.42;
      var tipX2=pivotX+bladeLen*Math.cos(upAngle);
      var tipY2=pivotY+bladeLen*Math.sin(upAngle);
      g.save();g.shadowColor='rgba(0,0,0,0.2)';g.shadowBlur=4;
      g.strokeStyle='#c0c0c0';g.lineWidth=7;g.lineCap='butt';
      g.beginPath();g.moveTo(pivotX,pivotY);g.lineTo(tipX2,tipY2);g.stroke();
      g.strokeStyle='#9ca3af';g.lineWidth=7;
      g.beginPath();g.moveTo(pivotX,pivotY+1);g.lineTo(tipX2,tipY2+1);g.stroke();
      g.strokeStyle='rgba(255,255,255,0.6)';g.lineWidth=2.5;
      g.beginPath();g.moveTo(pivotX,pivotY-1);g.lineTo(tipX2,tipY2-1);g.stroke();
      g.restore();
      // Handle
      g.fillStyle='#334155';g.strokeStyle='#1e293b';g.lineWidth=1;
      g.beginPath();g.roundRect(pivotX-6,pivotY-11,12,10,3);g.fill();g.stroke();
    }

    // Pivot rivet
    g.fillStyle='#52525b';g.beginPath();g.arc(pivotX,pivotY,3.5,0,Math.PI*2);g.fill();
    g.fillStyle='#a1a1aa';g.beginPath();g.arc(pivotX,pivotY,1.5,0,Math.PI*2);g.fill();

    // Label
    g.fillStyle='#475569';g.font='bold 10px sans-serif';g.textAlign='center';
    g.fillText('开关',sx+sw/2,sy+sh+14);
    g.fillText('(闸刀开关)',sx+sw/2,sy+sh+26);

    return{inX:lx,inY:ly,outX:rx2,outY:ry2}
	  }

	  // ============ Fixed Resistor ============
  function drawResistor(rx,ry,rw,rh){
    var g=ctx,midY=ry+rh/2;
    // Shadow
    g.fillStyle='rgba(0,0,0,0.08)';g.beginPath();g.roundRect(rx-2,ry+2,rw+4,rh,rh/2);g.fill();

    // Body (brown cylinder)
    var bg=g.createLinearGradient(0,ry,0,ry+rh);
    bg.addColorStop(0,'#d4a574');bg.addColorStop(0.25,'#e8c99b');bg.addColorStop(0.5,'#f5deb3');bg.addColorStop(0.75,'#d4a574');bg.addColorStop(1,'#b8860b');
    g.fillStyle=bg;g.strokeStyle='#8b6914';g.lineWidth=1.5;
    g.beginPath();g.roundRect(rx,ry,rw,rh,rh/2);g.fill();g.stroke();

    // Color bands (10Ω = Brown Black Black Gold)
    var bands=[
      {pos:0.2,color:'#8b4513',label:'棕'},
      {pos:0.35,color:'#1a1a1a',label:'黑'},
      {pos:0.50,color:'#1a1a1a',label:'黑'},
      {pos:0.68,color:'#daa520',label:'金'}
    ];
    bands.forEach(function(b){
      var bx=rx+rw*b.pos;
      g.fillStyle=b.color;g.fillRect(bx,ry+2,rh*0.9,rh-4);
      g.strokeStyle='rgba(0,0,0,0.2)';g.lineWidth=0.5;g.strokeRect(bx,ry+2,rh*0.9,rh-4);
    });

    // Metal end caps
    g.fillStyle='#c0c0c0';g.strokeStyle='#888';g.lineWidth=1;
    g.beginPath();g.roundRect(rx-rh*0.3,ry,rh*0.6,rh,rh/2);g.fill();g.stroke();
    g.fillStyle='#d4d4d8';g.beginPath();g.roundRect(rx+rw-rh*0.3,ry,rh*0.6,rh,rh/2);g.fill();g.stroke();

    // Label
    g.fillStyle='#8b6914';g.font='bold 11px sans-serif';g.textAlign='center';
    g.fillText('R 10Ω',rx+rw/2,ry-8);

    return{leftX:rx,leftY:midY,rightX:rx+rw,rightY:midY}
  }

  // ============ Sliding Rheostat ============
  function drawRheostat(rx,ry,rw,rh,frac){
    var g=ctx;
    var tubeX=rx+rw*0.35,tubeW=rw*0.3;
    var barX=rx+rw*0.05,barW=rw*0.12;
    var sliderX=rx+rw*0.6,sliderY=ry+frac*rh;

    // Shadow
    g.fillStyle='rgba(0,0,0,0.06)';g.beginPath();g.roundRect(rx-2,ry+3,rw+4,rh,5);g.fill();

    // Ceramic tube (white)
    var tg=g.createLinearGradient(tubeX,0,tubeX+tubeW,0);
    tg.addColorStop(0,'#e2e8f0');tg.addColorStop(0.3,'#f8fafc');tg.addColorStop(0.5,'#ffffff');tg.addColorStop(0.7,'#f1f5f9');tg.addColorStop(1,'#cbd5e1');
    g.fillStyle=tg;g.strokeStyle='#94a3b8';g.lineWidth=1.5;
    g.beginPath();g.roundRect(tubeX,ry,tubeW,rh,tubeW/2);g.fill();g.stroke();

    // Resistance wire (dark coils)
    g.strokeStyle='#334155';g.lineWidth=0.8;
    for(var cy=ry+10;cy<ry+rh-10;cy+=4){
      g.beginPath();g.moveTo(tubeX+2,cy);g.lineTo(tubeX+tubeW-2,cy);g.stroke();
    }

    // Metal slide bar
    var bg2=g.createLinearGradient(barX,0,barX+barW,0);
    bg2.addColorStop(0,'#94a3b8');bg2.addColorStop(0.5,'#e2e8f0');bg2.addColorStop(1,'#64748b');
    g.fillStyle=bg2;g.strokeStyle='#475569';g.lineWidth=1.5;
    g.beginPath();g.roundRect(barX,ry+4,barW,rh-8,3);g.fill();g.stroke();

    // Wiper connection
    g.strokeStyle='#94a3b8';g.lineWidth=2.5;
    g.beginPath();g.moveTo(sliderX,sliderY);g.lineTo(barX+barW,sliderY);g.stroke();

    // Slider knob (red)
    var kg=g.createRadialGradient(sliderX-1,sliderY-1,1,sliderX,sliderY,10);
    kg.addColorStop(0,'#fca5a5');kg.addColorStop(0.6,'#dc2626');kg.addColorStop(1,'#991b1b');
    g.fillStyle=kg;g.strokeStyle='#7f1d1d';g.lineWidth=2;
    g.beginPath();g.arc(sliderX,sliderY,10,0,Math.PI*2);g.fill();g.stroke();
    // P label on knob
    g.fillStyle='#fff';g.font='bold 8px sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.fillText('P',sliderX,sliderY);

    // Terminals
    var terms=[
      {label:'A',x:tubeX+tubeW/2,y:ry-2},
      {label:'B',x:tubeX+tubeW/2,y:ry+rh+2},
      {label:'C',x:barX+barW/2,y:ry-2},
      {label:'D',x:barX+barW/2,y:ry+rh+2}
    ];
    terms.forEach(function(t){
      g.fillStyle='#d4d4d8';g.strokeStyle='#71717a';g.lineWidth=1.5;
      g.beginPath();g.arc(t.x,t.y,6,0,Math.PI*2);g.fill();g.stroke();
      g.fillStyle='#1e293b';g.font='bold 9px sans-serif';g.textAlign='center';g.textBaseline='middle';
      g.fillText(t.label,t.x,t.y);
    });

    // Highlight connected terminal A
    g.strokeStyle='#f59e0b';g.lineWidth=2.5;
    g.beginPath();g.arc(tubeX+tubeW/2,ry-2,9,0,Math.PI*2);g.stroke();

    // Label
    g.fillStyle='#475569';g.font='bold 10px sans-serif';g.textAlign='center';
    g.fillText('滑动变阻器',rx+rw/2,ry+rh+18);
    g.fillText('R\' (A入 P出)',rx+rw/2,ry+rh+30);

    return{aX:tubeX+tubeW/2,aY:ry-2,sX:sliderX,sY:sliderY}
  }

  // ============ Analog Meter ============
  function drawMeter(mx,my,mr,type,value,range,maxVal){
    var g=ctx;
    // Shadow
    g.fillStyle='rgba(0,0,0,0.08)';g.beginPath();g.arc(mx+2,my+3,mr,0,Math.PI*2);g.fill();

    // Housing (blue plastic)
    var hg=g.createRadialGradient(mx-2,my-3,mr*0.1,mx,my,mr*1.05);
    hg.addColorStop(0,'#93c5fd');hg.addColorStop(0.7,'#3b82f6');hg.addColorStop(0.9,'#1d4ed8');hg.addColorStop(1,'#1e3a8a');
    g.fillStyle=hg;g.strokeStyle='#1e3a8a';g.lineWidth=2.5;
    g.beginPath();g.arc(mx,my,mr,0,Math.PI*2);g.fill();g.stroke();

    // Face (white)
    var fg=g.createRadialGradient(mx,my-2,mr*0.05,mx,my,mr*0.85);
    fg.addColorStop(0,'#ffffff');fg.addColorStop(1,'#f1f5f9');
    g.fillStyle=fg;g.strokeStyle='#cbd5e1';g.lineWidth=1;
    g.beginPath();g.arc(mx,my,mr*0.82,0,Math.PI*2);g.fill();g.stroke();

    // Scale arc
    var startA=-1.2*Math.PI,endA=0.2*Math.PI;
    g.strokeStyle='#1e293b';g.lineWidth=1.8;
    g.beginPath();g.arc(mx,my,mr*0.6,startA,endA);g.stroke();

    // Tick marks
    var numTicks=range===3?6:6;
    for(var i=0;i<=numTicks;i++){
      var frac=i/numTicks;
      var a=startA+frac*(endA-startA);
      var r1=mr*0.52,r2=mr*0.6;
      g.strokeStyle='#1e293b';g.lineWidth=1.2;
      g.beginPath();
      g.moveTo(mx+r1*Math.cos(a),my+r1*Math.sin(a));
      g.lineTo(mx+r2*Math.cos(a),my+r2*Math.sin(a));
      g.stroke();
      // Labels
      if(i%1===0){
        var lR=mr*0.4;
        g.fillStyle='#1e293b';g.font='bold 8px sans-serif';
        g.textAlign='center';g.textBaseline='middle';
        var tickVal=range*i/numTicks;
        g.fillText(tickVal.toFixed(1),mx+lR*Math.cos(a),my+lR*Math.sin(a));
      }
    }

    // Needle
    if(closed&&value>0.001){
      var nFrac=Math.min(1,value/maxVal);
      var nA=startA+nFrac*(endA-startA);
      var nLen=mr*0.55;
      g.strokeStyle='#dc2626';g.lineWidth=2;g.lineCap='round';
      g.shadowColor='rgba(220,38,38,0.4)';g.shadowBlur=3;
      g.beginPath();g.moveTo(mx,my);g.lineTo(mx+nLen*Math.cos(nA),my+nLen*Math.sin(nA));g.stroke();
      g.shadowBlur=0;
    }else{
      g.strokeStyle='#dc2626';g.lineWidth=2;g.lineCap='round';
      g.beginPath();g.moveTo(mx,my);g.lineTo(mx+mr*0.55*Math.cos(startA),my+mr*0.55*Math.sin(startA));g.stroke();
    }

    // Pivot
    var pg=g.createRadialGradient(mx-0.5,my-0.5,0.5,mx,my,5);
    pg.addColorStop(0,'#fff');pg.addColorStop(1,'#1e293b');
    g.fillStyle=pg;g.beginPath();g.arc(mx,my,4.5,0,Math.PI*2);g.fill();

    // Type label
    g.fillStyle='#1e293b';g.font='bold 12px sans-serif';g.textAlign='center';
    g.fillText(type==='A'?'A':'V',mx,my-mr*0.35);

    // Range text
    g.fillStyle='#64748b';g.font='7px sans-serif';
    g.fillText(type==='A'?'0~3A':'0~15V',mx,my+mr*0.62);

    // Terminals
    var tY=my+mr*0.85;
    // + terminal (right)
    g.fillStyle='#dc2626';g.beginPath();g.arc(mx+mr*0.55,tY,5,0,Math.PI*2);g.fill();
    g.fillStyle='#fff';g.font='bold 7px sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.fillText('+',mx+mr*0.55,tY);
    // - terminal (left)
    g.fillStyle='#1e293b';g.beginPath();g.arc(mx-mr*0.55,tY,5,0,Math.PI*2);g.fill();
    g.fillStyle='#fff';g.fillText('-',mx-mr*0.55,tY);

    // Name below
    g.fillStyle='#475569';g.font='bold 9px sans-serif';g.textAlign='center';
    g.fillText(type==='A'?'电流表':'电压表',mx,my+mr+14);

    return{posX:mx+mr*0.55,posY:tY,negX:mx-mr*0.55,negY:tY}
  }

  // ============ Full Scene Render ============
  function draw(){
    rs();ctx.clearRect(0,0,W,H);
    var p=P(),c=calc();

    drawBench();

    // ---- COMPUTE TERMINAL POSITIONS ----
    // Battery
    var batPosX=p.batX+p.batW*1.05,batPosY=p.batY+p.batH*0.3;
    var batNegX=p.batX-p.batW*0.05,batNegY=p.batY+p.batH*0.65;
    // Switch
    var swInX=p.swX+p.swW*0.18,swInY=p.swY+p.swH*0.25;
    var swOutX=p.swX+p.swW*0.82,swOutY=p.swY+p.swH*0.48;
    // Resistor
    var resLeftX=p.rx,resLeftY=p.ry+p.rh/2;
    var resRightX=p.rx+p.rw,resRightY=p.ry+p.rh/2;
    // Rheostat
    var tubeCX=p.rhX+p.rhW*0.35+p.rhW*0.15;
    var rheoAY=tubeCX,rheoAXY=p.rhY-2;
    var rheoSX=p.rhX+p.rhW*0.6,rheoSY=p.rhY+sfrac*p.rhH;
    // Meters
    var amPosX=p.amX+p.amR*0.55,amPosY=p.amY+p.amR*0.85;
    var amNegX=p.amX-p.amR*0.55,amNegY=p.amY+p.amR*0.85;
    var vmPosX=p.vmX+p.vmR*0.55,vmPosY=p.vmY+p.vmR*0.85;
    var vmNegX=p.vmX-p.vmR*0.55,vmNegY=p.vmY+p.vmR*0.85;

    // ---- WIRES ----
    // 1: Battery(+) → Switch(in)
    drawWirePathPts([[batPosX,batPosY],[p.swX-30,batPosY],[p.swX-30,swInY],[swInX,swInY]],'#1a1a1a');
    // 2: Switch(out) → Ammeter(-)
    drawWirePathPts([[swOutX,swOutY],[p.amX-60,swOutY],[p.amX-60,amNegY],[amNegX,amNegY]],'#1a1a1a');
    // 3: Ammeter(+) → Resistor(left)
    drawWirePathPts([[amPosX,amPosY],[amPosX+15,amPosY],[amPosX+15,resLeftY-20],[resLeftX,resLeftY-20]],'#1a1a1a');
    // 4: Resistor(right) → Rheostat(A)
    drawWirePathPts([[resRightX,resRightY],[p.rhX+30,resRightY],[p.rhX+30,p.rhY-30],[rheoAY,p.rhY-30],[rheoAY,rheoAXY]],'#1a1a1a');
    // 5: Rheostat(P) → Battery(-)
    drawWirePathPts([[rheoSX,rheoSY],[p.batX-60,rheoSY],[p.batX-60,batNegY],[batNegX,batNegY]],'#1a1a1a');
    // 6: Voltmeter(+) → Resistor(right) — measure VR
    drawWirePathPts([[vmPosX,vmPosY],[vmPosX,resRightY+22],[resRightX,resRightY+22]],'#2563eb');
    // 7: Voltmeter(-) → Resistor(left)
    drawWirePathPts([[vmNegX,vmNegY],[vmNegX,resLeftY+15],[resLeftX,resLeftY+15]],'#2563eb');

    // Junction dots
    var juncs=[[batPosX,batPosY],[batNegX,batNegY],[swInX,swInY],[swOutX,swOutY],
      [resLeftX,resLeftY],[resRightX,resRightY],[amPosX,amPosY],[amNegX,amNegY],
      [rheoAY,rheoAXY],[rheoSX,rheoSY],[vmPosX,vmPosY],[vmNegX,vmNegY]];
    juncs.forEach(function(j){dot(j[0],j[1],3.5,'#334155')});

    // ---- DRAW COMPONENTS ON TOP ----
    drawBattery(p.batX,p.batY,p.batW,p.batH);
    drawSwitch(p.swX,p.swY,p.swW,p.swH);
    drawResistor(p.rx,p.ry,p.rw,p.rh);
    drawRheostat(p.rhX,p.rhY,p.rhW,p.rhH,sfrac);
    drawMeter(p.amX,p.amY,p.amR,'A',c.I,3,3);
    drawMeter(p.vmX,p.vmY,p.vmR,'V',c.VR,15,15);

    // Title on bench
    ctx.fillStyle='rgba(0,0,0,0.04)';ctx.font='bold 20px sans-serif';ctx.textAlign='right';
    ctx.fillText('探究 I 与 U 的关系',W-20,H-15);
  }

  // ============ Mouse Interaction ============
  var dragging=false,doffY=0;
  function getPos(e){var r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}

  canvas.addEventListener('mousedown',function(e){
    var pos=getPos(e),p=P();
    // Hit test switch
    if(pos.x>=p.swX-5&&pos.x<=p.swX+p.swW+5&&pos.y>=p.swY-5&&pos.y<=p.swY+p.swH+5){
      closed=!closed;return;
    }
    // Hit test rheostat slider
    var sX=p.rhX+p.rhW*0.6,sY=p.rhY+sfrac*p.rhH;
    if(Math.hypot(pos.x-sX,pos.y-sY)<22){dragging=true;doffY=pos.y-sY;canvas.style.cursor='grabbing';return}
  });
  canvas.addEventListener('mousemove',function(e){
    var pos=getPos(e),p=P();
    if(dragging){
      var ny=pos.y-doffY;sfrac=Math.max(0,Math.min(1,(ny-p.rhY)/p.rhH));Rrheo=sfrac*Rmax;
    }else{
      var sX=p.rhX+p.rhW*0.6,sY=p.rhY+sfrac*p.rhH;
      var onRheo=Math.hypot(pos.x-sX,pos.y-sY)<22;
      var onSwitch=pos.x>=p.swX-5&&pos.x<=p.swX+p.swW+5&&pos.y>=p.swY-5&&pos.y<=p.swY+p.swH+5;
      canvas.style.cursor=onRheo?'grab':onSwitch?'pointer':'default';
    }
  });
  canvas.addEventListener('mouseup',function(){dragging=false;canvas.style.cursor='default'});
  canvas.addEventListener('mouseleave',function(){dragging=false});
  canvas.addEventListener('touchstart',function(e){
    e.preventDefault();var pos=getPos(e.touches[0]),p=P();
    if(pos.x>=p.swX-10&&pos.x<=p.swX+p.swW+10&&pos.y>=p.swY-10&&pos.y<=p.swY+p.swH+10){closed=!closed;return}
    var sX=p.rhX+p.rhW*0.6,sY=p.rhY+sfrac*p.rhH;
    if(Math.hypot(pos.x-sX,pos.y-sY)<30){dragging=true;doffY=pos.y-sY}
  });
  canvas.addEventListener('touchmove',function(e){
    e.preventDefault();if(!dragging)return;var pos=getPos(e.touches[0]),p=P();
    var ny=pos.y-doffY;sfrac=Math.max(0,Math.min(1,(ny-p.rhY)/p.rhH));Rrheo=sfrac*Rmax;
  });
  canvas.addEventListener('touchend',function(){dragging=false});

  // ============ UI Update ============
  function updateUI(){
    var c=calc();
    document.getElementById('valCurrent').textContent=c.I.toFixed(3)+' A';
    document.getElementById('valVoltage').textContent=c.VR.toFixed(2)+' V';
    document.getElementById('valRheo').textContent=Rrheo.toFixed(1)+' Ω';
    if(closed){document.getElementById('circuitStatus').innerHTML='<span style="color:#16a34a">● 通路</span>'}
    else{document.getElementById('circuitStatus').innerHTML='<span style="color:#94a3b8">○ 断路</span>'}
    var ce=document.getElementById('valCurrent');ce.className=closed&&c.I>0.001?'value val-on':'value val-off';
    var ve=document.getElementById('valVoltage');ve.className=closed&&c.VR>0.01?'value val-on':'value val-off';
  }

  // ============ Data Recording ============
  var data=[];
  window.recordData=function(){if(!closed)return;var c=calc();data.push({U:c.VR,I:c.I,Rr:Rrheo});updateTable();drawGraph()}
  window.clearData=function(){data=[];updateTable();drawGraph()}
  function updateTable(){
    var tb=document.getElementById('dataTable');
    if(!data.length){tb.innerHTML='<tr><td colspan="4" class="empty-hint">点击"记录数据"开始采集</td></tr>';return}
    tb.innerHTML=data.map(function(d,i){return'<tr><td>'+(i+1)+'</td><td>'+d.U.toFixed(2)+'</td><td>'+d.I.toFixed(3)+'</td><td>'+d.Rr.toFixed(1)+'</td></tr>'}).join('')
  }

  function drawGraph(){
    grs();gctx.clearRect(0,0,gW,gH);gctx.fillStyle='#fff';gctx.fillRect(0,0,gW,gH);
    if(!data.length){gctx.fillStyle='#cbd5e1';gctx.font='13px sans-serif';gctx.textAlign='center';gctx.fillText('记录数据后显示 I-U 图像',gW/2,gH/2);return}
    var m={t:20,r:20,b:32,l:42};
    var pw=gW-m.l-m.r,ph=gH-m.t-m.b;
    var maxU=3.5,maxI=0.35;
    data.forEach(function(d){if(d.U>maxU)maxU=d.U;if(d.I>maxI)maxI=d.I});
    maxU=Math.ceil(maxU/0.5)*0.5+0.5;maxI=Math.ceil(maxI/0.05)*0.05+0.05;
    if(maxU<3.5)maxU=3.5;if(maxI<0.35)maxI=0.35;

    // Grid
    gctx.strokeStyle='rgba(0,0,0,0.06)';gctx.lineWidth=0.8;
    for(var i=0;i<=5;i++){var gy=m.t+ph*(1-i/5);gctx.beginPath();gctx.moveTo(m.l,gy);gctx.lineTo(m.l+pw,gy);gctx.stroke()}
    for(var i=0;i<=5;i++){var gx=m.l+pw*(i/5);gctx.beginPath();gctx.moveTo(gx,m.t);gctx.lineTo(gx,m.t+ph);gctx.stroke()}
    // Axes
    gctx.strokeStyle='#64748b';gctx.lineWidth=1.5;
    gctx.beginPath();gctx.moveTo(m.l,m.t);gctx.lineTo(m.l,m.t+ph);gctx.stroke();
    gctx.beginPath();gctx.moveTo(m.l,m.t+ph);gctx.lineTo(m.l+pw,m.t+ph);gctx.stroke();
    // Labels
    gctx.fillStyle='#475569';gctx.font='9px sans-serif';
    for(var i=0;i<=5;i++){var y=m.t+ph*(1-i/5);gctx.textAlign='right';gctx.textBaseline='middle';gctx.fillText((maxI*i/5).toFixed(2),m.l-6,y)}
    for(var i=0;i<=5;i++){var x=m.l+pw*(i/5);gctx.textAlign='center';gctx.textBaseline='top';gctx.fillText((maxU*i/5).toFixed(1),x,m.t+ph+5)}
    gctx.fillStyle='#1e293b';gctx.font='bold 10px sans-serif';gctx.textAlign='center';
    gctx.fillText('U / V',m.l+pw/2,m.t+ph+20);
    gctx.save();gctx.translate(m.l-28,m.t+ph/2);gctx.rotate(-Math.PI/2);gctx.fillText('I / A',0,0);gctx.restore();
    // Data points
    data.forEach(function(d){
      var px=m.l+(d.U/maxU)*pw,py=m.t+ph-(d.I/maxI)*ph;
      gctx.fillStyle='#ef4444';gctx.beginPath();gctx.arc(px,py,4.5,0,Math.PI*2);gctx.fill();
      gctx.fillStyle='#fff';gctx.beginPath();gctx.arc(px,py,2,0,Math.PI*2);gctx.fill();
    });
    // Fit line
    if(data.length>=1){
      var su=0,si=0;data.forEach(function(d){su+=d.U*d.U;si+=d.U*d.I});
      var slope=si/su;
      var px1=m.l,py1=m.t+ph;
      var px2=m.l+(maxU/maxU)*pw,py2=m.t+ph-(slope*maxU/maxI)*ph;
      gctx.strokeStyle='#3b82f6';gctx.lineWidth=2;gctx.setLineDash([5,3]);
      gctx.beginPath();gctx.moveTo(px1,py1);gctx.lineTo(px2,py2);gctx.stroke();gctx.setLineDash([]);
      gctx.fillStyle='#3b82f6';gctx.font='10px sans-serif';gctx.textAlign='left';
      gctx.fillText('R=U/I≈'+(1/slope).toFixed(1)+'Ω',m.l+6,m.t+12);
    }
  }

  window.toggleFullscreen=function(){
    if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(function(){});
    else document.exitFullscreen();
  }

  // ============ Loop ============
  function loop(){updateUI();try{draw()}catch(e){}try{drawGraph()}catch(e){}requestAnimationFrame(loop)}
  rs();grs();updateTable();drawGraph();loop();
})();
</script>
