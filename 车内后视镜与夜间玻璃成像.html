<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>车内后视镜与夜间车窗成像 · 虚拟实验室</title>
<style>
  :root{
    --bg:#070a10;
    --panel:#0e151f;
    --line:#1d2836;
    --line2:#27374a;
    --tx:#e2eaf5;
    --tx2:#93a4bc;
    --tx3:#5f7089;
    --amber:#ffb454;
    --cyan:#4fd1e0;
    --red:#ff6b6b;
    --green:#5ee0a0;
    --violet:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 700px at 50% -10%,#111a26 0%,var(--bg) 60%);
    color:var(--tx);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px;
    display:flex;flex-direction:column;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    display:flex;align-items:center;gap:18px;
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(19,28,40,.9),rgba(11,16,23,.75));
    backdrop-filter:blur(8px);
    flex-wrap:wrap;
    flex:none;
  }
  .brand{display:flex;align-items:center;gap:11px}
  .logo{
    width:34px;height:34px;border-radius:9px;flex:none;
    background:linear-gradient(145deg,#1d2b3d,#0e151f);
    border:1px solid var(--line2);
    display:grid;place-items:center;font-size:17px;
    box-shadow:0 0 18px rgba(79,209,224,.12) inset;
  }
  .brand h1{font-size:14.5px;font-weight:650;letter-spacing:.3px}
  .brand p{font-size:11px;color:var(--tx3);margin-top:2px;letter-spacing:.2px}
  .tabs{display:flex;gap:6px;margin-left:auto}
  .tab{
    padding:7px 15px;border-radius:8px;cursor:pointer;
    background:transparent;border:1px solid transparent;
    color:var(--tx2);font-size:12.5px;font-family:inherit;
    transition:.18s;white-space:nowrap;
  }
  .tab:hover{color:var(--tx);background:rgba(255,255,255,.035)}
  .tab.active{
    background:linear-gradient(180deg,rgba(79,209,224,.16),rgba(79,209,224,.06));
    border-color:rgba(79,209,224,.35);
    color:#bff3fa;
    box-shadow:0 0 16px rgba(79,209,224,.12);
  }

  main{flex:1;min-height:0;position:relative}
  .pane{position:absolute;inset:0;display:none}
  .pane.active{display:flex}

  .stage{
    flex:1;min-width:0;position:relative;
    display:flex;align-items:center;justify-content:center;
    padding:12px;
  }
  canvas{display:block;border-radius:10px;border:1px solid var(--line);background:#05080d}
  .stage canvas{box-shadow:0 14px 44px rgba(0,0,0,.6)}

  .stage2{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding:10px;align-items:center;justify-content:center}
  .cvwrap{
    position:relative;width:100%;min-width:0;
    display:flex;align-items:center;justify-content:center;
  }
  .cvwrap canvas{box-shadow:0 14px 44px rgba(0,0,0,.6)}
  .cvtag{
    position:absolute;left:12px;top:10px;
    font-size:10.5px;color:var(--tx3);letter-spacing:.6px;
    pointer-events:none;
  }

  .hintbar{
    position:absolute;left:24px;top:24px;
    display:flex;align-items:center;gap:9px;
    padding:8px 14px 8px 11px;border-radius:9px;
    background:rgba(9,14,20,.84);
    border:1px solid var(--line2);
    backdrop-filter:blur(10px);
    font-size:12.5px;letter-spacing:.2px;
    transition:.2s;max-width:calc(100% - 48px);
  }
  .hintbar .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px currentColor;flex:none;color:var(--green)}
  .hintbar.warn{border-color:rgba(255,180,84,.42)}
  .hintbar.warn .dot{background:var(--amber);color:var(--amber)}
  .hintbar.bad{border-color:rgba(255,107,107,.42)}
  .hintbar.bad .dot{background:var(--red);color:var(--red)}

  .side{
    width:332px;flex:none;
    border-left:1px solid var(--line);
    background:linear-gradient(180deg,rgba(17,25,35,.92),rgba(10,15,21,.92));
    overflow-y:auto;padding:14px 14px 40px;
  }
  .side::-webkit-scrollbar{width:8px}
  .side::-webkit-scrollbar-thumb{background:#22303f;border-radius:4px}
  .side::-webkit-scrollbar-track{background:transparent}

  .grp{margin-bottom:18px}
  .grp-h{
    font-size:10.5px;letter-spacing:1.4px;color:var(--tx3);
    margin-bottom:9px;display:flex;align-items:center;gap:8px;
  }
  .grp-h::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

  .ctl{margin-bottom:11px}
  .ctl-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .ctl-t label{font-size:12px;color:var(--tx2)}
  .ctl-t b{font-size:11.5px;color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,#2b3d52,#1a2534)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:linear-gradient(180deg,#ffd08a,#ff9f2e);
    margin-top:-5px;border:2px solid #1a1205;
    box-shadow:0 0 10px rgba(255,180,84,.55);
  }
  input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#2b3d52}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;border:2px solid #1a1205;background:#ffb454;box-shadow:0 0 10px rgba(255,180,84,.55)}

  .btnrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
  button.b{
    flex:1;min-width:88px;padding:8px 10px;border-radius:8px;cursor:pointer;
    background:linear-gradient(180deg,#18222f,#111823);
    border:1px solid var(--line2);color:var(--tx2);
    font-size:12px;font-family:inherit;transition:.16s;
  }
  button.b:hover{color:var(--tx);border-color:#36506c;background:linear-gradient(180deg,#1e2b3c,#141d29)}
  button.b.on{
    background:linear-gradient(180deg,rgba(79,209,224,.2),rgba(79,209,224,.07));
    border-color:rgba(79,209,224,.45);color:#bdf4fb;
  }

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    padding:6px 11px;border-radius:7px;cursor:pointer;font-size:11.5px;
    background:#111823;border:1px solid var(--line);color:var(--tx2);transition:.16s;
    font-family:inherit;
  }
  .chip:hover{border-color:#36506c;color:var(--tx)}
  .chip.on{background:rgba(255,180,84,.14);border-color:rgba(255,180,84,.4);color:#ffd9a3}

  .readout{
    background:#0a1017;border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;font-size:11.5px;line-height:1.85;color:var(--tx2);
  }
  .readout .row{display:flex;justify-content:space-between;gap:10px}
  .readout .row span:last-child{color:var(--tx);font-variant-numeric:tabular-nums;font-weight:600}
  .readout .row.hl span:last-child{color:var(--amber)}
  .readout .row.cy span:last-child{color:var(--cyan)}
  .readout .row.rd span:last-child{color:var(--red)}

  .note{font-size:11.5px;line-height:1.75;color:var(--tx3);border-left:2px solid var(--line2);padding-left:10px;margin-top:8px}
  .note b{color:var(--tx2);font-weight:600}
  .note em{color:var(--amber);font-style:normal}

  @media (max-width:1080px){
    .pane.active{flex-direction:column}
    .stage{flex:1 1 auto;min-height:0}
    .stage2{flex:1 1 auto;min-height:0}
    .side{width:100%;flex:0 0 40%;height:40%;border-left:none;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">🪞</div>
    <div>
      <h1>车内后视镜 · 夜间车窗成像</h1>
      <p>平面镜成像 · 光路追踪虚拟实验</p>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="1">① 后视镜看后排</button>
    <button class="tab" data-tab="2">② 夜间车窗成像</button>
  </div>
</div>

<main>
  <section class="pane active" id="pane1">
    <div class="stage">
      <canvas id="cv1"></canvas>
      <div class="hintbar" id="hint1"><span class="dot"></span><span id="hint1t">—</span></div>
    </div>
    <aside class="side">
      <div class="grp">
        <div class="grp-h">镜面调节</div>
        <div class="ctl">
          <div class="ctl-t"><label>镜面俯仰角</label><b id="r-angle-v">-19°</b></div>
          <input type="range" id="r-angle" min="-45" max="25" step="0.5" value="-19">
        </div>
        <div class="ctl">
          <div class="ctl-t"><label>镜面高度</label><b id="r-mh-v">1.46 m</b></div>
          <input type="range" id="r-mh" min="1.24" max="1.56" step="0.005" value="1.46">
        </div>
        <div class="btnrow">
          <button class="b" id="btn-aim">自动对准乘客</button>
          <button class="b" id="btn-reset1">复位</button>
        </div>
      </div>

      <div class="grp">
        <div class="grp-h">后排乘客</div>
        <div class="ctl">
          <div class="ctl-t"><label>纵向位置</label><b id="r-px-v">-1.05 m</b></div>
          <input type="range" id="r-px" min="-1.18" max="-0.72" step="0.01" value="-1.05">
        </div>
        <div class="ctl">
          <div class="ctl-t"><label>头部高度</label><b id="r-ph-v">1.16 m</b></div>
          <input type="range" id="r-ph" min="1.00" max="1.34" step="0.005" value="1.16">
        </div>
        <div class="note">也可以直接在画布上<b>拖动乘客</b>。</div>
      </div>

      <div class="grp">
        <div class="grp-h">显示图层</div>
        <div class="chips">
          <button class="chip on" data-l="rays">主光路</button>
          <button class="chip on" data-l="virtual">虚像</button>
          <button class="chip on" data-l="fov">可视区</button>
          <button class="chip" data-l="normal">法线</button>
        </div>
      </div>

      <div class="grp">
        <div class="grp-h">实时数据</div>
        <div class="readout" id="ro1"></div>
        <div class="note" id="note1"></div>
      </div>
    </aside>
  </section>

  <section class="pane" id="pane2">
    <div class="stage2">
      <div class="cvwrap"><canvas id="cv2a"></canvas><span class="cvtag">光路几何 · 侧视</span></div>
      <div class="cvwrap"><canvas id="cv2b"></canvas><span class="cvtag">司机视角 · 实景＋像叠加</span></div>
    </div>
    <aside class="side">
      <div class="grp">
        <div class="grp-h">车内照明</div>
        <div class="ctl">
          <div class="ctl-t"><label>车内灯亮度</label><b id="r-lamp-v">70 %</b></div>
          <input type="range" id="r-lamp" min="0" max="100" step="1" value="70">
        </div>
        <div class="ctl">
          <div class="ctl-t"><label>玻璃反射率 R₀</label><b id="r-refl-v">0.090</b></div>
          <input type="range" id="r-refl" min="0.03" max="0.22" step="0.005" value="0.09">
        </div>
        <div class="readout" style="margin-top:6px">
          <div class="row"><span>入射角（对法线）</span><span id="ro-ang">—</span></div>
          <div class="row cy"><span>实际反射率（菲涅尔）</span><span id="ro-fres">—</span></div>
          <div class="row hl"><span>像亮度 / 背景亮度</span><span id="ro-ratio">—</span></div>
        </div>
      </div>

      <div class="grp">
        <div class="grp-h">成像物体</div>
        <div class="chips" id="objchips">
          <button class="chip on" data-o="dash">仪表台</button>
          <button class="chip" data-o="passenger">后排乘客</button>
          <button class="chip" data-o="screen">中控屏</button>
          <button class="chip" data-o="all">全部</button>
        </div>
      </div>

      <div class="grp">
        <div class="grp-h">车外车辆</div>
        <div class="ctl">
          <div class="ctl-t"><label>小汽车 距前</label><b id="r-card-v">8.0 m</b></div>
          <input type="range" id="r-card" min="4" max="26" step="0.5" value="8">
        </div>
        <div class="ctl">
          <div class="ctl-t"><label>大卡车 距前</label><b id="r-truckd-v">15.0 m</b></div>
          <input type="range" id="r-truckd" min="9" max="40" step="0.5" value="15">
        </div>
        <div class="btnrow">
          <button class="b" id="btn-lamp">开 / 关车内灯</button>
        </div>
      </div>

      <div class="grp">
        <div class="grp-h">结论</div>
        <div class="note" id="note2"></div>
      </div>
    </aside>
  </section>
</main>

<script>
(function(){
'use strict';

/* ========================= 工具 ========================= */
const $ = s => document.querySelector(s);
const D2R = Math.PI/180;
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const FONT = 'system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';

function N(x,y){ const m = Math.hypot(x,y)||1; return {x:x/m, y:y/m}; }

function fit(cv){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = Math.max(1, cv.clientWidth);
  const h = Math.max(1, cv.clientHeight);
  if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){
    cv.width = Math.round(w*dpr);
    cv.height = Math.round(h*dpr);
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return ctx;
}

/* 按比例把 canvas 塞进容器 */
function layoutCanvas(cv, ratio){
  const box = cv.parentElement;
  if(!box) return;
  const cs = getComputedStyle(box);
  const aw = box.clientWidth - parseFloat(cs.paddingLeft||0) - parseFloat(cs.paddingRight||0);
  const ah = box.clientHeight - parseFloat(cs.paddingTop||0) - parseFloat(cs.paddingBottom||0);
  if(aw <= 0 || ah <= 0) return;
  let w = aw, h = w/ratio;
  if(h > ah){ h = ah; w = h*ratio; }
  cv.style.width = Math.floor(w)+'px';
  cv.style.height = Math.floor(h)+'px';
}
function setSize(cv,w,h){
  cv.style.width = Math.max(1,Math.floor(w))+'px';
  cv.style.height = Math.max(1,Math.floor(h))+'px';
}
/* Tab2：上下两块，统一宽度并保证总高不溢出 */
function layoutPair(a,b,ra,rb){
  const st = a.parentElement && a.parentElement.parentElement;
  if(!st) return;
  const cs = getComputedStyle(st);
  const aw = st.clientWidth - parseFloat(cs.paddingLeft||0) - parseFloat(cs.paddingRight||0);
  const ah = st.clientHeight - parseFloat(cs.paddingTop||0) - parseFloat(cs.paddingBottom||0) - 8;
  if(aw<=0||ah<=0) return;
  let w = aw;
  let hA = w/ra, hB = w/rb;
  if(hA+hB > ah){
    const k = ah/(hA+hB);
    w = w*k; hA = hA*k; hB = hB*k;
  }
  setSize(a, w, hA);
  setSize(b, w, hB);
}

function makeView(W,H,w,pad){
  const l=pad.l||0, t=pad.t||0, r=pad.r||0, b=pad.b||0;
  const aw = W-l-r, ah = H-t-b;
  const s = Math.min(aw/(w.x1-w.x0), ah/(w.y1-w.y0));
  const ox = l + (aw-(w.x1-w.x0)*s)/2 - w.x0*s;
  const oy = t + (ah-(w.y1-w.y0)*s)/2 + w.y1*s;
  return { s, ox, oy, X:x=>ox+x*s, Y:y=>oy-y*s, px:v=>v*s };
}

/* 平面镜：镜像点 / 反射点 / 反射方向 */
function mirrorOf(P, C, n){
  const k = 2*((P.x-C.x)*n.x + (P.y-C.y)*n.y);
  return {x:P.x-k*n.x, y:P.y-k*n.y};
}
function hitPoint(P, E, C, n){
  const Ep = mirrorOf(E, C, n);
  const dx = Ep.x-P.x, dy = Ep.y-P.y;
  const den = dx*n.x + dy*n.y;
  if(Math.abs(den) < 1e-9) return null;
  const t = ((C.x-P.x)*n.x + (C.y-P.y)*n.y)/den;
  if(t <= 0.002 || t >= 0.998) return null;
  return {x:P.x+t*dx, y:P.y+t*dy};
}
function reflectDir(v, n){
  const k = 2*(v.x*n.x + v.y*n.y);
  return {x:v.x-k*n.x, y:v.y-k*n.y};
}
function rr(ctx,x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ========================= 状态 ========================= */
const S = {
  tab:1,
  angle:-19, mirrorY:1.46, passX:-1.05, passH:1.16,
  layers:{rays:true, virtual:true, fov:true, normal:false},
  lamp:0.70, refl:0.09, obj:'dash', carD:8, truckD:15
};

/* ========================= TAB 1 ========================= */
const T1 = {
  world:{x0:-1.80, x1:3.12, y0:-0.14, y1:2.68},
  ratio:1.74,
  eye:{x:0.60, y:1.22},
  mirrorX:1.055,
  roofY:1.60,
  mirrorL:0.125
};

function cabinPath(ctx,V){
  ctx.beginPath();
  ctx.moveTo(V.X(2.26), V.Y(0.70));
  ctx.lineTo(V.X(2.24), V.Y(0.90));
  ctx.quadraticCurveTo(V.X(2.06), V.Y(0.98), V.X(1.86), V.Y(1.00));
  ctx.lineTo(V.X(1.46), V.Y(1.04));
  ctx.lineTo(V.X(1.06), V.Y(1.61));
  ctx.quadraticCurveTo(V.X(0.00), V.Y(1.78), V.X(-1.26), V.Y(1.70));
  ctx.quadraticCurveTo(V.X(-1.56), V.Y(1.65), V.X(-1.58), V.Y(1.18));
  ctx.lineTo(V.X(-1.58), V.Y(0.52));
  ctx.lineTo(V.X(-1.40), V.Y(0.30));
  ctx.lineTo(V.X(1.70), V.Y(0.30));
  ctx.lineTo(V.X(2.16), V.Y(0.42));
  ctx.closePath();
}

function seatDraw(ctx,V){
  const g = ctx.createLinearGradient(0,V.Y(1.2),0,V.Y(0.4));
  g.addColorStop(0,'#253447'); g.addColorStop(1,'#151f2b');
  ctx.fillStyle = g;

  // 后排座垫 + 靠背
  rr(ctx, V.X(-1.34), V.Y(0.60), V.px(0.74), V.px(0.10), 4); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(V.X(-1.36), V.Y(0.60));
  ctx.quadraticCurveTo(V.X(-1.40), V.Y(1.02), V.X(-1.36), V.Y(1.22));
  ctx.lineTo(V.X(-1.24), V.Y(1.22));
  ctx.quadraticCurveTo(V.X(-1.27), V.Y(1.00), V.X(-1.24), V.Y(0.60));
  ctx.closePath(); ctx.fill();

  // 驾驶座
  rr(ctx, V.X(0.24), V.Y(0.60), V.px(0.64), V.px(0.10), 4); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(V.X(0.21), V.Y(0.60));
  ctx.quadraticCurveTo(V.X(0.17), V.Y(1.00), V.X(0.21), V.Y(1.16));
  ctx.lineTo(V.X(0.32), V.Y(1.16));
  ctx.quadraticCurveTo(V.X(0.295),V.Y(0.98), V.X(0.32), V.Y(0.60));
  ctx.closePath(); ctx.fill();
}

/* 坐姿人影；footY = 脚底世界高度 */
function seatedPerson(ctx,V,hx,hy,fill,stroke,lw,footY){
  const r = 0.0985;
  const fy = (footY==null) ? hy-0.68 : footY;

  ctx.beginPath();
  ctx.arc(V.X(hx), V.Y(hy), V.px(r), 0, Math.PI*2);
  ctx.fillStyle = fill; ctx.fill();
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw||1; ctx.stroke(); }

  ctx.beginPath();
  ctx.moveTo(V.X(hx-0.075), V.Y(hy-0.055));
  ctx.quadraticCurveTo(V.X(hx-0.148), V.Y(hy-0.20), V.X(hx-0.150), V.Y(hy-0.40));
  ctx.quadraticCurveTo(V.X(hx-0.152), V.Y(hy-0.495), V.X(hx-0.060), V.Y(hy-0.505));
  ctx.lineTo(V.X(hx+0.300), V.Y(hy-0.505));
  ctx.quadraticCurveTo(V.X(hx+0.395), V.Y(hy-0.505), V.X(hx+0.395), V.Y(hy-0.415));
  ctx.lineTo(V.X(hx+0.395), V.Y(fy));
  ctx.lineTo(V.X(hx+0.500), V.Y(fy));
  ctx.lineTo(V.X(hx+0.500), V.Y(hy-0.415));
  ctx.lineTo(V.X(hx+0.285), V.Y(hy-0.400));
  ctx.quadraticCurveTo(V.X(hx+0.040), V.Y(hy-0.380), V.X(hx+0.028), V.Y(hy-0.265));
  ctx.quadraticCurveTo(V.X(hx+0.018), V.Y(hy-0.14), V.X(hx+0.060), V.Y(hy-0.055));
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw||1; ctx.stroke(); }
}

function driverShape(ctx,V,E){
  const fill='#1c2634', stroke='#33495f';
  ctx.beginPath();
  ctx.arc(V.X(E.x-0.02), V.Y(E.y+0.075), V.px(0.090), 0, Math.PI*2);
  ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(V.X(E.x-0.10), V.Y(E.y+0.00));
  ctx.quadraticCurveTo(V.X(E.x-0.145), V.Y(E.y-0.24), V.X(E.x-0.155), V.Y(E.y-0.55));
  ctx.lineTo(V.X(E.x+0.12), V.Y(E.y-0.55));
  ctx.quadraticCurveTo(V.X(E.x+0.155), V.Y(E.y-0.22), V.X(E.x+0.095), V.Y(E.y+0.00));
  ctx.closePath();
  ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.stroke();
}

function draw1(){
  const cv = $('#cv1');
  if(!cv.clientWidth) return;
  const ctx = fit(cv);
  const W = cv.clientWidth, H = cv.clientHeight;
  const V = makeView(W,H,T1.world,{l:10,t:10,r:10,b:10});

  /* 背景 */
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a1220'); bg.addColorStop(0.55,'#080d16'); bg.addColorStop(1,'#05080d');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // 远路灯
  [[0.86,0.20],[0.72,0.13],[0.95,0.30]].forEach(([fx,fy],i)=>{
    const x=W*fx, y=H*fy, rad=44+i*16;
    const rg = ctx.createRadialGradient(x,y,0,x,y,rad);
    rg.addColorStop(0,'rgba(255,196,120,.30)');
    rg.addColorStop(0.4,'rgba(255,170,90,.08)');
    rg.addColorStop(1,'rgba(255,170,90,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,1.6,0,Math.PI*2); ctx.fillStyle='rgba(255,225,180,.9)'; ctx.fill();
  });

  // 地面
  ctx.beginPath();
  ctx.moveTo(0, V.Y(0)); ctx.lineTo(W, V.Y(0));
  ctx.strokeStyle='#141d29'; ctx.lineWidth=2; ctx.stroke();

  // 车轮
  [[-1.00,0.33],[1.52,0.33]].forEach(([cx,cy])=>{
    ctx.beginPath(); ctx.arc(V.X(cx),V.Y(cy),V.px(0.33),0,Math.PI*2);
    ctx.fillStyle='#0a0f16'; ctx.fill();
    ctx.strokeStyle='#1b2634'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(V.X(cx),V.Y(cy),V.px(0.155),0,Math.PI*2);
    ctx.strokeStyle='#22303f'; ctx.lineWidth=1.2; ctx.stroke();
  });

  // 车身
  cabinPath(ctx,V);
  const bodyG = ctx.createLinearGradient(0,V.Y(1.8),0,V.Y(0.3));
  bodyG.addColorStop(0,'#1a2534'); bodyG.addColorStop(0.45,'#121b26'); bodyG.addColorStop(1,'#0a1017');
  ctx.fillStyle=bodyG; ctx.fill();
  ctx.strokeStyle='#2b3d52'; ctx.lineWidth=1.8; ctx.stroke();

  // 车厢内衬
  ctx.beginPath();
  ctx.moveTo(V.X(1.46),V.Y(1.05));
  ctx.lineTo(V.X(1.10),V.Y(1.565));
  ctx.quadraticCurveTo(V.X(0.00),V.Y(1.72),V.X(-1.20),V.Y(1.645));
  ctx.quadraticCurveTo(V.X(-1.50),V.Y(1.60),V.X(-1.52),V.Y(1.14));
  ctx.lineTo(V.X(-1.53),V.Y(0.50));
  ctx.lineTo(V.X(1.42),V.Y(0.50));
  ctx.closePath();
  const inG = ctx.createLinearGradient(0,V.Y(1.7),0,V.Y(0.5));
  inG.addColorStop(0,'#16202d'); inG.addColorStop(1,'#0b121a');
  ctx.fillStyle=inG; ctx.fill();

  // 顶棚线
  ctx.beginPath();
  ctx.moveTo(V.X(1.10),V.Y(1.565));
  ctx.quadraticCurveTo(V.X(0.0),V.Y(1.72),V.X(-1.20),V.Y(1.645));
  ctx.strokeStyle='#243342'; ctx.lineWidth=1.2; ctx.stroke();

  // 地板
  ctx.beginPath();
  ctx.moveTo(V.X(-1.53),V.Y(0.475)); ctx.lineTo(V.X(1.42),V.Y(0.475));
  ctx.strokeStyle='#1a2532'; ctx.lineWidth=4; ctx.stroke();

  seatDraw(ctx,V);

  // 仪表台
  ctx.beginPath();
  ctx.moveTo(V.X(1.10),V.Y(1.02));
  ctx.lineTo(V.X(1.44),V.Y(1.04));
  ctx.lineTo(V.X(1.44),V.Y(0.92));
  ctx.quadraticCurveTo(V.X(1.25),V.Y(0.94),V.X(1.10),V.Y(0.86));
  ctx.closePath();
  ctx.fillStyle='#1a2432'; ctx.fill();

  /* 几何 */
  const E = T1.eye;
  const C = {x:T1.mirrorX, y:S.mirrorY};
  const th = S.angle*D2R;
  const d = {x:Math.sin(th), y:Math.cos(th)};
  const n = {x:-Math.cos(th), y:Math.sin(th)};
  const A = {x:C.x-d.x*T1.mirrorL, y:C.y-d.y*T1.mirrorL};
  const B = {x:C.x+d.x*T1.mirrorL, y:C.y+d.y*T1.mirrorL};
  const P = {x:S.passX, y:S.passH};

  /* ---- 光路采样 + 虚像定位（后面的镜面延长、反向延长线都要用）---- */
  const pts=[
    {dx:0.00,dy:0.098,a:0.95,w:1.9},
    {dx:0.062,dy:0.000,a:0.90,w:1.8},
    {dx:-0.050,dy:-0.165,a:0.62,w:1.4},
    {dx:0.015,dy:-0.320,a:0.38,w:1.1}
  ];
  let hits=0;
  const hitList=[];
  pts.forEach(sp=>{
    const Q={x:P.x+sp.dx,y:P.y+sp.dy};
    const M=hitPoint(Q,E,C,n);
    if(M && Math.abs(Math.hypot(M.x-C.x,M.y-C.y))<=T1.mirrorL+0.0008){
      hits++; hitList.push({Q,M,a:sp.a,w:sp.w});
    }
  });
  const Pimg = mirrorOf(P,C,n);
  const Pmid = {x:(P.x+Pimg.x)/2, y:(P.y+Pimg.y)/2};

  // 车内灯光
  const lampX=V.X(P.x+0.12), lampY=V.Y(1.46);
  const lg = ctx.createRadialGradient(lampX,lampY,0,lampX,lampY,V.px(1.55));
  lg.addColorStop(0,'rgba(255,206,140,.15)');
  lg.addColorStop(0.45,'rgba(255,180,100,.055)');
  lg.addColorStop(1,'rgba(255,180,100,0)');
  ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(lampX,lampY,V.px(1.55),0,Math.PI*2); ctx.fill();

  // 可视区
  const ua=N(A.x-E.x,A.y-E.y), ra=reflectDir(ua,n);
  const ub=N(B.x-E.x,B.y-E.y), rb=reflectDir(ub,n);
  const FAR=2.15;
  const fa={x:A.x+ra.x*FAR,y:A.y+ra.y*FAR}, fb={x:B.x+rb.x*FAR,y:B.y+rb.y*FAR};

  if(S.layers.fov){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(V.X(E.x),V.Y(E.y));
    ctx.lineTo(V.X(A.x),V.Y(A.y));
    ctx.lineTo(V.X(fa.x),V.Y(fa.y));
    ctx.lineTo(V.X(fb.x),V.Y(fb.y));
    ctx.lineTo(V.X(B.x),V.Y(B.y));
    ctx.closePath();
    const fg=ctx.createLinearGradient(V.X(C.x),V.Y(C.y),V.X(-1.2),V.Y(0.8));
    fg.addColorStop(0,'rgba(79,209,224,.15)');
    fg.addColorStop(1,'rgba(79,209,224,.015)');
    ctx.fillStyle=fg; ctx.fill();
    ctx.strokeStyle='rgba(79,209,224,.22)';
    ctx.setLineDash([5,5]); ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
  }

  // 乘客
  ctx.save();
  ctx.shadowColor='rgba(255,190,120,.20)'; ctx.shadowBlur=20;
  seatedPerson(ctx,V,P.x,P.y,'#2e4057','#4d6a8b',1.3, 0.475);
  ctx.restore();

  // 司机
  driverShape(ctx,V,E);
  ctx.beginPath();
  ctx.arc(V.X(E.x+0.062),V.Y(E.y),V.px(0.017),0,Math.PI*2);
  ctx.fillStyle='#ffe3a0'; ctx.shadowColor='#ffb454'; ctx.shadowBlur=10; ctx.fill();
  ctx.shadowBlur=0;

  /* 镜面延长虚线：物像连线的垂足往往落在镜面之外，
     延长后这条垂线才能与镜面相交成直角 */
  {
    let extP=0.10, extN=0.10;
    hitList.forEach(h=>{
      const u=(h.M.x-C.x)*d.x+(h.M.y-C.y)*d.y;
      if(u>0) extP=Math.max(extP,u+0.05); else extN=Math.max(extN,-u+0.05);
    });
    const um=(Pmid.x-C.x)*d.x+(Pmid.y-C.y)*d.y;
    if(um>0) extP=Math.max(extP,um+0.13); else extN=Math.max(extN,-um+0.13);
    extP=Math.min(extP,1.00); extN=Math.min(extN,1.00);

    ctx.save();
    ctx.setLineDash([5,5]);
    ctx.strokeStyle='rgba(150,225,245,.62)';
    ctx.lineWidth=1.5;
    ctx.shadowColor='rgba(79,209,224,.55)'; ctx.shadowBlur=6;
    if(extP>T1.mirrorL+0.006){
      ctx.beginPath();
      ctx.moveTo(V.X(C.x+d.x*T1.mirrorL), V.Y(C.y+d.y*T1.mirrorL));
      ctx.lineTo(V.X(C.x+d.x*extP), V.Y(C.y+d.y*extP));
      ctx.stroke();
    }
    if(extN>T1.mirrorL+0.006){
      ctx.beginPath();
      ctx.moveTo(V.X(C.x-d.x*T1.mirrorL), V.Y(C.y-d.y*T1.mirrorL));
      ctx.lineTo(V.X(C.x-d.x*extN), V.Y(C.y-d.y*extN));
      ctx.stroke();
    }
    // 延长线末端的小横杠，示意"镜面所在直线"
    ctx.setLineDash([]);
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(150,225,245,.55)';
    ctx.lineWidth=1.4;
    [[extP,1],[extN,-1]].forEach(([e,sg])=>{
      if(e<=T1.mirrorL+0.006) return;
      const px=C.x+sg*d.x*e, py=C.y+sg*d.y*e;
      const px2=px-n.x*0.055, py2=py-n.y*0.055;
      ctx.beginPath();
      ctx.moveTo(V.X(px),V.Y(py)); ctx.lineTo(V.X(px2),V.Y(py2));
      ctx.stroke();
    });
    ctx.restore();
  }

  // 后视镜
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(V.X(T1.mirrorX),V.Y(T1.roofY));
  ctx.lineTo(V.X(C.x),V.Y(B.y));
  ctx.strokeStyle='#33495f'; ctx.lineWidth=2.5; ctx.stroke();

  // 镜背
  ctx.beginPath();
  ctx.moveTo(V.X(A.x-n.x*0.028),V.Y(A.y-n.y*0.028));
  ctx.lineTo(V.X(B.x-n.x*0.028),V.Y(B.y-n.y*0.028));
  ctx.strokeStyle='#2b3d52'; ctx.lineWidth=5.5; ctx.stroke();

  // 镜面
  ctx.beginPath();
  ctx.moveTo(V.X(A.x),V.Y(A.y));
  ctx.lineTo(V.X(B.x),V.Y(B.y));
  ctx.strokeStyle='rgba(170,240,255,.95)';
  ctx.lineWidth=3.4;
  ctx.shadowColor='#4fd1e0'; ctx.shadowBlur=14;
  ctx.stroke();
  ctx.restore();
  ctx.shadowBlur=0;

  // 虚像
  if(S.layers.virtual){
    const Axx=1-2*n.x*n.x, Axy=-2*n.x*n.y;
    const Ayx=-2*n.x*n.y,  Ayy=1-2*n.y*n.y;
    const kk=2*(n.x*C.x+n.y*C.y);
    const tx=n.x*kk, ty=n.y*kk;
    const dpr=Math.min(window.devicePixelRatio||1,2);

    ctx.save();
    // 显式矩阵：世界坐标 →（镜像）→ 屏幕 css → 设备像素
    ctx.setTransform(
      dpr*V.s*Axx, -dpr*V.s*Ayx,
      dpr*V.s*Axy, -dpr*V.s*Ayy,
      dpr*(V.ox + V.s*tx), dpr*(V.oy - V.s*ty)
    );
    ctx.globalAlpha=0.9;
    ctx.setLineDash([0.013,0.013]);
    // 当前变换已完成全部映射，这里用恒等 view 直接传世界坐标
    // 线宽/dash 会被 CTM 放大，故按世界单位折算
    const V2={s:1, X:x=>x, Y:y=>y, px:v=>v};
    seatedPerson(ctx,V2,P.x,P.y,'rgba(79,209,224,.10)','rgba(110,225,240,.85)', 1.25/V.s, 0.475);
    ctx.restore();

    // 对称辅助线：物—镜面—像 的垂线
    if(S.layers.virtual){
      ctx.save();
      ctx.setLineDash([2,4]);
      ctx.strokeStyle='rgba(167,139,250,.45)'; ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(V.X(P.x), V.Y(P.y));
      ctx.lineTo(V.X(Pimg.x), V.Y(Pimg.y));
      ctx.stroke();

      // 垂足
      const mx=Pmid.x, my=Pmid.y;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(V.X(mx), V.Y(my), 3, 0, Math.PI*2);
      ctx.fillStyle='rgba(226,216,255,1)'; ctx.fill();

      // 直角标记
      const d1=N(Pimg.x-P.x, Pimg.y-P.y);
      const d2={x:-d1.y, y:d1.x};
      const u=18/V.s;
      const c1={x:mx+d2.x*u, y:my+d2.y*u};
      const c2={x:c1.x+d1.x*u, y:c1.y+d1.y*u};
      const c3={x:mx+d1.x*u, y:my+d1.y*u};
      ctx.beginPath();
      ctx.moveTo(V.X(c1.x),V.Y(c1.y));
      ctx.lineTo(V.X(c2.x),V.Y(c2.y));
      ctx.lineTo(V.X(c3.x),V.Y(c3.y));
      ctx.strokeStyle='rgba(226,216,255,.95)'; ctx.lineWidth=1.6; ctx.stroke();
      ctx.restore();
    }

    // 标注
    ctx.save();
    ctx.font='11px '+FONT; ctx.textAlign='center';
    ctx.fillStyle='rgba(120,225,240,.92)';
    ctx.fillText('虚  像', V.X(Pimg.x), V.Y(Pimg.y)+V.px(0.18));
    ctx.font='10px '+FONT;
    ctx.fillStyle='rgba(120,225,240,.55)';
    ctx.fillText('（镜后等大正立虚像）', V.X(Pimg.x), V.Y(Pimg.y)+V.px(0.18)+13);
    ctx.restore();
  }

  // 光路
  if(S.layers.rays){
    // 反射光线的反向延长线（虚线）—— 每条都必过对应物点的虚像
    hitList.forEach((h,idx)=>{
      const Qimg = mirrorOf(h.Q, C, n);
      const main = idx===0;
      ctx.save();
      ctx.setLineDash(main?[6,5]:[3,7]);
      ctx.strokeStyle='rgba(255,208,138,'+(main?0.80:h.a*0.30)+')';
      ctx.lineWidth=main?1.6:1;
      if(main){ ctx.shadowColor='rgba(255,180,84,.7)'; ctx.shadowBlur=7; }
      ctx.beginPath();
      ctx.moveTo(V.X(h.M.x), V.Y(h.M.y));
      ctx.lineTo(V.X(Qimg.x), V.Y(Qimg.y));
      ctx.stroke();
      ctx.restore();
    });

    hitList.forEach((h,i)=>{
      ctx.save();
      ctx.strokeStyle='rgba(255,198,112,'+h.a+')';
      ctx.lineWidth=h.w;
      ctx.shadowColor='#ffb454'; ctx.shadowBlur=8;
      ctx.beginPath();
      ctx.moveTo(V.X(h.Q.x),V.Y(h.Q.y));
      ctx.lineTo(V.X(h.M.x),V.Y(h.M.y));
      ctx.lineTo(V.X(E.x),V.Y(E.y));
      ctx.stroke();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(V.X(h.M.x),V.Y(h.M.y),2.4,0,Math.PI*2);
      ctx.fillStyle='#fff3d6'; ctx.fill();
    });

    // 入射方向箭头（最上面那条）
    if(hitList.length){
      const h=hitList[0];
      const mx=(h.Q.x+h.M.x)/2, my=(h.Q.y+h.M.y)/2;
      const dir=N(h.M.x-h.Q.x,h.M.y-h.Q.y);
      const ax=V.X(mx), ay=V.Y(my);
      const L=7;
      ctx.beginPath();
      ctx.moveTo(ax,ay);
      ctx.lineTo(ax-dir.x*L*0.9 - dir.y*L*0.55, ay+dir.y*L*0.9 - dir.x*L*0.55);
      ctx.lineTo(ax-dir.x*L*0.9 + dir.y*L*0.55, ay+dir.y*L*0.9 + dir.x*L*0.55);
      ctx.closePath();
      ctx.fillStyle='rgba(255,205,130,.9)';
      ctx.fill();
    }
  }

  // 法线
  if(S.layers.normal){
    ctx.save();
    ctx.setLineDash([3,4]);
    ctx.strokeStyle='rgba(167,139,250,.8)'; ctx.lineWidth=1.1;
    ctx.beginPath();
    ctx.moveTo(V.X(C.x-n.x*0.36),V.Y(C.y-n.y*0.36));
    ctx.lineTo(V.X(C.x+n.x*0.36),V.Y(C.y+n.y*0.36));
    ctx.stroke();
    ctx.restore();
  }

  // 图例
  ctx.save();
  ctx.font='11px '+FONT; ctx.textAlign='left';
  const lx=26, ly=40, gap=17;
  const items=[
    ['rgba(255,198,112,.98)','实线：入射光线 → 反射光线 → 眼睛',false],
    ['rgba(255,208,138,.95)','虚线：反射光线的反向延长线',true],
    ['rgba(150,225,245,.95)','虚线：镜面延长线',true],
    ['rgba(190,168,255,.95)','虚线：物像连线（⊥ 镜面）',true]
  ];
  // 底衬
  let maxW=0;
  items.forEach(([,,],i)=>{ maxW=Math.max(maxW, ctx.measureText(items[i][1]).width); });
  ctx.fillStyle='rgba(7,12,18,.62)';
  rr(ctx, lx-12, ly-15, maxW+58, gap*items.length+8, 7); ctx.fill();
  ctx.strokeStyle='rgba(40,58,78,.7)'; ctx.lineWidth=1; ctx.stroke();

  items.forEach(([col,txt,dashed],i)=>{
    const y=ly+i*gap;
    ctx.beginPath();
    ctx.setLineDash(dashed?[5,4]:[]);
    ctx.strokeStyle=col; ctx.lineWidth=1.8;
    ctx.moveTo(lx,y); ctx.lineTo(lx+22,y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(168,186,208,.92)';
    ctx.fillText(txt, lx+30, y+4);
  });
  ctx.restore();

  updateTab1Text(hits, pts.length, Pimg, P, E);
}

function updateTab1Text(hits,total,Pimg,P,E){
  const hb=$('#hint1'), ht=$('#hint1t');
  let cls='bad', txt='';
  if(hits===total){ cls=''; txt='✅ 司机能完整看到后排乘客 —— 所有反射点都落在镜面内'; }
  else if(hits>=3){ cls='warn'; txt='⚠︎ 只能看到乘客上半身 —— 下半身的反射点已超出镜面边缘'; }
  else if(hits>0){ cls='warn'; txt='⚠︎ 只勉强剩一条光路 —— 镜面偏转过多'; }
  else { cls='bad'; txt='✕ 完全看不到 —— 反射点全落在镜面之外，需要调节镜面角度'; }
  hb.className='hintbar '+cls;
  ht.textContent=txt;

  const C={x:T1.mirrorX,y:S.mirrorY};
  const objD=Math.hypot(P.x-C.x,P.y-C.y);
  const imgD=Math.hypot(Pimg.x-C.x,Pimg.y-C.y);
  const eyeM=Math.hypot(E.x-C.x,E.y-C.y);
  const eyeI=Math.hypot(E.x-Pimg.x,E.y-Pimg.y);

  $('#ro1').innerHTML=
    '<div class="row"><span>物距（乘客→镜面）</span><span>'+objD.toFixed(2)+' m</span></div>'+
    '<div class="row cy"><span>像距（镜面→虚像）</span><span>'+imgD.toFixed(2)+' m</span></div>'+
    '<div class="row"><span>物距 − 像距</span><span>'+Math.abs(objD-imgD).toFixed(3)+' m</span></div>'+
    '<div class="row"><span>眼睛→镜面</span><span>'+eyeM.toFixed(2)+' m</span></div>'+
    '<div class="row hl"><span>眼睛→虚像（视线长）</span><span>'+eyeI.toFixed(2)+' m</span></div>'+
    '<div class="row"><span>可见光路 / 采样</span><span>'+hits+' / '+total+'</span></div>';

  $('#note1').innerHTML=
    '<b>① 光路</b>：乘客身上各点射向镜面，经反射进入司机眼睛（橙色实线）。<br>'+
    '<b>② 反向延长</b>：把反射光线朝镜后延长（橙色虚线），它们落在虚像上 —— 眼睛"以为"光是从那里直射来的。<br>'+
    '<b>③ 对称</b>：物与像的连线垂直于镜面，垂足在<b>镜面延长线</b>（青色虚线）上，且物距 = 像距 = <em>'+imgD.toFixed(2)+' m</em>。<br>'+
    '所以司机觉得人浮在镜后 <em>'+imgD.toFixed(2)+' m</em>，其实那里什么都没有 —— 平面镜成的是<b>虚像</b>。';
}

const G2 = {
  eye:{x:0.52, y:1.10},
  g0:{x:1.42, y:0.96},
  gAng:72*D2R,
  gLen:0.78,
  dash:{x:1.26, y:0.88},
  roofLamp:{x:0.04, y:1.55},
  screen:{x:0.94, y:0.96},
  pass:{x:-0.46, y:1.06}
};
G2.gDir={x:-Math.cos(G2.gAng), y:Math.sin(G2.gAng)};
G2.gN  ={x: Math.sin(G2.gAng), y:Math.cos(G2.gAng)};
G2.g1  ={x:G2.g0.x+G2.gDir.x*G2.gLen, y:G2.g0.y+G2.gDir.y*G2.gLen};

const T2W={x0:-1.16, x1:4.20, y0:-0.36, y1:2.44};
const RATIO_A=3.0, RATIO_B=2.31;

function glassImg(P){ return mirrorOf(P,G2.g0,G2.gN); }
/* 玻璃上的反射点：眼睛关于玻璃镜像后与物的连线交玻璃面 */
function glassHit(P){
  const Ep = mirrorOf(G2.eye, G2.g0, G2.gN);
  const dx=Ep.x-P.x, dy=Ep.y-P.y;
  const den=dx*G2.gN.x+dy*G2.gN.y;
  if(Math.abs(den)<1e-9) return null;
  const t=((G2.g0.x-P.x)*G2.gN.x+(G2.g0.y-P.y)*G2.gN.y)/den;
  if(t<=0.002||t>=0.998) return null;
  const F={x:P.x+t*dx, y:P.y+t*dy};
  // 限制在玻璃实际范围内
  const u=(F.x-G2.g0.x)*G2.gDir.x+(F.y-G2.g0.y)*G2.gDir.y;
  if(u < -0.02 || u > G2.gLen+0.02) return null;
  return F;
}
function incidence(P){
  const F=glassHit(P);
  if(!F) return 0;
  const v=N(P.x-F.x,P.y-F.y);
  return Math.acos(clamp(Math.abs(v.x*G2.gN.x+v.y*G2.gN.y),0,1));
}
function fresnel(R0,ang){
  const c=Math.cos(ang);
  return R0+(1-R0)*Math.pow(1-c,5);
}
function objPoint(k){
  if(k==='dash') return G2.dash;
  if(k==='screen') return G2.screen;
  return G2.pass;
}
function activeObjs(){
  return S.obj==='all' ? ['dash','passenger','screen'] : [S.obj];
}

function drawDistBar(ctx,W,H){

  rr(ctx,x0-6,y-22,(x1-x0)+12,42,7); ctx.fill();
  ctx.strokeStyle='#1a2634'; ctx.lineWidth=1; ctx.stroke();

  const X=d=>x0+(d/maxD)*(x1-x0);

  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y);
  ctx.strokeStyle='#22303f'; ctx.lineWidth=1.4; ctx.stroke();

  for(let d=0; d<=maxD; d+=8){
    ctx.beginPath(); ctx.moveTo(X(d),y); ctx.lineTo(X(d),y+3);

/* ---------- 司机第一人称 ---------- */
function draw2b(){
  const cv=$('#cv2b');
  if(!cv.clientWidth) return;
  const ctx=fit(cv);
  const W=cv.clientWidth, H=cv.clientHeight;

  const CAM={x:G2.eye.x, y:G2.eye.y, z:0, pitch:7*D2R};
  const hfov=78*D2R;
  const focal=(W/2)/Math.tan(hfov/2);
  const cx=W/2, cy=H/2;
  const cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  CAMY=CAM.y;

  function proj(px,py,pz){
    const dx=px-CAM.x, dy=py-CAM.y, dz=pz-CAM.z;
    const fwd=dx*cp+dy*sp;
    const up=-dx*sp+dy*cp;
    if(fwd<0.12) return null;
    return {x:cx+dz/fwd*focal, y:cy-up/fwd*focal, k:focal/fwd};
  }
  function quad(pts,fill){
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const q=proj(pts[i][0],pts[i][1],pts[i][2]);
      if(!q) return;
      i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);
    }
    ctx.closePath();
    ctx.fillStyle=fill; ctx.fill();
  }

  /* 天空 */
  const sky=ctx.createLinearGradient(0,0,0,cy+30);
  sky.addColorStop(0,'#070d18');
  sky.addColorStop(0.6,'#0b1421');
  sky.addColorStop(1,'#101a28');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  // 星
  for(let i=0;i<46;i++){
    const x=(i*197.3)%W;
    const y=(i*73.1)%(cy*0.8);
    const a=0.10+0.26*Math.abs(Math.sin(i*1.9));
    ctx.beginPath(); ctx.arc(x,y,i%9===0?1.0:0.6,0,Math.PI*2);
    ctx.fillStyle='rgba(190,215,255,'+a+')'; ctx.fill();
  }

  // 建筑剪影
  ctx.save();
  const bl=[[0.00,0.52,0.13],[0.15,0.66,0.08],[0.25,0.46,0.11],[0.66,0.56,0.10],[0.78,0.40,0.14],[0.93,0.58,0.09]];
  bl.forEach(([fx,hh,fw])=>{
    const x=W*fx, w=W*fw, h=cy*hh*0.34;
    ctx.fillStyle='#08111c';
    ctx.fillRect(x,cy-h,w,h);
    for(let i=0;i<5;i++){
      const wx=x+((i*29+13)%(w-5));
      const wy=cy-h+((i*23+19)%Math.max(8,h-12));
      ctx.fillStyle='rgba(255,200,130,'+(0.06+0.10*((i*5)%3)/2)+')';
      ctx.fillRect(wx,wy,2.2,2.6);
    }
  });
  ctx.restore();

  // 远处路灯
  [[26,-5.2],[34,5.0],[52,-5.4]].forEach(([dd,zz])=>{
    const p=proj(dd,5.2,zz);
    if(!p) return;
    const rad=Math.max(16,p.k*1.5);
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad);
    g.addColorStop(0,'rgba(255,205,140,.30)');
    g.addColorStop(0.35,'rgba(255,185,110,.09)');
    g.addColorStop(1,'rgba(255,185,110,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(p.x,p.y,rad,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,225,180,.75)';
    ctx.beginPath(); ctx.arc(p.x,p.y,1.5,0,Math.PI*2); ctx.fill();
  });

  // 地平线雾
  const hz=ctx.createLinearGradient(0,cy-12,0,cy+22);
  hz.addColorStop(0,'rgba(26,44,64,0)');
  hz.addColorStop(0.5,'rgba(28,48,70,.5)');
  hz.addColorStop(1,'rgba(18,30,42,0)');
  ctx.fillStyle=hz; ctx.fillRect(0,cy-12,W,34);

  /* 路面 */
  const roadG=ctx.createLinearGradient(0,cy-2,0,H);
  roadG.addColorStop(0,'#0a131b');
  roadG.addColorStop(0.32,'#0e1721');
  roadG.addColorStop(1,'#141d27');
  quad([[-2,0,-13],[170,0,-13],[170,0,13],[-2,0,13]],roadG);

  for(let lane of [-1.75,1.75]){
    for(let d=3; d<80; d+=9){
      quad([[d,0.002,lane],[d+4.5,0.002,lane],[d+4.5,0.002,lane+0.11],[d,0.002,lane+0.11]],'rgba(185,202,220,.24)');
    }
  }
  quad([[3,0.002,4.55],[170,0.002,4.55],[170,0.002,4.75],[3,0.002,4.75]],'rgba(180,198,215,.15)');

  /* 地面光晕（尾灯照地） */
  function groundGlow(x,z,r,col){
    const p=proj(x,0.01,z);
    if(!p) return;
    const rd=r*p.k;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rd);
    g.addColorStop(0,col);
    g.addColorStop(1,'rgba(255,80,80,0)');
    ctx.save();
    ctx.translate(p.x,p.y); ctx.scale(1,0.40); ctx.translate(-p.x,-p.y);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(p.x,p.y,rd,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  /* ---- 大卡车 ---- */
  const trD=S.truckD;
  groundGlow(trD+1.1, 3.70, 3.0, 'rgba(255,70,70,.09)');
  drawBox(ctx,proj,trD,trD+10,0.34,3.55,2.45,4.95,{a:'#18202a',b:'#121922',e:'rgba(115,145,178,.20)'});

  // 车厢门缝
  [2.45,3.70,4.95].forEach(zz=>{
    const p1=proj(trD-0.005,0.42,zz), p2=proj(trD-0.005,3.45,zz);
    if(p1&&p2){
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
      ctx.strokeStyle='rgba(90,115,145,.22)'; ctx.lineWidth=0.9; ctx.stroke();
    }
  });
  // 底部红白反光条
  for(let i=0;i<9;i++){
    const z0=2.47+i*0.276, z1=z0+0.138;
    quad([[trD-0.006,0.46,z0],[trD-0.006,0.46,z1],[trD-0.006,0.60,z1],[trD-0.006,0.60,z0]],
      i%2 ? 'rgba(255,240,240,.26)' : 'rgba(255,85,85,.26)');
  }
  // 尾灯
  [2.58,4.82].forEach(zz=>{
    const t=proj(trD,0.80,zz);
    if(t){
      ctx.save();
      ctx.shadowColor='#ff5a5a'; ctx.shadowBlur=13;
      ctx.fillStyle='rgba(255,85,85,.95)';
      ctx.beginPath(); ctx.arc(t.x,t.y,Math.max(1.8,t.k*0.062),0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  });
  // 示廓灯（顶 + 两侧）
  [[3.50,3.70],[3.40,2.47],[3.40,4.93]].forEach(([yy,zz])=>{
    const t=proj(trD,yy,zz);
    if(t){
      ctx.save();
      ctx.shadowColor='#ffd479'; ctx.shadowBlur=10;
      ctx.fillStyle='rgba(255,215,130,.85)';
      ctx.beginPath(); ctx.arc(t.x,t.y,Math.max(1.3,t.k*0.038),0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  });

  /* ---- 小汽车 ---- */
  const carD=S.carD, cz=0.55;
  groundGlow(carD+1.5, cz, 2.2, 'rgba(255,70,70,.12)');
  drawBox(ctx,proj,carD,carD+4.4,0.30,1.00,cz-0.88,cz+0.88,{a:'#1e2937',b:'#161e29',e:'rgba(150,180,212,.26)'});
  drawBox(ctx,proj,carD+0.55,carD+3.1,1.00,1.44,cz-0.74,cz+0.74,{a:'#151e29',b:'#111922',e:'rgba(130,162,196,.20)'});
  // 后窗
  quad([[carD+0.58,1.08,cz-0.70],[carD+3.05,1.08,cz-0.70],[carD+3.05,1.40,cz-0.70],[carD+0.58,1.40,cz-0.70]],'rgba(24,44,64,.55)');
  // 后保险杠亮线
  const b1=proj(carD-0.004,0.34,cz-0.86), b2=proj(carD-0.004,0.34,cz+0.86);
  if(b1&&b2){
    ctx.beginPath(); ctx.moveTo(b1.x,b1.y); ctx.lineTo(b2.x,b2.y);
    ctx.strokeStyle='rgba(150,175,200,.20)'; ctx.lineWidth=1.2; ctx.stroke();
  }
  // 牌照
  quad([[carD-0.012,0.60,cz-0.17],[carD-0.012,0.60,cz+0.17],[carD-0.012,0.76,cz+0.17],[carD-0.012,0.76,cz-0.17]],'rgba(215,228,240,.22)');
  // 尾灯
  [cz-0.76,cz+0.76].forEach(zz=>{
    const t=proj(carD-0.004,0.84,zz);
    if(t){
      ctx.save();
      ctx.shadowColor='#ff4d4d'; ctx.shadowBlur=22;
      ctx.fillStyle='rgba(255,72,72,.98)';
      ctx.beginPath(); ctx.arc(t.x,t.y,Math.max(2.2,t.k*0.070),0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  });
  // 高位刹车灯
  const hb=proj(carD+0.62,1.38,cz);
  if(hb){
    ctx.save();
    ctx.shadowColor='#ff3b3b'; ctx.shadowBlur=14;
    ctx.fillStyle='rgba(255,62,62,.8)';
    ctx.beginPath(); ctx.arc(hb.x,hb.y,Math.max(1.4,hb.k*0.030),0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  /* 仪表台（底部） */
  const df=proj(1.22,0.90,0);
  if(df){
    const dy=df.y;
    const g=ctx.createLinearGradient(0,dy-4,0,H);
    g.addColorStop(0,'rgba(20,28,38,0)');
    g.addColorStop(0.3,'rgba(14,21,29,.9)');
    g.addColorStop(1,'#080d13');
    ctx.fillStyle=g; ctx.fillRect(0,dy-4,W,H-dy+4);
    ctx.beginPath(); ctx.moveTo(0,dy); ctx.lineTo(W,dy);
    ctx.strokeStyle='rgba(120,150,180,.16)'; ctx.lineWidth=1; ctx.stroke();
  }

  /* 玻璃微反射层 */
  const gl=ctx.createLinearGradient(0,0,W,H);
  gl.addColorStop(0,'rgba(120,160,200,.020)');
  gl.addColorStop(0.5,'rgba(90,130,170,.006)');
  gl.addColorStop(1,'rgba(60,90,130,.030)');
  ctx.fillStyle=gl; ctx.fillRect(0,0,W,H);

  /* 反射像 */
  let firstGhost=null;
  if(S.lamp>0.02){
    activeObjs().forEach(k=>{
      const src=objPoint(k);
      const img=glassImg(src);
      const ang=incidence(src);
      const Reff=fresnel(S.refl,ang);
      const alpha=clamp(1-Math.exp(-S.lamp*Reff*5.2),0,0.40);
      drawGhost(ctx,proj,k,img,alpha);
      if(!firstGhost){ firstGhost={img, alpha}; }
    });
  }

  /* 车内暗角 */
  const vg=ctx.createRadialGradient(W/2,H*0.50,H*0.30,W/2,H*0.50,H*0.96);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,.52)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  /* 标注 */
  ctx.save();
  ctx.font='10px '+FONT; ctx.fillStyle='rgba(147,164,188,.50)'; ctx.textAlign='right';
  ctx.fillText('水平视野 78°', W-10, 16);
  ctx.restore();

  if(firstGhost && S.lamp>0.05){
    const p=proj(firstGhost.img.x, firstGhost.img.y, 0.1);
    if(p){
      ctx.save();
      ctx.font='10.5px '+FONT;
      ctx.fillStyle='rgba(150,225,240,.80)';
      ctx.textAlign='left';
      const tx=clamp(p.x+18,10,W-150), ty=clamp(p.y-10,24,H-24);
      ctx.fillText('玻璃上的像 · 约 '+(firstGhost.img.x-CAM.x).toFixed(1)+' m', tx, ty);
      ctx.restore();
    }
  }

  updateTab2Text();
}

function drawBox(ctx,proj,x0,x1,y0,y1,z0,z1,col){
  const P=(x,y,z)=>proj(x,y,z);
  const near=[P(x0,y0,z0),P(x0,y0,z1),P(x0,y1,z1),P(x0,y1,z0)];
  const top=[P(x0,y1,z0),P(x0,y1,z1),P(x1,y1,z1),P(x1,y1,z0)];
  if(near.some(p=>!p)) return;

  const sz0=[P(x0,y0,z0),P(x0,y1,z0),P(x1,y1,z0),P(x1,y0,z0)];
  const sz1=[P(x0,y0,z1),P(x0,y1,z1),P(x1,y1,z1),P(x1,y0,z1)];
  const sd=(z0>0)?sz0:(z1<0?sz1:null);
  if(sd && !sd.some(p=>!p)){
    ctx.beginPath();
    sd.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.closePath(); ctx.fillStyle='#0c141c'; ctx.fill();
  }

  if(y1 < CAMY && !top.some(p=>!p)){
    ctx.beginPath();
    top.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.closePath();
    ctx.fillStyle=col.b; ctx.fill();
    ctx.strokeStyle=col.e; ctx.lineWidth=0.7; ctx.stroke();
  }

  ctx.beginPath();
  near.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.closePath();
  const g=ctx.createLinearGradient(0,near[2].y,0,near[0].y);
  g.addColorStop(0,col.a); g.addColorStop(1,'#0a1118');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle=col.e; ctx.lineWidth=0.9; ctx.stroke();
}

function drawGhost(ctx,proj,kind,img,alpha){
  const p=proj(img.x,img.y,0.1);
  if(!p) return;
  const k=p.k;

  ctx.save();
  ctx.globalAlpha=alpha;
  const canBlur = (typeof ctx.filter === 'string');

  if(kind==='passenger'){
    if(canBlur) ctx.filter='blur('+Math.max(2.0,k*0.024).toFixed(1)+'px)';
    ctx.translate(p.x,p.y);
    ctx.scale(k,k);

    const g=ctx.createRadialGradient(0,0.14,0,0,0.24,0.70);
    g.addColorStop(0,'rgba(255,214,166,.72)');
    g.addColorStop(0.40,'rgba(220,178,138,.44)');
    g.addColorStop(1,'rgba(150,120,100,0)');
    ctx.fillStyle=g;

    ctx.beginPath(); ctx.arc(0,0,0.105,0,Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-0.075,0.075);
    ctx.quadraticCurveTo(-0.165,0.26,-0.158,0.50);
    ctx.quadraticCurveTo(-0.152,0.63,-0.04,0.64);
    ctx.lineTo(0.20,0.64);
    ctx.quadraticCurveTo(0.31,0.64,0.31,0.52);
    ctx.lineTo(0.31,0.30);
    ctx.quadraticCurveTo(0.12,0.26,0.09,0.10);
    ctx.closePath(); ctx.fill();

    ctx.beginPath();
    ctx.ellipse(0,0.13,0.155,0.075,0,0,Math.PI*2);
    ctx.fillStyle='rgba(255,242,220,.22)'; ctx.fill();

    if(canBlur) ctx.filter='none';
  }
  else if(kind==='screen'){
    // 中控屏：一块偏蓝的发光矩形 + 外溢光晕
    const w=k*0.24, h=k*0.14;
    if(canBlur) ctx.filter='blur('+Math.max(2,k*0.014).toFixed(1)+'px)';
    const gg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,w*2.6);
    gg.addColorStop(0,'rgba(150,205,245,.34)');
    gg.addColorStop(1,'rgba(110,165,215,0)');
    ctx.fillStyle=gg;
    ctx.beginPath(); ctx.arc(p.x,p.y,w*2.6,0,Math.PI*2); ctx.fill();

    const g2=ctx.createLinearGradient(0,p.y-h/2,0,p.y+h/2);
    g2.addColorStop(0,'rgba(210,238,255,.92)');
    g2.addColorStop(0.5,'rgba(150,200,240,.80)');
    g2.addColorStop(1,'rgba(90,140,190,.55)');
    ctx.fillStyle=g2;
    rr(ctx,p.x-w/2,p.y-h/2,w,h,h*0.16); ctx.fill();
    if(canBlur) ctx.filter='none';
  }
  else {
    // 仪表台反光：压扁的椭圆光斑 + 中控屏亮块
    const w=k*1.46, h=k*0.155;
    if(canBlur) ctx.filter='blur('+Math.max(2.5,k*0.011).toFixed(1)+'px)';

    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.scale(1, h*1.7/w);
    const g=ctx.createRadialGradient(0,0,0,0,0,w*0.60);
    g.addColorStop(0,'rgba(168,198,232,.62)');
    g.addColorStop(0.38,'rgba(140,170,208,.40)');
    g.addColorStop(0.70,'rgba(100,130,170,.14)');
    g.addColorStop(1,'rgba(70,95,130,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(0,0,w*0.60,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // 仪表台上沿的亮边
    const lg=ctx.createLinearGradient(p.x-w*0.46,0,p.x+w*0.46,0);
    lg.addColorStop(0,'rgba(120,155,195,0)');
    lg.addColorStop(0.30,'rgba(190,215,245,.42)');
    lg.addColorStop(0.70,'rgba(190,215,245,.34)');
    lg.addColorStop(1,'rgba(120,155,195,0)');
    ctx.fillStyle=lg;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y-h*0.55, w*0.46, h*0.22, 0, 0, Math.PI*2);
    ctx.fill();

    // 中控屏亮块
    const gg=ctx.createLinearGradient(0,p.y-h*0.5,0,p.y+h*0.7);
    gg.addColorStop(0,'rgba(205,232,255,.50)');
    gg.addColorStop(1,'rgba(120,160,210,0)');
    ctx.fillStyle=gg;
    rr(ctx,p.x-w*0.085,p.y-h*0.45,w*0.17,h*1.05,h*0.16);
    ctx.fill();

    if(canBlur) ctx.filter='none';
  }
  ctx.restore();
}

function updateTab2Text(){
  const src=objPoint(S.obj==='all'?'dash':S.obj);
  const ang=incidence(src);
  const Reff=fresnel(S.refl,ang);
  const img=glassImg(src);
  const dImg=img.x-G2.eye.x;

  $('#ro-ang').textContent=(ang/D2R).toFixed(1)+'°';
  $('#ro-fres').textContent=Reff.toFixed(3);
  const ratio=S.lamp*Reff/0.010;
  $('#ro-ratio').textContent = ratio>0.05 ? ratio.toFixed(1)+' : 1' : '—';

  const el=$('#note2');
  if(S.lamp<0.05){
    el.innerHTML='车内灯已关：玻璃上<b>没有像</b>，只剩车外实景。此时眼睛暗适应最好，暗处行人和车辆轮廓最容易发现。';
  }else{
    el.innerHTML=
      '开灯后，车内物体的虚像落在<b>车头前方约 '+dImg.toFixed(1)+' m</b>（紧贴玻璃外侧），'+
      '而小汽车在 <em>'+S.carD.toFixed(0)+' m</em>、大卡车在 <em>'+S.truckD.toFixed(0)+' m</em>。'+
      '像看起来<b>又大又近</b>，正好压住近处路面和小汽车 —— 这就是"看不清、误判距离"的根源。';
  }
}

/* ========================= UI ========================= */
function bindRange(id,fmt,apply){
  const el=document.getElementById('r-'+id);
  const out=document.getElementById('r-'+id+'-v');
  const upd=()=>{
    const v=parseFloat(el.value);
    apply(v);
    if(out) out.textContent=fmt(v);
    render();
  };
  el.addEventListener('input',upd);
  upd();
}

let CAMY=1.10;
let rafId=0;
function render(){
  if(rafId) cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(()=>{
    rafId=0;
    if(S.tab===1){
      layoutCanvas($('#cv1'),T1.ratio);
      draw1();
    }else{
      layoutPair($('#cv2a'),$('#cv2b'),RATIO_A,RATIO_B);
      draw2a(); draw2b();
    }
  });
}

function bindAll(){
  bindRange('angle',v=>v.toFixed(0)+'°',v=>S.angle=v);
  bindRange('mh',v=>v.toFixed(2)+' m',v=>S.mirrorY=v);
  bindRange('px',v=>v.toFixed(2)+' m',v=>S.passX=v);
  bindRange('ph',v=>v.toFixed(2)+' m',v=>S.passH=v);
  bindRange('lamp',v=>Math.round(v)+' %',v=>S.lamp=v/100);
  bindRange('refl',v=>v.toFixed(3),v=>S.refl=v);
  bindRange('card',v=>v.toFixed(1)+' m',v=>S.carD=v);
  bindRange('truckd',v=>v.toFixed(1)+' m',v=>S.truckD=v);

  document.querySelectorAll('.chip[data-l]').forEach(c=>{
    c.addEventListener('click',()=>{
      const k=c.dataset.l;
      S.layers[k]=!S.layers[k];
      c.classList.toggle('on',S.layers[k]);
      render();
    });
  });

  document.querySelectorAll('#objchips .chip').forEach(c=>{
    c.addEventListener('click',()=>{
      document.querySelectorAll('#objchips .chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on');
      S.obj=c.dataset.o;
      render();
    });
  });

  $('#btn-aim').addEventListener('click',()=>{
    const C={x:T1.mirrorX,y:S.mirrorY};
    const a=N(S.passX-C.x, S.passH-C.y);
    const b=N(T1.eye.x-C.x, T1.eye.y-C.y);
    let nx=a.x+b.x, ny=a.y+b.y;
    const m=Math.hypot(nx,ny)||1; nx/=m; ny/=m;
    if(nx>0){ nx=-nx; ny=-ny; }
    S.angle=clamp(Math.round(Math.atan2(ny,-nx)/D2R*2)/2,-45,25);
    document.getElementById('r-angle').value=S.angle;
    document.getElementById('r-angle-v').textContent=S.angle.toFixed(0)+'°';
    render();
  });

  $('#btn-reset1').addEventListener('click',()=>{
    S.angle=-19; S.mirrorY=1.46; S.passX=-1.05; S.passH=1.16;
    const set=(id,v,fmt)=>{
      document.getElementById('r-'+id).value=v;
      document.getElementById('r-'+id+'-v').textContent=fmt(v);
    };
    set('angle',S.angle,v=>v.toFixed(0)+'°');
    set('mh',S.mirrorY,v=>v.toFixed(2)+' m');
    set('px',S.passX,v=>v.toFixed(2)+' m');
    set('ph',S.passH,v=>v.toFixed(2)+' m');
    render();
  });

  $('#btn-lamp').addEventListener('click',()=>{
    S.lamp = S.lamp>0.05 ? 0 : 0.7;
    document.getElementById('r-lamp').value=Math.round(S.lamp*100);
    document.getElementById('r-lamp-v').textContent=Math.round(S.lamp*100)+' %';
    render();
  });

  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      S.tab=parseInt(t.dataset.tab,10);
      document.getElementById('pane'+S.tab).classList.add('active');
      render();
    });
  });
}

function bindDrag(){
  const cv=$('#cv1');
  let dragging=false;
  function toWorld(ev){
    const rect=cv.getBoundingClientRect();
    const V=makeView(cv.clientWidth,cv.clientHeight,T1.world,{l:10,t:10,r:10,b:10});
    return {x:(ev.clientX-rect.left-V.ox)/V.s, y:(V.oy-(ev.clientY-rect.top))/V.s};
  }
  function near(ev){
    const w=toWorld(ev);
    return Math.hypot(w.x-S.passX, w.y-(S.passH-0.18))<0.40;
  }
  cv.addEventListener('pointerdown',e=>{
    if(near(e)){ dragging=true; cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing'; }
  });
  cv.addEventListener('pointermove',e=>{
    if(!dragging){ cv.style.cursor=near(e)?'grab':'default'; return; }
    const w=toWorld(e);
    S.passX=clamp(w.x,-1.18,-0.72);
    S.passH=clamp(w.y+0.18,1.00,1.34);
    document.getElementById('r-px').value=S.passX;
    document.getElementById('r-px-v').textContent=S.passX.toFixed(2)+' m';
    document.getElementById('r-ph').value=S.passH;
    document.getElementById('r-ph-v').textContent=S.passH.toFixed(2)+' m';
    render();
  });
  const stop=()=>{ if(dragging){ dragging=false; cv.style.cursor='grab'; } };
  cv.addEventListener('pointerup',stop);
  cv.addEventListener('pointercancel',stop);
}

bindAll();
bindDrag();

let rzT=0;
window.addEventListener('resize',()=>{
  clearTimeout(rzT);
  rzT=setTimeout(render,60);
});
if(window.ResizeObserver){
  const ro=new ResizeObserver(()=>render());
  ro.observe(document.body);
}

render();
setTimeout(render,80);
setTimeout(render,320);

})();
</script>
</body>
