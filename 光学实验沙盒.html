<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光学实验沙盒 · 3D 光路搭建 - 物理虚拟实验</title>
<style>
:root {
  --bg-darker: #020617;
  --bg-dark: #0f172a;
  --surface: #1e293b;
  --primary: #3b82f6;
  --secondary: #06b6d4;
  --accent: #8b5cf6;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --glass-bg: rgba(255,255,255,0.05);
  --glass-border: rgba(255,255,255,0.1);
  --card-shadow: 0 8px 32px 0 rgba(0,0,0,0.37);
}
* { margin:0; padding:0; box-sizing:border-box }
body {
  background: var(--bg-darker);
  color: var(--text-main);
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
body::before {
  content:""; position:fixed; inset:0;
  background: radial-gradient(circle at 20% 30%, rgba(59,130,246,0.08) 0%, transparent 40%),
              radial-gradient(circle at 80% 70%, rgba(139,92,246,0.08) 0%, transparent 40%);
  z-index:-1;
}
.header {
  background: rgba(15,23,42,0.8);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--glass-border);
  padding:1rem 2rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky; top:0; z-index:100;
}
.logo {
  font-size:1.3rem; font-weight:800;
  background: linear-gradient(135deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.nav a {
  color:var(--text-muted); margin-left:1.5rem;
  text-decoration:none; font-size:0.9rem; font-weight:500;
  transition:color .3s;
}
.nav a:hover { color:var(--primary) }
.wrap { max-width:1200px; margin:0 auto; padding:1.5rem }
.main-card {
  background: var(--bg-dark);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: var(--card-shadow);
}
.experiment-title {
  padding: 1.5rem 2rem 0.75rem;
  border-bottom: 1px solid var(--glass-border);
}
.experiment-title h1 { font-size:1.6rem; font-weight:700 }
.experiment-title p { color:var(--text-muted); font-size:0.9rem; margin-top:0.25rem }
.layout { display:flex; gap:0; flex-wrap:wrap }
.canvas-wrap {
  flex: 1;
  min-width: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.5rem;
  position: relative;
  background: #000;
}
#simCanvas {
  display: block;
  border-radius: 8px;
  cursor: crosshair;
}
.panel {
  width: 300px;
  border-left: 1px solid var(--glass-border);
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  max-height: 580px;
  overflow-y: auto;
}
.ctrl-group {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 0.6rem 0.8rem;
}
.ctrl-group h4 {
  font-size: 0.8rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 0.5rem;
}
.component-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.35rem;
}
.comp-btn {
  background: rgba(59,130,246,0.1);
  border: 1px solid rgba(59,130,246,0.2);
  color: var(--text-main);
  padding: 0.4rem 0.3rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.75rem;
  transition: all 0.2s;
  text-align: center;
}
.comp-btn:hover {
  background: rgba(59,130,246,0.25);
  border-color: var(--primary);
}
.comp-btn.active-type {
  background: rgba(59,130,246,0.35);
  border-color: var(--secondary);
  box-shadow: 0 0 8px rgba(6,182,212,0.3);
}
.comp-btn .icon { font-size: 1.2rem; display: block; margin-bottom: 2px; }
.btn {
  background: rgba(59,130,246,0.15);
  border: 1px solid rgba(59,130,246,0.3);
  color: var(--text-main);
  padding: 0.45rem 0.8rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s;
}
.btn:hover { background: rgba(59,130,246,0.3); }
.btn.danger { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.1); }
.btn.danger:hover { background: rgba(239,68,68,0.3); }
.btn-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.prop-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.25rem 0;
  font-size: 0.8rem;
}
.prop-row span:first-child { color: var(--text-muted); }
.prop-row span:last-child { color: var(--secondary); font-weight: 600; }
select, input[type=range] {
  width: 100%;
  background: transparent;
  color: var(--text-main);
  border: 1px solid var(--glass-border);
  border-radius: 6px;
  padding: 0.3rem 0.5rem;
  font-size: 0.8rem;
  outline: none;
}
select option { background: var(--bg-dark); color: var(--text-main) }
input[type=range] {
  -webkit-appearance: none; appearance: none;
  border: none; padding: 0; height: 3px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 6px rgba(59,130,246,0.5);
  cursor: pointer;
}
.info-row {
  display: flex; justify-content: space-between;
  font-size: 0.75rem; color: var(--text-muted);
}
.info-row span:last-child { color: var(--secondary); font-weight: 600; }
.empty-hint {
  text-align: center;
  color: var(--text-muted);
  font-size: 0.8rem;
  padding: 1rem 0;
}
@media (max-width: 860px) {
  .layout { flex-direction: column; }
  .panel { width: 100%; border-left: none; border-top: 1px solid var(--glass-border); max-height: none; }
  .canvas-wrap { min-width: auto; }
}
</style>
  <script src="auth-check.js"></script>
</head>
<body>
<div class="header">
  <div class="logo">物理虚拟实验</div>
  <nav class="nav">
    <a href="index.html">首页</a>
    <a href="experiments.html">实验列表</a>
    <a href="vip.html">开通VIP</a>
  </nav>
</div>

<div class="wrap">
  <div class="main-card">
    <div class="experiment-title">
      <h1>光学实验沙盒</h1>
      <p>交互式光学模拟 — 拖拽元件，观察光的折射、反射与全反射现象</p>
    </div>
    <div class="layout">
      <div class="canvas-wrap">
        <canvas id="simCanvas"></canvas>
      </div>
      <div class="panel" id="panel">
        <div class="ctrl-group">
          <h4>元件面板 <span style="font-weight:400;font-size:0.7rem;color:var(--text-muted);">（点击添加，拖拽移动）</span></h4>
          <div class="component-grid" id="compGrid">
            <button class="comp-btn" data-type="laser_single"><span class="icon">🔴</span>单束激光</button>
            <button class="comp-btn" data-type="laser_triple"><span class="icon">🔴🔴🔴</span>三束激光</button>
            <button class="comp-btn" data-type="convex_lens"><span class="icon">🔍</span>凸透镜</button>
            <button class="comp-btn" data-type="concave_lens"><span class="icon">🔎</span>凹透镜</button>
            <button class="comp-btn" data-type="flat_mirror"><span class="icon">🪞</span>平面镜</button>
            <button class="comp-btn" data-type="concave_mirror"><span class="icon">🥄</span>凹面镜</button>
            <button class="comp-btn" data-type="convex_mirror"><span class="icon">🔄</span>凸面镜</button>
            <button class="comp-btn" data-type="glass_block"><span class="icon">🧱</span>玻璃块</button>
            <button class="comp-btn" data-type="prism"><span class="icon">🔺</span>三棱镜</button>
          </div>
        </div>

        <div class="ctrl-group" id="propGroup">
          <h4>选中元件属性</h4>
          <div id="propContent" class="empty-hint">点击画布上的元件以查看属性</div>
        </div>

        <div class="ctrl-group">
          <h4>全局控制</h4>
          <div class="btn-row">
            <button class="btn danger" onclick="clearAll()">🗑 清空全部</button>
            <button class="btn" onclick="toggleNormals()" id="btnNormals">📐 显示法线</button>
          </div>
          <div style="margin-top:0.5rem;">
            <label style="font-size:0.75rem;color:var(--text-muted);">玻璃折射率: <span id="nVal">1.50</span></label>
            <input type="range" min="1.0" max="2.5" step="0.01" value="1.50" oninput="setGlobalN(this.value)" id="nSlider">
          </div>
        </div>

        <div class="ctrl-group">
          <h4>观察视角</h4>
          <div class="btn-row">
            <button class="btn view-btn active-view" data-view="front">正视</button>
            <button class="btn view-btn" data-view="angle">斜视</button>
            <button class="btn view-btn" data-view="top">俯视</button>
          </div>
          <div class="info-row" style="margin-top:0.5rem"><span>转动相机</span><span>拖空白处</span></div>
          <div class="info-row"><span>缩放</span><span>滚轮</span></div>
        </div>

        <div class="ctrl-group">
          <h4>操作提示</h4>
          <div class="info-row"><span>添加元件</span><span>点击左侧按钮</span></div>
          <div class="info-row"><span>移动元件</span><span>拖拽元件</span></div>
          <div class="info-row"><span>旋转元件</span><span>右侧角度滑块</span></div>
          <div class="info-row"><span>删除元件</span><span>双击 / 🗑 按钮 / Delete 键</span></div>
          <div class="info-row"><span>选中元件</span><span>单击元件</span></div>
          <div class="info-row"><span>取消选中</span><span>Esc / 点空白处</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="experiment_光学沙盒3D.js"></script>
</body>
</html>
