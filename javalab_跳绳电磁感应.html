<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跳绳切割磁感线 - 电磁感应虚拟实验</title>
  <script src="protect.js"></script>
  <script src="auth-check.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.06);
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-body: #475569;
      --btn-border: #cbd5e1;
      --btn-hover: #f1f5f9;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #16a34a;
      --warning: #d97706;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }
    .main-container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      padding: 18px;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .title-area h1 { font-size: 1.4rem; color: var(--text-primary); font-weight: 700; }
    .title-area .subtitle { font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      font-family: inherit; font-size: 0.9rem; padding: 8px 16px;
      border-radius: 8px; border: 1px solid var(--btn-border);
      background: var(--card-bg); color: var(--text-body);
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    button:hover { background: var(--btn-hover); }
    button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.active:hover { background: var(--primary-hover); }
    .canvas-wrap {
      position: relative; width: 100%; aspect-ratio: 16 / 10;
      max-height: 580px; border-radius: 10px; overflow: hidden;
      background: #fff; border: 1px solid var(--card-border);
    }
    canvas { display: block; width: 100%; height: 100%; }
    .info-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }
    .info-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 14px 16px; box-shadow: var(--card-shadow);
    }
    .info-card .label { font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 4px; }
    .info-card .value { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); }
    .info-card .value.on { color: var(--success); }
    .info-card .value.off { color: var(--text-secondary); }
    .formula-box {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px;
      padding: 12px 16px; font-size: 0.85rem; color: var(--text-body); line-height: 1.8;
    }
    .formula-box strong { color: var(--primary); }
    .status-on { color: #16a34a; font-weight: 700; }
    .status-off { color: #94a3b8; }
  </style>
</head>
<body>
<div class="main-container">
  <div class="main-card">
    <div class="header-row">
      <div class="title-area">
        <h1>跳绳切割磁感线 — 电磁感应</h1>
        <p class="subtitle">九年级物理 · 电磁感应现象 · 地磁场</p>
      </div>
      <div class="btn-row">
        <button id="btnEW" class="active" onclick="setDirection('EW')">东西方向跳绳</button>
        <button id="btnNS" onclick="setDirection('NS')">南北方向跳绳</button>
        <button onclick="toggleFullscreen()" title="全屏">⛶ 全屏</button>
      </div>
    </div>
  </div>

  <div class="main-card" style="padding:8px;">
    <div class="canvas-wrap">
      <canvas id="simCanvas"></canvas>
    </div>
  </div>

  <div class="info-cards">
    <div class="info-card">
      <div class="label">灵敏电流计读数</div>
      <div class="value on" id="valCurrent">0.00 μA</div>
    </div>
    <div class="info-card">
      <div class="label">绳平面方向</div>
      <div class="value on" id="valDir">东西方向 → 切割磁感线 ✓</div>
    </div>
    <div class="info-card">
      <div class="label">导体运动 vs 磁场</div>
      <div class="value on" id="valRelation">垂直切割 ⟂</div>
    </div>
  </div>

  <div class="formula-box">
    <strong id="statusText">东西方向跳绳：导线绳东西方向运动，垂直切割地磁场磁感线（南→北），产生感应电流。</strong><br>
    原理：E = BLv （导体垂直切割磁感线产生电动势）｜ 地磁场水平分量 ≈ 0.05 mT
  </div>
</div>

<script>
(function() {
  // ============ Access Protection ============
  (function() {
    var ref = document.referrer;
    var host = window.location.hostname;
    var allowed = ['xiaobinlaoshi.cn', 'localhost', '127.0.0.1', 'gelindise.github.io', 'xiaobin-physics.github.io'];
    var ok = !ref || host === 'localhost' || host === '127.0.0.1';
    if (!ok) for (var i = 0; i < allowed.length; i++) {
      if (ref.indexOf(allowed[i]) !== -1 || host.indexOf(allowed[i]) !== -1) { ok = true; break; }
    }
    if (!ok && !localStorage.getItem('physics_lab_token')) {
      document.body.innerHTML = '<div style="text-align:center;padding:80px;color:#64748b;font-size:1.1rem;">请从平台首页进入实验</div>';
      return;
    }
  })();

  // ============ Canvas Setup ============
  var canvas = document.getElementById('simCanvas');
  var ctx = canvas.getContext('2d');
  var W, H;
  function resize() {
    var rect = canvas.parentElement.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    W = rect.width; H = rect.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr, dpr);
  }
  resize();
  window.addEventListener('resize', resize);

  // ============ State ============
  var direction = 'EW';
  var ropeAngle = 0;
  var angularSpeed = 0.035;
  var maxCurrent = 50;
  var currentValue = 0;
  var smoothedCurrent = 0;
  var time = 0;

  // ============ Controls ============
  window.setDirection = function(dir) {
    direction = dir;
    document.getElementById('btnEW').className = dir === 'EW' ? 'active' : '';
    document.getElementById('btnNS').className = dir === 'NS' ? 'active' : '';
    document.getElementById('valDir').textContent =
      dir === 'EW' ? '东西方向 → 切割磁感线 ✓' : '南北方向 → 不切割磁感线 ✗';
    document.getElementById('valDir').className = dir === 'EW' ? 'value on' : 'value off';
    document.getElementById('valRelation').textContent =
      dir === 'EW' ? '垂直切割 ⟂' : '平行运动 ∥';
    document.getElementById('valRelation').className = dir === 'EW' ? 'value on' : 'value off';
    document.getElementById('statusText').innerHTML =
      dir === 'EW'
        ? '<span class="status-on">东西方向跳绳：</span>导线绳东西方向运动，<span class="status-on">垂直切割</span>地磁场磁感线（南→北），产生感应电流。'
        : '<span class="status-off">南北方向跳绳：</span>导线绳南北方向运动，<span class="status-off">平行于</span>地磁场磁感线方向，不产生感应电流。';
    // Reset particles
    sparkParticles = [];
    electrons = [];
  };

  window.toggleFullscreen = function() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){});
    else document.exitFullscreen();
  };

  // ============ Drawing ============
  function drawArrow(x, y, dx, dy, color, size) {
    var len = Math.sqrt(dx*dx+dy*dy);
    if (len < 0.01) return;
    var ux = dx/len, uy = dy/len;
    var tipX = x+dx, tipY = y+dy;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(tipX,tipY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tipX,tipY);
    ctx.lineTo(tipX-ux*size+uy*size*0.5, tipY-uy*size-ux*size*0.5);
    ctx.lineTo(tipX-ux*size-uy*size*0.5, tipY-uy*size+ux*size*0.5);
    ctx.closePath(); ctx.fill();
  }

  function drawPerson(cx, cy) {
    var headY = cy - 88, bodyTop = cy - 58, bodyBot = cy + 65;
    var armY = cy - 42, handSpread = 80;
    var footY = bodyBot + 52;

    // Legs (with slight jumping pose)
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, bodyBot); ctx.lineTo(cx-24, footY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, bodyBot); ctx.lineTo(cx+24, footY); ctx.stroke();

    // Shoes
    ctx.fillStyle = '#475569';
    ctx.fillRect(cx-32, footY-4, 16, 10); ctx.fillRect(cx+16, footY-4, 16, 10);

    // Body (jersey)
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx, bodyTop); ctx.lineTo(cx, bodyBot); ctx.stroke();

    // Shirt fill
    ctx.fillStyle = '#dbeafe';
    ctx.fillRect(cx-18, bodyTop, 36, bodyBot-bodyTop+10);

    // Arms holding rope handles
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 3;
    // Left arm
    ctx.beginPath(); ctx.moveTo(cx-handSpread, armY); ctx.lineTo(cx-20, bodyTop+14); ctx.stroke();
    // Right arm
    ctx.beginPath(); ctx.moveTo(cx+handSpread, armY); ctx.lineTo(cx+20, bodyTop+14); ctx.stroke();

    // Hands (gripping rope handles)
    ctx.fillStyle = '#fef3c7';
    ctx.beginPath(); ctx.arc(cx-handSpread, armY, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+handSpread, armY, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();

    // Head
    ctx.fillStyle = '#fef3c7'; ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, headY, 22, 0, Math.PI*2); ctx.fill(); ctx.stroke();

    // Hair
    ctx.fillStyle = '#1e293b';
    ctx.beginPath(); ctx.arc(cx, headY-5, 23, Math.PI, 2*Math.PI); ctx.fill();

    // Eyes
    ctx.fillStyle = '#1e293b';
    ctx.beginPath(); ctx.arc(cx-7, headY-4, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+7, headY-4, 3, 0, Math.PI*2); ctx.fill();

    // Smile
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(cx, headY+7, 7, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();

    return { lhx: cx-handSpread, lhy: armY, rhx: cx+handSpread, rhy: armY, cx: cx, cy: armY };
  }

  function drawRope(lhx, lhy, rhx, rhy, angle, mode) {
    var midX = (lhx+rhx)/2, midY = (lhy+rhy)/2;
    var R = 175; // rope radius
    var cosA = Math.cos(angle), sinA = Math.sin(angle);

    // Control point for the arc
    var cpx, cpy;
    var glowAlpha = 0;

    if (mode === 'EW') {
      // Full visible circular motion in screen plane
      cpx = midX + R * sinA * 0.35; // slight horizontal sway
      cpy = midY - R * cosA;
      glowAlpha = Math.abs(cosA); // strongest at top/bottom
    } else {
      // NS mode: edge-on, narrow apparent motion
      cpx = midX + R * sinA * 0.08; // very narrow horizontal
      cpy = midY - R * cosA * 0.7;
    }

    // Outer glow when cutting field lines
    if (mode === 'EW' && glowAlpha > 0.2) {
      ctx.save();
      ctx.globalAlpha = glowAlpha * 0.6;
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 8;
      ctx.shadowColor = '#f59e0b';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.moveTo(lhx, lhy);
      ctx.quadraticCurveTo(cpx, cpy, rhx, rhy);
      ctx.stroke();
      ctx.restore();
    }

    // Main rope
    var ropeColor = mode === 'EW' ? '#d97706' : '#94a3b8';
    var ropeWidth = mode === 'EW' ? 3.5 : 2.5;
    ctx.strokeStyle = ropeColor;
    ctx.lineWidth = ropeWidth;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(lhx, lhy);
    ctx.quadraticCurveTo(cpx, cpy, rhx, rhy);
    ctx.stroke();

    // Rope handles (small grips at hands)
    ctx.fillStyle = '#64748b';
    ctx.fillRect(lhx-4, lhy-8, 8, 16); ctx.fillRect(rhx-4, rhy-8, 8, 16);

    return { cpx: cpx, cpy: cpy, glowAlpha: glowAlpha };
  }

  function drawFieldLines(cx, cy, groundY) {
    var fieldTop = 30, fieldBottom = groundY;

    // Colored field zone background
    var grad = ctx.createLinearGradient(0, fieldTop, 0, fieldBottom);
    grad.addColorStop(0, 'rgba(219, 234, 254, 0.25)');
    grad.addColorStop(1, 'rgba(219, 234, 254, 0.05)');
    ctx.fillStyle = grad;
    ctx.fillRect(cx-230, fieldTop, 260, fieldBottom-fieldTop);

    // Field lines (vertical = S→N direction on screen)
    for (var i = 0; i < 8; i++) {
      var lx = cx - 200 + i * 57;
      ctx.strokeStyle = 'rgba(37, 99, 235, 0.22)';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([7, 12]);
      ctx.beginPath();
      ctx.moveTo(lx, fieldTop);
      ctx.lineTo(lx, fieldBottom);
      ctx.stroke();
      ctx.setLineDash([]);

      // Arrow heads
      for (var ay = fieldTop + 40; ay < fieldBottom - 10; ay += 70) {
        drawArrow(lx, ay, 0, -14, 'rgba(37, 99, 235, 0.3)', 3.5);
      }
    }

    // Big N label
    ctx.fillStyle = '#dc2626'; ctx.font = 'bold 22px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('N', cx-170, fieldTop+22);
    ctx.fillText('北', cx-170, fieldTop+42);

    // Big S label
    ctx.fillStyle = '#2563eb';
    ctx.fillText('S', cx-170, fieldBottom-12);
    ctx.fillText('南', cx-170, fieldBottom-32);

    // Side field representation - large faint N at top of scene
    ctx.fillStyle = 'rgba(220, 38, 38, 0.08)';
    ctx.font = 'bold 72px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('N', cx-40, groundY - 10);

    ctx.fillStyle = 'rgba(37, 99, 235, 0.08)';
    ctx.textAlign = 'left';
    ctx.fillText('S', cx+40, groundY - 10);

    // B-field label
    ctx.fillStyle = '#64748b'; ctx.font = '11px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('地磁场 B', 14, 22);
    drawArrow(14, 30, 28, 0, '#64748b', 4);
    ctx.fillText('S → N', 14, 42);
  }

  function drawGalvanometer(gx, gy, current) {
    var R = 70;

    // Housing shadow
    ctx.fillStyle = 'rgba(0,0,0,0.04)';
    ctx.beginPath();
    ctx.arc(gx+2, gy+2, R+4, 0, Math.PI*2);
    ctx.fill();

    // Housing
    var gradH = ctx.createLinearGradient(gx-R, gy-R, gx+R, gy+R);
    gradH.addColorStop(0, '#ffffff'); gradH.addColorStop(1, '#f1f5f9');
    ctx.fillStyle = gradH;
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(gx, gy, R+4, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();

    // Inner face
    var gradF = ctx.createRadialGradient(gx, gy-4, R*0.2, gx, gy, R-2);
    gradF.addColorStop(0, '#ffffff'); gradF.addColorStop(1, '#f8fafc');
    ctx.fillStyle = gradF;
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(gx, gy, R-4, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();

    // Scale arc
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(gx, gy, R-12, -0.82*Math.PI, 0.82*Math.PI);
    ctx.stroke();

    // Tick marks
    for (var i = -10; i <= 10; i++) {
      var a = (i/10) * 0.78 * Math.PI;
      var isMajor = i % 5 === 0;
      var innerR = isMajor ? R-26 : R-20;
      var outerR = R-16;
      var x1 = gx + innerR*Math.sin(a), y1 = gy - innerR*Math.cos(a);
      var x2 = gx + outerR*Math.sin(a), y2 = gy - outerR*Math.cos(a);
      ctx.strokeStyle = isMajor ? '#475569' : '#cbd5e1';
      ctx.lineWidth = isMajor ? 1.5 : 0.6;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();

      // Labels
      if (isMajor) {
        var lR = R-38;
        ctx.fillStyle = '#475569'; ctx.font = '9px -apple-system, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(i*5), gx+lR*Math.sin(a), gy-lR*Math.cos(a));
      }
    }

    // Zero mark
    ctx.fillStyle = '#64748b'; ctx.font = 'bold 10px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('0', gx, gy+R-30);

    // Unit
    ctx.fillStyle = '#64748b'; ctx.font = '11px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('μA', gx, gy+R-14);

    // Needle counterweight (short tail)
    var needleAngle = (current / maxCurrent) * 0.75 * Math.PI;
    needleAngle = Math.max(-0.75*Math.PI, Math.min(0.75*Math.PI, needleAngle));
    var nLen = R-22;
    var nx = gx + nLen*Math.sin(needleAngle), ny = gy - nLen*Math.cos(needleAngle);
    var tailX = gx - nLen*0.22*Math.sin(needleAngle), tailY = gy + nLen*0.22*Math.cos(needleAngle);

    // Needle shadow
    ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(gx+1, gy+1); ctx.lineTo(nx+1, ny+1); ctx.stroke();

    // Needle tail (counterweight)
    ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(tailX, tailY); ctx.stroke();

    // Needle body
    var gradN = ctx.createLinearGradient(gx, gy, nx, ny);
    gradN.addColorStop(0, '#dc2626'); gradN.addColorStop(1, '#ef4444');
    ctx.strokeStyle = gradN;
    ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(nx, ny); ctx.stroke();

    // Needle tip
    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.moveTo(nx, ny);
    ctx.lineTo(nx-3*Math.sin(needleAngle+1.2), ny+3*Math.cos(needleAngle+1.2));
    ctx.lineTo(nx-3*Math.sin(needleAngle-1.2), ny+3*Math.cos(needleAngle-1.2));
    ctx.closePath(); ctx.fill();

    // Pivot
    var radGrad = ctx.createRadialGradient(gx-1, gy-1, 1, gx, gy, 5);
    radGrad.addColorStop(0, '#ffffff'); radGrad.addColorStop(1, '#1e293b');
    ctx.fillStyle = radGrad;
    ctx.beginPath(); ctx.arc(gx, gy, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(gx, gy, 2, 0, Math.PI*2); ctx.fill();

    // Indicator LED
    var absCur = Math.abs(current);
    var ledColor = absCur < 1 ? '#cbd5e1' : absCur < 20 ? '#fbbf24' : '#ef4444';
    var ledGlow = absCur > 1 ? 10 + absCur*0.4 : 0;
    ctx.fillStyle = ledColor;
    ctx.shadowColor = ledColor;
    ctx.shadowBlur = ledGlow;
    ctx.beginPath();
    ctx.arc(gx+R+2, gy-R+10, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(gx+R+2, gy-R+10, 7, 0, Math.PI*2);
    ctx.stroke();

    // Label
    ctx.fillStyle = '#475569'; ctx.font = 'bold 12px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('灵敏电流计', gx, gy-R-14);
  }

  // Mini top-down diagram
  function drawTopDownDiagram(tx, ty) {
    var size = 90;
    // Background (manual rounded rect for compat)
    var r = 8;
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(tx+r, ty); ctx.lineTo(tx+size-r, ty);
    ctx.quadraticCurveTo(tx+size, ty, tx+size, ty+r);
    ctx.lineTo(tx+size, ty+size-r);
    ctx.quadraticCurveTo(tx+size, ty+size, tx+size-r, ty+size);
    ctx.lineTo(tx+r, ty+size);
    ctx.quadraticCurveTo(tx, ty+size, tx, ty+size-r);
    ctx.lineTo(tx, ty+r);
    ctx.quadraticCurveTo(tx, ty, tx+r, ty);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    var midX = tx+size/2, midY = ty+size/2;

    // Label
    ctx.fillStyle = '#64748b'; ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('俯视示意', midX, ty-6);

    // Field lines (vertical, S→N)
    ctx.strokeStyle = 'rgba(37, 99, 235, 0.3)'; ctx.lineWidth = 1;
    for (var i = -2; i <= 2; i++) {
      var lx = midX + i*14;
      ctx.beginPath(); ctx.moveTo(lx, ty+8); ctx.lineTo(lx, ty+size-8); ctx.stroke();
      if (i === 0) {
        drawArrow(lx, ty+20, 0, -14, 'rgba(37, 99, 235, 0.5)', 3);
        drawArrow(lx, ty+size-20, 0, -14, 'rgba(37, 99, 235, 0.5)', 3);
      }
    }

    // N, S labels
    ctx.fillStyle = '#dc2626'; ctx.font = 'bold 10px -apple-system, sans-serif';
    ctx.fillText('N', midX, ty+16);
    ctx.fillStyle = '#2563eb';
    ctx.fillText('S', midX, ty+size-4);

    // E, W labels
    ctx.fillStyle = '#94a3b8'; ctx.font = '9px -apple-system, sans-serif';
    ctx.fillText('W', tx+10, midY+3);
    ctx.fillText('E', tx+size-8, midY+3);

    // Person (dot)
    ctx.fillStyle = '#475569';
    ctx.beginPath(); ctx.arc(midX, midY, 4, 0, Math.PI*2); ctx.fill();

    // Rope plane line
    var lineHalf = 30;
    if (direction === 'EW') {
      // Horizontal line (perpendicular to field) = CUTTING
      ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(245, 158, 11, 0.5)'; ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(midX-lineHalf, midY); ctx.lineTo(midX+lineHalf, midY);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Motion arrows
      drawArrow(midX-lineHalf+6, midY, 20, 0, '#f59e0b', 4);
      drawArrow(midX+lineHalf-6, midY, -20, 0, '#f59e0b', 4);

      // Label
      ctx.fillStyle = '#d97706'; ctx.font = 'bold 10px -apple-system, sans-serif';
      ctx.fillText('切割!', midX, midY-10);
    } else {
      // Vertical line (parallel to field) = NOT CUTTING
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.setLineDash([5, 3]);
      ctx.beginPath();
      ctx.moveTo(midX, midY-lineHalf); ctx.lineTo(midX, midY+lineHalf);
      ctx.stroke();
      ctx.setLineDash([]);

      drawArrow(midX, midY-lineHalf+6, 0, 20, '#94a3b8', 3);
      drawArrow(midX, midY+lineHalf-6, 0, -20, '#94a3b8', 3);

      ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 10px -apple-system, sans-serif';
      ctx.fillText('不切割', midX, midY-10);
    }
  }

  // Electron flow particles along the rope
  var electrons = [];
  function spawnElectrons(lhx, lhy, rhx, rhy, cpx, cpy, glowAlpha, dt) {
    if (glowAlpha < 0.15) return;
    // Spawn electrons periodically
    if (Math.random() > 0.4) return;
    // Parametric position along the quadratic bezier: B(t) = (1-t)²P0 + 2(1-t)tP1 + t²P2
    var t = Math.random();
    var mt = 1-t;
    var ex = mt*mt*lhx + 2*mt*t*cpx + t*t*rhx;
    var ey = mt*mt*lhy + 2*mt*t*cpy + t*t*rhy;
    // Direction: if current positive, flow left-to-right; negative, right-to-left
    var flowDir = (currentValue > 0) ? 1 : -1;
    electrons.push({
      x: ex, y: ey,
      t: t,
      dir: flowDir,
      life: 0.6 + Math.random()*0.8
    });
    while (electrons.length > 20) electrons.shift();
  }
  function updateElectrons(lhx, lhy, rhx, rhy, cpx, cpy) {
    for (var i = electrons.length-1; i >= 0; i--) {
      var e = electrons[i];
      e.t += e.dir * 0.018;
      if (e.t > 1 || e.t < 0) { electrons.splice(i,1); continue; }
      var mt = 1-e.t;
      e.x = mt*mt*lhx + 2*mt*e.t*cpx + e.t*e.t*rhx;
      e.y = mt*mt*lhy + 2*mt*e.t*cpy + e.t*e.t*rhy;
      e.life -= 0.02;
      if (e.life <= 0) electrons.splice(i,1);
    }
  }
  function drawElectrons() {
    for (var i = 0; i < electrons.length; i++) {
      var e = electrons[i];
      ctx.fillStyle = e.dir > 0 ? '#fbbf24' : '#f59e0b';
      ctx.shadowColor = '#fef08a';
      ctx.shadowBlur = 5;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 2.5, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  // Spark particles
  var sparkParticles = [];
  function spawnSpark(x, y, intensity) {
    if (intensity < 0.3) return;
    var count = Math.floor(intensity * 4);
    for (var i = 0; i < count; i++) {
      var a = Math.random()*Math.PI*2;
      var d = 5 + Math.random()*20;
      sparkParticles.push({
        x: x + (Math.random()-0.5)*40,
        y: y + (Math.random()-0.5)*20,
        vx: Math.cos(a)*d*0.3,
        vy: Math.sin(a)*d*0.3,
        life: 1,
        size: 0.8 + Math.random()*1.5
      });
    }
    // Limit particles
    while (sparkParticles.length > 80) sparkParticles.shift();
  }

  function drawSparks() {
    for (var i = 0; i < sparkParticles.length; i++) {
      var p = sparkParticles[i];
      if (p.life <= 0) continue;
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.life > 0.5 ? '#fbbf24' : '#f59e0b';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
      // Glow
      ctx.fillStyle = 'rgba(254, 240, 138, 0.6)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size*1.8, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function updateSparks() {
    for (var i = sparkParticles.length-1; i >= 0; i--) {
      sparkParticles[i].x += sparkParticles[i].vx;
      sparkParticles[i].y += sparkParticles[i].vy;
      sparkParticles[i].life -= 0.035;
      if (sparkParticles[i].life <= 0) sparkParticles.splice(i, 1);
    }
  }

  // ============ Main Render ============
  function draw() {
    resize();
    ctx.clearRect(0, 0, W, H);

    var cx = W * 0.45;
    var cy = H * 0.42;
    var groundY = cy + 120;

    // Sky gradient
    var sky = ctx.createLinearGradient(0, 0, 0, groundY);
    sky.addColorStop(0, '#f0f9ff'); sky.addColorStop(0.5, '#f8fafc'); sky.addColorStop(1, '#f1f5f9');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, groundY);

    // Ground
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(0, groundY, W, H-groundY);

    // Ground surface line
    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();

    // Field lines
    drawFieldLines(cx, cy, groundY);

    // Big field direction arrow (on the left) - with subtle pulse
    var pulseAlpha = 0.5 + 0.2 * Math.sin(time * 0.04);
    drawArrow(cx - 220, groundY - 20, 0, -(groundY-70),
      'rgba(37, 99, 235, ' + pulseAlpha + ')', 7);

    // Person
    var hands = drawPerson(cx, cy);

    // Rope
    var ropeInfo = drawRope(hands.lhx, hands.lhy, hands.rhx, hands.rhy, ropeAngle, direction);

    // Spawn sparks at rope position (EW mode only)
    if (direction === 'EW' && ropeInfo.glowAlpha > 0.3) {
      spawnSpark(ropeInfo.cpx, ropeInfo.cpy, ropeInfo.glowAlpha);
    }

    // Spawn electrons along rope
    if (direction === 'EW') {
      spawnElectrons(hands.lhx, hands.lhy, hands.rhx, hands.rhy, ropeInfo.cpx, ropeInfo.cpy, ropeInfo.glowAlpha, 0.016);
    }

    // Update electron positions
    updateElectrons(hands.lhx, hands.lhy, hands.rhx, hands.rhy, ropeInfo.cpx, ropeInfo.cpy);

    // Draw electrons on rope
    drawElectrons();

    // Draw spark particles
    drawSparks();

    // Galvanometer
    var galvX = W * 0.81, galvY = cy - 25;
    drawGalvanometer(galvX, galvY, smoothedCurrent);

    // Top-down mini diagram
    drawTopDownDiagram(W - 120, 18);

    // Ground info text
    ctx.fillStyle = direction === 'EW' ? '#d97706' : '#94a3b8';
    ctx.font = 'bold 13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    var infoText = direction === 'EW'
      ? '绳平面：← 东西方向 → （垂直切割 N-S 磁感线 ✓）'
      : '绳平面：↕ 南北方向 （平行于 N-S 磁感线，不切割 ✗）';
    ctx.fillText(infoText, cx, groundY + 40);

    // Direction arrows on ground
    if (direction === 'EW') {
      drawArrow(cx-70, groundY+56, 140, 0, '#d97706', 6);
      drawArrow(cx+70, groundY+56, -140, 0, '#d97706', 6);
    } else {
      drawArrow(cx, groundY+36, 0, 40, '#94a3b8', 5);
      drawArrow(cx, groundY+76, 0, -40, '#94a3b8', 5);
    }

    // Compass directions on ground
    ctx.fillStyle = '#dc2626'; ctx.font = 'bold 13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('N (北) ↑', cx, groundY - 104);

    ctx.fillStyle = '#2563eb';
    ctx.fillText('↓ S (南)', cx, groundY + 95);
  }

  // ============ Animation ============
  function update() {
    time += 1;
    ropeAngle += angularSpeed;
    if (ropeAngle > Math.PI*2) ropeAngle -= Math.PI*2;

    // Physics: current = Imax * cos(angle) for EW mode
    if (direction === 'EW') {
      currentValue = maxCurrent * Math.cos(ropeAngle);
    } else {
      currentValue = 0;
    }

    smoothedCurrent += (currentValue - smoothedCurrent) * 0.22;
    updateSparks();
    // Note: electrons are updated in draw() since they need rope position info

    // Update UI
    var absCur = Math.abs(smoothedCurrent);
    var curEl = document.getElementById('valCurrent');
    if (direction === 'NS') {
      curEl.textContent = '0.00 μA'; curEl.className = 'value off';
    } else {
      curEl.textContent = absCur.toFixed(2) + ' μA';
      curEl.className = absCur > 0.5 ? 'value on' : 'value off';
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  resize();
  loop();
})();
</script>
</body>
</html>
