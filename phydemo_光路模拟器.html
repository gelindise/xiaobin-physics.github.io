<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物理虚拟实验 - 光路模拟器</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
      background: #000;
    }
    .header {
      padding: 0.4rem 1rem;
      position: fixed !important;
      top: 0;
      left: 0;
      right: 0;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .header.hidden {
      transform: translateY(-100%);
    }
    .logo {
      font-size: 1rem;
    }
    .nav a {
      font-size: 0.8rem;
      padding: 0.3rem 0.6rem;
    }
    .sim-container {
      position: fixed;
      top: 34px;
      left: 0;
      right: 0;
      bottom: 0;
      transition: top 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sim-container.expanded {
      top: 0;
    }
    .sim-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    @media (max-width: 768px) {
      .sim-container { top: 32px; }
    }
    /* 外部模拟器主脚本约 4 MB，国内网络首次加载可能要等较久；
       未加载完时给提示和兜底入口，避免出现「一片黑 + 一行欢迎语」被当成坏页。 */
    #loading {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      background: #0b1220;
      color: #e8eef8;
      font-size: 15px;
      text-align: center;
      transition: opacity 0.4s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .spinner {
      width: 34px; height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .hint { font-size: 12.5px; color: #93a4bd; line-height: 1.8; max-width: 480px; }
    #loading .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    #loading a, #loading button {
      font: inherit; font-size: 13px;
      color: #dbeafe; text-decoration: none;
      border: 1px solid rgba(96, 165, 250, 0.5);
      background: rgba(96, 165, 250, 0.12);
      padding: 7px 14px; border-radius: 8px; cursor: pointer;
    }
  </style>
  <script src="protect.js"></script>
  <script src="auth-check.js"></script>
</head>
<body>
  <header class="header">
    <div class="logo">物理虚拟实验平台</div>
    <nav class="nav">
      <a href="experiments.html">实验目录</a>
      <a href="index.html">首页</a>
      <a href="vip.html">开通VIP</a>
    </nav>
  </header>
  <div class="sim-container">
    <iframe id="simFrame" src="https://phydemo.app/ray-optics/simulator/?zh-CN"
      allowfullscreen
      allow="fullscreen; accelerometer; autoplay; camera; encrypted-media; gyroscope; microphone; geolocation; xr-spatial-tracking">
    </iframe>
    <div id="loading">
      <div class="spinner"></div>
      <div>正在加载在线光路模拟器…</div>
      <div class="hint" id="loadHint">首次打开需下载约 4 MB 的模拟程序，请保持联网并稍候。<br>加载完成后即可自由摆放光源、镜面与透镜。</div>
      <div class="actions">
        <a href="https://phydemo.app/ray-optics/simulator/?zh-CN" target="_blank" rel="noopener">在新窗口打开</a>
        <button type="button" id="retryBtn">重新加载</button>
      </div>
    </div>
  </div>
  <script src="supabase.js"></script>
  <script src="script.js"></script>
  <script>
    (function() {
      var header = document.querySelector('.header');
      var container = document.querySelector('.sim-container');
      var hideTimer = null;
      var HIDE_DELAY = 800;

      function showHeader() {
        clearTimeout(hideTimer);
        header.classList.remove('hidden');
        container.classList.remove('expanded');
      }

      function hideHeader() {
        hideTimer = setTimeout(function() {
          header.classList.add('hidden');
          container.classList.add('expanded');
        }, HIDE_DELAY);
      }

      document.addEventListener('mousemove', function(e) {
        if (e.clientY <= 60) {
          showHeader();
        } else if (e.clientY > header.offsetHeight + 20 && !header.classList.contains('hidden')) {
          hideHeader();
        }
      });

      header.addEventListener('mouseenter', showHeader);
      header.addEventListener('mouseleave', hideHeader);

      hideTimer = setTimeout(function() {
        header.classList.add('hidden');
        container.classList.add('expanded');
      }, 2000);
    })();

    // 加载遮罩：iframe 的 load 在主脚本（defer）执行完后触发，届时淡出。
    // 12 秒还没好就补充说明；「重新加载」用带时间戳的新 URL 强制重新请求。
    (function() {
      var frame = document.getElementById('simFrame');
      var loading = document.getElementById('loading');
      var hint = document.getElementById('loadHint');
      var BASE = 'https://phydemo.app/ray-optics/simulator/?zh-CN';
      var slowTip = setTimeout(function() {
        hint.innerHTML = '加载比预期慢（首次需下载约 4 MB，取决于网络）。<br>若长时间无响应，可点下方「在新窗口打开」或「重新加载」。';
      }, 12000);
      frame.addEventListener('load', function() {
        clearTimeout(slowTip);
        loading.classList.add('done');
      });
      document.getElementById('retryBtn').addEventListener('click', function() {
        loading.classList.remove('done');
        hint.innerHTML = '正在重新加载…';
        frame.src = BASE + '&retry=' + Date.now();
      });
    })();
  </script>
</body>
</html>
