    <style>

        #visual-area {

            overflow: hidden;
        }
        canvas {
            display: block;
        }

        /* --- 控制面板 --- */
        #control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .control-group {
            background-color: rgba(255, 255, 255, 0.1);

            border-radius: 10px;
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .control-value {
            font-size: 1.2em;
            color: #ffd700;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffd700;
            cursor: pointer;
            transition: background 0.3s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #fff;
        }

        select {
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: rgba(255, 255, 255, 0.8);
            color: #333;

            cursor: pointer;
        }

        /* --- 播放按钮 --- */
        #play-button {
            display: block;
            margin: 0 auto;
            padding: 15px 40px;

            font-weight: bold;
            color: #764ba2;
            background-color: #ffd700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px 0 rgba(255, 215, 0, 0.4);
        }

        #play-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 rgba(255, 215, 0, 0.6);
        }

        #play-button:active {
            transform: translateY(0);
        }
    /* ===== 实拍视频区（站点形态：上半屏虚拟实验 + 底部实拍视频，两者缺一不可） ===== */
    .video-section { max-width: 1200px; margin: 24px auto 40px; padding: 20px 22px; background: #0f172a; border: 1px solid rgba(148,163,184,0.16); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.28); }
    .video-section .section-title { font-size: 20px; font-weight: bold; color: #f8fafc; margin-bottom: 16px; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
    .video-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 18px 20px; }
    .video-card h3 { margin: 0 0 12px; font-size: 15px; line-height: 1.5; color: #f8fafc; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; display: flex; align-items: flex-start; gap: 8px; }

    .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #000; }

    .video-desc { font-size: 13px; color: #94a3b8; line-height: 1.7; margin-top: 10px; }
    .video-desc b { color: #a5f3fc; }
    .video-fullscreen-btn { position: absolute; top: 10px; right: 10px; z-index: 10; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 8px; background: rgba(0,0,0,0.55); color: #fff; cursor: pointer; transition: background 0.2s ease; }
    .video-fullscreen-btn:hover { background: rgba(59,130,246,0.85); }

<body>

    <div class="container">
        <h1>声音的三要素</h1>
        <p class="subtitle">探索音调、响度与音色的奥秘</p>

        <div id="visual-area">
            <canvas id="waveCanvas"></canvas>
        </div>

        <div id="control-panel">
            <div class="control-group">
                <label for="frequency-slider">音调 (频率)</label>
                <input type="range" id="frequency-slider" min="100" max="1500" value="440">
                <span class="control-value" id="frequency-value">440 Hz</span>
            </div>
            <div class="control-group">
                <label for="volume-slider">响度 (音量)</label>
                <input type="range" id="volume-slider" min="0" max="100" value="50">
                <span class="control-value" id="volume-value">50 %</span>
            </div>
            <div class="control-group">
                <label for="waveform-selector">音色 (波形)</label>
                <select id="waveform-selector">
                    <option value="sine">正弦波 (柔和)</option>
                    <option value="square">方波 (明亮)</option>
                    <option value="sawtooth">锯齿波 (尖锐)</option>
                    <option value="triangle">三角波 (温暖)</option>
                </select>
            </div>
        </div>

        <button id="play-button">播放</button>
    </div>

    <script>
        // --- DOM 元素获取 ---
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        const playButton = document.getElementById('play-button');
        const frequencySlider = document.getElementById('frequency-slider');
        const frequencyValue = document.getElementById('frequency-value');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeValue = document.getElementById('volume-value');
        const waveformSelector = document.getElementById('waveform-selector');

        // --- Canvas 设置 ---
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- 音频上下文与节点 ---
        let audioContext;
        let oscillator;
        let gainNode;
        let isPlaying = false;

        // --- 动画相关变量 ---
        let animationId;
        let phase = 0;

        // --- 初始化音频 ---
        function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioContext.createOscillator();
            gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.type = waveformSelector.value;
            oscillator.frequency.value = frequencySlider.value;
            gainNode.gain.value = volumeSlider.value / 100;
            
            oscillator.start();
        }

        // --- 停止音频 ---
        function stopAudio() {
            if (oscillator) {
                oscillator.stop();
                oscillator.disconnect();
                oscillator = null;
            }
            if (gainNode) {
                gainNode.disconnect();
                gainNode = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
        }

        // --- 播放/暂停逻辑 ---
        playButton.addEventListener('click', () => {
            if (!isPlaying) {
                initAudio();
                playButton.textContent = '暂停';
                isPlaying = true;
                draw();
            } else {
                stopAudio();
                cancelAnimationFrame(animationId);
                playButton.textContent = '播放';
                isPlaying = false;
                // 清空画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });

        // --- 控件事件监听 ---
        frequencySlider.addEventListener('input', (e) => {
            const value = e.target.value;
            frequencyValue.textContent = `${value} Hz`;
            if (oscillator) {
                oscillator.frequency.setValueAtTime(value, audioContext.currentTime);
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            const value = e.target.value;
            volumeValue.textContent = `${value} %`;
            if (gainNode) {
                gainNode.gain.setValueAtTime(value / 100, audioContext.currentTime);
            }
        });

        waveformSelector.addEventListener('change', (e) => {
            const value = e.target.value;
            if (oscillator) {
                oscillator.type = value;
            }
        });

        // --- 绘制函数 ---
        function draw() {
            if (!isPlaying) return;

            animationId = requestAnimationFrame(draw);

            const width = canvas.width;
            const height = canvas.height;
            const frequency = parseFloat(frequencySlider.value);
            const volume = parseFloat(volumeSlider.value) / 100;
            const waveformType = waveformSelector.value;

            // 清空画布
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            // 绘制波形
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 3;
            ctx.beginPath();

            const amplitude = (height / 2 - 20) * volume; // 振幅与响度关联
            const wavelength = (width * 100) / frequency; // 波长与频率成反比

            for (let x = 0; x < width; x++) {
                let y;
                const t = (x / wavelength) + phase;

                switch (waveformType) {
                    case 'sine':
                        y = height / 2 + amplitude * Math.sin(2 * Math.PI * t);
                        break;
                    case 'square':
                        y = height / 2 + (Math.sin(2 * Math.PI * t) > 0 ? amplitude : -amplitude);
                        break;
                    case 'sawtooth':
                        y = height / 2 + amplitude * (2 * (t - Math.floor(t + 0.5)));
                        break;
                    case 'triangle':
                        y = height / 2 + amplitude * (2 * Math.asin(Math.sin(2 * Math.PI * t)) / Math.PI);
                        break;
                }
                
                if (x === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            ctx.stroke();

            // 更新相位以产生动画效果
            phase += frequency / 5000; // 动画速度与频率关联
        }
    </script>
  <!-- 实拍视频区（站点形态：上半屏虚拟实验 + 底部实拍视频，两者缺一不可）
       站内无素材，站外检索。★ 本页是【浅色页】（body 有效底色 rgb(255,255,255)）⇒ 视频区必须自带深色卡片，否则 #f8fafc 的标题落在白底上「有但看不见」。 -->
  <div class="video-section">

        <div class="video-container">
          <iframe src="//player.bilibili.com/player.html?bvid=BV1oD4y1S7qP&page=1&autoplay=0&loop=1&danmaku=0&high_quality=1" scrolling="no" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>
          <button class="video-fullscreen-btn" title="全屏播放" aria-label="全屏播放">
            <svg class="fs-expand" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
            <svg class="fs-compress" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path stroke-linecap="round" stroke-linejoin="round" d="M8 3v3a2 2 0 01-2 2H3m18 0h-3a2 2 0 01-2-2V3m0 18v-3a2 2 0 012-2h3M3 16h3a2 2 0 012 2v3"/></svg>
          </button>
        </div>
        <div class="video-desc">真实示波器上的波形：<b>频率越高，一个屏幕里挤进去的波峰越多</b>。和上方「音调（频率）」滑块是同一件事 —— 拖动滑块，画布上的波形疏密跟着变。</div>
      </div>
      <div class="video-card">
        <h3>音调、响度、音色的波形图放在一起比一比<span class="live-badge">实拍</span></h3>
        <div class="video-container">
          <iframe src="//player.bilibili.com/player.html?bvid=BV1an4y1X72x&page=1&autoplay=0&loop=1&danmaku=0&high_quality=1" scrolling="no" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>
          <button class="video-fullscreen-btn" title="全屏播放" aria-label="全屏播放">
            <svg class="fs-expand" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
            <svg class="fs-compress" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path stroke-linecap="round" stroke-linejoin="round" d="M8 3v3a2 2 0 01-2 2H3m18 0h-3a2 2 0 01-2-2V3m0 18v-3a2 2 0 012-2h3M3 16h3a2 2 0 012 2v3"/></svg>
          </button>
        </div>
        <div class="video-desc">把三种情况的波形摆在一起看：音调只改<b>疏密</b>、响度只改<b>高低</b>、音色只改<b>形状</b>。上方三个滑块（音调 / 响度 / 音色）分别只动其中一个 —— 每动一个，就盯着画布看是哪一个特征在变。</div>
      </div>
    </div>
  </div>

  <script>
  (function() {
    var btns = document.querySelectorAll('.video-fullscreen-btn');
    if (!btns.length) return;
    btns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        var container = btn.closest('.video-container');
        if (!container) return;
        if (document.fullscreenElement === container) { document.exitFullscreen(); }
        else { if (container.requestFullscreen) container.requestFullscreen(); else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen(); }
      });
    });
    document.addEventListener('fullscreenchange', function() {
      var fsEl = document.fullscreenElement;
      btns.forEach(function(btn) {
        var container = btn.closest('.video-container');
        var on = fsEl === container;
        var ex = btn.querySelector('.fs-expand'), cp = btn.querySelector('.fs-compress');
        if (ex) ex.style.display = on ? 'none' : '';
        if (cp) cp.style.display = on ? '' : 'none';
        btn.title = on ? '退出全屏' : '全屏播放';
        btn.setAttribute('aria-label', btn.title);
      });
    });
  })();
  </script>
</body>
