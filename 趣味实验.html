<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>趣味实验 · 玩全攻略 | 物理虚拟实验</title>
<meta name="description" content="小彬老师整理的初中物理趣味实验合集：210 个随手可做的课堂小实验，按教材章节编排，附难度、材料、步骤、原理与生活应用。">
<link rel="stylesheet" href="style.css">
<style>
  :root{
    --fx-line: rgba(148,163,184,.16);
    --fx-line-soft: rgba(148,163,184,.09);
    --fx-card: rgba(15,23,42,.62);
    --fx-ink: #dbe5f0;
    --fx-muted: #94a3b8;
    --fx-cyan: #38bdf8;
    --fx-amber: #fbbf24;
  }

  /* ============ 布局骨架 ============ */
  .fx-layout{
    display:grid;
    grid-template-columns:302px minmax(0,1fr);
    gap:26px;
    max-width:1480px;
    margin:0 auto;
    padding:24px 24px 96px;
    align-items:start;
  }

  /* ============ 左侧导航 ============ */
  .fx-side{
    position:sticky;
    top:92px;
    max-height:calc(100vh - 112px);
    display:flex;
    flex-direction:column;
    background:rgba(15,23,42,.7);
    border:1px solid var(--fx-line);
    border-radius:18px;
    box-shadow:0 18px 50px rgba(0,0,0,.35);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    overflow:hidden;
    z-index:30;
  }
  .fx-side-head{padding:18px 16px 12px;border-bottom:1px solid var(--fx-line-soft);}
  .fx-side-title{
    display:flex;align-items:baseline;gap:6px;
    font-size:1.02rem;font-weight:800;color:#f1f5f9;letter-spacing:.4px;
  }
  .fx-side-title span{
    font-size:.72rem;font-weight:500;color:var(--fx-muted);letter-spacing:0;
  }
  .fx-side-stat{margin-top:6px;font-size:.72rem;color:#64748b;}
  .fx-search{position:relative;margin-top:12px;}
  .fx-search input[type=search]::-webkit-search-cancel-button{display:none;}
  .fx-search input{
    width:100%;padding:9px 34px 9px 32px;border-radius:11px;
    border:1px solid rgba(148,163,184,.22);background:rgba(2,6,23,.6);
    color:#e2e8f0;font-size:12.5px;font-family:inherit;outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .fx-search input:focus{border-color:rgba(56,189,248,.6);box-shadow:0 0 0 3px rgba(56,189,248,.12);}
  .fx-search input::placeholder{color:#64748b;}
  .fx-search .fx-sic{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.65;}
  .fx-search .fx-sclr{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    border:0;background:transparent;color:#94a3b8;font-size:12px;cursor:pointer;
    display:none;padding:4px;
  }
  .fx-search.on .fx-sclr{display:block;}

  .fx-results{
    position:absolute;left:0;right:0;top:46px;z-index:40;
    background:#0b1220;border:1px solid rgba(148,163,184,.22);border-radius:12px;
    box-shadow:0 24px 50px rgba(0,0,0,.55);
    max-height:340px;overflow:auto;display:none;
  }
  .fx-results.on{display:block;}
  .fx-results-head{font-size:.68rem;color:#64748b;padding:9px 12px 6px;border-bottom:1px solid var(--fx-line-soft);}
  .fx-res-item{
    display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;
    padding:8px 12px;background:transparent;border:0;border-bottom:1px solid rgba(148,163,184,.06);
    color:#cbd5e1;cursor:pointer;font-family:inherit;
  }
  .fx-res-item:hover{background:rgba(59,130,246,.12);}
  .fx-res-item b{font-size:12.5px;font-weight:600;color:#e2e8f0;line-height:1.4;}
  .fx-res-item small{font-size:.66rem;color:#64748b;}
  .fx-res-empty{padding:18px 12px;font-size:.75rem;color:#64748b;text-align:center;}

  .fx-tree{overflow-y:auto;padding:8px 10px 18px;scrollbar-width:thin;}
  .fx-tree::-webkit-scrollbar{width:6px;}
  .fx-tree::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:99px;}

  .fx-chblock{margin-bottom:2px;}
  .fx-chbtn{
    display:flex;align-items:center;gap:8px;width:100%;padding:8px 8px;border:0;border-radius:10px;
    background:transparent;color:#cbd5e1;font-family:inherit;text-align:left;cursor:pointer;
    transition:background .18s;
  }
  .fx-chbtn:hover{background:rgba(59,130,246,.1);color:#fff;}
  .fx-chidx{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.65rem;
    color:#64748b;min-width:17px;
  }
  .fx-chname{flex:1;font-size:.82rem;font-weight:600;line-height:1.4;}
  .fx-chcount{
    font-size:.62rem;color:#94a3b8;background:rgba(148,163,184,.12);
    padding:1px 6px;border-radius:99px;
  }
  .fx-caret{font-size:.6rem;color:#64748b;transition:transform .22s;}
  .fx-chblock.open .fx-caret{transform:rotate(180deg);}
  .fx-chitems{list-style:none;margin:0 0 6px;padding:0 0 0 6px;display:none;}
  .fx-chblock.open .fx-chitems{display:block;}
  .fx-item{
    display:flex;gap:8px;padding:6px 8px;border-radius:8px;text-decoration:none;
    border-left:2px solid transparent;transition:background .16s;
  }
  .fx-itemnum{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.63rem;
    color:#64748b;min-width:40px;padding-top:2px;
  }
  .fx-itemtitle{
    font-size:.74rem;line-height:1.5;color:#94a3b8;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .fx-item:hover{background:rgba(148,163,184,.08);}
  .fx-item:hover .fx-itemtitle{color:#e2e8f0;}
  .fx-item.on{background:linear-gradient(90deg,rgba(59,130,246,.18),rgba(59,130,246,0));border-left-color:var(--fx-cyan);}
  .fx-item.on .fx-itemtitle{color:#e0f2fe;font-weight:600;}
  .fx-item.on .fx-itemnum{color:var(--fx-cyan);}

  .fx-side-foot{
    padding:10px 16px;border-top:1px solid var(--fx-line-soft);
    font-size:.66rem;color:#475569;line-height:1.6;
  }

  /* ============ 主体 ============ */
  .fx-main{min-width:0;}

  /* 首页 hero */
  .fx-hero{
    position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--fx-line);
    padding:44px 44px 36px;
    background:
      radial-gradient(120% 130% at 8% 0%, rgba(59,130,246,.2), transparent 55%),
      radial-gradient(90% 90% at 92% 8%, rgba(139,92,246,.18), transparent 58%),
      rgba(15,23,42,.58);
  }
  .fx-hero::after{
    content:"";position:absolute;right:-60px;bottom:-90px;width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle,rgba(56,189,248,.18),transparent 70%);
    pointer-events:none;
  }
  .fx-eyebrow{
    font-size:.72rem;letter-spacing:.22em;color:#7dd3fc;text-transform:uppercase;
    font-weight:600;margin-bottom:14px;
  }
  .fx-hero h1{
    font-size:clamp(1.8rem,3.6vw,2.7rem);line-height:1.25;font-weight:800;
    color:#f8fafc;letter-spacing:.5px;margin-bottom:14px;
  }
  .fx-hero h1 em{
    font-style:normal;
    background:linear-gradient(135deg,#7dd3fc,#38bdf8 40%,#a78bfa);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .fx-lede{font-size:.95rem;line-height:1.9;color:#b6c2d4;max-width:640px;}
  .fx-stats{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 4px;}
  .fx-stat{
    display:flex;align-items:baseline;gap:6px;padding:8px 14px;border-radius:12px;
    background:rgba(2,6,23,.45);border:1px solid var(--fx-line-soft);
  }
  .fx-stat b{font-size:1.15rem;font-weight:800;color:#f1f5f9;font-family:inherit;}
  .fx-stat span{font-size:.7rem;color:#7c8ba1;}
  .fx-hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px;}
  .fx-btn{
    display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:12px;
    border:1px solid rgba(56,189,248,.35);color:#e0f2fe;text-decoration:none;
    font-size:.82rem;font-weight:600;transition:.22s;background:rgba(56,189,248,.08);
  }
  .fx-btn:hover{background:rgba(56,189,248,.18);border-color:var(--fx-cyan);transform:translateY(-1px);}
  .fx-btn.primary{
    background:linear-gradient(135deg,#3b82f6,#06b6d4);border-color:transparent;color:#fff;
    box-shadow:0 10px 26px rgba(56,189,248,.25);
  }
  .fx-btn.primary:hover{box-shadow:0 14px 32px rgba(56,189,248,.36);}

  .fx-block-title{
    display:flex;align-items:center;gap:10px;margin:42px 0 16px;
    font-size:1.05rem;font-weight:700;color:#f1f5f9;
  }
  .fx-block-title i{
    width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,#38bdf8,#8b5cf6);
    display:inline-block;
  }
  .fx-block-title small{font-size:.7rem;font-weight:500;color:#64748b;margin-left:2px;}

  /* 章节卡片 */
  .fx-gridnote{margin:14px 0 0;font-size:.72rem;color:#64748b;}
  .fx-chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px;}
  .fx-chcard{
    position:relative;display:block;padding:18px 18px 16px;border-radius:16px;
    border:1px solid var(--fx-line-soft);background:rgba(15,23,42,.55);
    text-decoration:none;overflow:hidden;transition:transform .2s, border-color .2s, background .2s;
  }
  .fx-chcard:hover{transform:translateY(-3px);border-color:rgba(56,189,248,.45);background:rgba(15,23,42,.8);}
  .fx-chcard .idx{
    position:absolute;right:12px;top:8px;font-family:ui-monospace,monospace;
    font-size:1.5rem;font-weight:800;color:rgba(148,163,184,.18);line-height:1;
  }
  .fx-chcard .ico{font-size:1.15rem;display:block;margin-bottom:8px;}
  .fx-chcard strong{display:block;font-size:.92rem;color:#e8f0fa;margin-bottom:4px;font-weight:700;}
  .fx-chcard em{font-style:normal;font-size:.68rem;color:#7dd3fc;letter-spacing:.02em;}
  .fx-chcard p{font-size:.72rem;line-height:1.7;color:#7f8ea4;margin-top:8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  /* 说明区 */
  .fx-note{
    margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;
  }
  .fx-tip{
    padding:18px;border-radius:14px;border:1px dashed rgba(148,163,184,.24);
    background:rgba(2,6,23,.3);font-size:.78rem;line-height:1.85;color:#9fb0c6;
  }
  .fx-tip b{display:block;color:#e2e8f0;font-size:.82rem;margin-bottom:6px;font-weight:700;}

  /* 章节页 hero */
  .fx-chhero{
    position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--fx-line);
    padding:32px 34px;margin-bottom:24px;
    background:radial-gradient(110% 120% at 0% 0%, rgba(59,130,246,.16), transparent 60%), rgba(15,23,42,.58);
  }
  .fx-chhero .bigno{
    position:absolute;right:22px;bottom:-16px;font-family:ui-monospace,monospace;
    font-size:6.4rem;font-weight:800;line-height:1;color:rgba(148,163,184,.12);pointer-events:none;
  }
  .fx-chhero .fx-eyebrow{margin-bottom:8px;}
  .fx-chhero h1{font-size:clamp(1.5rem,2.6vw,2rem);color:#f8fafc;font-weight:800;margin-bottom:10px;}
  .fx-chhero p{font-size:.86rem;line-height:1.8;color:#a9b7c9;max-width:660px;}
  .fx-chhero .metas{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .fx-pill{
    font-size:.7rem;padding:4px 10px;border-radius:99px;border:1px solid var(--fx-line-soft);
    color:#9fb0c6;background:rgba(2,6,23,.35);
  }

  /* 实验卡片 */
  .fx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
  .fx-card{
    display:block;padding:18px;border-radius:16px;text-decoration:none;
    border:1px solid var(--fx-line-soft);background:rgba(15,23,42,.55);
    transition:transform .18s,border-color .18s,background .18s;
  }
  .fx-card:hover{transform:translateY(-2px);border-color:rgba(56,189,248,.4);background:rgba(15,23,42,.82);}
  .fx-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .fx-card .num{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.68rem;
    color:#7dd3fc;letter-spacing:.03em;
  }
  .fx-card .dif{font-size:.72rem;color:var(--fx-amber);letter-spacing:1px;}
  .fx-card .dif.none{color:#64748b;letter-spacing:0;}
  .fx-card h3{font-size:.95rem;line-height:1.55;color:#eaf2fb;font-weight:600;margin-bottom:8px;}
  .fx-card p{
    font-size:.73rem;line-height:1.75;color:#7f8ea4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .fx-card:hover h3{color:#fff;}

  /* ============ 文章 ============ */
  .fx-article{
    max-width:940px;margin:0 auto;padding:34px 46px 42px;border-radius:24px;
    border:1px solid var(--fx-line);
    background:linear-gradient(180deg,rgba(15,23,42,.86),rgba(2,6,23,.72));
    box-shadow:0 30px 90px rgba(0,0,0,.4);
  }
  .fx-back{
    display:inline-flex;align-items:center;gap:6px;font-size:.72rem;color:#7c8ba1;
    text-decoration:none;margin-bottom:14px;
  }
  .fx-back:hover{color:var(--fx-cyan);}
  .fx-art-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .fx-art-meta .num{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.74rem;
    padding:3px 9px;border-radius:8px;border:1px solid rgba(56,189,248,.3);
    background:rgba(56,189,248,.1);color:#7dd3fc;
  }
  .fx-art-meta .dif{font-size:.82rem;color:var(--fx-amber);letter-spacing:1.5px;}
  .fx-art-meta .none{font-size:.66rem;color:#64748b;}
  .fx-art-meta .time{font-size:.68rem;color:#64748b;}
  .fx-article h1{
    font-size:clamp(1.4rem,2.8vw,2.05rem);line-height:1.4;color:#f8fafc;font-weight:800;
    margin:12px 0 16px;letter-spacing:.2px;
  }
  .fx-mat{
    font-size:.76rem;line-height:1.8;color:#b9d9ec;background:rgba(56,189,248,.08);
    border-left:3px solid rgba(56,189,248,.6);border-radius:10px;padding:10px 14px;
    display:flex;gap:8px;align-items:flex-start;
  }
  .fx-mat b{color:#7dd3fc;font-weight:600;white-space:nowrap;font-size:.72rem;padding-top:1px;}
  .fx-tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0;}
  .fx-tool{
    display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:9px;
    border:1px solid var(--fx-line-soft);background:rgba(2,6,23,.4);
    color:#a9b7c9;font-size:.72rem;font-family:inherit;cursor:pointer;transition:.18s;
  }
  .fx-tool:hover{border-color:rgba(56,189,248,.4);color:#e0f2fe;background:rgba(56,189,248,.1);}
  .fx-secnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--fx-line-soft);}
  .fx-secbtn{
    border:1px solid var(--fx-line-soft);background:transparent;color:#94a3b8;
    font-size:.7rem;font-family:inherit;padding:5px 11px;border-radius:99px;cursor:pointer;transition:.18s;
  }
  .fx-secbtn:hover{color:#e0f2fe;border-color:rgba(56,189,248,.45);background:rgba(56,189,248,.1);}

  .fx-body{margin-top:26px;font-size:1.005rem;line-height:1.95;color:#d6e1ee;word-break:break-word;}
  .fx-body .fx-p{margin:0 0 13px;}
  .fx-body .fx-key strong{color:#7dd3fc;font-weight:600;}
  .fx-body .fx-sec{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin:34px 0 12px;padding-top:16px;border-top:1px solid var(--fx-line-soft);
    font-size:1.12rem;font-weight:700;color:#f1f5f9;letter-spacing:.2px;scroll-margin-top:110px;
  }
  .fx-body .fx-sec:first-of-type{border-top:0;padding-top:0;margin-top:8px;}
  .fx-ico{
    width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:inline-flex;
    align-items:center;justify-content:center;font-size:.95rem;
    background:rgba(59,130,246,.14);border:1px solid rgba(56,189,248,.18);
    font-weight:400;
  }
  .fx-sec-sub{font-size:.74rem;font-weight:500;color:#94a3b8;letter-spacing:0;}
  .fx-body .fx-sub{
    display:flex;align-items:center;gap:6px;margin:22px 0 8px;
    font-size:.9rem;font-weight:700;color:#bae6fd;letter-spacing:.02em;
  }
  .fx-body .fx-list{margin:4px 0 16px;padding:0;list-style:none;}
  .fx-body .fx-list li{
    position:relative;padding:5px 0 5px 21px;line-height:1.9;
  }
  .fx-body .fx-list li::before{
    content:"";position:absolute;left:3px;top:1.15em;width:6px;height:6px;border-radius:50%;
    background:linear-gradient(135deg,#3b82f6,#06b6d4);
    box-shadow:0 0 7px rgba(56,189,248,.45);
  }
  .fx-body .fx-list li strong{color:#eef6ff;font-weight:600;}
  .fx-body .fx-list li.fx-sub{
    display:block;margin:14px 0 2px;padding-left:0;font-size:.9rem;font-weight:700;color:#c7d2fe;
  }
  .fx-body .fx-list li.fx-sub::before{display:none;}
  .fx-body .fx-list li.fx-sub strong{color:#c7d2fe;}

  .fx-table-wrap{
    margin:14px 0 18px;overflow-x:auto;border:1px solid var(--fx-line-soft);
    border-radius:12px;background:rgba(2,6,23,.35);
  }
  .fx-table{border-collapse:collapse;width:100%;min-width:480px;font-size:.8rem;}
  .fx-table th,.fx-table td{
    padding:9px 12px;border-bottom:1px solid rgba(148,163,184,.1);
    text-align:left;vertical-align:top;line-height:1.65;color:#cbd5e1;
  }
  .fx-table th{background:rgba(59,130,246,.13);color:#dbeafe;font-weight:600;white-space:nowrap;}
  .fx-table tr:last-child td{border-bottom:0;}

  .fx-fig{margin:18px 0;text-align:center;}
  .fx-fig.qr img{max-width:216px;border-radius:10px;}
  .fx-fig img{
    max-width:100%;height:auto;border-radius:12px;border:1px solid var(--fx-line-soft);
    box-shadow:0 12px 30px rgba(0,0,0,.35);
  }
  .fx-attach{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0;padding:12px 14px;
    border:1px solid rgba(56,189,248,.28);border-radius:12px;
    background:linear-gradient(90deg,rgba(56,189,248,.12),rgba(59,130,246,.04));
    font-size:.82rem;color:#bae6fd;
  }
  .fx-attach span{font-weight:600;color:#7dd3fc;}
  .fx-attach a{color:#fff;border-bottom:1px dashed rgba(255,255,255,.35);}
  .fx-attach.ghost{border-color:var(--fx-line-soft);background:rgba(148,163,184,.06);color:#94a3b8;}
  .fx-attach.ghost span{color:#cbd5e1;}
  .fx-body a{color:#7dd3fc;text-decoration:none;border-bottom:1px dashed rgba(125,211,252,.4);word-break:break-all;}
  .fx-body a:hover{color:#fff;border-bottom-color:#fff;}

  .fx-artfoot{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:44px;padding-top:22px;
    border-top:1px solid var(--fx-line-soft);
  }
  .fx-navcard{
    display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;
    border:1px solid var(--fx-line-soft);background:rgba(2,6,23,.35);
    text-decoration:none;transition:.18s;
  }
  .fx-navcard:hover{border-color:rgba(56,189,248,.4);background:rgba(56,189,248,.08);}
  .fx-navcard small{font-size:.64rem;color:#64748b;letter-spacing:.04em;}
  .fx-navcard b{font-size:.8rem;color:#cbd5e1;font-weight:600;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .fx-navcard.next{text-align:right;align-items:flex-end;}
  .fx-navcard.next b{text-align:right;}

  .fx-footer-cta{
    margin-top:26px;padding:18px 20px;border-radius:14px;
    background:linear-gradient(120deg,rgba(59,130,246,.12),rgba(139,92,246,.1));
    border:1px solid rgba(56,189,248,.18);display:flex;gap:14px;align-items:center;justify-content:space-between;
    flex-wrap:wrap;
  }
  .fx-footer-cta p{margin:0;font-size:.76rem;line-height:1.7;color:#a9b7c9;}
  .fx-footer-cta a{font-size:.76rem;color:#7dd3fc;text-decoration:none;white-space:nowrap;}

  .fx-loading{padding:70px 0;text-align:center;color:#7c8ba1;font-size:.85rem;}

  /* ============ 移动端 ============ */

    .fx-side{
      position:fixed;left:0;top:0;height:100vh;height:100dvh;max-height:none;width:306px;
      border-radius:0 16px 16px 0;transform:translateX(-103%);transition:transform .28s ease;

    .fx-backdrop{
      display:block;position:fixed;inset:0;background:rgba(2,6,23,.66);

  /* ============ 解锁 ============ */
  .fx-lockbar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;

  }
  .fx-lockbar[hidden]{display:none;}
  .fx-lockbar.on{border-color:rgba(74,222,128,.28);background:rgba(74,222,128,.08);color:#bbf7d0;}
  .fx-lockbtn{
    flex:none;padding:4px 9px;border-radius:7px;cursor:pointer;
    border:1px solid rgba(125,211,252,.45);background:rgba(56,189,248,.16);
    color:#e0f2fe;font-size:.68rem;font-family:inherit;white-space:nowrap;
  }
  .fx-lockbar.on .fx-lockbtn{border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.14);color:#dcfce7;}

  .fx-itemlock{flex:none;margin-left:5px;font-size:.62rem;opacity:.45;filter:grayscale(1);}
  .fx-cardlock{display:inline-block;margin-right:6px;font-size:.78rem;opacity:.55;filter:grayscale(1);vertical-align:1px;}
  .fx-item.locked .fx-itemtitle{color:#93a4bb;}

  .fx-lockview{display:flex;flex-direction:column;align-items:center;padding:40px 0 26px;}
  .fx-lockcard{
    width:100%;max-width:560px;padding:34px 28px 26px;text-align:center;
    border-radius:18px;border:1px solid var(--fx-line);
    background:linear-gradient(180deg,rgba(15,23,42,.92),rgba(2,6,23,.94));

  .fx-lockico{font-size:1.9rem;line-height:1;}

  .fx-lockskel-cap{margin-top:12px;font-size:.7rem;color:#64748b;letter-spacing:.04em;}

  .fx-modal{
    position:fixed;inset:0;z-index:130;display:flex;align-items:center;justify-content:center;
    padding:22px;background:rgba(2,6,23,.74);backdrop-filter:blur(7px);

  .fx-modal[hidden]{display:none;}
  .fx-modal-card{
    position:relative;width:100%;max-width:408px;padding:32px 26px 20px;text-align:center;

    box-shadow:0 30px 80px rgba(0,0,0,.6);animation:fxpop .22s ease-out;

  @keyframes fxpop{from{transform:translateY(10px) scale(.97);opacity:0;}to{transform:none;opacity:1;}}
  .fx-modal-x{position:absolute;right:10px;top:8px;padding:8px;border:0;background:none;color:#94a3b8;font-size:.95rem;cursor:pointer;font-family:inherit;}
  .fx-modal-ico{font-size:1.7rem;line-height:1;}
  .fx-modal-card h3{font-size:1.08rem;margin:10px 0 8px;color:#f1f5f9;}
  .fx-modal-card p{font-size:.78rem;line-height:1.8;color:#94a3b8;margin:0 0 16px;}
  #fxCodeInput{
    width:100%;padding:12px 14px;border-radius:11px;outline:none;text-align:center;
    border:1px solid rgba(148,163,184,.28);background:rgba(2,6,23,.72);color:#e2e8f0;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;letter-spacing:.12em;
    text-transform:uppercase;

  #fxCodeInput::placeholder{letter-spacing:.1em;color:#64748b;text-transform:none;}
  #fxCodeInput:focus{border-color:rgba(56,189,248,.7);box-shadow:0 0 0 3px rgba(56,189,248,.14);}
  .fx-modal-btn{width:100%;margin-top:12px;display:flex;justify-content:center;padding:11px 0;}
  .fx-modal-btn[disabled]{opacity:.6;cursor:wait;}
  .fx-modal-tip{min-height:18px;margin-top:10px;font-size:.74rem;line-height:1.7;color:#fca5a5;}
  .fx-modal-tip.ok{color:#86efac;}
  .fx-modal-foot{margin-top:6px;font-size:.7rem;line-height:1.75;color:#64748b;}
  .fx-preview-btn{
    margin-top:10px;padding:7px 12px;border-radius:8px;cursor:pointer;font-family:inherit;
    border:1px dashed rgba(148,163,184,.3);background:rgba(148,163,184,.08);color:#94a3b8;font-size:.7rem;
  }
  .fx-homehint{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin:0 0 18px;padding:9px 13px;border-radius:10px;font-size:.76rem;color:#bae6fd;
    border:1px solid rgba(56,189,248,.24);background:rgba(56,189,248,.08);
  }
  .fx-homehint button{
    padding:5px 11px;border-radius:7px;cursor:pointer;font-family:inherit;font-size:.72rem;
    border:1px solid rgba(125,211,252,.45);background:rgba(56,189,248,.16);color:#e0f2fe;
  }

  /* ============ 打印 ============ */
  @media print{
    header.header,.fx-side,.fx-mbar,.fx-backdrop,.fx-tools,.fx-secnav,.fx-artfoot,.fx-footer-cta,.fx-back{display:none !important;}
    body{background:#fff !important;}
    .fx-layout{display:block;padding:0;max-width:none;}
    .fx-article{max-width:none;border:0;border-radius:0;box-shadow:none;background:#fff;padding:0;}
    .fx-body,.fx-body *,.fx-article h1{color:#111 !important;}

  }
</style>

<script src="assets/fun-exp/meta.js"></script>
<script>
(function(){
  "use strict";

  const META = window.FEX_META || { total: 0, chapters: [], index: [] };
  const getCh = function(no){ return (window.FEX_CH || {})[no]; };
  const chapterMap = new Map(META.chapters.map(c => [c.no, c]));
  const indexMap = new Map(META.index.map(e => [e.id, e]));

  const $ = (s, root) => (root || document).querySelector(s);
  const $$ = (s, root) => Array.prototype.slice.call((root || document).querySelectorAll(s));

  const elHome = $('#fxHome');
  const elChapter = $('#fxChapter');
  const elExp = $('#fxExp');
  const elMain = $('#fxMain');
  const elTree = $('#fxTree');
  const elSide = $('#fxSide');
  const elBackdrop = $('#fxBackdrop');
  const elMbarTitle = $('#fxMbarTitle');

  const chapterPromises = {};
  const chapterCache = {};

  function clearChapterCache(){
    Object.keys(chapterCache).forEach(function(k){ delete chapterCache[k]; });
    Object.keys(chapterPromises).forEach(function(k){ delete chapterPromises[k]; });
  }
  let currentHash = '';
  let lastQuery = '';

  /* ---------- 小工具 ---------- */
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function pad2(n){ return n < 10 ? '0' + n : String(n); }
  function stars(n){
    if (!n) return '<span class="dif none">未标注难度</span>';
    return '<span class="dif" title="实验难度">' + '★'.repeat(n) + '<span style="opacity:.35">' + '★'.repeat(3-n) + '</span></span>';
  }
  function readMinutes(len){ return Math.max(1, Math.round((len || 600) / 380)); }
  function chapterOf(no){ return chapterMap.get(Number(no)) || { no:no, name:'', full:'' }; }

  /* ---------- 解锁（趣味实验门禁） ---------- */
  const UNLOCK_KEY = 'funexp_unlock_v1';
  const DEVICE_KEY = 'funexp_device_v1';
  const IS_LOCAL = location.protocol === 'file:' ||
    /^(localhost|127\.0\.0\.1|::1)$/i.test(location.hostname);
  let unlock = readUnlock();

  function readUnlock(){
    try{
      const raw = localStorage.getItem(UNLOCK_KEY);
      if (!raw) return null;
      const o = JSON.parse(raw);
      if (!o || !o.code) return null;
      if (o.expires_at && new Date(o.expires_at).getTime() < Date.now()){
        localStorage.removeItem(UNLOCK_KEY);
        return null;
      }
      return o;
    }catch(e){ return null; }
  }

  function isUnlocked(){ return !!unlock; }

  function deviceId(){
    let d = localStorage.getItem(DEVICE_KEY);
    if (!d){
      d = 'dev_' + (window.crypto && crypto.randomUUID
        ? crypto.randomUUID().replace(/-/g, '')
        : Math.random().toString(36).slice(2) + Date.now().toString(36));
      localStorage.setItem(DEVICE_KEY, d);
    }
    return d;
  }

  function saveUnlock(o){
    try{ localStorage.setItem(UNLOCK_KEY, JSON.stringify(o)); }catch(e){}
    unlock = o;
  }

  function clearUnlock(){
    try{ localStorage.removeItem(UNLOCK_KEY); }catch(e){}
    unlock = null;
    clearChapterCache();
  }

  function fmtDate(v){
    const d = new Date(v);
    if (isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function updateLockBar(){
    const bar = $('#fxLockBar');
    if (!bar) return;
    bar.hidden = false;
    if (unlock){
      bar.classList.add('on');
      $('#fxLockText').textContent = '✅ 已解锁' + (unlock.expires_at ? ' · ' + fmtDate(unlock.expires_at) + ' 到期' : ' · 长期有效');
      $('#fxLockBtn').textContent = '退出';
    } else {
      bar.classList.remove('on');
      $('#fxLockText').textContent = lockNotice ? '🔒 ' + lockNotice : '🔒 未解锁 · 只能看目录';
      $('#fxLockBtn').textContent = '输入解锁码';
    }
  }

  function setModalTip(msg, ok){
    const t = $('#fxModalTip');
    if (!t) return;
    t.className = 'fx-modal-tip' + (ok ? ' ok' : '');
    t.textContent = msg || '';
  }

  function openUnlockModal(){
    const m = $('#fxModal');
    if (!m) return;
    m.hidden = false;
    setModalTip('');
    $('#fxPreviewBtn').hidden = !IS_LOCAL;
    const input = $('#fxCodeInput');
    try{ input.focus(); }catch(e){}
  }

  function closeUnlockModal(){
    const m = $('#fxModal');
    if (m) m.hidden = true;
  }

  async function redeemRequest(code){
    const res = await fetch('api/proxy-user', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'redeemFunExpCode', code: code, device: deviceId() })
    });
    const ct = res.headers.get('content-type') || '';
    if (ct.indexOf('application/json') === -1) throw new Error('NO_API');
    let data = null;
    try{ data = await res.json(); }catch(e){ throw new Error('NO_API'); }
    if (!res.ok || !data || !data.success){
      const err = (data && data.error) || '解锁失败，请稍后重试';
      if (res.status === 502 && err.indexOf('funexp_codes') !== -1) throw new Error('NOT_READY');
      throw new Error(err);
    }
    return data;
  }

  async function doUnlock(){
    const input = $('#fxCodeInput');
    const btn = $('#fxUnlockBtn');
    const code = (input.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!code){ setModalTip('请先输入解锁码'); return; }
    if (code.length < 8){ setModalTip('解锁码好像少了几位，请核对一下'); return; }
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = '验证中…';
    setModalTip('');
    try{
      const data = await redeemRequest(code);
      saveUnlock({
        code: data.code,
        note: data.note || '',
        expires_at: data.expires_at || null,
        at: Date.now()
      });
      applyUnlocked();
    }catch(e){
      const msg = e.message;
      if (msg === 'NO_API'){
        setModalTip(IS_LOCAL
          ? '本地预览时没有解锁服务，可点下方「本地预览」直接查看全部内容。'
          : '解锁服务连接不上，请检查网络后重试。');
        if (IS_LOCAL) $('#fxPreviewBtn').hidden = false;
      } else if (msg === 'NOT_READY'){
        setModalTip('解锁服务还没准备好：数据库里缺少解锁码表，请站长执行 api/funexp_codes.sql。');
      } else {
        setModalTip(msg);
      }
    }finally{
      btn.disabled = false;
      btn.textContent = old;
    }
  }

  function applyUnlocked(){
    lockNotice = '';
    clearChapterCache();
    closeUnlockModal();
    buildTree();
    updateLockBar();
    currentHash = '';
    route();
    if (lastQuery) doSearch(lastQuery);
  }

  let lockNotice = '';

  function onUnlockLost(reason){
    lockNotice = reason === 'expired' ? '解锁码已过期，请联系老师续期' :
                 reason === 'not_found' ? '解锁码已被删除，请联系老师' :
                 reason === 'unbound' ? '这台设备没有绑定记录，请重新输入解锁码' :
                 '解锁码已被停用，请联系老师';
    clearUnlock();
    clearChapterCache();
    buildTree();
    updateLockBar();
    currentHash = '';
    route();
  }

  async function verifyUnlock(){
    if (!unlock || unlock.preview) return;
    try{
      const res = await fetch('api/proxy-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'checkFunExpCode', code: unlock.code, device: deviceId() })
      });
      const ct = res.headers.get('content-type') || '';
      if (ct.indexOf('application/json') === -1) return;
      const data = await res.json().catch(function(){ return null; });
      if (!data || data.error || data.valid !== false) {
        if (data && data.valid && data.expires_at && data.expires_at !== unlock.expires_at){
          unlock.expires_at = data.expires_at;
          saveUnlock(unlock);
          updateLockBar();
        }
        return;
      }
      onUnlockLost(data.reason);
    }catch(e){
      // 离线或接口异常时保留本机解锁状态，不打断使用
    }
  }

  function renderLock(id){
    const meta = indexMap.get(id);
    const title = meta ? meta.title : '这个实验';
    showView('exp');
    elExp.innerHTML =
      '<div class="fx-lockview">'
      +  '<div class="fx-lockcard">'
      +    '<div class="fx-lockico">🔒</div>'
      +    '<h1>这一页需要解锁码</h1>'
      +    '<p>「<b>' + esc(title) + '</b>」属于解锁内容。目录、章节和实验名称都可以免费浏览；'

  /* 正文不再随页面发布：解锁后按码向服务器取，没码的人猜文件名也拿不到 */
  function scriptOnce(no, src){
    return new Promise(function(resolve, reject){
      const s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = function(){ getCh(no) ? resolve(getCh(no)) : reject(new Error('empty')); };
      s.onerror = function(){ reject(new Error('404')); };
      document.head.appendChild(s);
    });
  }

  function loadLocalChapter(no){
    // 仅本地预览用：内容文件放在不随站点发布的 private/ 目录
    return scriptOnce(no, 'private/fun-exp/ch' + no + '.js')
      .catch(function(){ return scriptOnce(no, 'assets/fun-exp/ch' + no + '.js'); });
  }

  function fetchChapter(no){
    if (!unlock || !unlock.code) return Promise.reject(new Error('还没有解锁'));
    return fetch('api/proxy-user', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'getFunExpChapter', code: unlock.code, device: deviceId(), chapter: no
      })
    }).then(function(res){
      return res.text().then(function(t){
        let data = null;
        try { data = JSON.parse(t); } catch (e) {}
        if (!data) throw new Error('取正文失败：接口没有返回数据（请在正式域名下访问）');
        if (!res.ok){
          if (data.reason) setTimeout(function(){ onUnlockLost(data.reason); }, 0);
          throw new Error(data.error || '这一章打不开');
        }
        if (!data.payload) throw new Error('这一章还没有同步到服务器');
        return data.payload;
      });
    });
  }

  function loadChapter(no){
    if (chapterCache[no]) return Promise.resolve(chapterCache[no]);
    if (chapterPromises[no]) return chapterPromises[no];
    const useLocal = IS_LOCAL && unlock && unlock.preview;
    const task = (useLocal ? loadLocalChapter(no) : fetchChapter(no))
      .then(function(d){ chapterCache[no] = d; return d; })
      .catch(function(e){ delete chapterPromises[no]; throw e; });
    chapterPromises[no] = task;
    return task;
  }

  function copyText(text, btn){
    const done = function(){
      const old = btn.textContent;
      btn.textContent = '✅ 已复制';
      setTimeout(function(){ btn.textContent = old; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }
    function fallback(){
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch(e) { }
      document.body.removeChild(ta);
    }
  }

  /* ---------- 路由 ---------- */
  function setHash(h){
    if (location.hash.slice(1) === h){ route(); return; }
    location.hash = h;
  }

  function route(){
    const raw = decodeURIComponent(location.hash.slice(1)) || '';
    if (raw === currentHash && !elExp.hidden) return;
    currentHash = raw;

    if (!raw || raw === 'home'){
      showView('home');
      elMbarTitle.textContent = '趣味实验 · 玩全攻略';
      document.title = '趣味实验 · 玩全攻略 | 物理虚拟实验';
      markActive(null, 0);
      expandChapter(1, true);
      window.scrollTo({ top: 0, behavior: 'auto' });
      return;
    }
    if (/^ch=(\d+)$/.test(raw)){
      const no = Number(raw.split('=')[1]);
      expandChapter(no, true);
      markActive(null, no);
      renderChapter(no);
      const c = chapterOf(no);
      document.title = c.full + ' | 趣味实验';
      elMbarTitle.textContent = c.full;
      return;
    }
    const m = raw.match(/^e-\d+-\d+(?:-\d+)?(?:-\d+)?$/);
    if (m || indexMap.has(raw)){
      const meta = indexMap.get(raw);
      if (meta){
        expandChapter(meta.ch, true);
        markActive(raw, meta.ch);
        if (!isUnlocked()){
          renderLock(raw);
        } else {
          renderExp(raw);
        }
      } else {
        setHash('home');
      }
      return;
    }
    showView('home');
  }

  window.addEventListener('hashchange', route);

  /* ---------- 搜索 ---------- */
  const searchInput = $('#fxSearch');

  function doSearch(q){
    q = q.trim();
    lastQuery = q;
    if (!q){
      results.classList.remove('on');
      searchWrap.classList.remove('on');
      filterTree('');
      return;
    }
    searchWrap.classList.add('on');
    const kw = q.toLowerCase();
    const hits = META.index.filter(function(e){
      return (e.title + ' ' + e.num + ' ' + (e.material || '') + ' ' + (e.digest || ''))
        .toLowerCase().indexOf(kw) !== -1;
    });
    let html = '<div class="fx-results-head">找到 ' + hits.length + ' 个相关实验</div>';
    if (!hits.length){
      html += '<div class="fx-res-empty">换一个词试试，比如“气球”“大气压”“透镜”</div>';
    } else {
      hits.slice(0, 16).forEach(function(e){
        html += '<button class="fx-res-item" type="button" data-id="' + e.id + '">'
          + '<b>' + esc(e.title) + '</b>'
          + '<small>' + esc(e.num) + ' · 第' + e.ch + '章 ' + esc(chapterOf(e.ch).name) + '</small>'
          + '</button>';
      });
      if (hits.length > 16){
        html += '<div class="fx-res-empty">还有 ' + (hits.length - 16) + ' 个结果，再输入几个字缩小范围</div>';
      }
    }
    results.innerHTML = html;
    results.classList.add('on');
    filterTree(q);
  }

  function filterTree(q){
    const kw = (q || '').toLowerCase();
    $$('.fx-chblock', elTree).forEach(function(block){
      let visible = 0;
      $$('.fx-item', block).forEach(function(a){
        const meta = indexMap.get(a.dataset.id);
        let ok = true;
        if (kw && meta){
          ok = (meta.title + ' ' + meta.num + ' ' + (meta.material || '') + ' ' + (meta.digest || ''))
            .toLowerCase().indexOf(kw) !== -1;
        }
        a.parentNode.style.display = ok ? '' : 'none';
        if (ok) visible++;
      });
      block.style.display = visible ? '' : 'none';
      if (kw && visible) block.classList.add('open');
      if (!kw) block.classList.remove('open');
    });
    if (kw) expandChapter(Number((elSide.dataset.ch) || 0), true);
  }

  function closeDrawer(){
    elSide.classList.remove('open');
    elBackdrop.classList.remove('show');
  }
  $('#fxDrawerBtn').addEventListener('click', openDrawer);
  elBackdrop.addEventListener('click', closeDrawer);
  elTree.addEventListener('click', function(ev){
    if (ev.target.closest('.fx-item')) closeDrawer();
  });

  /* ---------- 解锁弹窗事件 ---------- */
  $('#fxModalX').addEventListener('click', closeUnlockModal);
  $('#fxUnlockBtn').addEventListener('click', doUnlock);
  $('#fxModal').addEventListener('click', function(ev){
    if (ev.target === this) closeUnlockModal();
  });
  $('#fxCodeInput').addEventListener('keydown', function(ev){
    if (ev.key === 'Enter'){ ev.preventDefault(); doUnlock(); }
  });
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape' && !$('#fxModal').hidden) closeUnlockModal();
  });
  $('#fxPreviewBtn').addEventListener('click', function(){
    saveUnlock({ code: 'PREVIEW', preview: true, note: '本地预览', at: Date.now() });
    applyUnlocked();
  });
  $('#fxLockBtn').addEventListener('click', function(){
    if (unlock){
      if (confirm('退出后本机恢复「只能看目录」，已绑定的设备名额不会自动释放。确定退出？')){
        clearUnlock();
        buildTree();
        updateLockBar();
        currentHash = '';
        route();
      }
    } else {
      openUnlockModal();
    }
  });

  /* ---------- 启动 ---------- */
  $('#fxSideStat').textContent = META.chapters.length + ' 章 · ' + META.total + ' 个实验';
  updateLockBar();
  buildTree();
  renderHome();
  expandChapter(1, true);
  route();
  verifyUnlock();
})();
</script>
</body>
</html>
