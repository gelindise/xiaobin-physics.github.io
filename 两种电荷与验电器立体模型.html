<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>两种电荷与验电器 · 3D 静电实验台 — 物理虚拟实验</title>
<script src="protect.js"></script>
<script src="auth-check.js"></script>
<style>
  :root{
    --bg:#020617; --panel:rgba(15,23,42,.72); --line:rgba(148,163,184,.16);
    --ink:#e2e8f0; --dim:#94a3b8; --dim2:#64748b;
    --blue:#38bdf8; --cyan:#22d3ee; --purple:#a78bfa; --green:#34d399;
    --amber:#fbbf24; --red:#f87171; --rose:#f43f5e;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1100px 620px at 12% -8%, rgba(56,189,248,.14), transparent 62%),
      radial-gradient(900px 560px at 88% 4%, rgba(167,139,250,.13), transparent 60%),
      radial-gradient(760px 520px at 50% 108%, rgba(34,211,238,.08), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.62; min-height:100vh;
  }
  .lab3d{max-width:1520px;margin:0 auto;padding:20px 18px 40px}
  .lab3d h1{margin:0;font-size:19px;letter-spacing:.3px;
    background:linear-gradient(120deg,#e2e8f0 10%,#7dd3fc 52%,#c4b5fd 92%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .lab3d-sub{margin:7px 0 16px;color:#93b4c4;font-size:12.5px;line-height:1.65}
  .lab3d-sub b{color:#a5f3fc;font-weight:700}
  .lab3d-sub .hl{color:#fcd34d;font-weight:700}

  /* 三栏：控制台 | 场景 | 读数 —— 控制台与实验画面【左右并排】，绝不放在画面下面 */
  .lab3d-layout{display:grid;gap:14px;align-items:start;
    grid-template-columns:294px minmax(0,1fr) 300px;
    grid-template-areas:"ctl scene read" "ctl lower read"}
  .lab3d-ctl{grid-area:ctl;display:flex;flex-direction:column;gap:11px;min-width:0}
  .lab3d-stage{grid-area:scene;position:relative;height:clamp(430px,62vh,620px);
    border:1px solid var(--line);border-radius:16px;overflow:hidden;overflow:clip;background:#050b18}
  .lab3d-lower{grid-area:lower;display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:11px}
  /* 读数栏 sticky 的行程 = 【所在网格区高】−【元素高】；区域高 == 元素高时行程为 0、
     sticky 静默失效。这里再限一个高度上限，保证它永远比区域矮一点。 */
  .lab3d-sidebar{grid-area:read;display:flex;flex-direction:column;gap:11px;min-width:0;
    position:sticky;top:16px;align-self:start;
    max-height:calc(100vh - 120px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}

  .lab3d-stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  .lab3d-stage canvas.grabbing{cursor:grabbing}
  .lab3d-stage canvas.hot{cursor:pointer}

  .stage-hint{position:absolute;left:12px;top:12px;max-width:60%;padding:7px 11px;border-radius:9px;
    background:rgba(2,6,23,.72);border:1px solid rgba(148,163,184,.22);color:#cbd5e1;font-size:11.5px;
    line-height:1.55;backdrop-filter:blur(6px);pointer-events:none}
  .stage-hint b{color:#7dd3fc}
  .stage-flag{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;padding:7px 14px;border-radius:999px;
    font-size:12px;font-weight:700;background:rgba(120,53,15,.78);border:1px solid rgba(251,191,36,.6);
    color:#fef3c7;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:88%;
    overflow:hidden;text-overflow:ellipsis}
  .stage-flag.show{opacity:1}
  .stage-flag.good{background:rgba(6,78,59,.75);border-color:rgba(52,211,153,.6);color:#d1fae5}
  .stage-flag.bad{background:rgba(127,29,29,.75);border-color:rgba(248,113,113,.6);color:#fee2e2}
  .stage-toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 18px;border-radius:12px;
    background:rgba(2,6,23,.9);border:1px solid rgba(56,189,248,.45);color:#e0f2fe;font-size:13px;font-weight:600;
    opacity:0;transition:opacity .22s;pointer-events:none;max-width:78%;text-align:center}
  .stage-toast.show{opacity:1}

  .stage-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;
    gap:10px;padding:10px 12px;pointer-events:none}
  .stage-bar .bar-left{display:flex;align-items:center;gap:7px;flex-wrap:wrap;pointer-events:auto}
  .stage-bar .stage-help{font-size:11px;color:#7b93a6;text-align:right;max-width:44%;line-height:1.5}
  .stage-btn{padding:7px 12px;border-radius:10px;border:1px solid rgba(148,163,184,.3);
    background:rgba(15,23,42,.88);color:#cbd5e1;font-size:12px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:all .18s;display:inline-flex;align-items:center;gap:6px}
  .stage-btn:hover{background:rgba(30,41,59,.95);color:#e2e8f0}
  .stage-btn.on{border-color:rgba(56,189,248,.6);background:linear-gradient(135deg,rgba(56,189,248,.3),rgba(34,211,238,.2));color:#e0f2fe}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;
    backdrop-filter:blur(8px);min-width:0}
  .panel h3{margin:0 0 9px;font-size:13px;color:#cbd5e1;display:flex;align-items:center;gap:8px;font-weight:700}
  .panel h3 .pill{margin-left:auto}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;
    background:rgba(148,163,184,.14);border:1px solid rgba(148,163,184,.28);color:#cbd5e1;white-space:nowrap}
  .pill.ok{background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.4);color:#6ee7b7}
  .pill.bad{background:rgba(248,113,113,.16);border-color:rgba(248,113,113,.42);color:#fca5a5}
  .pill.warn{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.36);color:#fcd34d}
  .pill.pos{background:rgba(248,113,113,.16);border-color:rgba(248,113,113,.42);color:#fca5a5}
  .pill.neg{background:rgba(56,189,248,.16);border-color:rgba(56,189,248,.42);color:#7dd3fc}
  .pill.zero{background:rgba(100,116,139,.18);border-color:rgba(100,116,139,.4);color:#94a3b8}

  .btn-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .btn-row button{flex:1;min-width:60px;padding:8px 9px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:#cbd5e1;font-size:12px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:all .18s}
  .btn-row button:hover{background:rgba(255,255,255,.09);color:#e2e8f0}
  .btn-row button.on{background:linear-gradient(135deg,rgba(56,189,248,.28),rgba(34,211,238,.22));
    border-color:rgba(56,189,248,.5);color:#e0f2fe}
  .mode-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .mode-row button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 9px;border-radius:10px;
    border:1px solid var(--line);background:rgba(255,255,255,.04);color:#cbd5e1;font-size:12px;font-weight:600;
    cursor:pointer;font-family:inherit;transition:all .18s;text-align:left;line-height:1.35}
  .mode-row button:hover{background:rgba(255,255,255,.09);color:#e2e8f0}
  .mode-row button.on{background:linear-gradient(135deg,rgba(56,189,248,.28),rgba(34,211,238,.22));
    border-color:rgba(56,189,248,.5);color:#e0f2fe}
  .mode-row button i{font-style:normal;font-size:10.5px;color:#7b93a6;font-weight:500}
  .mode-row button.on i{color:#a5f3fc}

  .readouts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .readouts > div{background:rgba(255,255,255,.035);border-radius:9px;padding:6px 8px;text-align:center}
  .readouts span{display:block;font-size:10.5px;color:var(--dim2)}
  .readouts b{font-size:14.5px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .readouts .zero b{color:#64748b}
  .readouts .pos b{color:#fca5a5}
  .readouts .neg b{color:#7dd3fc}

  .datagrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .datagrid > div{background:rgba(255,255,255,.035);border-radius:9px;padding:6px 8px}
  .datagrid span{display:block;font-size:10.5px;color:var(--dim2)}
  .datagrid b{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}

  .note{margin:9px 0 0;font-size:11.5px;color:var(--dim);line-height:1.6}
  .note b{color:#cbd5e1}
  .note.warn{border-left:2px solid rgba(251,191,36,.6);padding-left:9px;color:#fcd34d}
  .note.bad{border-left:2px solid rgba(248,113,113,.65);padding-left:9px;color:#fca5a5}
  .note.good{border-left:2px solid rgba(52,211,153,.6);padding-left:9px;color:#6ee7b7}

  .chk{list-style:none;margin:0;padding:0;font-size:12px}
  .chk li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;color:#cbd5e1;line-height:1.55}
  .chk li.no{color:#fca5a5}
  .chk li.yes{color:#a7f3d0}
  .chk li.wait{color:#94a3b8}
  .chk li .mk{flex:0 0 auto;font-weight:800}

  .eq{display:inline-block;background:rgba(2,6,23,.62);border:1px solid rgba(148,163,184,.2);
    border-radius:7px;padding:1px 8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;color:#7dd3fc}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px;color:var(--dim)}
  .kv b{color:#cbd5e1;font-weight:600;text-align:right}

  .mtable{width:100%;border-collapse:collapse;font-size:11.5px}
  .mtable th{text-align:left;color:var(--dim2);font-weight:600;padding:3px 5px;border-bottom:1px solid rgba(148,163,184,.16)}
  .mtable td{padding:3px 5px;color:#cbd5e1;border-bottom:1px solid rgba(148,163,184,.07)}
  .mtable td.n{font-variant-numeric:tabular-nums}
  .mtable tr.done td{color:#6ee7b7}

  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:8px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .legend .ip{background:linear-gradient(135deg,#fca5a5,#f87171)}
  .legend .in{background:linear-gradient(135deg,#7dd3fc,#38bdf8)}
  .legend .iz{background:linear-gradient(135deg,#94a3b8,#64748b)}

  @media (max-width:1180px){
    .lab3d-layout{grid-template-columns:270px minmax(0,1fr);
      grid-template-areas:"ctl scene" "ctl lower" "read read"}
    .lab3d-sidebar{position:static;max-height:none}
  }
  @media (max-width:820px){
    .lab3d-layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"ctl" "scene" "read" "lower"}
    .lab3d-stage{height:clamp(360px,52vh,520px)}
  }
</style>

<body>
<div class="lab3d">
  <h1>两种电荷与验电器 · 3D 静电实验台</h1>
  <p class="lab3d-sub">
    一张真实的实验台，四种静电实验。所有器材都<b>直接用手操作</b>：拖动丝绸去擦玻璃棒、把带电棒移到小球旁边、
    让带电棒靠近或接触验电器的金属球、把测试物件架到两个金属夹之间。
    电荷不会凭空产生——<span class="hl">摩擦时两件物体得到的是等量异种电荷</span>，验电器的张角则如实反映它身上有多少电荷。
  </p>

  <div class="lab3d-layout">
    <div class="lab3d-ctl" id="st-ctl"></div>

    <div class="lab3d-stage" id="st-stage">
      <canvas id="st-canvas"></canvas>
      <div class="stage-hint" id="st-hint"></div>
      <div class="stage-flag" id="st-flag"></div>
      <div class="stage-toast" id="st-toast"></div>
      <div class="stage-bar">
        <div class="bar-left" id="st-viewbtns"></div>
        <div class="stage-help" id="st-help"></div>
      </div>
    </div>

    <div class="lab3d-sidebar" id="st-side"></div>
    <div class="lab3d-lower" id="st-lower"></div>
  </div>
</div>

<script>
(function(){
'use strict';

// ============================================================
// 向量小工具
// ============================================================
function add(a,b){ return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]; }
function sub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
function scl(a,k){ return [a[0]*k,a[1]*k,a[2]*k]; }
function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function len(a){ return Math.hypot(a[0],a[1],a[2]); }
function norm(a){ var L=len(a)||1; return [a[0]/L,a[1]/L,a[2]/L]; }
function mix(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function dist(a,b){ return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }

// ============================================================
// 3D：相机 / 投影（与旗舰页同一套）
// ============================================================
var cvs = document.getElementById('st-canvas');
var ctx = cvs.getContext('2d');
var W = 900, H = 600, DPR = 1, cam = null;

function envelopePoints(pts,q){
  var loR=Infinity,hiR=-Infinity,loU=Infinity,hiU=-Infinity;
  for(var i=0;i<pts.length;i++){
    var d=sub(pts[i],q.eye), r=dot(d,q.right), u=dot(d,q.up);
    if(r<loR)loR=r; if(r>hiR)hiR=r; if(u<loU)loU=u; if(u>hiU)hiU=u;
  }
  return {loR:loR,hiR:hiR,loU:loU,hiU:hiU};
}
function project(p,q){
  q = q || cam;
  var d = sub(p, q.eye);
  var z = Math.max(dot(d,q.fwd), 0.02);
  var s = q.focal / z;
  return {x: q.cx + dot(d,q.right)*s, y: q.cy - dot(d,q.up)*s, z: z, s: s};
}
// 自动取景：包络角点投影后铺满画布，再迭代把【屏幕包围盒中心】对到画布中心。
// ⚠️ 居中的对象是屏幕包围盒的中心，不是「包络中心点的投影」—— 透视下两者不是同一点。
function buildCam(){
  var q = {};
  q.azim = state.azim; q.elev = clamp(state.elev,-85,85);
  q.cx = W/2; q.cy = H/2;
  var az = q.azim*Math.PI/180, el = q.elev*Math.PI/180;
  var dir = [Math.cos(el)*Math.sin(az), Math.sin(el), Math.cos(el)*Math.cos(az)];
  var E = env();
  var envC = [ (E.x0+E.x1)/2, (E.y0+E.y1)/2, (E.z0+E.z1)/2 ];
  q.dist = 250;
  q.eye = add(envC, scl(dir,q.dist));
  q.fwd = scl(dir,-1);
  q.right = norm(cross(q.fwd,[0,1,0]));
  q.up = cross(q.right,q.fwd);
  var pts = envPoints();
  var e = envelopePoints(pts,q);
  q.focal = Math.min( W*0.93/Math.max(0.001,e.hiR-e.loR), H*0.88/Math.max(0.001,e.hiU-e.loU) ) * q.dist;
  for(var it=0; it<3; it++){
    var x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
    for(var i=0;i<pts.length;i++){
      var s2=project(pts[i],q);
      if(s2.x<x0)x0=s2.x; if(s2.x>x1)x1=s2.x;
      if(s2.y<y0)y0=s2.y; if(s2.y>y1)y1=s2.y;
    }
    q.cx += W/2 - (x0+x1)/2;
    q.cy += H/2 - (y0+y1)/2;
    var k = Math.min( W*0.93/Math.max(1,x1-x0), H*0.88/Math.max(1,y1-y0) );
    if(Math.abs(k-1) < 1e-9) break;
    q.focal *= k;
  }
  q.focal *= state.zoom;
  cam = q;
  return q;
}
// 屏幕点 → 台面（y = yPlane）上的世界点。**dir 不能归一化** —— 归一化会破坏
// dot(dir,right)=dx / dot(dir,up)=dy / dot(dir,fwd)=1 这三个比例。
function pickPlane(sx, sy, yPlane, q){
  q = q || cam;
  yPlane = (yPlane === undefined) ? 0 : yPlane;
  var dx=(sx-q.cx)/q.focal, dy=(q.cy-sy)/q.focal;
  var dir = add(add(scl(q.right,dx), scl(q.up,dy)), q.fwd);
  var den = dir[1];
  if(Math.abs(den) < 1e-6) return null;
  var t = (yPlane - q.eye[1]) / den;
  if(!(t>0)) return null;
  return [q.eye[0]+dir[0]*t, yPlane, q.eye[2]+dir[2]*t];
}

// ---------------- 绘制小工具 ----------------
var LIGHT = norm([-0.52, 0.80, 0.30]);
function shadeHex(hex,f){
  var n=parseInt(hex.slice(1),16);
  function ch(v){ return Math.max(0, Math.min(255, Math.round(v*f))); }
  return 'rgb('+ch((n>>16)&255)+','+ch((n>>8)&255)+','+ch(n&255)+')';
}
function shade(fill,n){
  if(typeof fill!=='string' || fill.charAt(0)!=='#') return fill;
  return shadeHex(fill, 0.60 + 0.44*Math.max(0, dot(n,LIGHT)));
}
function mixHex(a, b, t){
  t = clamp(t,0,1);
  var na = parseInt(a.slice(1),16), nb = parseInt(b.slice(1),16);
  var r = Math.round(((na>>16)&255) + (((nb>>16)&255) - ((na>>16)&255))*t);
  var g = Math.round(((na>>8)&255)  + (((nb>>8)&255)  - ((na>>8)&255))*t);
  var bl= Math.round((na&255)       + ((nb&255)       - (na&255))*t);
  return 'rgb('+r+','+g+','+bl+')';
}
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r); c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h); c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r); c.arcTo(x,y,x+r,y,r); c.closePath();
}
function polyPath(pts,c){
  c.beginPath();
  for(var i=0;i<pts.length;i++){ if(i) c.lineTo(pts[i].x,pts[i].y); else c.moveTo(pts[i].x,pts[i].y); }
  c.closePath();
}
function poly(pts,fill,stroke,lw,c){
  if(pts.length<2) return;
  polyPath(pts,c);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1; c.stroke(); }
}
function dot2(p,r,fill,c){ c.beginPath(); c.arc(p.x,p.y,Math.max(0.4,r),0,Math.PI*2); c.fillStyle=fill; c.fill(); }
function seg(a,b,stroke,lw,c,dash){
  c.save();
  if(dash) c.setLineDash(dash);
  c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y);
  c.strokeStyle=stroke; c.lineWidth=lw||1; c.stroke();
  c.restore();
}
function textAt(p,txt,font,color,c,align,baseline){
  c.font=font; c.fillStyle=color; c.textAlign=align||'center'; c.textBaseline=baseline||'middle';
  c.fillText(txt,p.x,p.y);
}
function ringPts(cx,y,cz,r,q,n){
  n=n||48; var out=[];
  for(var i=0;i<n;i++){ var a=i/n*Math.PI*2; out.push(project([cx+r*Math.cos(a), y, cz+r*Math.sin(a)], q)); }
  return out;
}
function ringExtremes(pts){
  var iL=0,iR=0;
  for(var i=1;i<pts.length;i++){ if(pts[i].x<pts[iL].x)iL=i; if(pts[i].x>pts[iR].x)iR=i; }
  return [iL,iR];
}
// 沿环取 iA→iB 的两条弧之一：wantFront=true 取【离相机近】的那条（屏幕平均 z 小）。
function arcPick(c,pts,iA,iB,moveFirst,wantFront){
  var N=pts.length, pathA=[], pathB=[], i;
  for(i=iA;;i=(i+1)%N){ pathA.push(i); if(i===iB) break; }
  for(i=iA;;i=(i-1+N)%N){ pathB.push(i); if(i===iB) break; }
  function avgZ(p){ var s=0; for(var k=0;k<p.length;k++) s+=pts[p[k]].z; return s/p.length; }
  var aFront = avgZ(pathA) <= avgZ(pathB);
  var path = (aFront === !!wantFront) ? pathA : pathB;
  if(moveFirst) c.moveTo(pts[path[0]].x, pts[path[0]].y);
  else c.lineTo(pts[path[0]].x, pts[path[0]].y);
  for(var k=1;k<path.length;k++) c.lineTo(pts[path[k]].x, pts[path[k]].y);
  return path;
}
function frontArc(c,pts,iA,iB,moveFirst){ return arcPick(c,pts,iA,iB,moveFirst,true); }
function backArc(c,pts,iA,iB,moveFirst){ return arcPick(c,pts,iA,iB,moveFirst,false); }
// 竖直圆柱的实体（侧面 + 前半个上端面）—— 台面圆盘 / 底座用它
function cylSolid(cx,y0,y1,cz,r,q,c,fill,stroke,lw){
  var p0=ringPts(cx,y0,cz,r,q), p1=ringPts(cx,y1,cz,r,q);
  var e0=ringExtremes(p0), e1=ringExtremes(p1);
  c.beginPath();
  frontArc(c,p1,e1[0],e1[1],true);
  c.lineTo(p0[e0[1]].x, p0[e0[1]].y);
  frontArc(c,p0,e0[1],e0[0],false);
  c.closePath();
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1; c.stroke(); }
}
function cylTop(cx,y,cz,r,q,c,fill,stroke,lw){
  var p=ringPts(cx,y,cz,r,q); polyPath(p,c);
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1; c.stroke(); }
}
function sphereAt(p,r,q,c,fill,stroke,lw){
  var pr=project(p,q), R=r*q.focal/Math.max(pr.z,0.02);
  dot2(pr, R, fill, c);
  if(stroke){ c.beginPath(); c.arc(pr.x,pr.y,Math.max(0.4,R),0,Math.PI*2); c.strokeStyle=stroke; c.lineWidth=lw||1; c.stroke(); }
}
function boxSolid(cx,cy,cz,hx,hy,hz,q,c,fill,stroke,lw){
  var V=[];
  for(var i=0;i<8;i++) V.push([cx+((i&1)?hx:-hx), cy+((i&2)?hy:-hy), cz+((i&4)?hz:-hz)]);
  var F=[
    {idx:[0,1,3,2], n:[0,0,-1]}, {idx:[4,5,7,6], n:[0,0,1]},
    {idx:[0,1,5,4], n:[0,-1,0]}, {idx:[2,3,7,6], n:[0,1,0]},
    {idx:[0,2,6,4], n:[-1,0,0]}, {idx:[1,3,7,5], n:[1,0,0]}
  ];
  var vis=[];
  for(var k=0;k<F.length;k++){
    var f=F[k], fc=[0,0,0];
    for(var m=0;m<4;m++) fc=add(fc,V[f.idx[m]]);
    fc=scl(fc,0.25);
    if(dot(f.n, sub(q.eye,fc)) <= 0) continue;
    vis.push({f:f, z:dot(sub(fc,q.eye),q.fwd)});
  }
  vis.sort(function(a,b){ return b.z-a.z; });
  for(var j=0;j<vis.length;j++){
    var pts=[];
    for(var t=0;t<4;t++) pts.push(project(V[vis[j].f.idx[t]],q));
    poly(pts, shade(fill, vis[j].f.n), stroke, lw, c);
  }
}

/* ==================================================================
   真三维几何原语（与旗舰页同一套）
   ----------------------------------------------------------------
   圆柱走 cylAxis()（两端圆 + 屏幕公切线侧影），球走 sphereShaded()
   （偏光心的径向渐变 + 高光），任意取向的板 / 盒走 slabBox()
   （六个面按外法线剔除 + 面心深度排序）。
   ================================================================== */
function lightScreen(q){
  var x = dot(LIGHT, q.right), y = -dot(LIGHT, q.up);
  var L = Math.hypot(x,y) || 1;
  return [x/L, y/L];
}
function matGrad(c, x0,y0,x1,y1, stops){
  var g = c.createLinearGradient(x0,y0,x1,y1);
  for(var i=0;i<stops.length;i++) g.addColorStop(stops[i][0], stops[i][1]);
  return g;
}
function matAt(c, mx,my, dx,dy, R, stops){
  R = Math.max(0.5, R);
  return matGrad(c, mx-dx*R, my-dy*R, mx+dx*R, my+dy*R, stops);
}
function bboxOf(pts){
  var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(var i=0;i<pts.length;i++){
    if(pts[i].x<x0)x0=pts[i].x; if(pts[i].x>x1)x1=pts[i].x;
    if(pts[i].y<y0)y0=pts[i].y; if(pts[i].y>y1)y1=pts[i].y;
  }
  return {x0:x0,y0:y0,x1:x1,y1:y1,w:x1-x0,h:y1-y0,cx:(x0+x1)/2,cy:(y0+y1)/2};
}
function basisFor(d){
  d = norm(d);
  var ref = Math.abs(d[1]) < 0.85 ? [0,1,0] : [1,0,0];
  var u = norm(cross(d,ref));
  return [u, cross(d,u)];
}
function circlePts(c0, u, v, r, q, n){
  n = n || 36; var out=[];
  for(var i=0;i<n;i++){
    var a = i/n*Math.PI*2, ca = Math.cos(a)*r, sa = Math.sin(a)*r;
    out.push(project([c0[0]+u[0]*ca+v[0]*sa, c0[1]+u[1]*ca+v[1]*sa, c0[2]+u[2]*ca+v[2]*sa], q));
  }
  return out;
}
function primBump(k){
  if(!drawn.prim) drawn.prim = { cyl:0, sph:0, slab:0, box:0 };
  drawn.prim[k]++;
}
// 任意方向圆柱：a → b，半径 r。侧影 = 两端圆在屏幕上的公切线（凸包），端面 = 朝向相机的那个圆。
function cylAxis(a, b, r, q, c, stops, opt){
  opt = opt || {};
  var dv = sub(b,a), L = Math.hypot(dv[0],dv[1],dv[2]);
  // 位置算成 NaN 时【别】退化成球：那会让 createRadialGradient 抛错、整帧渲染中断，
  // 页面看上去「什么都没画」而控制台只说了一句 gradient 非有限值。这里记一笔就跳过。
  if(!isFinite(L) || !isFinite(r)){ drawn.badGeom = (drawn.badGeom||0)+1; return; }
  if(!(L > 1e-6)){ sphereShaded(a, r, q, c, stops, opt); return; }
  primBump('cyl');
  var d = scl(dv, 1/L);
  var pa = project(a,q), pb = project(b,q);
  var dx = pb.x-pa.x, dy = pb.y-pa.y, dl = Math.hypot(dx,dy);
  var ra = r*q.focal/Math.max(pa.z,0.02), rb = r*q.focal/Math.max(pb.z,0.02);
  var ls = lightScreen(q);
  if(dl > 0.7){
    var ux = dx/dl, uy = dy/dl, nx = -uy, ny = ux;
    if(ls[0]*nx + ls[1]*ny < 0){ nx = -nx; ny = -ny; }
    poly([{x:pa.x-nx*ra, y:pa.y-ny*ra}, {x:pb.x-nx*rb, y:pb.y-ny*rb},
          {x:pb.x+nx*rb, y:pb.y+ny*rb}, {x:pa.x+nx*ra, y:pa.y+ny*ra}],
         matAt(c, (pa.x+pb.x)/2, (pa.y+pb.y)/2, nx, ny, Math.max(ra,rb), stops),
         opt.stroke || null, opt.lw || 1, c);
  }
  var uv = basisFor(d);
  var capEnd = dot(d, sub(q.eye, b)) > 0 ? b : a;
  var ring = circlePts(capEnd, uv[0], uv[1], r, q, 40);
  var bb = bboxOf(ring);
  polyPath(ring, c);
  c.fillStyle = matAt(c, bb.cx, bb.cy, ls[0], ls[1], Math.max(bb.w,bb.h)/2, stops);
  c.fill();
  if(opt.stroke){ c.strokeStyle = opt.stroke; c.lineWidth = opt.lw||1; c.stroke(); }
}
function sphereShaded(p, r, q, c, stops, opt){
  opt = opt || {};
  primBump('sph');
  var pr = project(p,q), R = r*q.focal/Math.max(pr.z,0.02);
  if(R < 0.7){ dot2(pr, Math.max(0.5,R), stops[Math.floor(stops.length/2)][1], c); return pr; }
  var ls = lightScreen(q);
  var g = c.createRadialGradient(pr.x-ls[0]*R*0.40, pr.y-ls[1]*R*0.40, R*0.03,
                                 pr.x, pr.y, R*1.02);
  for(var i=0;i<stops.length;i++) g.addColorStop(stops[i][0], stops[i][1]);
  c.beginPath(); c.arc(pr.x, pr.y, R, 0, Math.PI*2);
  c.fillStyle = g; c.fill();
  if(opt.rim){ c.strokeStyle = opt.rim; c.lineWidth = opt.lw||1; c.stroke(); }
  if(opt.spec){
    c.beginPath();
    c.ellipse(pr.x-ls[0]*R*0.42, pr.y-ls[1]*R*0.42, R*0.20, R*0.13, 0, 0, Math.PI*2);
    c.fillStyle = opt.spec; c.fill();
  }
  return pr;
}
// 任意取向的扁盒：中心 ctr，三个半轴向量 e0/e1/e2（长度 = 半长）。
function slabBox(ctr, e0, e1, e2, q, c, fill, stroke, lw, stops){
  primBump('slab');
  var E = [e0,e1,e2], faces = [];
  for(var i=0;i<3;i++){
    var j = (i+1)%3, k = (i+2)%3;
    var Li = Math.hypot(E[i][0],E[i][1],E[i][2]);
    if(Li < 1e-9) continue;
    var n = scl(E[i], 1/Li);
    for(var s=1;s>=-1;s-=2){
      var fc = add(ctr, scl(E[i], s));
      var sn = scl(n, s);
      if(dot(sn, sub(q.eye, fc)) <= 0) continue;
      var P = [];
      for(var u=1;u>=-1;u-=2) for(var v=1;v>=-1;v-=2)
        P.push(project(add(add(ctr, scl(E[i], s)), add(scl(E[j],u), scl(E[k],v))), q));
      faces.push({ n:sn, z:dot(sub(fc,q.eye), q.fwd), pts:[P[0],P[1],P[3],P[2]] });
    }
  }
  faces.sort(function(a,b){ return b.z-a.z; });
  var ls = lightScreen(q);
  for(var m=0;m<faces.length;m++){
    var f = faces[m], bb = bboxOf(f.pts), g = null;
    if(stops && stops[0] && typeof stops[0][1] === 'string') g = matAt(c, bb.cx, bb.cy, ls[0], ls[1], Math.max(bb.w,bb.h)/2, stops);
    poly(f.pts, g || shade(fill, f.n), stroke, lw, c);
  }
}
function box3(cx,cy,cz, hx,hy,hz, q,c, fill,stroke,lw,stops){
  primBump('box');
  slabBox([cx,cy,cz], [hx,0,0], [0,hy,0], [0,0,hz], q,c, fill,stroke,lw,stops);
}

// ---------------- 标签系统 ----------------
var frameBoxes=[], labelQ=[], drawnLabels=[], domBoxList=[];
function textW(text,font){ ctx.save(); ctx.font=font; var w=ctx.measureText(text).width; ctx.restore(); return w; }
function clampBox(b){
  b.x = clamp(b.x, 6, Math.max(6, W-b.w-6));
  b.y = clamp(b.y, 6, Math.max(6, H-b.h-6));
  return b;
}
function overlapArea(a,b){
  var x = Math.max(0, Math.min(a.x+a.w,b.x+b.w) - Math.max(a.x,b.x));
  var y = Math.max(0, Math.min(a.y+a.h,b.y+b.h) - Math.max(a.y,b.y));
  return x*y;
}
function costOf(b){
  var cost = 0;
  for(var i=0;i<frameBoxes.length;i++) cost += (frameBoxes[i].weight||1) * overlapArea(b,frameBoxes[i]);
  return cost;
}
function bestLabel(ax,ay,text,font,color,weight){
  var w=textW(text,font)+16, h=20, cands=[];
  for(var ringN=0; ringN<16; ringN++){
    var R=ringN*14;
    for(var k=0;k<16;k++){
      var a=k/16*Math.PI*2;
      cands.push(clampBox({x: ax+Math.cos(a)*R+(R?7:10), y: ay+Math.sin(a)*R-h/2, w:w, h:h}));
    }
  }
  var best=cands[0], bestC=Infinity;
  for(var i=0;i<cands.length;i++){
    var cc = costOf(cands[i]);
    if(cc < bestC - 1e-6){ bestC = cc; best = cands[i]; if(cc === 0) break; }
  }
  var box = best;
  frameBoxes.push({x:box.x,y:box.y,w:box.w,h:box.h,weight:weight||2});
  labelQ.push({box:box, text:text, font:font, ax:ax, ay:ay, color:color||'#e2e8f0'});
  return box;
}
function flushLabels(c){
  for(var i=0;i<labelQ.length;i++){
    var L=labelQ[i], b=L.box, cx=b.x+b.w/2, cy=b.y+b.h/2;
    if(Math.hypot(cx-L.ax, cy-L.ay) > 26){
      c.beginPath(); c.moveTo(L.ax,L.ay); c.lineTo(cx,cy);
      c.strokeStyle='rgba(148,163,184,.4)'; c.lineWidth=1; c.stroke();
    }
    rr(c,b.x,b.y,b.w,b.h,7);
    c.fillStyle='rgba(2,6,23,.86)'; c.fill();
    c.strokeStyle='rgba(148,163,184,.3)'; c.lineWidth=1; c.stroke();
    c.fillStyle=L.color; c.font=L.font; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(L.text, cx, cy+0.5);
    drawnLabels.push({x:b.x,y:b.y,w:b.w,h:b.h});
  }
}
function pointInPoly(x, y, polyPts){
  var inside=false;
  for(var i=0,j=polyPts.length-1;i<polyPts.length;j=i++){
    var xi=polyPts[i].x, yi=polyPts[i].y, xj=polyPts[j].x, yj=polyPts[j].y;
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/((yj-yi)||1e-9)+xi)) inside=!inside;
  }
  return inside;
}
function boxScreenHull(ctr, e0, e1, e2, q){
  var out=[];
  for(var a=1;a>=-1;a-=2) for(var b=1;b>=-1;b-=2) for(var d=1;d>=-1;d-=2){
    var p = add(ctr, add(scl(e0,a), add(scl(e1,b), scl(e2,d))));
    var s = project(p,q); out.push({x:s.x,y:s.y});
  }
  return out;
}
function hull2(pts){
  var P = pts.slice().sort(function(a,b){ return a.x-b.x || a.y-b.y; });
  if(P.length<3) return P;
  function cr(o,a,b){ return (a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x); }
  var lo=[], up=[];
  for(var i=0;i<P.length;i++){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],P[i])<=0) lo.pop(); lo.push(P[i]); }
  for(var j=P.length-1;j>=0;j--){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],P[j])<=0) up.pop(); up.push(P[j]); }
  lo.pop(); up.pop();
  return lo.concat(up);
}

// ============================================================
// 物理常量与模型
// ------------------------------------------------------------
// 电荷量一律以【纳库仑 nC】为单位在页面里流转，只在这一处换算成库仑。
// ============================================================
var NC = 1e-9;                  // 1 nC = 1e-9 C
var K_E = 9e9;                  // 库仑常量 N·m²/C²
var E_CHARGE = 1.6e-19;         // 元电荷 C
var G_ACC = 9.8;

var Q_STROKE = 4.8;             // 一次摩擦转移的电荷量 (nC)
var RUB_LEN  = 9.0;             // 沿棒每滑过 9 cm 算一次「摩擦」(cm)
var K_IND    = 0.30;            // 感应起电：棒电荷的 30% 等效出现在金箔上
var D_NEAR   = 9.0;             // 感应起作用的距离 (cm)
// 接触起电：两个导体接触后电荷重新分配，分配比例由【电容】决定。
// 把验电器与棒看成两个相同的导体（电容比 1:1）⇒ 平分，这正是教材里的结论。
// 用「平分」而不是「每次转移固定比例」还有一个好处：接触一次就到位，
// 不会出现「手一直按着，电荷一帧一帧往上涨」这种不像现实的行为。
var SCOPE_CAP = 1.0;
function contactShare(Qs, Qr){
  var t = SCOPE_CAP/(SCOPE_CAP + 1);
  var tot = Qs + Qr;
  return { scope: tot*t, rod: tot*(1-t) };
}

// 摩擦电序列：越靠前越容易【失去】电子 —— 摩擦后带正电。
var SERIES = ['fur','glass','silk','wood','rubber','plastic'];
var SERIES_CN = { fur:'毛皮', glass:'玻璃', silk:'丝绸', wood:'木材', rubber:'橡胶', plastic:'塑料' };
function seriesIdx(m){ var i = SERIES.indexOf(m); return i < 0 ? 0 : i; }

// 金箔：质量 m、长 L，绕顶端铰链张开 θ。
//   两片箔各带 Q/2，视作集中在箔的质心（距铰链 L/2）⇒ 间距 d = L·sinθ
//   斥力矩 = k(Q/2)²/d² · (L/2)cosθ ，重力矩 = m g (L/2) sinθ
//   平衡 ⇒ sin³θ / cosθ = k Q² / (4 m g L²) ≡ A
// f(θ) = sin³θ − A·cosθ 在 [0°,90°) 上严格单调增 ⇒ 二分法有唯一解；
// 且 ∂θ/∂A = cosθ / f′(θ) > 0 ⇒ 张角随 |Q| 【严格单调增】（这就是本页的判分点）。
var LEAF_M = 1e-6;              // 1 mg
var LEAF_L = 0.055;             // 5.5 cm
function leafA(Qn){ return K_E*Math.pow(Qn*NC,2) / (4*LEAF_M*G_ACC*LEAF_L*LEAF_L); }
function leafResid(theta, A){ var s=Math.sin(theta); return s*s*s - A*Math.cos(theta); }
function leafAngle(Qn){
  var A = leafA(Qn);
  if(!(A > 1e-12)) return 0;
  var lo = 0, hi = Math.PI/2*0.999;
  if(leafResid(hi, A) < 0) return hi;            // A 极大时张角趋近 90°
  for(var i=0;i<64;i++){
    var mid=(lo+hi)/2;
    if(leafResid(mid, A) < 0) lo=mid; else hi=mid;
  }
  return (lo+hi)/2;
}

// 悬挂小球的库仑摆平衡：tanθᵢ = Fᵢₓ/(m g)，位置与力互相依赖 ⇒ 不动点迭代。
var BALL_M  = 5e-5;             // 0.05 g（轻质小球）
var BALL_R  = 1.35;             // cm
var BALL_L  = 22.0;             // 丝线长 cm
var Q_BALL  = 40.0;             // 小球「1 份电量」= 40 nC
// ⚠️ 悬挂点的 y 必须【正好落在横梁下沿】（IR_FRAME.h − 0.5）：丝线的顶端就画在那里。
//    悬挂点比它低的时候，画出来的丝线长度 = 32.5 − 球心 y，比 BALL_L 长一截 ——
//    绷紧的线不可能比自身长，看上去就是一根被拉长的线，而角度公式却仍然是对的。
function ballPivots(){ var y = IR_FRAME.h - 0.5; return [[-6.0, y, 0.0], [6.0, y, 0.0]]; }
// 给定两个偏角，算出两球的球心世界坐标
function ballPos(th1, th2){
  var P = ballPivots();
  return [
    [P[0][0] + BALL_L*Math.sin(th1), P[0][1] - BALL_L*Math.cos(th1), 0],
    [P[1][0] + BALL_L*Math.sin(th2), P[1][1] - BALL_L*Math.cos(th2), 0]
  ];
}
// 两个点电荷之间的库仑力（N），返回作用在 a 上的力矢量。
// ⚠️ 世界单位是【厘米】，库仑定律要【米】—— 漏掉这个 1e-2 会让力小 10⁴ 倍，
//    小球看上去「一点都不动」，而所有角度公式本身还是对的。
function coulombF(pa, qa, pb, qb){
  var dv = sub(pa, pb), rcm = len(dv);
  if(!(rcm > 1e-9) || Math.abs(qa) < 1e-12 || Math.abs(qb) < 1e-12) return [0,0,0];
  var r = rcm*1e-2;
  var F = K_E * (qa*NC) * (qb*NC) / (r*r);
  return scl(scl(dv, 1/rcm), F);
}
// 带电棒对小球的力：棒的电荷沿 22 cm 的棒【均匀分布】，不是全部堆在尖端一个点上。
// 只用尖端点电荷时，棒贴近小球（3 cm）算出来的力比真实大 8 倍 ——
// 点电荷 ∝ 1/d²，均匀线电荷 ∝ 1/(d(d+L))，比值 = d/(d+L) ≈ 3/25。
// 结果就是「棒一挪近，小球立刻被吸到极限摆角」，看着像开关，而不是连续变化。
var ROD_SEG = 9;
function rodForce(pa, qa, rod){
  var F = [0,0,0];
  if(!rod || Math.abs(rod.q) < 1e-12 || Math.abs(qa) < 1e-12) return F;
  var half = rod.L/2, y = (rod.y === undefined) ? 0.62 : rod.y, qi = rod.q/ROD_SEG;
  for(var i=0;i<ROD_SEG;i++){
    var x = rod.wx - half + rod.L*(i+0.5)/ROD_SEG;
    F = add(F, coulombF(pa, qa, [x, y, rod.wz], qi));
  }
  return F;
}
// 求解两球平衡角（含可选的外来电棒）。返回 {th1, th2, pos, conv}
function ballEquilibrium(q1, q2, rod){
  var th1 = 0, th2 = 0, it, conv = false;
  for(it=0; it<240; it++){
    var p = ballPos(th1, th2);
    var f1 = [0,0,0], f2 = [0,0,0];
    var c = coulombF(p[0], q1, p[1], q2); f1 = add(f1, c); f2 = sub(f2, c);
    if(rod && Math.abs(rod.q) > 1e-12){
      f1 = add(f1, rodForce(p[0], q1, rod));
      f2 = add(f2, rodForce(p[1], q2, rod));
    }
    var n1 = Math.atan(f1[0]/(BALL_M*G_ACC));
    var n2 = Math.atan(f2[0]/(BALL_M*G_ACC));
    n1 = clamp(n1, -BALL_TH_MAX, BALL_TH_MAX); n2 = clamp(n2, -BALL_TH_MAX, BALL_TH_MAX);
    var d1 = n1-th1, d2 = n2-th2;
    th1 += d1*0.5; th2 += d2*0.5;
    if(Math.abs(d1) < 1e-9 && Math.abs(d2) < 1e-9){ conv = true; break; }
  }
  return { th1:th1, th2:th2, pos:ballPos(th1,th2), conv:conv };
}

// 导体 / 绝缘体回路：电源 + 小灯泡 + 被测物串成一个回路
var PSU_V = 3.0;                // 两节 1.5 V 干电池串联
var PSU_R = 0.5;                // 电池组内阻 Ω
var LAMP_V = 3.0, LAMP_W = 0.9; // 小灯泡额定 3.0 V / 0.9 W ⇒ R = 10 Ω
var LAMP_R = LAMP_V*LAMP_V/LAMP_W;
function loopCurrent(Robj){
  if(Robj === null || Robj === undefined) return 0;   // 夹子之间空着 = 断路
  var I = PSU_V / (Robj + LAMP_R + PSU_R);
  return (isFinite(I) && I > 0) ? I : 0;
}
function loopBrightness(Robj){
  var I = loopCurrent(Robj);
  if(!(I > 0)) return 0;
  var P = I*I*LAMP_R;
  return clamp(P/LAMP_W, 0, 1.3);
}
function fmtElectrons(nC){
  var n = Math.abs(nC)*NC/E_CHARGE;
  if(n < 1e4) return n.toFixed(0)+' 个';
  var e = Math.floor(Math.log10(n)), m = n/Math.pow(10,e);
  return m.toFixed(1)+'×10'+supNum(e)+' 个';
}
var SUPS = ['⁰','¹','²','³','⁴','⁵','⁶','⁷','⁸','⁹'];
function supNum(n){ return String(n).split('').map(function(ch){ return ch==='-'?'⁻':SUPS[+ch]; }).join(''); }
function signCn(v){ return (v>1e-9?'+':(v<-1e-9?'−':''))+Math.abs(v).toFixed(1); }

function clipFront(a, b, q){
  var da=dot(sub(a,q.eye),q.fwd), db=dot(sub(b,q.eye),q.fwd);
  if(da<NEAR_D && db<NEAR_D) return null;
  var A=a, B=b;
  if(da<NEAR_D) A=mix(a,b,(NEAR_D-da)/(db-da));
  if(db<NEAR_D) B=mix(b,a,(NEAR_D-db)/(da-db));
  return [A,B];
}
function roomLine(a, b, q, c, stroke, lw){
  var s=clipFront(a,b,q); if(!s) return;
  var pa=project(s[0],q), pb=project(s[1],q);
  c.beginPath(); c.moveTo(pa.x,pa.y); c.lineTo(pb.x,pb.y);
  c.strokeStyle=stroke; c.lineWidth=lw||1; c.stroke();
}
function fillAboveLine(pts3, q, c, fill){
  var pr=[];
  for(var i=0;i<pts3.length;i++){
    if(dot(sub(pts3[i],q.eye), q.fwd) < NEAR_D) return false;
    pr.push(project(pts3[i],q));
  }
  c.beginPath();
  c.moveTo(pr[0].x, -H);
  for(var j=0;j<pr.length;j++) c.lineTo(pr[j].x, pr[j].y);
  c.lineTo(pr[pr.length-1].x, -H);
  c.closePath();
  c.fillStyle=fill; c.fill();
  return true;
}
function drawBackdrop(q,c){
  var R=ROOM;
  var gf=c.createLinearGradient(0,0,0,H);
  gf.addColorStop(0,'#18262f'); gf.addColorStop(0.36,'#111c26'); gf.addColorStop(1,'#0b1520');
  c.fillStyle=gf; c.fillRect(0,0,W,H);
  c.save();
  for(var gx=R.x0; gx<=R.x1; gx+=R.tile)
    roomLine([gx,R.y,-34], [gx,R.y,140], q, c, 'rgba(148,163,184,.155)', 1);
  for(var gz=-34; gz<=140; gz+=R.tile)
    roomLine([R.x0,R.y,gz], [R.x1,R.y,gz], q, c, 'rgba(148,163,184,.115)', 1);
  c.restore();
  var base=[[R.x0,R.y,R.z],[R.x1,R.y,R.z]];
  var bLow=project([(R.x0+R.x1)/2, R.y, R.z], q).y;
  // 墙身用【竖向渐变】而不是平色：平色时墙与墙脚处地面亮度几乎相同，整面墙等于没画。
  var wf=c.createLinearGradient(0, 0, 0, Math.max(1, bLow));
  wf.addColorStop(0,'#141f2b'); wf.addColorStop(0.55,'#1b2938'); wf.addColorStop(1,'#223346');
  var painted = fillAboveLine(base, q, c, wf);
  if(painted){
    c.save();
    var pa=project([R.x0,R.y,R.z],q), pb=project([R.x1,R.y,R.z],q);
    var ang=Math.atan2(pb.y-pa.y, pb.x-pa.x);
    c.translate(pa.x, pa.y); c.rotate(ang);
    var aoG=c.createLinearGradient(0,0,0,9);
    aoG.addColorStop(0,'rgba(2,6,23,.46)'); aoG.addColorStop(1,'rgba(2,6,23,0)');
    c.fillStyle=aoG; c.fillRect(0, 0, Math.hypot(pb.x-pa.x, pb.y-pa.y), 9);
    c.restore();
    for(var wx=R.x0; wx<=R.x1; wx+=R.tile*1.5)
      roomLine([wx,R.y,R.z], [wx,R.y+150,R.z], q, c, 'rgba(148,163,184,.030)', 1);
    c.save();
    c.lineWidth=1.4; c.strokeStyle='rgba(125,211,252,.20)';
    var pb0=project([R.x0,R.y,R.z],q), pb1=project([R.x1,R.y,R.z],q);
    c.beginPath(); c.moveTo(pb0.x,pb0.y); c.lineTo(pb1.x,pb1.y); c.stroke();
    c.restore();
    // 墙上的电源插座与实验台提示牌（实验室的「实感」来自这些次要细节）
    for(var sx=R.x0+60; sx<=R.x1-60; sx+=R.tile*2.4){
      var s0=project([sx-11, R.rail, R.z], q), s1=project([sx+11, R.rail+20, R.z], q);
      if(s0.z<1 || s1.z<1) continue;
      c.fillStyle='rgba(203,213,225,.15)';
      c.fillRect(s0.x, s0.y, s1.x-s0.x, s1.y-s0.y);
      c.fillStyle='rgba(8,15,26,.85)';
      c.fillRect(s0.x+(s1.x-s0.x)*0.22, s0.y+(s1.y-s0.y)*0.30, (s1.x-s0.x)*0.56, (s1.y-s0.y)*0.40);
    }
  }
  var pool=project([(TABLE.x0+TABLE.x1)/2, 0, (TABLE.z0+TABLE.z1)/2], q);
  var pg=c.createRadialGradient(pool.x, pool.y, 20, pool.x, pool.y, Math.max(W,H)*0.62);
  pg.addColorStop(0,'rgba(186,230,253,.085)');
  pg.addColorStop(0.42,'rgba(125,211,252,.030)');
  pg.addColorStop(1,'rgba(56,189,248,0)');
  c.fillStyle=pg; c.fillRect(0,0,W,H);
  for(var i2=0;i2<2;i2++){
    var lx = W*(0.30 + i2*0.42), ly = H*0.030;
    var lg = c.createRadialGradient(lx, ly, 4, lx, ly, Math.max(W,H)*0.46);
    lg.addColorStop(0,'rgba(186,230,253,.13)');
    lg.addColorStop(0.30,'rgba(125,211,252,.050)');
    lg.addColorStop(1,'rgba(56,189,248,0)');
    c.fillStyle=lg; c.fillRect(0,0,W,H);
    c.fillStyle='rgba(15,23,42,.62)';   c.fillRect(lx-64, ly-9,  128, 21);
    c.fillStyle='rgba(203,213,225,.12)'; c.fillRect(lx-64, ly-9,  128, 3);
    c.fillStyle='rgba(226,240,254,.40)'; c.fillRect(lx-57, ly-5,  114, 13);
    c.fillStyle='rgba(255,255,255,.30)'; c.fillRect(lx-57, ly-5,  114, 4);
  }
}
function shadowEllipse(cx, cz, rx, rz, q, c, alpha){
  var pts=[];
  for(var i=0;i<40;i++){ var a=i/40*Math.PI*2; pts.push(project([cx+rx*Math.cos(a), 0.02, cz+rz*Math.sin(a)], q)); }
  polyPath(pts,c);
  c.fillStyle='rgba(2,6,23,'+alpha+')'; c.fill();
}
function shadowSoft(cx, cz, rx, rz, q, c, alpha, passes){
  passes = passes || 5;
  for(var k=passes;k>=1;k--){
    var f = k/passes;
    shadowEllipse(cx, cz, rx*(0.72+0.28*f), rz*(0.72+0.28*f), q, c, alpha/passes);
  }
}
function drawTable(q,c){
  var T=TABLE;
  var cx=(T.x0+T.x1)/2, cz=(T.z0+T.z1)/2, hx=(T.x1-T.x0)/2, hz=(T.z1-T.z0)/2;
  shadowSoft(cx, cz, hx*1.12, hz*1.10, q, c, 0.38, 6);
  boxSolid(cx, -T.h/2, cz, hx, T.h/2, hz, q, c, '#1b2431', 'rgba(148,163,184,.14)', 1);
  var b0=project([cx,0,T.z0],q), b1=project([cx,0,T.z1],q);
  var gt=c.createLinearGradient(b0.x,b0.y,b1.x,b1.y);
  gt.addColorStop(0,'rgba(186,230,253,.090)');
  gt.addColorStop(0.28,'rgba(148,163,184,.034)');
  gt.addColorStop(1,'rgba(8,15,26,0)');
  c.save();
  polyPath([project([T.x0,0,T.z0],q), project([T.x1,0,T.z0],q),
            project([T.x1,0,T.z1],q), project([T.x0,0,T.z1],q)], c);
  c.fillStyle=gt; c.fill();
  c.restore();
  seg(project([T.x0,0,T.z1],q), project([T.x1,0,T.z1],q), 'rgba(203,213,225,.30)', 1.7, c);
  seg(project([T.x0,0,T.z1],q), project([T.x0,0,T.z0],q), 'rgba(203,213,225,.10)', 1, c);
  seg(project([T.x1,0,T.z1],q), project([T.x1,0,T.z0],q), 'rgba(203,213,225,.07)', 1, c);
  // 防静电台垫 + 格纹
  var mhx=hx-8.5, mhz=hz-6.5, mcx=cx, mcz=cz-0.5;
  boxSolid(mcx, 0.05, mcz, mhx, 0.05, mhz, q, c, '#141d29', 'rgba(148,163,184,.09)', 1);
  c.save();
  c.strokeStyle='rgba(148,163,184,.05)'; c.lineWidth=1;
  for(var x=Math.ceil((mcx-mhx)/8)*8; x<=mcx+mhx; x+=8){
    var a=project([x,0.115,mcz-mhz],q), b=project([x,0.115,mcz+mhz],q);
    c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke();
  }
  for(var z=Math.ceil((mcz-mhz)/8)*8; z<=mcz+mhz; z+=8){
    var a2=project([mcx-mhx,0.115,z],q), b2=project([mcx+mhx,0.115,z],q);
    c.beginPath(); c.moveTo(a2.x,a2.y); c.lineTo(b2.x,b2.y); c.stroke();
  }
  c.restore();
}

// ============================================================
// 通用器材绘制
// ============================================================
// 棒 / 尺：沿 x 轴躺着的圆柱（可整体平移、可绕 y 轴转一点点显得随意）
function drawRod3(o, q, c, opt){
  opt = opt || {};
  var y = (opt.y === undefined) ? (o.r + 0.02) : opt.y;
  var half = o.L/2;
  var ctr = [o.wx, y, o.wz];
  var a = [ctr[0]-half, ctr[1], ctr[2]], b = [ctr[0]+half, ctr[1], ctr[2]];
  var st = MAT[o.mat] || MAT.steel;
  cylAxis(a, b, o.r, q, c, st, { stroke:'rgba(2,6,23,.45)', lw:1 });
  // 端头倒角（一小段更亮的圆环）—— 只有圆柱会显得像一根塑料棍
  var cap0 = project(a,q), cap1 = project(b,q);
  var rr0 = o.r*q.focal/Math.max(cap0.z,0.02), rr1 = o.r*q.focal/Math.max(cap1.z,0.02);
  c.beginPath(); c.arc(cap0.x, cap0.y, Math.max(0.4,rr0*0.62), 0, Math.PI*2);
  c.fillStyle='rgba(226,240,254,.22)'; c.fill();
  c.beginPath(); c.arc(cap1.x, cap1.y, Math.max(0.4,rr1*0.62), 0, Math.PI*2);
  c.fillStyle='rgba(226,240,254,.22)'; c.fill();
  // 带电辉光：电荷量越大越亮（红=正、蓝=负）
  var A = Math.abs(o.q||0);
  if(A > 1e-9){
    var col = (o.q>0) ? '248,113,113' : '56,189,248';
    var s = clamp(A/6, 0, 1);
    for(var k=0;k<9;k++){
      var t=(k+0.5)/9;
      var pp = project([lerp(a[0],b[0],t), y, o.wz], q);
      var rad = (1.5 + 3.2*s) * q.focal/Math.max(pp.z,0.02);
      var g = c.createRadialGradient(pp.x,pp.y,0,pp.x,pp.y,rad);
      g.addColorStop(0,'rgba('+col+','+(0.30*s).toFixed(3)+')');
      g.addColorStop(1,'rgba('+col+',0)');
      c.fillStyle=g; c.beginPath(); c.arc(pp.x,pp.y,rad,0,Math.PI*2); c.fill();
    }
  }
  return { a:a, b:b, y:y };
}
// 布：一块软垫（六面体，上表面带织纹）。
// opt.peakY = 布【中心】在棒顶的高度 —— 摩擦时布是搭在棒上的，不是摊在台面上的：
//   摊在台面的平板 y∈[0, 0.84]，而棒是 y∈[0, 1.24] 的圆柱，两者正好互相咬住；
//   布又是后画的，看上去就是「一张粉卡片把棒盖掉了一截」。
//   搭上去之后沿 z 折成「人」字：中间顶在棒上，两边垂到台面。
function drawCloth3(o, q, c, opt){
  opt = opt || {};
  var y = (opt.y === undefined) ? CLOTH_HY : opt.y;
  var st = MAT[o.mat] || MAT.silk;
  var pk = opt.peakY, draped = (pk !== undefined && pk > y + 1e-6);
  if(!draped){
    slabBox([o.wx, y, o.wz], [CLOTH_HX,0,0], [0,CLOTH_HY,0], [0,0,CLOTH_HZ],
            q, c, st[1][1], 'rgba(2,6,23,.5)', 1, st);
  } else {
    var hz = CLOTH_HZ/2, dy = (pk - y)/2, my = (y + pk)/2;
    slabBox([o.wx, my, o.wz - hz], [CLOTH_HX,0,0], [0,CLOTH_HY,0], [0, dy, hz],
            q, c, st[1][1], 'rgba(2,6,23,.5)', 1, st);
    slabBox([o.wx, my, o.wz + hz], [CLOTH_HX,0,0], [0,CLOTH_HY,0], [0,-dy, hz],
            q, c, st[1][1], 'rgba(2,6,23,.5)', 1, st);
  }
  // 织纹：沿 x 的几道细线（搭着的时候要跟着「人」字起伏走，否则纹路会飘在布外面）
  for(var i=-2;i<=2;i++){
    var zz = o.wz + i*CLOTH_HZ*0.34;
    var ty = y + CLOTH_HY;
    if(draped) ty += (pk - y) * Math.max(0, 1 - Math.abs(zz - o.wz)/CLOTH_HZ);
    var p0=project([o.wx-CLOTH_HX*0.86, ty+0.01, zz],q), p1=project([o.wx+CLOTH_HX*0.86, ty+0.01, zz],q);
    seg(p0,p1,'rgba(255,255,255,.14)',1,c);
  }
  return { y:y, peakY: draped ? pk : null };
}
// 布搭在棒上时，布中心该抬到多高：棒顶（r+0.02 是棒心，再加一个 r）+ 布的半厚
function clothPeakY(rod){ return rod.r*2 + 0.02 + CLOTH_HY; }
// ============================================================
// 电荷符号（画在物体上方的小标签）
// ============================================================
var FONT_S = '700 11px ui-monospace,SFMono-Regular,Menlo,monospace';
var FONT_T = '700 12px -apple-system,"PingFang SC",sans-serif';
function chargeLabel(p, v, q, c, dy){
  if(Math.abs(v) < 1e-9) return;
  var col = v>0 ? '#fca5a5' : '#7dd3fc';
  var txt = (v>0?'+':'−') + Math.abs(v).toFixed(1) + ' nC';
  var pr = project(p, q);
  bestLabel(pr.x, pr.y + (dy||-26), txt, FONT_S, col, 3);
}
// 带电物体的「电荷符号」小球阵列：正电荷画 +，负电荷画 −
function chargeMarks(ctr, r, v, q, c, n){
  if(Math.abs(v) < 1e-9) return 0;
  var col = v>0 ? 'rgba(248,113,113,.95)' : 'rgba(125,211,252,.95)';
  var cnt = Math.min(n||6, 2 + Math.floor(Math.abs(v)/1.2));
  var pr = project(ctr, q), R = r*q.focal/Math.max(pr.z,0.02);
  for(var i=0;i<cnt;i++){
    var a = (i/cnt)*Math.PI*2 + 0.6;
    var x = pr.x + Math.cos(a)*R*0.62, y = pr.y + Math.sin(a)*R*0.62;
    c.font = '700 '+Math.max(8, Math.min(15, R*0.42)).toFixed(1)+'px ui-monospace,monospace';
    c.fillStyle = col; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(v>0?'+':'−', x, y);
  }
  return cnt;
}

// ============================================================
// 模式 1：摩擦起电（电子转移）
// ============================================================
function spawnElectrons(from, to, n, color, arc){
  for(var i=0;i<n;i++){
    state.fr.sparks.push({
      from: from, to: to, t: -i*0.045, dur: 0.5,
      jitter: (Math.random()-0.5)*2.2, color: color || '#7dd3fc',
      // 抛物线拱高：两端相距十几厘米时拱 2.6 cm 刚好；布贴在棒上时两点只差 1 cm，
      // 再拱 2.6 cm 就变成一个鼓包，所以按距离缩放。
      arc: (arc === undefined) ? 2.6 : arc
    });
  }
}
function rubRod(rod, cloth, dqSign){
  // dqSign = +1 表示【棒失电子带正电】。电荷守恒：棒 +dq、布 −dq，逐次严格相等。
  var dq = Q_STROKE*dqSign;
  rod.q += dq; cloth.q -= dq;
  state.fr.strokes++;
  var loser = dqSign > 0 ? rod : cloth;      // 失电子的一方
  var gainer = dqSign > 0 ? cloth : rod;     // 得电子的一方
  // 电子转移动画要发生在【棒与布的接触处】，不是「棒心 → 布心」：
  // 布贴在棒上时两者 z 完全相同，再按棒心算就会从棒的正中间飞出一条 10 cm 的
  // 粒子流，看着像「电子从棒心跑到布上」，与「在接触处转移」对不上。
  var onR = (cloth.onRod === rod.id);
  var rodPt   = onR ? [cloth.wx, 1.02, rod.wz] : [rod.wx,   1.2, rod.wz];
  var clothPt = onR ? [cloth.wx, 1.98, rod.wz] : [cloth.wx, 1.2, cloth.wz];
  var _a = (loser === rod) ? rodPt : clothPt, _b = (gainer === rod) ? rodPt : clothPt;
  var _hop = Math.hypot(_b[0]-_a[0], _b[1]-_a[1], _b[2]-_a[2]);
  spawnElectrons(_a, _b, 12, null, onR ? Math.min(2.6, 0.35*_hop) : 2.6);
  state.fr.lastRub = { rod: rod.id, cloth: cloth.id, dq: dq };
}
function drawFriction(q, c){
  var F = state.fr, i;
  for(i=0;i<F.rods.length;i++){
    var r = F.rods[i];
    shadowSoft(r.wx, r.wz, r.L*0.42, r.r*2.4, q, c, 0.34, 4);
  }
  for(i=0;i<F.cloths.length;i++) shadowSoft(F.cloths[i].wx, F.cloths[i].wz, CLOTH_HX*1.05, CLOTH_HZ*1.05, q, c, 0.30, 4);
  for(i=0;i<F.rods.length;i++){
    var rod = F.rods[i];
    drawRod3(rod, q, c);
    // 摩擦中：棒上叠一层「正在转移」的亮带
    if(rod.rub > 0.01){
      var p0=project([rod.wx-rod.L*0.36, rod.r+0.05, rod.wz],q), p1=project([rod.wx+rod.L*0.36, rod.r+0.05, rod.wz],q);
      var g=c.createLinearGradient(p0.x,p0.y,p1.x,p1.y);
      g.addColorStop(0,'rgba(125,211,252,0)');
      g.addColorStop(0.5,'rgba(125,211,252,'+(0.5*rod.rub).toFixed(3)+')');
      g.addColorStop(1,'rgba(125,211,252,0)');
      seg(p0,p1,g,Math.max(2, rod.r*2*q.focal/Math.max(p0.z,0.02)*0.5),c);
    }
  }
  for(i=0;i<F.cloths.length;i++){
    var _cl = F.cloths[i], _rd = _cl.onRod ? findRod(F.rods, _cl.onRod) : null;
    _cl._peak = drawCloth3(_cl, q, c, _rd ? { peakY: clothPeakY(_rd) } : null).peakY;
  }

  // 电子转移动画：一串小蓝点从失电子的一方飞到得电子的一方
  var alive = [];
  for(i=0;i<F.sparks.length;i++){
    var s = F.sparks[i];
    if(s.t > s.dur) continue;
    alive.push(s);
    if(s.t < 0) continue;
    var u = s.t/s.dur;
    var ease = u*u*(3-2*u);
    var p = [ lerp(s.from[0], s.to[0], ease),
              lerp(s.from[1], s.to[1], ease) + Math.sin(u*Math.PI)*(s.arc === undefined ? 2.6 : s.arc),
              lerp(s.from[2], s.to[2], ease) + s.jitter*u ];
    var pr = project(p, q);
    var rad = Math.max(1.4, 0.30*q.focal/Math.max(pr.z,0.02));
    var g2 = c.createRadialGradient(pr.x,pr.y,0,pr.x,pr.y,rad*3.2);
    g2.addColorStop(0,'rgba(186,240,255,.92)');
    g2.addColorStop(0.4,'rgba(56,189,248,.42)');
    g2.addColorStop(1,'rgba(56,189,248,0)');
    c.fillStyle=g2; c.beginPath(); c.arc(pr.x,pr.y,rad*3.2,0,Math.PI*2); c.fill();
    dot2(pr, rad, '#e0f7ff', c);
  }
  F.sparks = alive.slice(-160);

  // 电荷符号
  for(i=0;i<F.rods.length;i++){
    chargeMarks([F.rods[i].wx, F.rods[i].r+0.6, F.rods[i].wz], F.rods[i].r*2.6, F.rods[i].q, q, c);
    if(Math.abs(F.rods[i].q) > 1e-9)
      chargeLabel([F.rods[i].wx, F.rods[i].r+1.2, F.rods[i].wz], F.rods[i].q, q, c, -24);
  }
  // 布的标签跟着布的【实际高度】走：搭在棒上时布已经抬到棒顶，
  // 还按台面高度（CLOTH_HY*2）挂标签的话，标签会落在布的下面一截。
  for(i=0;i<F.cloths.length;i++){
    var _c2 = F.cloths[i], _r2 = _c2.onRod ? findRod(F.rods, _c2.onRod) : null;
    var _ay = _r2 ? clothPeakY(_r2) + CLOTH_HY : CLOTH_HY*2;
    if(Math.abs(_c2.q) > 1e-9)
      chargeLabel([_c2.wx, _ay, _c2.wz], _c2.q, q, c, 22);
  }
  // 每件器材的名字标签
  for(i=0;i<F.rods.length;i++){
    var pr = project([F.rods[i].wx, F.rods[i].r, F.rods[i].wz], q);
    bestLabel(pr.x, pr.y + 16, F.rods[i].name, FONT_T, '#cbd5e1', 1);
  }
  for(i=0;i<F.cloths.length;i++){
    var _c3 = F.cloths[i], _r3 = _c3.onRod ? findRod(F.rods, _c3.onRod) : null;
    var pc = project([_c3.wx, _r3 ? clothPeakY(_r3) + CLOTH_HY : CLOTH_HY*2, _c3.wz], q);
    bestLabel(pc.x, pc.y + 15, _c3.name, FONT_T, '#cbd5e1', 1);
  }
  drawn.fr = {
    rods: F.rods.map(function(r){ return { id:r.id, q:r.q, x:r.wx, z:r.wz, acc:r.acc, rub:r.rub }; }),
    cloths: F.cloths.map(function(o){ return { id:o.id, q:o.q, x:o.wx, z:o.wz, lift:o.lift,
                                             onRod:o.onRod, peakY:(o._peak === undefined ? null : o._peak) }; }),
    strokes: F.strokes, sparks: F.sparks.length
  };
}

// ============================================================
// 模式 2：电荷间相互作用（库仑摆）
// ============================================================
// x = 立柱中线到中线一半（即立柱中心到中轴的距离）。立柱原来放在 20 cm 上，
// 而小球在【2 份电量（±80 nC）】时会摆到 |x| ≈ 19.5 cm —— 球心正好落在立柱里，
// 截图里立柱是从小球中间穿过去的。立柱让到 24.5 cm，最外侧还留 3 cm 余量。
var IR_FRAME = { x:24.5, h:33, r:0.55, baseH:0.6 };
// 摆角的硬上限 = 小球【贴住立柱内壁】的角度（再往外就被立柱挡住了，现实中也是）。
// 原来封在 ±1.45 rad（83°）：球心最远能到 ±27.8 cm，比立柱（内壁 23.95 cm）还远 ——
// 把带电棒拖到小球旁边时，小球会直接穿进立柱里。留 0.5% 余量，正好贴在立柱前停住。
var BALL_TH_MAX = Math.asin(clamp((IR_FRAME.x - IR_FRAME.r - BALL_R - Math.abs(ballPivots()[0][0]))/BALL_L*0.995, 0, 1));
function drawInteract(q, c){
  var I = state.ir, i;
  // 门形支架
  shadowSoft(-IR_FRAME.x, 0, 6.2, 4.4, q, c, 0.34, 4);
  shadowSoft( IR_FRAME.x, 0, 6.2, 4.4, q, c, 0.34, 4);
  boxSolid(-IR_FRAME.x, 0.6, 0, 5.0, 0.6, 3.4, q, c, MAT.base[1][1], 'rgba(148,163,184,.2)', 1, MAT.base);
  boxSolid( IR_FRAME.x, 0.6, 0, 5.0, 0.6, 3.4, q, c, MAT.base[1][1], 'rgba(148,163,184,.2)', 1, MAT.base);
  cylAxis([-IR_FRAME.x,1.2,0], [-IR_FRAME.x,IR_FRAME.h,0], IR_FRAME.r, q, c, MAT.steel, {stroke:'rgba(2,6,23,.4)',lw:1});
  cylAxis([ IR_FRAME.x,1.2,0], [ IR_FRAME.x,IR_FRAME.h,0], IR_FRAME.r, q, c, MAT.steel, {stroke:'rgba(2,6,23,.4)',lw:1});
  cylAxis([-IR_FRAME.x,IR_FRAME.h,0], [IR_FRAME.x,IR_FRAME.h,0], IR_FRAME.r, q, c, MAT.steel, {stroke:'rgba(2,6,23,.4)',lw:1});

  var q1 = I.q[0]*Q_BALL, q2 = I.q[1]*Q_BALL;
  var rod = I.rod;
  // ★ 渲染读 frameStep 算好的 sol，不自己再解一遍 —— 两处各解一次的话，
  //   画面与「物理真值」会在收敛差里互相打架（也会让断言变成自指）。
  var sol = I.sol || ballEquilibrium(q1, q2, rod);
  var pos = sol.pos, P = ballPivots();

  // 丝线
  for(i=0;i<2;i++){
    cylAxis([P[i][0], IR_FRAME.h-0.5, 0], pos[i], 0.075, q, c,
            [[0,'#e8f1ff'],[0.4,'#a9bbd2'],[1,'#66788e']], null);
  }
  // 小球
  for(i=0;i<2;i++){
    var v = (i===0) ? q1 : q2;
    var base = v>1e-9 ? [[0,'#ffe3e3'],[0.34,'#f6a3a3'],[0.76,'#c05555'],[1,'#6d2323']]
             : v<-1e-9 ? [[0,'#e3f4ff'],[0.34,'#a5d3f6'],[0.76,'#4a86c0'],[1,'#1c3f68']]
             : [[0,'#f1f5f9'],[0.34,'#cbd5e1'],[0.76,'#8792a1'],[1,'#3f4854']];
    shadowSoft(pos[i][0], pos[i][2], BALL_R*1.5, BALL_R*1.5, q, c, 0.22, 3);
    sphereShaded(pos[i], BALL_R, q, c, base, { rim:'rgba(2,6,23,.5)', lw:1, spec:'rgba(255,255,255,.34)' });
    chargeMarks(pos[i], BALL_R*1.5, v, q, c);
    if(Math.abs(v) > 1e-9) chargeLabel(pos[i], v, q, c, -BALL_R*2.6);
    var pn = project(pos[i], q);
    bestLabel(pn.x, pn.y + 24, '小球'+(i+1), FONT_T, '#cbd5e1', 1);
  }
  // 两球之间的作用力示意（斥/吸箭头）
  if(Math.abs(q1) > 1e-9 && Math.abs(q2) > 1e-9){
    var pa=project(pos[0],q), pb=project(pos[1],q);
    var mx=(pa.x+pb.x)/2, my=(pa.y+pb.y)/2;
    var repel = (q1*q2) > 0;
    var col = repel ? 'rgba(248,113,113,.85)' : 'rgba(52,211,153,.9)';
    var dxs = Math.sign(pb.x-pa.x) || 1;
    c.save(); c.strokeStyle=col; c.lineWidth=2;
    for(var s2=0;s2<2;s2++){
      var dir = repel ? (s2?1:-1) : (s2?-1:1);
      c.beginPath(); c.moveTo(mx - dxs*dir*7, my); c.lineTo(mx - dxs*dir*19, my);
      c.stroke();
      c.beginPath();
      c.moveTo(mx - dxs*dir*19, my);
      c.lineTo(mx - dxs*dir*13, my-4.4);
      c.moveTo(mx - dxs*dir*19, my);
      c.lineTo(mx - dxs*dir*13, my+4.4);
      c.stroke();
    }
    c.restore();
    bestLabel(mx, my-24, repel?'同种电荷 → 相互排斥':'异种电荷 → 相互吸引', FONT_S, col, 4);
  }
  // 棒架（一根低矮的托盘，和验电器那一页同款）
  boxSolid(0, 0.4, 13, 24.5, 0.4, 2.8, q, c, MAT.base[1][1], 'rgba(148,163,184,.16)', 1, MAT.base);
  for(i=0;i<I.rods.length;i++){
    var r = I.rods[i];
    shadowSoft(r.wx, r.wz, r.L*0.42, r.r*2.4, q, c, 0.30, 4);
    drawRod3(r, q, c, { y: r.y });
    if(Math.abs(r.q) > 1e-9){
      chargeMarks([r.wx, r.y + 0.8, r.wz], r.r*2.6, r.q, q, c);
      chargeLabel([r.wx, r.y + 1.4, r.wz], r.q, q, c, -24);
    }
    var pr2 = project([r.wx, r.y, r.wz], q);
    bestLabel(pr2.x, pr2.y + 16, r.name, FONT_T, '#cbd5e1', 1);
  }
  // 中和火花
  if(I.spark > 0.01){
    for(i=0;i<2;i++){
      var ps = project(pos[i], q);
      var R2 = (3.4 + 7.5*(1-I.spark))*q.focal/Math.max(ps.z,0.02);
      var gs = c.createRadialGradient(ps.x,ps.y,0,ps.x,ps.y,R2);
      gs.addColorStop(0,'rgba(255,255,220,'+(0.85*I.spark).toFixed(3)+')');
      gs.addColorStop(0.45,'rgba(250,204,21,'+(0.42*I.spark).toFixed(3)+')');
      gs.addColorStop(1,'rgba(250,204,21,0)');
      c.fillStyle=gs; c.beginPath(); c.arc(ps.x,ps.y,R2,0,Math.PI*2); c.fill();
    }
  }
  drawn.ir = {
    q1:q1, q2:q2, th1:sol.th1, th2:sol.th2, conv:sol.conv, touching:!!sol.touching,
    pos:pos, sep: Math.abs(pos[0][0]-pos[1][0]), restSep: Math.abs(P[0][0]-P[1][0]),
    neutralized: I.neutralized, spark: I.spark, approach: I.approach||0,
    rod: rod ? { id:rod.id, q:rod.q, x:rod.wx, z:rod.wz, tip:rodTip(rod) } : null
  };
}

// ============================================================
// 模式 3：验电器
// ============================================================
function scopeBallPos(){ return [0, SC_BALL_Y, 0]; }
// 棒的「作用端」= 棒的近端（指向验电器的那一端）
function rodTip(r){
  var toward = (0 - r.wx);
  var sgn = toward >= 0 ? 1 : -1;
  return [r.wx + sgn*r.L/2, r.y, r.wz];
}
function nearestRod(){
  var best=null, bd=Infinity, i;
  for(i=0;i<state.sc.rods.length;i++){
    var r = state.sc.rods[i];
    var t = rodTip(r);
    var d = Math.hypot(t[0]-0, t[1]-SC_BALL_Y, t[2]-0);
    if(d < bd){ bd = d; best = r; }
  }
  return best ? { rod:best, d:bd, tip:rodTip(best) } : null;
}
function inductionK(d){
  if(!(d < D_NEAR)) return 0;
  var u = 1 - d/D_NEAR;
  return Math.pow(u, 1.4);
}
// 验电器【金箔上】的有效电荷 = 自身净电荷 + 感应项（感应项符号与棒相同）
function scopeQeff(){
  var nr = nearestRod();
  var Q = state.sc.Q;
  if(nr && Math.abs(nr.rod.q) > 1e-12){
    Q += Math.sign(nr.rod.q) * K_IND * Math.abs(nr.rod.q) * inductionK(nr.d);
  }
  return Q;
}
// 玻璃罩分两次画：pass 0 = 后半个（在内容物【之前】）+ 口沿；pass 1 = 前半个（在内容物【之后】）。
// 前半个用【屏幕空间的横向渐变】做玻璃：左边缘一道亮边、中间几乎透明、右边缘一点反光。
// ⚠️ 别用「一条很粗的白线」当高光 —— 线宽是 r·focal/z，放大到 2.9 倍就变成一根灰色方柱。
function drawScopeJar(q, c, pass){
  var y0 = SC_JAR_Y0, y1 = SC_JAR_Y1, r = SC_JAR_R;
  var p0=ringPts(0,y0,0,r,q), p1=ringPts(0,y1,0,r,q);
  var e0=ringExtremes(p0), e1=ringExtremes(p1);
  var bb = bboxOf(p1.concat(p0));
  if(pass === 0){
    // 后半个：暗一档，让里面的金箔读得出来
    c.beginPath();
    backArc(c,p1,e1[0],e1[1],true);
    c.lineTo(p0[e0[1]].x, p0[e0[1]].y);
    backArc(c,p0,e0[1],e0[0],false);
    c.closePath();
    c.fillStyle='rgba(24,42,60,.34)'; c.fill();
    // 上下口沿
    polyPath(p1,c); c.strokeStyle='rgba(226,244,255,.62)'; c.lineWidth=1.8; c.stroke();
    polyPath(p0,c); c.strokeStyle='rgba(186,230,253,.34)'; c.lineWidth=1.3; c.stroke();
  } else {
    // 前半个：横向玻璃渐变
    c.beginPath();
    frontArc(c,p1,e1[0],e1[1],true);
    c.lineTo(p0[e0[1]].x, p0[e0[1]].y);
    frontArc(c,p0,e0[1],e0[0],false);
    c.closePath();
    var g = c.createLinearGradient(bb.x0, 0, bb.x1, 0);
    g.addColorStop(0,    'rgba(255,255,255,.26)');
    g.addColorStop(0.07, 'rgba(226,246,255,.11)');
    g.addColorStop(0.34, 'rgba(186,230,253,.035)');
    g.addColorStop(0.72, 'rgba(186,230,253,.055)');
    g.addColorStop(0.95, 'rgba(255,255,255,.17)');
    g.addColorStop(1,    'rgba(255,255,255,.05)');
    c.fillStyle=g; c.fill();
    c.strokeStyle='rgba(226,244,255,.42)'; c.lineWidth=1.2; c.stroke();
  }
}
function drawScope(q, c){
  var S = state.sc, i;
  // 底座
  shadowSoft(0, 0, 8.6, 8.6, q, c, 0.36, 5);
  cylSolid(0, 0.0, 1.1, 0, 7.2, q, c, MAT.base[1][1], 'rgba(148,163,184,.22)', 1);
  cylTop(0, 1.1, 0, 7.2, q, c, MAT.base[0][1], 'rgba(148,163,184,.24)', 1);
  cylSolid(0, 1.1, SC_JAR_Y0, 0, 5.9, q, c, '#2b3543', 'rgba(148,163,184,.2)', 1);

  drawScopeJar(q, c, 0);

  // 金属杆 + 铰链
  cylAxis([0, SC_STEM_TOP, 0], [0, SC_HINGE_Y, 0], 0.44, q, c, MAT.brass, {stroke:'rgba(2,6,23,.45)',lw:1});
  sphereShaded([0, SC_HINGE_Y, 0], 0.72, q, c, MAT.brass, {rim:'rgba(2,6,23,.5)',lw:1,spec:'rgba(255,255,255,.4)'});
  // 金箔
  var Qeff = scopeQeff();
  var th = leafAngle(Math.abs(Qeff));
  var sgn = (Qeff >= 0) ? 1 : -1;
  var leafRecs = [];
  for(i=0;i<2;i++){
    var s = (i===0) ? -1 : 1;
    var u = [s*Math.sin(th), -Math.cos(th), 0];
    var ctr = [ u[0]*SC_LEAF_L/2, SC_HINGE_Y + u[1]*SC_LEAF_L/2, 0 ];
    var e0 = [u[0]*SC_LEAF_L/2, u[1]*SC_LEAF_L/2, 0];
    var e1 = [0,0,SC_LEAF_W/2];
    var e2 = [ -Math.cos(th)*SC_LEAF_T/2, -s*Math.sin(th)*SC_LEAF_T/2, 0 ];
    slabBox(ctr, e0, e1, e2, q, c, MAT.gold[1][1], 'rgba(60,40,6,.65)', 1, MAT.gold);
    var tip = [u[0]*SC_LEAF_L, SC_HINGE_Y + u[1]*SC_LEAF_L, 0];
    leafRecs.push({ tip:tip, base:[0,SC_HINGE_Y,0], dir:u });
    // 箔上的电荷符号
    chargeMarks([ctr[0], ctr[1], ctr[2]], SC_LEAF_L*0.34, Qeff, q, c, 3);
  }
  // 玻璃罩的前半（盖在金箔之上，才有「隔着玻璃看」的感觉）
  drawScopeJar(q, c, 1);

  // 顶部金属球
  sphereShaded([0, SC_BALL_Y, 0], SC_BALL_R, q, c, MAT.brass, { rim:'rgba(2,6,23,.5)', lw:1, spec:'rgba(255,255,255,.45)' });
  chargeMarks([0, SC_BALL_Y, 0], SC_BALL_R*1.35, Qeff, q, c, 6);
  // 金属球与杆之间的连接颈。
  // ⚠️ 原来两端点算出来都是 21.8（SC_BALL_Y−SC_BALL_R+0.3 == SC_STEM_TOP+0.2），
  //    长度 0 的圆柱会被 cylAxis 退化成【球】画出来。画面看不出问题（那个小球
  //    整个躲在金属球里），但「球图元计数」被它污染 —— B04 那条「金属球走球图元」
  //    就再也测不出金属球了（把金属球换成 2D 圆点，计数照样 ≥ 2）。
  cylAxis([0, SC_BALL_Y-SC_BALL_R-0.25, 0], [0, SC_BALL_Y-SC_BALL_R+0.55, 0], 0.55, q, c, MAT.brass, null);

  // 放电火花（接触 / 接地）
  for(i=0;i<S.sparks.length;i++){
    var sp = S.sparks[i];
    if(sp.t > sp.dur) continue;
    var u2 = clamp(sp.t/sp.dur, 0, 1);
    var pp = project(sp.p, q);
    var R3 = (2.0 + 9.0*u2)*q.focal/Math.max(pp.z,0.02);
    var g3 = c.createRadialGradient(pp.x,pp.y,0,pp.x,pp.y,R3);
    g3.addColorStop(0,'rgba(255,255,225,'+(0.9*(1-u2)).toFixed(3)+')');
    g3.addColorStop(0.4,'rgba(147,197,253,'+(0.5*(1-u2)).toFixed(3)+')');
    g3.addColorStop(1,'rgba(96,165,250,0)');
    c.fillStyle=g3; c.beginPath(); c.arc(pp.x,pp.y,R3,0,Math.PI*2); c.fill();
    for(var k2=0;k2<7;k2++){
      var a2 = k2/7*Math.PI*2 + u2*1.6;
      var l0 = [sp.p[0], sp.p[1], sp.p[2]];
      var l1 = [sp.p[0]+Math.cos(a2)*3.4*u2, sp.p[1]+Math.sin(a2)*3.4*u2, sp.p[2]];
      seg(project(l0,q), project(l1,q), 'rgba(191,219,254,'+(0.7*(1-u2)).toFixed(3)+')', 1.6, c);
    }
  }
  if(S.groundPulse > 0.01){
    var gp = project([0, SC_BALL_Y, 0], q);
    var R4 = (4 + 16*(1-S.groundPulse))*q.focal/Math.max(gp.z,0.02);
    var g4 = c.createRadialGradient(gp.x,gp.y,0,gp.x,gp.y,R4);
    g4.addColorStop(0,'rgba(255,255,255,'+(0.7*S.groundPulse).toFixed(3)+')');
    g4.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=g4; c.beginPath(); c.arc(gp.x,gp.y,R4,0,Math.PI*2); c.fill();
  }

  // 棒架（两层托盘，托住两排棒）
  boxSolid(0, 0.45, 11.5, 26, 0.45, 2.8, q, c, MAT.base[1][1], 'rgba(148,163,184,.18)', 1, MAT.base);
  boxSolid(0, 0.45, 17.0, 26, 0.45, 2.8, q, c, MAT.base[1][1], 'rgba(148,163,184,.18)', 1, MAT.base);
  for(i=0;i<S.rods.length;i++){
    var r = S.rods[i];
    shadowSoft(r.wx, r.wz, r.L*0.42, r.r*2.4, q, c, 0.28, 4);
    drawRod3(r, q, c, { y: r.y });
    if(Math.abs(r.q) > 1e-9){
      chargeMarks([r.wx, r.y+0.8, r.wz], r.r*2.6, r.q, q, c);
      chargeLabel([r.wx, r.y+1.4, r.wz], r.q, q, c, -24);
    }
    var pr3 = project([r.wx, r.y, r.wz], q);
    bestLabel(pr3.x, pr3.y + 16, r.name, FONT_T, '#cbd5e1', 1);
  }
  // 读数标签
  var lp = project([0, SC_HINGE_Y - SC_LEAF_L*0.55, 0], q);
  bestLabel(lp.x, lp.y, '张角 θ = ' + (th*180/Math.PI).toFixed(1) + '°', FONT_S, '#fcd34d', 5);
  drawn.sc = {
    Q: S.Q, Qeff: Qeff, theta: th, thetaDeg: th*180/Math.PI,
    leafTips: leafRecs.map(function(L){ return project(L.tip, q); }),
    leafBases: leafRecs.map(function(L){ return project(L.base, q); }),
    // 世界坐标的箔尖与铰链：自检用它独立验「两箔夹角 == θ」「关于竖直轴对称」
    leafTipWorld: leafRecs.map(function(L){ return L.tip.slice(); }),
    leafDirWorld: leafRecs.map(function(L){ return L.dir.slice(); }),
    hingeWorld: [0, SC_HINGE_Y, 0],
    hinge: project([0,SC_HINGE_Y,0], q),
    ball: project([0,SC_BALL_Y,0], q),
    contacts: S.contacts, touched: S.touched, groundPulse: S.groundPulse,
    rods: S.rods.map(function(r){ return { id:r.id, q:r.q, x:r.wx, z:r.wz }; }),
    nearest: (function(){ var nr=nearestRod(); return nr ? { id:nr.rod.id, d:nr.d } : null; })()
  };
}

function drawLamp3(q, c, bright){
  var L = CD_LAMP;
  shadowSoft(L.x, L.z, 3.6, 3.6, q, c, 0.32, 4);
  cylSolid(L.x, 0.0, 0.5, L.z, 2.9, q, c, MAT.bakelite[1][1], 'rgba(148,163,184,.2)', 1);
  cylSolid(L.x, 0.5, 2.1, L.z, 1.6, q, c, MAT.steel[1][1], 'rgba(2,6,23,.4)', 1);
  for(var i=0;i<6;i++){
    var yy = 0.7 + i*0.23;
    var pp = ringPts(L.x, yy, L.z, 1.66, q);

  }
  // 玻璃泡
  var bp = [L.x, L.y + 1.9, L.z];

    g.addColorStop(0,'rgba(255,247,214,'+(0.62*bright).toFixed(3)+')');
    g.addColorStop(0.30,'rgba(253,224,71,'+(0.26*bright).toFixed(3)+')');
    g.addColorStop(1,'rgba(250,204,21,0)');
    c.fillStyle=g; c.beginPath(); c.arc(pr.x,pr.y,gr,0,Math.PI*2); c.fill();
    var pool = project([L.x, 0.14, L.z], q);

    pg.addColorStop(0,'rgba(253,224,71,'+(0.24*bright).toFixed(3)+')');
    pg.addColorStop(1,'rgba(250,204,21,0)');
    c.fillStyle=pg; c.beginPath(); c.arc(pool.x,pool.y,prr,0,Math.PI*2); c.fill();

    : [[0,'rgba(238,248,255,.55)'],[0.4,'rgba(170,205,230,.22)'],[1,'rgba(90,120,150,.28)']];
  sphereShaded(bp, 2.7, q, c, glassStops, { rim:'rgba(226,240,254,.5)', lw:1, spec:'rgba(255,255,255,.5)' });
  // 灯丝
  var f0 = project([L.x, L.y+0.6, L.z], q), f1 = project([L.x, L.y+3.0, L.z], q);
  seg(f0, f1, bright>0.02 ? 'rgba(255,247,214,'+(0.6+0.4*bright).toFixed(3)+')' : 'rgba(120,110,95,.85)',
      bright>0.02 ? 2.4 : 1.6, c);

function drawClip(q, c, cl, idx){
  shadowSoft(cl.x, cl.z, 1.9, 1.9, q, c, 0.3, 3);
  cylSolid(cl.x, 0, 0.55, cl.z, 1.7, q, c, MAT.base[1][1], 'rgba(148,163,184,.2)', 1);
  cylAxis([cl.x, 0.55, cl.z], [cl.x, 3.2, cl.z], 0.36, q, c, MAT.brass, null);
  cylAxis([cl.x, 3.2, cl.z], [cl.x, 4.3, cl.z], 0.30, q, c, MAT.copper, null);
  var p = project([cl.x, 4.9, cl.z], q);
  bestLabel(p.x, p.y, idx===0?'夹 A':'夹 B', FONT_S, '#fcd34d', 3);
  return [cl.x, 3.6, cl.z];
}
function drawWire3(a, b, q, c, flow){
  var mid = [ (a[0]+b[0])/2, Math.max(a[1], b[1]) + 1.6, (a[2]+b[2])/2 ];
  var pts = [];
  for(var i=0;i<=12;i++){
    var t=i/12;
    var u=1-t;
    pts.push([ u*u*a[0]+2*u*t*mid[0]+t*t*b[0],
               u*u*a[1]+2*u*t*mid[1]+t*t*b[1],
               u*u*a[2]+2*u*t*mid[2]+t*t*b[2] ]);
  }
  for(var k=1;k<pts.length;k++)
    cylAxis(pts[k-1], pts[k], 0.16, q, c, [[0,'#f0d0a0'],[0.3,'#c98a44'],[0.72,'#8d5423'],[1,'#4a2a10']], null);
  return pts;
}
// hx = 沿 x 的半长。架到两个金属夹之间时把它加长，否则物件只有 6 cm 长、
// 两个夹子相距 10 cm，看上去是「悬在中间没搭上」。
function drawObj3(o, q, c, opt){
  opt = opt || {};
  var y = (opt.y === undefined) ? 0 : opt.y;
  var hx = opt.hx || 3.2;
  var st = MAT[o.mat] || MAT.steel;
  var ctr = [o.wx, y, o.wz];
  if(o.shape === 'ruler'){
    slabBox([ctr[0], y+0.28, ctr[2]], [hx*1.06,0,0], [0,0.28,0], [0,0,1.1], q, c, st[1][1], 'rgba(2,6,23,.45)', 1, st);
    for(var i=-3;i<=3;i++){
      var p0=project([ctr[0]+i*(hx*1.06/3.4), y+0.57, ctr[2]-0.9],q), p1=project([ctr[0]+i*(hx*1.06/3.4), y+0.57, ctr[2]+0.9],q);
      seg(p0,p1,'rgba(15,23,42,.5)',1,c);
    }
  } else if(o.shape === 'tube'){
    cylAxis([ctr[0]-hx, y+0.9, ctr[2]], [ctr[0]+hx, y+0.9, ctr[2]], 1.15, q, c,
            [[0,'rgba(232,250,245,.5)'],[0.45,'rgba(150,210,195,.35)'],[1,'rgba(80,150,130,.3)']],
            {stroke:'rgba(226,240,254,.4)', lw:1});
    cylAxis([ctr[0]-hx-0.35, y+0.9, ctr[2]], [ctr[0]+hx+0.35, y+0.9, ctr[2]], 1.02, q, c, MAT.water, null);
    cylTop(ctr[0]-hx-0.35, y+0.9, ctr[2], 1.15, q, c, 'rgba(200,240,230,.35)', 'rgba(226,240,254,.4)', 1);
  } else if(o.shape === 'plate'){
    slabBox([ctr[0], y+0.34, ctr[2]], [hx*0.78,0,0], [0,0.34,0], [0,0,2.2], q, c, st[1][1], 'rgba(2,6,23,.4)', 1, st);
  } else if(o.shape === 'wire'){
    for(var k=0;k<3;k++){
      var zz = ctr[2] + (k-1)*0.5;
      cylAxis([ctr[0]-hx, y+0.22, zz], [ctr[0]+hx, y+0.22, zz], 0.22, q, c, st, null);
    }
  } else {
    cylAxis([ctr[0]-hx, y+0.55, ctr[2]], [ctr[0]+hx, y+0.55, ctr[2]], 0.55, q, c, st, {stroke:'rgba(2,6,23,.4)',lw:1});
  }
  return { ctr:ctr };
}
function cdTerminals(){
  var B = CD_BAT;
  return {
    minus: [B.x-B.w/2-0.6, 2.4, B.z],
    plus:  [B.x+B.w/2+0.6, 2.4, B.z]
  };
}
function drawConduct(q, c){
  var D = state.cd, i;
  var T = cdTerminals();
  var clipA = [CD_CLIP[0].x, 3.6, CD_CLIP[0].z];
  var clipB = [CD_CLIP[1].x, 3.6, CD_CLIP[1].z];
  var lampLow  = [CD_LAMP.x, 1.0, CD_LAMP.z];
  var lampHigh = [CD_LAMP.x, 3.0, CD_LAMP.z];
  var inObj = null;
  for(i=0;i<D.objs.length;i++) if(D.objs[i].id === D.inCircuit) inObj = D.objs[i];
  var Robj = inObj ? inObj.R : null;
  var I = loopCurrent(Robj), bright = loopBrightness(Robj);
  // ① 导线先落笔（它们在器材【下面/后面】）
  drawWire3(T.minus, clipA, q, c, I);
  drawWire3(clipB, lampLow, q, c, I);
  drawWire3(lampHigh, T.plus, q, c, I);
  // ② 器材
  drawBatteryPack(q, c);
  drawClip(q, c, CD_CLIP[0], 0);
  drawClip(q, c, CD_CLIP[1], 1);
  var lamp = drawLamp3(q, c, bright);
  // ③ 架在两夹之间的被测物
  if(inObj){
    var saved = { wx: inObj.wx, wz: inObj.wz };
    inObj.wx = 0; inObj.wz = CD_CLIP[0].z;
    drawObj3(inObj, q, c, { y: 3.6, hx: 4.6 });
    inObj.wx = saved.wx; inObj.wz = saved.wz;
  }
  // ④ 电流粒子：只有回路真的接通（导体）才有
  if(I > 1e-4){
    var segs = [[T.minus, clipA], [clipB, lampLow], [lampHigh, T.plus]];
    if(inObj) segs.push([clipA, clipB]);
    for(var s3=0;s3<segs.length;s3++){
      var A0=segs[s3][0], B0=segs[s3][1];
      for(var k=0;k<5;k++){
        var u = ((state.t*0.9 + k/5) % 1);
        var p = [ lerp(A0[0],B0[0],u), lerp(A0[1],B0[1],u)+1.6*Math.sin(u*Math.PI), lerp(A0[2],B0[2],u) ];
        var pr = project(p, q);
        var rad = Math.max(1.1, 0.24*q.focal/Math.max(pr.z,0.02));
        var g = c.createRadialGradient(pr.x,pr.y,0,pr.x,pr.y,rad*2.8);
        g.addColorStop(0,'rgba(254,240,138,.95)');
        g.addColorStop(1,'rgba(250,204,21,0)');
        c.fillStyle=g; c.beginPath(); c.arc(pr.x,pr.y,rad*2.8,0,Math.PI*2); c.fill();
        dot2(pr, rad, '#fef08a', c);
      }
    }
  }
  // ⑤ 物件架上的物件 + 正被拖动的那一件（拖动时它已经离开架子，不能漏画）
  boxSolid(0, 0.34, CD_SLOT_Z, 36.5, 0.34, 3.0, q, c, MAT.base[1][1], 'rgba(148,163,184,.16)', 1, MAT.base);
  var dragging = (drag.mode === 'obj') ? drag.obj : null;
  for(i=0;i<D.objs.length;i++){
    var o = D.objs[i];
    if(o.id === D.inCircuit) continue;
    if(!o.slot && o !== dragging) continue;
    shadowSoft(o.wx, o.wz, 3.4, 1.6, q, c, 0.26, 3);
    drawObj3(o, q, c, { y: 0 });
    var po = project([o.wx, 0.6, o.wz], q);
    bestLabel(po.x, po.y + 15, o.name, '600 11px -apple-system,"PingFang SC",sans-serif',
              D.verdict[o.id] === 'cond' ? '#6ee7b7' : (D.verdict[o.id] === 'ins' ? '#fca5a5' : '#cbd5e1'), 1);
  }
  // ⑥ 判定结果角标
  var lpr = project([CD_LAMP.x, CD_LAMP.y + 6.4, CD_LAMP.z], q);
  bestLabel(lpr.x, lpr.y, inObj ? (inObj.cond ? '灯亮 → 导体' : '灯不亮 → 绝缘体') : '两夹之间空着（断路）',
            FONT_S, inObj ? (inObj.cond ? '#6ee7b7' : '#fca5a5') : '#94a3b8', 4);
  // 夹子之间的提示环（提示「把物件拖到这里」）
  if(!inObj){
    var mid = project([0, 3.6, CD_CLIP[0].z], q);
    var rpx = 5.0*q.focal/Math.max(mid.z,0.02);
    c.save(); c.setLineDash([5,5]);
    c.beginPath(); c.ellipse(mid.x, mid.y, rpx, rpx*0.5, 0, 0, Math.PI*2);
    c.strokeStyle='rgba(251,191,36,.55)'; c.lineWidth=1.6; c.stroke();
    c.restore();
  }
  drawn.cd = {
    I: I, bright: bright, Robj: Robj, inCircuit: D.inCircuit,
    slots: D.objs.filter(function(o){ return o.slot; }).map(function(o){ return o.id; }),
    lampGlass: project(lamp.glass, q), lampBright: bright,
    lampBase: project([CD_LAMP.x, 0.4, CD_LAMP.z], q),
    clipA: project(clipA, q), clipB: project(clipB, q),
    mid: project([0, 3.6, CD_CLIP[0].z], q),
    tested: Object.assign({}, D.tested), verdict: Object.assign({}, D.verdict)
  };
}

var drawn = {};
function collectDomBoxes(){
  domBoxList.length=0;
  var r = cvs.getBoundingClientRect();
  var ids=['st-hint','st-toast','st-flag'];
  var bar = document.getElementById('st-stage').querySelector('.stage-bar');
  var els = ids.map(function(id){ return document.getElementById(id); });
  if(bar) els.push(bar);
  for(var i=0;i<els.length;i++){
    var e=els[i]; if(!e) continue;
    var b=e.getBoundingClientRect();
    if(b.width<1 || b.height<1) continue;
    domBoxList.push({x:b.left-r.left, y:b.top-r.top, w:b.width, h:b.height, weight:6});
  }
  for(var j=0;j<domBoxList.length;j++) frameBoxes.push(domBoxList[j]);
}
function render(){
  if(!cam) buildCam();
  var q=cam, c=ctx;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,W,H);
  c.setTransform(DPR,0,0,DPR,0,0);
  frameBoxes.length=0; labelQ.length=0; drawnLabels.length=0; drawn={};
  drawBackdrop(q,c);
  collectDomBoxes();
  drawTable(q,c);
  if(state.mode === 'friction')      drawFriction(q,c);
  else if(state.mode === 'interact') drawInteract(q,c);
  else if(state.mode === 'scope')    drawScope(q,c);
  else                               drawConduct(q,c);
  flushLabels(c);
  drawn.mode = state.mode;
  drawn.azim = state.azim; drawn.elev = state.elev;
  drawn.env = { x0:ENV.x0, x1:ENV.x1, y0:ENV.y0, y1:ENV.y1, z0:ENV.z0, z1:ENV.z1 };
  drawn.envPts = envPoints().map(function(p){ var s=project(p,q); return {x:s.x,y:s.y}; });
  drawn.labelBoxes = drawnLabels.map(function(b){ return {x:b.x,y:b.y,w:b.w,h:b.h}; });
}

// ============================================================
// 每帧物理（与渲染分开：动画与自检走同一个 frameStep）
// ============================================================
var SC_CONTACT_D = SC_BALL_R + 0.62 + 0.5;
var IR_APPROACH_T = 0.9;
function ballTouchNeed(){
  var P = Math.abs(ballPivots()[1][0]);
  var sinT = (P - BALL_R)/BALL_L;
  if(!(sinT > 0)) return 0;
  return BALL_M*G_ACC*Math.tan(Math.asin(sinT));
}
function ballTouchHave(q1,q2){
  var d = 2*BALL_R*1e-2;
  return K_E*Math.abs(q1*NC)*Math.abs(q2*NC)/(d*d);
}
function ballWouldTouch(q1,q2){
  if(!(q1*q2 < 0)) return false;
  return ballTouchHave(q1,q2) > ballTouchNeed();
}
function solveInteract(dt){
  var I = state.ir;
  var q1 = I.q[0]*Q_BALL, q2 = I.q[1]*Q_BALL;
  var rod = I.rod;
  if(ballWouldTouch(q1,q2)){
    // 异种电荷：相互吸引 → 一起向中间摆（把「接触前的过程」画出来），碰上就中和。
    var P = Math.abs(ballPivots()[1][0]);
    var thT = Math.asin(clamp((P - BALL_R)/BALL_L, 0, 1));
    I.approach = Math.min(1, (I.approach||0) + dt/IR_APPROACH_T);
    var s1 = (q1 > 0) ? 1 : -1;
    var th1 = thT*I.approach*s1, th2 = -th1;
    I.sol = { th1:th1, th2:th2, pos:ballPos(th1,th2), conv:true, touching:true };
    if(I.approach >= 0.999){
      I.q = [0,0]; I.spark = 1; I.neutralized++; I.approach = 0;
      I.sol = { th1:0, th2:0, pos:ballPos(0,0), conv:true, touching:false, justNeutralized:true };
      hud('两球接触，正负电荷相互中和 —— 都不带电了，又垂回竖直位置', 'good');
    }
  } else {
    I.approach = 0;
    I.sol = ballEquilibrium(q1, q2, rod);
    I.sol.touching = false;
  }
}
function solveScope(dt){
  var S = state.sc;
  S.cool = Math.max(0, (S.cool||0) - dt);
  S.groundPulse = Math.max(0, S.groundPulse - dt*2.4);
  for(var i=0;i<S.sparks.length;i++) S.sparks[i].t += dt;
  S.sparks = S.sparks.filter(function(s){ return s.t <= s.dur; });
  var nr = nearestRod();
  S.nearD = nr ? nr.d : Infinity;
  S.nearId = nr ? nr.rod.id : null;
  if(nr && nr.d < SC_CONTACT_D && S.cool <= 0 && Math.abs(nr.rod.q - S.Q) > 1e-9){
    var sh = contactShare(S.Q, nr.rod.q);
    var dq = sh.scope - S.Q;
    S.Q = sh.scope; nr.rod.q = sh.rod;
    S.contacts++; S.touched = 1; S.cool = 0.45;
    S.sparks.push({ p:[0, SC_BALL_Y, 0], t:0, dur:0.6 });
    hud('接触：电荷在两件导体之间重新分配（各得 ' + signCn(sh.scope) + ' nC），移开棒后张角【保持不变】', 'good');
  }
}
function frameStep(dt){
  state.t += dt;
  if(state.mode === 'friction'){
    var F = state.fr;
    for(var i=0;i<F.rods.length;i++) F.rods[i].rub = Math.max(0, F.rods[i].rub - dt*1.8);
    for(var j=0;j<F.sparks.length;j++) F.sparks[j].t += dt;
  } else if(state.mode === 'interact'){
    solveInteract(dt);
    state.ir.spark = Math.max(0, state.ir.spark - dt*1.4);
  } else if(state.mode === 'scope'){
    solveScope(dt);
  }
}

// ============================================================
// 交互：屏幕命中 + 拖动
// ============================================================
var drag = { mode:null, obj:null, sx:0, sy:0, moved:0, active:false };
var ZPLANE = 2.0;     // 「拿在手里的棒」所在的竖直平面
function evPt(e){
  var r = cvs.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function distToSeg(px,py, ax,ay, bx,by){
  var dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  var t = L2 > 1e-9 ? clamp(((px-ax)*dx+(py-ay)*dy)/L2, 0, 1) : 0;
  return Math.hypot(px-(ax+dx*t), py-(ay+dy*t));
}
function rodScreenSeg(r){
  // 高度口径必须与 drawRod3 一致（drawRod3 在 opt.y / o.y 都没给时用 r+0.02）。
  // 两边不一致 = 命中区域和画面差一截，看上去就是「点得到但点不准」。
  var y = (r.y === undefined) ? (r.r + 0.02) : r.y;
  var half = r.L/2;
  var a = project([r.wx-half, y, r.wz], cam), b = project([r.wx+half, y, r.wz], cam);
  return [a,b];
}
function pickRayZ(sx, sy, zPlane){
  var q = cam;
  var dx=(sx-q.cx)/q.focal, dy=(q.cy-sy)/q.focal;
  var dir = add(add(scl(q.right,dx), scl(q.up,dy)), q.fwd);
  if(Math.abs(dir[2]) < 1e-6) return null;
  var t = (zPlane - q.eye[2]) / dir[2];
  if(!(t > 0)) return null;
  return [q.eye[0]+dir[0]*t, q.eye[1]+dir[1]*t, zPlane];
}
function hitTest(sx, sy){
  var i, q = cam;
  if(state.mode === 'friction'){
    for(i=0;i<state.fr.cloths.length;i++){
      var cl = state.fr.cloths[i];
      var pr = project([cl.wx, CLOTH_HY*2, cl.wz], q);
      var R = Math.max(14, CLOTH_HX*q.focal/Math.max(pr.z,0.02));
      if(Math.hypot(sx-pr.x, sy-pr.y) < R) return { kind:'cloth', id:cl.id };
    }
    for(i=0;i<state.fr.rods.length;i++){
      var s = rodScreenSeg(state.fr.rods[i]);
      if(distToSeg(sx,sy,s[0].x,s[0].y,s[1].x,s[1].y) < 14) return { kind:'rod', id:state.fr.rods[i].id };
    }
    return null;
  }
  if(state.mode === 'interact'){
    var I = state.ir;
    var sol = I.sol || ballEquilibrium(I.q[0]*Q_BALL, I.q[1]*Q_BALL, I.rod);
    for(i=0;i<2;i++){
      var pb = project(sol.pos[i], q);
      var Rb = Math.max(13, (BALL_R+0.9)*q.focal/Math.max(pb.z,0.02));
      if(Math.hypot(sx-pb.x, sy-pb.y) < Rb) return { kind:'ball', idx:i };
    }
    for(i=0;i<I.rods.length;i++){
      var s2 = rodScreenSeg(I.rods[i]);
      if(distToSeg(sx,sy,s2[0].x,s2[0].y,s2[1].x,s2[1].y) < 13) return { kind:'irod', id:I.rods[i].id };
    }
    return null;
  }
  if(state.mode === 'scope'){
    var S = state.sc;
    var pball = project(scopeBallPos(), q);
    var Rball = Math.max(14, (SC_BALL_R+1.2)*q.focal/Math.max(pball.z,0.02));
    for(i=0;i<S.rods.length;i++){
      var s3 = rodScreenSeg(S.rods[i]);
      if(distToSeg(sx,sy,s3[0].x,s3[0].y,s3[1].x,s3[1].y) < 13) return { kind:'srod', id:S.rods[i].id };
    }
    if(Math.hypot(sx-pball.x, sy-pball.y) < Rball) return { kind:'scopeBall' };
    return null;
  }
  // conduct
  var D = state.cd;
  for(i=0;i<D.objs.length;i++){
    var o = D.objs[i];
    var inC = (o.id === D.inCircuit);
    var po = project(inC ? [0, 3.6, CD_CLIP[0].z] : [o.wx, 0.6, o.wz], q);
    var Ro = Math.max(15, 3.6*q.focal/Math.max(po.z,0.02));
    if(Math.hypot(sx-po.x, sy-po.y) < Ro) return { kind:'obj', id:o.id };
  }
  return null;
}
function findRod(list, id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }
function findObj(id){ for(var i=0;i<state.cd.objs.length;i++) if(state.cd.objs[i].id===id) return state.cd.objs[i]; return null; }

function onDown(e){
  var p = evPt(e);
  drag.sx = p.x; drag.sy = p.y; drag.moved = 0; drag.active = true;
  var h = hitTest(p.x, p.y);
  drag.hit = h;
  if(!h) return;
  if(h.kind === 'cloth'){
    drag.mode = 'cloth'; drag.obj = findRod(state.fr.cloths, h.id);
    cvs.classList.add('grabbing');
  } else if(h.kind === 'ball'){
    drag.mode = 'ballclick'; drag.idx = h.idx;
  } else if(h.kind === 'irod'){
    drag.mode = 'irod'; drag.obj = findRod(state.ir.rods, h.id);
    drag.obj.hold = true; state.ir.rod = drag.obj; state.ir.approach = 0;
    cvs.classList.add('grabbing');
  } else if(h.kind === 'srod'){
    drag.mode = 'srod'; drag.obj = findRod(state.sc.rods, h.id);
    drag.obj.hold = true; state.sc.held = drag.obj;
    cvs.classList.add('grabbing');
  } else if(h.kind === 'scopeBall'){
    groundScope();
  } else if(h.kind === 'obj'){
    drag.mode = 'obj'; drag.obj = findObj(h.id);
    var o = drag.obj;
    if(state.cd.inCircuit === o.id) state.cd.inCircuit = null;
    o.slot = false;
    cvs.classList.add('grabbing');
  }
}
function onMove(e){
  var p = evPt(e);
  if(!drag.active){
    var h = hitTest(p.x, p.y);
    cvs.classList.toggle('hot', !!(h && (h.kind!=='rod')));
    return;
  }
  drag.moved = Math.max(drag.moved, Math.hypot(p.x-drag.sx, p.y-drag.sy));
  if(drag.mode === 'cloth'){
    var w = pickPlane(p.x, p.y, 0.12, cam);
    if(w) moveCloth(drag.obj, w[0], w[2]);
  } else if(drag.mode === 'irod' || drag.mode === 'srod'){
    var wp = pickRayZ(p.x, p.y, ZPLANE);
    if(wp){
      drag.obj.wx = clamp(wp[0], -30, 30);
      drag.obj.y  = clamp(wp[1], 1.4, 33);
      drag.obj.wz = ZPLANE;
    }
  } else if(drag.mode === 'obj'){
    var w2 = pickPlane(p.x, p.y, 0.0, cam);
    if(w2){
      drag.obj.wx = clamp(w2[0], -44, 44);
      drag.obj.wz = clamp(w2[2], -22, 20);
    }
  }
}
function onUp(e){
  var p = evPt(e);
  cvs.classList.remove('grabbing');
  if(drag.active){
    if(drag.mode === 'ballclick' && drag.moved < 6){
      var idx = drag.idx;
      state.ir.q[idx] = (state.ir.q[idx] === 1) ? 2 : (state.ir.q[idx] === 2 ? 0 : (state.ir.q[idx] === 0 ? -1 : (state.ir.q[idx] === -1 ? -2 : 1)));
      state.ir.approach = 0;
      state.ir.spark = 0;
      hud('小球'+(idx+1)+' 现在的电荷：' + chargeName(state.ir.q[idx]), state.ir.q[idx]===0?'':'good');
      syncUI();
    } else if(drag.mode === 'irod'){
      returnRod(drag.obj, state.ir.rods);
      state.ir.rod = drag.obj.hold ? drag.obj : null;
      syncUI();
    } else if(drag.mode === 'srod'){
      returnRod(drag.obj, state.sc.rods);
      state.sc.held = drag.obj.hold ? drag.obj : null;
      syncUI();
    } else if(drag.mode === 'obj'){
      var o = drag.obj;
      var inZone = Math.abs(o.wx) < 9 && Math.abs(o.wz - CD_CLIP[0].z) < 7;
      if(inZone){
        state.cd.inCircuit = o.id;
        o.wx = 0; o.wz = CD_CLIP[0].z; o.slot = false;
        state.cd.tested[o.id] = true;
        state.cd.verdict[o.id] = o.cond ? 'cond' : 'ins';
        hud(o.name + '：' + (o.cond ? '灯亮了 → 它是【导体】' : '灯不亮 → 它是【绝缘体】'), o.cond?'good':'bad');
      } else {
        o.slot = true; o.wx = o.x; o.wz = CD_SLOT_Z;
      }
      syncUI();
    }
  }
  drag.mode = null; drag.obj = null; drag.active = false; drag.hit = null;
}
function chargeName(lv){
  if(lv === 0) return '不带电';
  var mag = Math.abs(lv) === 2 ? '2 份' : '1 份';
  return (lv>0?'正电 ':'负电 ') + mag + '（' + (lv>0?'+':'−') + (Math.abs(lv)*Q_BALL) + ' nC）';
}
function returnRod(r, list){
  var near = Math.hypot(r.wx - r.x, r.wz - r.z) < 8;
  if(near){ r.hold = false; r.wx = r.x; r.wz = r.z; r.y = 0.62; }
  else { r.hold = true; }
}
function moveCloth(cl, wx, wz){
  var i, rod = null;
  for(i=0;i<state.fr.rods.length;i++){
    var r = state.fr.rods[i];
    if(wx > r.wx - r.L/2 - 1.5 && wx < r.wx + r.L/2 + 1.5 && Math.abs(wz - r.z) < 3.2){ rod = r; break; }
  }
  if(rod){
    cl.wx = clamp(wx, rod.wx - rod.L/2 + CLOTH_HX*0.4, rod.wx + rod.L/2 - CLOTH_HX*0.4);
    cl.wz = rod.z; cl.lift = 1; cl.onRod = rod.id;
    // 位置记录挂在【这块布】自己身上，不是全局的 —— 见 FR_CLOTHS 上面的注释。
    if(cl.lastX === null || cl.lastX === undefined){ cl.lastX = cl.wx; }
    var dx = Math.abs(cl.wx - cl.lastX);
    cl.lastX = cl.wx;
    rod.acc += dx;
    rod.rub = 1;
    while(rod.acc >= RUB_LEN){
      rod.acc -= RUB_LEN;
      var s = (seriesIdx(rod.series) < seriesIdx(cl.series)) ? 1 : -1;
      rubRod(rod, cl, s);
    }
  } else {
    cl.wx = wx; cl.wz = wz; cl.lift = 0; cl.onRod = null; cl.lastX = null;
  }
}
function groundScope(){
  var S = state.sc;
  if(Math.abs(S.Q) < 1e-9){ hud('验电器本来就不带电，金属球上没有电荷可以放掉', ''); return; }
  S.Q = 0; S.groundPulse = 1;
  S.sparks.push({ p:[0, SC_BALL_Y, 0], t:0, dur:0.6 });
  hud('用手（接地）一碰金属球：电荷被导入大地，金箔立刻合拢', 'good');
  syncUI();
}
