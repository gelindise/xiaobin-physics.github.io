  var b = e.querySelector('b');

      if(Math.abs(S.Q) < 1e-9 && Math.abs(Qe) < 1e-9){ n3.textContent = '金箔合拢着，验电器不带电。'; n3.className='note'; }
      else if(Math.abs(S.Q) < 1e-9 && Math.abs(Qe) >= 1e-9){ n3.textContent = '棒只是【靠近】，这是静电感应：张角 ' + th.toFixed(1) + '°，把棒移开就会归零。'; n3.className='note warn'; }
      else { n3.textContent = '电荷已经转移到了验电器上（净电荷 ' + signCn(S.Q) + ' nC），移开棒后张角仍保持 ' + th.toFixed(1) + '°。'; n3.className='note good'; }
    }
  } else {
    var D = state.cd, o = D.inCircuit ? findObj(D.inCircuit) : null;
    var I2 = loopCurrent(o ? o.R : null), br = loopBrightness(o ? o.R : null);
    setText('rd-R', o ? (o.R >= 1e6 ? '> 10 MΩ' : (o.R < 1 ? o.R.toFixed(2) : o.R.toFixed(1)) + ' Ω') : '—');
    setText('rd-I', (I2*1000).toFixed(0)+' mA');
    setText('rd-lamp', (br*100).toFixed(0)+' %', clsOf(o && o.cond ? 1 : 0));
    var nTested = 0; for(var k in D.tested) if(D.tested[k]) nTested++;
    setText('rd-cd-n', nTested+' / 10');
    setText('rd-cd-count', String(nTested));
    var n4 = document.getElementById('rd-cdnote');
    if(n4){
      if(!o){ n4.textContent = '两个金属夹之间空着，回路是断开的。'; n4.className='note'; }
      else if(o.cond){ n4.textContent = o.name + '接进回路，灯泡亮了（亮度 ' + (br*100).toFixed(0) + '%）→ 它是导体。'; n4.className='note good'; }
      else { n4.textContent = o.name + '接进回路，回路里几乎没有电流（' + (I2*1000).toFixed(2) + ' mA）→ 它是绝缘体。'; n4.className='note bad'; }
    }
    var tb = document.querySelector('#rd-table tbody');
    if(tb){
      var html = '';
      for(i=0;i<D.objs.length;i++){
        var ob = D.objs[i];
        var v = D.verdict[ob.id];
        html += '<tr class="'+(v?'done':'')+'"><td>'+ob.name+'</td><td class="n">'
             + (ob.R >= 1e6 ? '> 10 MΩ' : (ob.R<1?ob.R.toFixed(2):ob.R.toFixed(1))+' Ω') + '</td><td>'
             + (v === 'cond' ? '导体' : (v === 'ins' ? '绝缘体' : '—')) + '</td></tr>';
      }
      tb.innerHTML = html;
    }
  }
}
function clsOf(v){ return Math.abs(v) < 1e-9 ? 'zero' : (v > 0 ? 'pos' : 'neg'); }
function chargeShort(lv){
  if(lv === 0) return '不带电';
  return (lv>0?'+':'−') + Math.abs(lv) + ' 份';
}

// ============================================================
// 主循环
// ============================================================
function resize(){
  var r = cvs.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(320, Math.round(r.width));
  H = Math.max(240, Math.round(r.height));
  cvs.width = Math.round(W*DPR);
  cvs.height = Math.round(H*DPR);
  buildCam();
}
var last = 0;
function loop(now){
  var dt = last ? Math.min(0.05, (now-last)/1000) : 0.016;
  last = now;
  frameStep(dt);
  render();
  syncReadouts(false);
  requestAnimationFrame(loop);
}
// 无 rAF 环境（headless）用的手动推进 —— 与真实循环共用同一个 frameStep
function driveAnim(seconds, dt){
  dt = dt || 1/60;
  var n = Math.max(1, Math.round(seconds/dt));
  for(var i=0;i<n;i++) frameStep(dt);
  render();
  syncReadouts(false);
}

// ---------------- 事件绑定 ----------------
cvs.addEventListener('pointerdown', function(e){ cvs.setPointerCapture(e.pointerId); onDown(e); });
cvs.addEventListener('pointermove', onMove);
cvs.addEventListener('pointerup', onUp);
cvs.addEventListener('pointercancel', onUp);
cvs.addEventListener('wheel', onWheel, {passive:false});
el.ctl.addEventListener('click', function(e){
  var b = e.target.closest('button[data-mode]'); if(!b) return;
  setMode(b.dataset.mode);
  hud('切换到「' + MODE_META[state.mode].name + '」', '');
});
el.viewbtns.addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.dataset.act === 'reset'){
    resetMode(state.mode);
    if(state.mode === 'scope') state.sc.rods.forEach(function(r){ r.q = r.q0; });
    hud('已把实验台上的器材恢复到初始状态', '');
  } else if(b.dataset.view){
    var v = VIEWS[b.dataset.view];
    state.azim = v.azim; state.elev = v.elev; state.zoom = v.zoom;
    state.viewName = b.dataset.view;
    buildCam();
  }
  syncUI();
});
window.addEventListener('resize', function(){ resize(); });
document.addEventListener('visibilitychange', function(){ last = 0; });

// ---------------- 启动 ----------------
buildViewBtns();
setMode('friction');
resetMode('friction');
state.ir.sol = ballEquilibrium(state.ir.q[0]*Q_BALL, state.ir.q[1]*Q_BALL, null);
state.sc.rods.forEach(function(r){ r.q = r.q0; });
resize();
syncUI();
requestAnimationFrame(loop);

// ---------------- 导出（自检 / 负向对照用） ----------------
window.__STL = {
  version: '1.0.0',
  // 常量（自检要独立地拿它们重算一遍解析值）
  NC: NC, K_E: K_E, E_CHARGE: E_CHARGE, G_ACC: G_ACC,
  Q_STROKE: Q_STROKE, RUB_LEN: RUB_LEN, K_IND: K_IND, D_NEAR: D_NEAR, SCOPE_CAP: SCOPE_CAP,
  LEAF_M: LEAF_M, LEAF_L: LEAF_L,
  BALL_M: BALL_M, BALL_R: BALL_R, BALL_L: BALL_L, Q_BALL: Q_BALL,
  PSU_V: PSU_V, PSU_R: PSU_R, LAMP_V: LAMP_V, LAMP_W: LAMP_W, LAMP_R: LAMP_R,
  SERIES: SERIES, SERIES_CN: SERIES_CN, seriesIdx: seriesIdx,
  SC_BALL_Y: SC_BALL_Y, SC_BALL_R: SC_BALL_R, SC_HINGE_Y: SC_HINGE_Y,
  SC_LEAF_L: SC_LEAF_L, SC_LEAF_W: SC_LEAF_W, SC_CONTACT_D: SC_CONTACT_D, ZPLANE: ZPLANE,
  SC_JAR_R: SC_JAR_R, SC_JAR_Y0: SC_JAR_Y0, SC_JAR_Y1: SC_JAR_Y1, SC_STEM_TOP: SC_STEM_TOP,
  CD_CLIP: CD_CLIP, CD_SLOT_Z: CD_SLOT_Z, CD_BAT: CD_BAT, CD_LAMP: CD_LAMP,
  OBJS: OBJS, ENVS: ENVS, FR_RODS: FR_RODS, FR_CLOTHS: FR_CLOTHS,
  CLOTH_HX: CLOTH_HX, CLOTH_HY: CLOTH_HY, CLOTH_HZ: CLOTH_HZ, clothPeakY: clothPeakY,
  IR_FRAME: IR_FRAME,
  IR_RODS: IR_RODS, SC_RODS: SC_RODS, RUB: { LEN: RUB_LEN },
  MODE_META: MODE_META, VIEWS: VIEWS,
  // 模型（纯函数，自检要拿任意输入调它们）
  leafA: leafA, leafAngle: leafAngle, leafResid: leafResid,
  ballPos: ballPos, ballPivots: ballPivots, coulombF: coulombF, ballEquilibrium: ballEquilibrium,
  rodForce: rodForce, ROD_SEG: ROD_SEG, BALL_TH_MAX: BALL_TH_MAX,
  ballTouchNeed: ballTouchNeed, ballTouchHave: ballTouchHave, ballWouldTouch: ballWouldTouch,
  loopCurrent: loopCurrent, loopBrightness: loopBrightness,
  rodTip: rodTip, nearestRod: nearestRod, inductionK: inductionK, scopeQeff: scopeQeff,
  fmtElectrons: fmtElectrons, signCn: signCn,
  // 场景与状态
  state: state,
  project: project, buildCam: buildCam, pickPlane: pickPlane, pickRayZ: pickRayZ,
  pointInPoly: pointInPoly, boxScreenHull: boxScreenHull, hull2: hull2,
  env: env, envPoints: envPoints, syncEnv: syncEnv, boxCorners: boxCorners,
  // 入口（自检必须走这些真实入口，不能自己赋值再检查「变了没有」）
  setMode: setMode, resetMode: resetMode, syncUI: syncUI, syncReadouts: syncReadouts,
  onDown: onDown, onMove: onMove, onUp: onUp, onWheel: onWheel,
  hitTest: hitTest, moveCloth: moveCloth, rubRod: rubRod, groundScope: groundScope,
  rodScreenSeg: rodScreenSeg, findRod: findRod, findObj: findObj,
  returnRod: returnRod, frameStep: frameStep, driveAnim: driveAnim,
  render: render, resize: resize, solveInteract: solveInteract, solveScope: solveScope,
  setBallCharge: function(i, lv){ state.ir.q[i] = lv; state.ir.approach = 0; },
  contactShare: contactShare,
  contactScope: function(){ var nr = nearestRod(); if(!nr) return null;
    var sh = contactShare(state.sc.Q, nr.rod.q);
    var dq = sh.scope - state.sc.Q;
    state.sc.Q = sh.scope; nr.rod.q = sh.rod; state.sc.contacts++; return dq; },
  get W(){ return W; }, get H(){ return H; }, get cam(){ return cam; },
  get drawn(){ return drawn; }, get drag(){ return { mode:drag.mode, moved:drag.moved }; }
};
})();
