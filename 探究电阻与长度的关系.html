<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>探究电阻大小与长度的关系 - 物理虚拟实验平台</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .experiment-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .experiment-title {
      text-align: center;
      color: #1e40af;
      font-size: 28px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .experiment-subtitle {
      text-align: center;
      color: #64748b;
      font-size: 16px;
      margin-bottom: 20px;
    }
    .canvas-wrapper {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 20px;
      margin-bottom: 20px;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: #fafafa;
      border-radius: 8px;
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 20px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
      font-family: "Microsoft YaHei", sans-serif;
    }
    .btn:hover {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    .btn.active {
      background: #fbbf24;
      border-color: #f59e0b;
      color: #78350f;
      font-weight: bold;
    }
    .data-display {
      display: flex;
      gap: 30px;
      justify-content: center;
      margin-bottom: 15px;
      font-size: 16px;
    }
    .data-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .data-label {
      color: #64748b;
    }
    .data-value {
      color: #2563eb;
      font-weight: bold;
      font-size: 20px;
      font-family: "Courier New", monospace;
    }
    .status-bar {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #fef2f2;
      border-radius: 20px;
      color: #dc2626;
    }
    .status-item.active {
      background: #f0fdf4;
      color: #16a34a;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .principle-box {
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
      padding: 15px 20px;
      border-radius: 0 8px 8px 0;
      margin-top: 20px;
    }
    .principle-title {
      font-weight: bold;
      color: #1e40af;
      margin-bottom: 8px;
      font-size: 16px;
    }
    .principle-content {
      color: #1e40af;
      line-height: 1.8;
      font-size: 14px;
    }
    .tip-text {
      text-align: center;
      color: #f59e0b;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="container">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">物理虚拟实验平台</span>
      </div>
      <div class="nav">
        <a href="experiments.html">实验目录</a>
        <a href="index.html">首页</a>
      </div>
    </div>
  </div>

  <div class="experiment-container">
    <h1 class="experiment-title">探究电阻大小与长度的关系</h1>
    <p class="experiment-subtitle">点击开关闭合/断开电路 | 点击电阻丝切换长度 | 观察电流表示数变化</p>
    
    <div class="canvas-wrapper">
      <canvas id="canvas" width="1000" height="500"></canvas>
    </div>

    <div class="controls">
      <button class="btn" onclick="toggleSwitch()">🔌 开关</button>
      <button class="btn active" onclick="selectWire('short')">📏 短镍铬丝</button>
      <button class="btn" onclick="selectWire('long')">📐 长镍铬丝</button>
      <button class="btn" onclick="toggleFullscreen()">⛶ 全屏</button>
    </div>

    <div class="data-display">
      <div class="data-item">
        <span class="data-label">电流：</span>
        <span class="data-value" id="currentDisplay">0.00</span>
        <span class="data-label">A</span>
      </div>
      <div class="data-item">
        <span class="data-label">电阻：</span>
        <span class="data-value" id="resistanceDisplay">5.0</span>
        <span class="data-label">Ω</span>
      </div>
      <div class="data-item">
        <span class="data-label">长度：</span>
        <span class="data-value" id="lengthDisplay">0.5</span>
        <span class="data-label">m</span>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-item" id="ammeterStatus">
        <span class="status-dot"></span>
        <span>电流表：无示数</span>
      </div>
      <div class="status-item" id="switchStatus">
        <span class="status-dot"></span>
        <span>开关：断开</span>
      </div>
    </div>

    <p class="tip-text">💡 提示：电阻丝越长，电阻越大，电流越小，电流表指针偏转越小</p>

    <div class="principle-box">
      <div class="principle-title">📚 实验原理</div>
      <div class="principle-content">
        <p>• <strong>控制变量法：</strong>保持材料和粗细不变，改变电阻丝长度，观察电流表示数变化</p>
        <p>• <strong>欧姆定律：</strong>I = U/R，电压一定时，电阻越大，电流越小</p>
        <p>• <strong>结论：</strong>在材料和粗细相同时，导体的长度越长，电阻越大</p>
      </div>
    </div>
  </div>

  <script>
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var CANVAS_W = 1000;
    var CANVAS_H = 500;

    // ============ 电路元件定义 ============
    
    // 电池组
    var battery = { x: 80, y: 80, w: 280, h: 100 };
    
    // 电流表
    var ammeter = { x: 150, y: 280, w: 200, h: 180 };
    
    // 开关
    var switchObj = { x: 600, y: 350, w: 120, h: 60 };
    
    // 电阻丝面板
    var wirePanel = { x: 580, y: 50, w: 340, h: 180 };

    // ============ 状态变量 ============
    var switchClosed = false;
    var selectedWire = 'short'; // 'short' 或 'long'
    var current = 0;
    var needleAngle = -Math.PI / 3; // 电流表指针角度（初始指向0）
    var targetNeedleAngle = -Math.PI / 3;
    
    // 电阻参数
    var wireResistance = {
      short: 5,   // 短镍铬丝：5Ω
      long: 10    // 长镍铬丝：10Ω（长度加倍，电阻加倍）
    };
    
    var wireLength = {
      short: 0.5,  // 0.5米
      long: 1.0    // 1.0米
    };
    
    var batteryVoltage = 3; // 电源电压3V

    // 电流粒子动画
    var particles = [];
    var particleSpeed = 0;

    // 鼠标悬停状态
    var hoverSwitch = false;
    var hoverWire = null;

    // ============ 工具函数 ============
    
    // 绘制圆角矩形
    function drawRoundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // ============ 绘制函数 ============
    
    // 绘制电池组
    function drawBattery() {
      var x = battery.x;
      var y = battery.y;
      var w = battery.w;
      var h = battery.h;
      
      // 电池底座
      ctx.fillStyle = '#94a3b8';
      drawRoundRect(x - 10, y + h - 15, w + 20, 20, 5);
      ctx.fill();
      
      // 两节电池
      for (var i = 0; i < 2; i++) {
        var bx = x + i * (w / 2 + 5);
        var bw = w / 2 - 5;
        var bh = h - 20;
        var by = y + 5;
        
        // 电池主体渐变
        var grad = ctx.createLinearGradient(bx, by, bx, by + bh);
        grad.addColorStop(0, '#fef3c7');
        grad.addColorStop(0.3, '#fbbf24');
        grad.addColorStop(0.7, '#f59e0b');
        grad.addColorStop(1, '#d97706');
        
        ctx.fillStyle = grad;
        drawRoundRect(bx, by, bw, bh, 8);
        ctx.fill();
        
        // 电池正极凸起
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(bx + bw - 8, by + bh/2 - 8, 12, 16);
        
        // 正极符号
        ctx.fillStyle = '#dc2626';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('+', bx + bw/2 + 10, by + bh/2);
      }
      
      // 左边接线柱（负极）
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(x - 5, y + h/2, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fca5a5';
      ctx.beginPath();
      ctx.arc(x - 5, y + h/2, 6, 0, Math.PI * 2);
      ctx.fill();
      
      // 右边接线柱（正极）
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(x + w + 5, y + h/2, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fca5a5';
      ctx.beginPath();
      ctx.arc(x + w + 5, y + h/2, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    // 绘制电流表
    function drawAmmeter() {
      var x = ammeter.x;
      var y = ammeter.y;
      var w = ammeter.w;
      var h = ammeter.h;
      var cx = x + w / 2;
      var cy = y + h / 2 - 10;
      
      // 表壳
      ctx.fillStyle = '#e2e8f0';
      drawRoundRect(x, y, w, h, 10);
      ctx.fill();
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      // 表盘
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(cx, cy, 70, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      // 表盘刻度（0-0.6A量程）
      ctx.strokeStyle = '#374151';
      ctx.lineWidth = 1.5;
      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#374151';
      
      var startAngle = -Math.PI * 5 / 6;
      var endAngle = -Math.PI / 6;
      var totalAngle = endAngle - startAngle;
      
      // 大刻度（0, 0.2, 0.4, 0.6）
      for (var i = 0; i <= 3; i++) {
        var angle = startAngle + totalAngle * (i / 3);
        var x1 = cx + Math.cos(angle) * 55;
        var y1 = cy + Math.sin(angle) * 55;
        var x2 = cx + Math.cos(angle) * 65;
        var y2 = cy + Math.sin(angle) * 65;
        
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        
        // 刻度数字
        var label = (i * 0.2).toFixed(1);
        var tx = cx + Math.cos(angle) * 45;
        var ty = cy + Math.sin(angle) * 45;
        ctx.fillText(label, tx, ty + 4);
      }
      
      // 小刻度
      ctx.lineWidth = 1;
      for (var j = 0; j <= 30; j++) {
        if (j % 10 !== 0) {
          var angle2 = startAngle + totalAngle * (j / 30);
          var x3 = cx + Math.cos(angle2) * 58;
          var y3 = cy + Math.sin(angle2) * 58;
          var x4 = cx + Math.cos(angle2) * 65;
          var y4 = cy + Math.sin(angle2) * 65;
          
          ctx.beginPath();
          ctx.moveTo(x3, y3);
          ctx.lineTo(x4, y4);
          ctx.stroke();
        }
      }
      
      // 字母A
      ctx.font = 'bold 16px Arial';
      ctx.fillText('A', cx, cy + 15);
      
      // 指针
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(needleAngle);
      
      // 指针主体
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.moveTo(0, -60);
      ctx.lineTo(-4, 10);
      ctx.lineTo(4, 10);
      ctx.closePath();
      ctx.fill();
      
      // 指针底座
      ctx.fillStyle = '#991b1b';
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fca5a5';
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
      
      // 接线柱底座
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(x + 10, y + h - 40, w - 20, 30);
      
      // 三个接线柱（-、0.6、3）
      var posts = [
        { x: x + 40, label: '-' },
        { x: x + w/2, label: '0.6' },
        { x: x + w - 40, label: '3' }
      ];
      
      for (var k = 0; k < posts.length; k++) {
        var px = posts[k].x;
        var py = y + h - 25;
        
        // 接线柱
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.arc(px, py, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fca5a5';
        ctx.beginPath();
        ctx.arc(px, py, 5, 0, Math.PI * 2);
        ctx.fill();
        
        // 标签
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(posts[k].label, px, py + 25);
      }
      
      // 调零旋钮
      ctx.fillStyle = '#6b7280';
      ctx.beginPath();
      ctx.arc(cx, y + h - 55, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    // 绘制开关
    function drawSwitch() {
      var x = switchObj.x;
      var y = switchObj.y;
      var w = switchObj.w;
      var h = switchObj.h;

      // 悬停高亮
      if (hoverSwitch) {
        ctx.fillStyle = 'rgba(59, 130, 246, 0.1)';
        ctx.beginPath();
        ctx.arc(x + w/2, y + h/2, 50, 0, Math.PI * 2);
        ctx.fill();
      }

      // 底座
      ctx.fillStyle = '#cbd5e1';
      drawRoundRect(x, y + h - 15, w, 20, 4);
      ctx.fill();

      // 左接线柱
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(x + 20, y + h - 15, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fca5a5';
      ctx.beginPath();
      ctx.arc(x + 20, y + h - 15, 5, 0, Math.PI * 2);
      ctx.fill();

      // 右接线柱
      ctx.fillStyle = switchClosed ? '#22c55e' : '#dc2626';
      ctx.beginPath();
      ctx.arc(x + w - 20, y + h - 15, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = switchClosed ? '#86efac' : '#fca5a5';
      ctx.beginPath();
      ctx.arc(x + w - 20, y + h - 15, 5, 0, Math.PI * 2);
      ctx.fill();

      // 闸刀
      ctx.save();
      ctx.translate(x + 20, y + h - 15);
      
      if (switchClosed) {
        ctx.rotate(0);
      } else {
        ctx.rotate(-Math.PI / 4);
      }

      // 闸刀杆
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(-3, -50, 6, 55);
      
      // 闸刀头
      ctx.fillStyle = '#64748b';
      ctx.beginPath();
      ctx.arc(0, -50, 8, 0, Math.PI * 2);
      ctx.fill();
      
      // 绝缘手柄
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.arc(0, -50, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#60a5fa';
      ctx.beginPath();
      ctx.arc(-3, -53, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // 接触点
      if (switchClosed) {
        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.arc(x + w - 20, y + h - 15, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 绘制电阻丝面板
    function drawWirePanel() {
      var x = wirePanel.x;
      var y = wirePanel.y;
      var w = wirePanel.w;
      var h = wirePanel.h;

      // 面板背景
      ctx.fillStyle = '#f8fafc';
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      drawRoundRect(x, y, w, h, 10);
      ctx.fill();
      ctx.stroke();

      // 短镍铬丝区域
      var shortY = y + 45;
      var isShortSelected = selectedWire === 'short';
      
      // 短镍铬丝悬停高亮
      if (hoverWire === 'short' && !isShortSelected) {
        ctx.fillStyle = 'rgba(100, 116, 139, 0.1)';
        ctx.fillRect(x + 30, y + 20, w - 60, 55);
      }
      
      // 短镍铬丝选中高亮
      if (isShortSelected && switchClosed) {
        ctx.fillStyle = 'rgba(100, 116, 139, 0.15)';
        ctx.fillRect(x + 30, y + 20, w - 60, 55);
      }

      // 短镍铬丝标签
      ctx.fillStyle = isShortSelected ? '#1e293b' : '#64748b';
      ctx.font = 'bold 18px "Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.fillText('短镍铬合金丝', x + w/2, y + 25);

      // 短镍铬丝接线柱
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(x + 50, shortY, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + w - 50, shortY, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fca5a5';
      ctx.beginPath();
      ctx.arc(x + 50, shortY, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + w - 50, shortY, 5, 0, Math.PI * 2);
      ctx.fill();

      // 短镍铬丝（直线，短）
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = isShortSelected && switchClosed ? 5 : 4;
      ctx.beginPath();
      ctx.moveTo(x + 50, shortY);
      ctx.lineTo(x + w - 50, shortY);
      ctx.stroke();

      // 短镍铬丝选中时的电流指示
      if (isShortSelected && switchClosed) {
        ctx.strokeStyle = 'rgba(100, 116, 139, 0.5)';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(x + 50, shortY);
        ctx.lineTo(x + w - 50, shortY);
        ctx.stroke();
      }

      // 分隔线
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + 20, y + h/2);
      ctx.lineTo(x + w - 20, y + h/2);
      ctx.stroke();

      // 长镍铬丝区域
      var longY = y + h - 45;
      var isLongSelected = selectedWire === 'long';
      
      // 长镍铬丝悬停高亮
      if (hoverWire === 'long' && !isLongSelected) {
        ctx.fillStyle = 'rgba(100, 116, 139, 0.1)';
        ctx.fillRect(x + 30, y + h/2 + 5, w - 60, 55);
      }
      
      // 长镍铬丝选中高亮
      if (isLongSelected && switchClosed) {
        ctx.fillStyle = 'rgba(100, 116, 139, 0.15)';
        ctx.fillRect(x + 30, y + h/2 + 5, w - 60, 55);
      }

      // 长镍铬丝标签
      ctx.fillStyle = isLongSelected ? '#1e293b' : '#64748b';
      ctx.font = 'bold 18px "Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.fillText('长镍铬合金丝', x + w/2, y + h/2 + 30);

      // 长镍铬丝接线柱
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(x + 50, longY, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + w - 50, longY, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fca5a5';
      ctx.beginPath();
      ctx.arc(x + 50, longY, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + w - 50, longY, 5, 0, Math.PI * 2);
      ctx.fill();

      // 长镍铬丝（波浪形，表示更长的电阻丝）
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = isLongSelected && switchClosed ? 5 : 4;
      ctx.beginPath();
      var waveCount = 12;
      var waveWidth = (w - 100) / waveCount;
      var waveHeight = 12;
      for (var i = 0; i <= waveCount; i++) {
        var wx = x + 50 + i * waveWidth;
        var wy = longY + (i % 2 === 0 ? -waveHeight : waveHeight);
        if (i === 0) {
          ctx.moveTo(wx, longY);
        } else {
          ctx.lineTo(wx, wy);
        }
      }
      ctx.lineTo(x + w - 50, longY);
      ctx.stroke();

      // 长镍铬丝选中时的电流指示
      if (isLongSelected && switchClosed) {
        ctx.strokeStyle = 'rgba(100, 116, 139, 0.5)';
        ctx.lineWidth = 10;
        ctx.beginPath();
        for (var j = 0; j <= waveCount; j++) {
          var wx2 = x + 50 + j * waveWidth;
          var wy2 = longY + (j % 2 === 0 ? -waveHeight : waveHeight);
          if (j === 0) {
            ctx.moveTo(wx2, longY);
          } else {
            ctx.lineTo(wx2, wy2);
          }
        }
        ctx.lineTo(x + w - 50, longY);
        ctx.stroke();
      }
    }

    // 绘制导线
    function drawWires() {
      ctx.strokeStyle = '#eab308';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      var wireY = selectedWire === 'short' ? wirePanel.y + 45 : wirePanel.y + wirePanel.h - 45;

      // 电池负极 -> 电流表负接线柱
      ctx.beginPath();
      ctx.moveTo(battery.x - 5, battery.y + battery.h/2);
      ctx.lineTo(battery.x - 5, ammeter.y + ammeter.h - 25);
      ctx.lineTo(ammeter.x + 40, ammeter.y + ammeter.h - 25);
      ctx.stroke();

      // 电流表0.6接线柱 -> 开关左接线柱
      ctx.beginPath();
      ctx.moveTo(ammeter.x + ammeter.w/2, ammeter.y + ammeter.h - 25);
      ctx.lineTo(switchObj.x + 20, ammeter.y + ammeter.h - 25);
      ctx.lineTo(switchObj.x + 20, switchObj.y + switchObj.h - 15);
      ctx.stroke();

      // 开关右接线柱 -> 电阻丝面板右接线柱
      ctx.beginPath();
      ctx.moveTo(switchObj.x + switchObj.w - 20, switchObj.y + switchObj.h - 15);
      ctx.quadraticCurveTo(
        switchObj.x + switchObj.w + 80, 
        switchObj.y + switchObj.h - 80,
        wirePanel.x + wirePanel.w - 50, 
        wireY
      );
      ctx.stroke();

      // 电阻丝面板左接线柱 -> 电池正极
      ctx.beginPath();
      ctx.moveTo(wirePanel.x + 50, wireY);
      ctx.quadraticCurveTo(
        battery.x + battery.w/2, 
        battery.y - 40,
        battery.x + battery.w + 5, 
        battery.y + battery.h/2
      );
      ctx.stroke();
    }

    // ============ 电流粒子动画 ============
    function initParticles() {
      particles = [];
      var pathPoints = getWirePath();
      for (var i = 0; i < 20; i++) {
        particles.push({
          progress: Math.random(),
          speed: 0.8 + Math.random() * 0.4
        });
      }
    }

    function getWirePath() {
      var wireY = selectedWire === 'short' ? wirePanel.y + 45 : wirePanel.y + wirePanel.h - 45;
      return [
        { x: battery.x - 5, y: battery.y + battery.h/2 },
        { x: battery.x - 5, y: ammeter.y + ammeter.h - 25 },
        { x: ammeter.x + 40, y: ammeter.y + ammeter.h - 25 },
        { x: ammeter.x + ammeter.w/2, y: ammeter.y + ammeter.h - 25 },
        { x: switchObj.x + 20, y: ammeter.y + ammeter.h - 25 },
        { x: switchObj.x + 20, y: switchObj.y + switchObj.h - 15 },
        { x: switchObj.x + switchObj.w - 20, y: switchObj.y + switchObj.h - 15 },
        { x: wirePanel.x + wirePanel.w - 50, y: wireY },
        { x: wirePanel.x + 50, y: wireY },
        { x: battery.x + battery.w + 5, y: battery.y + battery.h/2 }
      ];
    }

    function getPointOnPath(progress) {
      var points = getWirePath();
      var totalLen = 0;
      var segLens = [];
      
      for (var i = 0; i < points.length - 1; i++) {
        var dx = points[i + 1].x - points[i].x;
        var dy = points[i + 1].y - points[i].y;
        var len = Math.sqrt(dx * dx + dy * dy);
        segLens.push(len);
        totalLen += len;
      }
      
      var targetLen = progress * totalLen;
      var accLen = 0;
      
      for (var i = 0; i < segLens.length; i++) {
        if (accLen + segLens[i] >= targetLen) {
          var t = (targetLen - accLen) / segLens[i];
          return {
            x: points[i].x + (points[i + 1].x - points[i].x) * t,
            y: points[i].y + (points[i + 1].y - points[i].y) * t
          };
        }
        accLen += segLens[i];
      }
      
      return points[points.length - 1];
    }

    function updateParticles() {
      if (!switchClosed) return;
      
      for (var i = 0; i < particles.length; i++) {
        particles[i].progress += particles[i].speed * particleSpeed * 0.1;
        if (particles[i].progress > 1) {
          particles[i].progress = 0;
        }
      }
    }

    function drawParticles() {
      if (!switchClosed || current < 0.01) return;
      
      for (var i = 0; i < particles.length; i++) {
        var pos = getPointOnPath(particles[i].progress);
        
        // 发光效果
        var glow = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 10);
        glow.addColorStop(0, 'rgba(251, 191, 36, 0.8)');
        glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 10, 0, Math.PI * 2);
        ctx.fill();
        
        // 粒子核心
        ctx.fillStyle = '#fef3c7';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ============ 物理计算 ============
    function updatePhysics() {
      if (switchClosed) {
        var R = wireResistance[selectedWire];
        current = batteryVoltage / R;
        particleSpeed = current * 2;
        
        // 电流表指针角度（0-0.6A量程对应-5/6π到-1/6π）
        var maxAngle = -Math.PI / 6;
        var minAngle = -Math.PI * 5 / 6;
        targetNeedleAngle = minAngle + (maxAngle - minAngle) * (current / 0.6);
      } else {
        current = 0;
        particleSpeed = 0;
        targetNeedleAngle = -Math.PI * 5 / 6; // 归零
      }
      
      // 平滑过渡指针角度
      needleAngle += (targetNeedleAngle - needleAngle) * 0.08;
    }

    function updateUI() {
      document.getElementById('currentDisplay').textContent = current.toFixed(2);
      document.getElementById('resistanceDisplay').textContent = wireResistance[selectedWire].toFixed(1);
      document.getElementById('lengthDisplay').textContent = wireLength[selectedWire].toFixed(1);
      
      // 开关状态
      var switchStatus = document.getElementById('switchStatus');
      if (switchClosed) {
        switchStatus.classList.add('active');
        switchStatus.querySelector('span:last-child').textContent = '开关：闭合';
      } else {
        switchStatus.classList.remove('active');
        switchStatus.querySelector('span:last-child').textContent = '开关：断开';
      }
      
      // 电流表状态
      var ammeterStatus = document.getElementById('ammeterStatus');
      if (switchClosed) {
        ammeterStatus.classList.add('active');
        ammeterStatus.querySelector('span:last-child').textContent = '电流表：有示数';
      } else {
        ammeterStatus.classList.remove('active');
        ammeterStatus.querySelector('span:last-child').textContent = '电流表：无示数';
      }
      
      // 按钮状态
      var btns = document.querySelectorAll('.btn');
      btns[1].classList.toggle('active', selectedWire === 'short');
      btns[2].classList.toggle('active', selectedWire === 'long');
    }

    // ============ 交互函数 ============
    function toggleSwitch() {
      switchClosed = !switchClosed;
      updatePhysics();
      updateUI();
    }

    function selectWire(wire) {
      selectedWire = wire;
      initParticles();
      updatePhysics();
      updateUI();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // ============ 点击检测 ============
    function isInSwitch(x, y) {
      return x >= switchObj.x - 20 && x <= switchObj.x + switchObj.w + 20 &&
             y >= switchObj.y - 20 && y <= switchObj.y + switchObj.h + 20;
    }

    function isInWirePanel(x, y) {
      return x >= wirePanel.x && x <= wirePanel.x + wirePanel.w &&
             y >= wirePanel.y && y <= wirePanel.y + wirePanel.h;
    }

    function getClickedWire(x, y) {
      if (!isInWirePanel(x, y)) return null;
      
      if (y < wirePanel.y + wirePanel.h / 2) {
        return 'short';
      } else {
        return 'long';
      }
    }

    // ============ 点击事件 ============
    canvas.addEventListener('click', function(e) {
      var rect = canvas.getBoundingClientRect();
      var scaleX = canvas.width / rect.width;
      var scaleY = canvas.height / rect.height;
      var x = (e.clientX - rect.left) * scaleX;
      var y = (e.clientY - rect.top) * scaleY;

      // 开关点击
      if (isInSwitch(x, y)) {
        toggleSwitch();
        return;
      }

      // 电阻丝点击
      var wire = getClickedWire(x, y);
      if (wire) {
        selectWire(wire);
        return;
      }
    });

    // 鼠标移动事件（悬停效果）
    canvas.addEventListener('mousemove', function(e) {
      var rect = canvas.getBoundingClientRect();
      var scaleX = canvas.width / rect.width;
      var scaleY = canvas.height / rect.height;
      var x = (e.clientX - rect.left) * scaleX;
      var y = (e.clientY - rect.top) * scaleY;

      hoverSwitch = isInSwitch(x, y);
      hoverWire = getClickedWire(x, y);

      // 鼠标样式
      if (hoverSwitch || hoverWire) {
        canvas.style.cursor = 'pointer';
      } else {
        canvas.style.cursor = 'default';
      }
    });

    // ============ 主绘制函数 ============
    function draw() {
      // 清空画布
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      
      // 背景
      ctx.fillStyle = '#fafafa';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      // 绘制顺序：从后往前
      drawWires();
      drawWirePanel();
      drawBattery();
      drawAmmeter();
      drawSwitch();
      drawParticles();
    }

    // ============ 动画循环 ============
    function animate() {
      // 更新粒子
      updateParticles();
      
      // 更新物理
      updatePhysics();
      
      // 绘制
      draw();
      
      // 更新UI
      updateUI();
      
      requestAnimationFrame(animate);
    }

    // ============ 初始化 ============
    initParticles();
    updatePhysics();
    animate();
  </script>
</body>
</html>
