<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物理虚拟实验 - 摩擦力（PhET仿真）</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      overflow-x: hidden;
      background: #0f172a;
    }
    /* 覆盖共享样式：将 sticky 改为 fixed，使导航栏可隐藏 */
    .header {
      position: fixed !important;
      top: 0;
      left: 0;
      right: 0;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .header.hidden {
      transform: translateY(-100%);
    }
    /* 顶部隐形触发区：鼠标移到顶部 40px 区域内显示导航栏 */
    .header-trigger {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      z-index: 101;
    }
    .sim-container {
      position: relative;
      height: calc(100vh - 56px);
      margin-top: 56px;
      transition: margin-top 0.35s cubic-bezier(0.4, 0, 0.2, 1), height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sim-container.expanded {
      margin-top: 0;
      height: 100vh;
    }
    .sim-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    @media (max-width: 768px) {
      .sim-container { margin-top: 52px; height: calc(100vh - 52px); }
    }
    /* ===== 实拍视频区 ===== */
    .video-section { max-width: 1200px; margin: 24px auto 40px; padding: 0 16px; }
    .video-section .section-title { font-size: 20px; font-weight: bold; color: #f8fafc; margin-bottom: 16px; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
    .video-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 18px 20px; }
    .video-card h3 { margin: 0 0 12px; font-size: 15px; line-height: 1.5; color: #f8fafc; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; display: flex; align-items: flex-start; gap: 8px; }
    .video-card h3 .live-badge { font-size: 11px; background: rgba(239,68,68,0.15); color: #ef4444; padding: 2px 8px; border-radius: 6px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
    .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #000; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .video-desc { font-size: 13px; color: #94a3b8; line-height: 1.7; margin-top: 10px; }
    .video-fullscreen-btn { position: absolute; top: 10px; right: 10px; z-index: 10; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 8px; background: rgba(0,0,0,0.55); color: #fff; cursor: pointer; transition: background 0.2s ease; }
    .video-fullscreen-btn:hover { background: rgba(59,130,246,0.85); }
    .video-container:fullscreen, .video-container:-webkit-full-screen { width: 100%; height: 100%; padding-bottom: 0; border-radius: 0; }
  </style>
  <script src="protect.js"></script>
  <script src="auth-check.js"></script>
</head>
<body>
  <header class="header">
    <div class="logo">物理虚拟实验平台</div>
    <nav class="nav">
      <a href="experiments.html">实验目录</a>
      <a href="index.html">首页</a>
      <a href="vip.html">开通VIP</a>
    </nav>
  </header>
  <div class="sim-container">
    <iframe src="https://phet.colorado.edu/sims/html/friction/latest/friction_all.html?locale=zh_CN"
      allowfullscreen
      allow="fullscreen; accelerometer; autoplay; camera; encrypted-media; gyroscope; microphone; geolocation; xr-spatial-tracking">
    </iframe>
  </div>

  <!-- 实拍视频区 -->
  <div class="video-section">
    <div class="section-title">🎬 实拍视频 · 从虚拟实验到真实世界</div>
    <div class="video-grid">
      <div class="video-card">
        <h3>中考科学·物理实验：探究影响滑动摩擦力大小的因素<span class="live-badge">实拍</span></h3>
        <div class="video-container">
          <iframe src="//player.bilibili.com/player.html?bvid=BV1aA411V7TV&page=1&autoplay=0&loop=1&danmaku=0&high_quality=1" scrolling="no" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>
          <button class="video-fullscreen-btn" title="全屏播放" aria-label="全屏播放">
            <svg class="fs-expand" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
            <svg class="fs-compress" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path stroke-linecap="round" stroke-linejoin="round" d="M8 3v3a2 2 0 01-2 2H3m18 0h-3a2 2 0 01-2-2V3m0 18v-3a2 2 0 012-2h3M3 16h3a2 2 0 012 2v3"/></svg>
          </button>
        </div>
        <div class="video-desc">实拍演示用弹簧测力计沿水平方向匀速拉动木块，再分别改变木块上的砝码数量和接触面的粗糙程度进行对照。这套"控制变量法"的操作步骤，与上方虚拟实验中切换接触面材质、调节物块质量观察摩擦力读数的过程完全一致。</div>
      </div>
      <div class="video-card">
        <h3>研究影响滑动摩擦力大小的因素（完整实验记录）<span class="live-badge">实拍</span></h3>
        <div class="video-container">
          <iframe src="//player.bilibili.com/player.html?bvid=BV1nswZefE4N&page=1&autoplay=0&loop=1&danmaku=0&high_quality=1" scrolling="no" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>
          <button class="video-fullscreen-btn" title="全屏播放" aria-label="全屏播放">
            <svg class="fs-expand" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
            <svg class="fs-compress" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path stroke-linecap="round" stroke-linejoin="round" d="M8 3v3a2 2 0 01-2 2H3m18 0h-3a2 2 0 01-2-2V3m0 18v-3a2 2 0 012-2h3M3 16h3a2 2 0 012 2v3"/></svg>
          </button>
        </div>
        <div class="video-desc">逐项记录压力大小、接触面粗糙程度与弹簧测力计示数的对应关系，得出"压力越大、接触面越粗糙，滑动摩擦力越大"的结论。可以把实拍读数与虚拟实验的实时数值对照，检验自己对 f = μN 的理解。</div>
      </div>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script src="script.js"></script>
  <script>
    (function() {
      var header = document.querySelector('.header');
      var container = document.querySelector('.sim-container');
      var hideTimer = null;
      var HIDE_DELAY = 800;

      function showHeader() {
        clearTimeout(hideTimer);
        header.classList.remove('hidden');
        container.classList.remove('expanded');
      }

      function hideHeader() {
        hideTimer = setTimeout(function() {
          header.classList.add('hidden');
          container.classList.add('expanded');
        }, HIDE_DELAY);
      }

      document.addEventListener('mousemove', function(e) {
        if (e.clientY <= 60) {
          showHeader();
        } else if (e.clientY > header.offsetHeight + 20 && !header.classList.contains('hidden')) {
          hideHeader();
        }
      });

      header.addEventListener('mouseenter', function() {
        showHeader();
      });

      header.addEventListener('mouseleave', function() {
        hideHeader();
      });

      hideTimer = setTimeout(function() {
        header.classList.add('hidden');
        container.classList.add('expanded');
      }, 2000);
    })();
  </script>
  <script>
  (function() {
    var btns = document.querySelectorAll('.video-fullscreen-btn');
    if (!btns.length) return;
    btns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        var container = btn.closest('.video-container');
        if (!container) return;
        if (document.fullscreenElement === container) { document.exitFullscreen(); }
        else { if (container.requestFullscreen) container.requestFullscreen(); else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen(); }
      });
    });
    document.addEventListener('fullscreenchange', function() {
      var fsEl = document.fullscreenElement;
      btns.forEach(function(btn) {
        var container = btn.closest('.video-container');
        var on = fsEl === container;
        var ex = btn.querySelector('.fs-expand'), cp = btn.querySelector('.fs-compress');
        if (ex) ex.style.display = on ? 'none' : '';
        if (cp) cp.style.display = on ? '' : 'none';
        btn.title = on ? '退出全屏' : '全屏播放';
        btn.setAttribute('aria-label', btn.title);
      });
    });
  })();
  </script>
</body>
</html>
